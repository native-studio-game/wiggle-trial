      pushHistory();
      wounded.splice(index, 1);
      player.hand.push(tile);
      action.remaining -= 1;
      queueDealAnimation(player.id, 1, player.color);
      addLog(player.name + " が共通負傷置き場から1枚回復しました。");
      if (!maybeFinishLifeRecoveryAction(action)) {
        render();
      }
    }

    function selectLifeRecoveryBoard(key) {
      const action = state.pendingAction;
      const player = action && state.players[action.playerId];
      const slot = (state.blBoard || {})[key];
      if (!action || action.type !== "life-recover" || !player || player.finished || lifeHandSpace(player) <= 0) {
        return;
      }
      if (!slot || !slot.tile || slot.tile.start || action.boardRecovered || action.remaining < 2 || key === action.placedKey) {
        return;
      }
      pushHistory();
      const tile = cloneTile(slot.tile);
      delete state.blBoard[key];
      player.hand.push(tile);
      action.remaining -= 2;
      action.boardRecovered = true;
      queueDealAnimation(player.id, 1, player.color);
      forgetBrokenCompletedPatterns();
      addLog(player.name + " が完成模様から1枚回収しました。");
      if (!maybeFinishLifeRecoveryAction(action)) {
        render();
      }
    }

    function skipLifeRecovery() {
      const action = state.pendingAction;
      if (!action || action.type !== "life-recover") {
        return;
      }
      addLog(state.players[action.playerId].name + " は残り回復値" + action.remaining + "を使わず進めました。");
      finishLifePendingAfterRecovery(action);
    }

    function autoResolveLifeRecovery(action) {
      const player = action && state.players[action.playerId];
      if (!player || player.finished) {
        return;
      }
      while (action.remaining > 0 && lifeHandSpace(player) > 0) {
        const wounded = lifeWoundPool();
        if (wounded.length > 0 && action.remaining >= 1) {
          player.hand.push(wounded.shift());
          action.remaining -= 1;
          queueDealAnimation(player.id, 1, player.color);
          continue;
        }
        const boardChoices = lifeBoardRecoveryCandidates(action);
        if (boardChoices.length > 0 && action.remaining >= 2) {
          const choice = boardChoices[0];
          const slot = state.blBoard[choice.key];
          if (slot && slot.tile) {
            player.hand.push(cloneTile(slot.tile));
            delete state.blBoard[choice.key];
            action.remaining -= 2;
            action.boardRecovered = true;
            queueDealAnimation(player.id, 1, player.color);
            forgetBrokenCompletedPatterns();
            continue;
          }
        }
        break;
      }
    }

    function startNextLifeRecoveryAction(defaultReturnAfterPlayerId) {
      if (!isLifeWoundMode()) {
        return false;
      }
      if (state.pendingAction && state.pendingAction.type === "life-recover") {
        return true;
      }
      state.lifeRecoveryQueue = state.lifeRecoveryQueue || [];
      while (state.lifeRecoveryQueue.length > 0) {
        const action = state.lifeRecoveryQueue.shift();
        action.returnAfterPlayerId = action.returnAfterPlayerId === undefined
          ? defaultReturnAfterPlayerId
          : action.returnAfterPlayerId;
        const player = state.players[action.playerId];
        if (!player || player.finished) {
          continue;
        }
        if (!lifeRecoveryHasChoice(action)) {
          addLog(player.name + " は回復値" + action.remaining + "を得ましたが、回復できる対象がありません。");
          continue;
        }
        if (player.isCpu) {
          autoResolveLifeRecovery(action);
          addLog(player.name + " が回復値" + action.total + "を自動で使いました。");
          continue;
        }
        state.pendingAction = action;
        state.currentPlayer = player.id;
        state.selectedHandIndex = null;
        state.scoreText = player.name + " は回復値" + action.remaining + "を使えます。";
        scheduleToastHide();
        return true;
      }
      return false;
    }

    function moveLifeHandToWounded(player, index) {
      if (!player || !player.hand || !player.hand[index]) {
        return null;
      }
      const tile = player.hand.splice(index, 1)[0];
      lifeWoundPool().push(tile);
      return tile;
    }

    function resolveLifeWoundDamage(action, options) {
      const player = action && state.players[action.playerId];
      if (!player || player.finished) {
        return 0;
      }
      let moved = 0;
      while (action.remaining > 0 && player.hand.length > 0) {
        const index = options && typeof options.index === "number" ? options.index : player.hand.length - 1;
        const safeIndex = Math.max(0, Math.min(index, player.hand.length - 1));
        if (!moveLifeHandToWounded(player, safeIndex)) {
          break;
        }
        action.remaining -= 1;
        moved++;
        if (options && typeof options.index === "number") {
          break;
        }
      }
      if (moved > 0) {
        addLog(player.name + " が" + moved + "枚を共通負傷置き場へ送りました。");
      }
      return moved;
    }

    function finishLifePendingAfterDamage(action) {
      if (state.over) { return; }
      if (startNextLifeDamageAction(action.returnAfterPlayerId)) {
        render();
        return;
      }
      const source = state.players[action.returnAfterPlayerId];
      if (source && !source.finished) {
        state.currentPlayer = source.id;
        finishLifePlacement(source, null);
        return;
      }
      blAdvanceTurn();
      render();
    }

    function selectLifeWoundDamageTile(index) {
      const action = state.pendingAction;
      const player = action && state.players[action.playerId];
      if (!action || action.type !== "life-wound-damage" || !player || player.finished) {
        return;
      }
      pushHistory();
      resolveLifeWoundDamage(action, { index: index });
      if (player.hand.length === 0) {
        state.pendingAction = null;
        eliminateLifePlayer(player, "負傷でライフがなくなりました。");
        return;
      }
      if (action.remaining <= 0) {
        state.pendingAction = null;
        finishLifePendingAfterDamage(action);
        return;
      }
      state.scoreText = player.name + " はあと" + action.remaining + "枚を負傷へ送る";
      scheduleToastHide();
      render();
    }

    function scoreStrongLifeCpuMove(tile, rotation, row, col, marketIndex) {
      const player = currentPlayer();
      if (!player) {
        return Math.random();
      }

      const patterns = WiggleRules.detectClosedPatternsDynamic(
        dynamicScoringBoardForCandidate(tile, rotation, row, col)
      ).filter(function (pattern) {
        return state.blCompletedKeys.indexOf(pattern.key) === -1;
      });

      const lifeAfterPlace = Math.max(0, player.hand.length - 1);
      const fromDamagePlacement = Boolean(state.pendingAction
        && state.pendingAction.type === "life-damage"
        && state.pendingAction.playerId === player.id);
      let score = countDynamicAdjacentTiles(row, col) * 6
        - (Math.abs(row) + Math.abs(col)) * 0.35
        + Math.random() * 0.01;

      patterns.forEach(function (pattern) {
        const owner = ownerForColor(pattern.color);
        if (!owner || owner.finished) {
          const activeTargets = activeDynamicPlayers().filter(function (target) {
            return target.id !== player.id;
          });
          const humanTarget = activeTargets.some(function (target) {
            return !target.isCpu;
          });
          score += pattern.points * (humanTarget ? 22 : 12);
          return;
        }

        if (owner.id === player.id) {
          const recovery = lifeRecoveryInfo(pattern, lifeAfterPlace, fromDamagePlacement);
          const recoveryPoints = recovery.recoverable;
          const lowLifeBonus = Math.max(0, 5 - lifeAfterPlace) * 3;
          score += recoveryPoints * (16 + lowLifeBonus);
          if (recoveryPoints === 0) {
            score -= 24;
          }
          return;
        }

        const targetIsHuman = !owner.isCpu;
        const targetLowLifeBonus = Math.max(0, 5 - owner.hand.length) * 4;
        score += pattern.points * (targetIsHuman ? 26 : 14) + targetLowLifeBonus;
      });

      if (patterns.length === 0 && player.hand.length <= 3) {
        score -= 8;
      }

      return score;
    }

    function setupBorderless() {
      const playerCount = state.playerCount;
      const trapMode = isPopjamInnerQuestionMode();
      const lifeMode = isLifeMode();
      state.neutralColor = "";
      state.turn = 1;
      state.currentPlayer = 0;
      state.started = true;
      state.over = false;
      state.survivalLoserId = null;
      state.selectedHandIndex = null;
      state.selectedRotation = 0;
      state.selectedColor = "red";

      // 3色=1〜2人 / 4色(緑)=3〜4人
      const defs = (playerCount >= 4 && !trapMode && !lifeMode)
        ? tileDefinitions.concat(fourPlayerTileDefinitions)
        : tileDefinitions;
      state.deck = shuffle(defs.map(cloneTile));
      state.sharedMarket = [];
      state.marketRotations = {};
      state.innerQuestionDeck = [];
      state.board = createEmptyBoard();
      state.questionBoard = createEmptyQuestionBoard();

      state.players = createPlayers(playerCount, state.cpuEnabled);

      state.blBoard = {};
      state.blBoard[blCellKey(0, 0)] = {
        tile: { id: startTile.id, name: startTile.name, src: startTile.src, start: true },
        rotation: 0
      };
      state.startTileAnimating = true; // 開始時のスタートタイル設置演出（全モード共通）
      resetScoreFlights();
      state.tiebreak = null;
      state.resultViewStep = 0;
      state.resultOverlayHidden = false;
      state.blCompletedKeys = [];
      state.blAllPlacedWin = false;
      state.classicBonusUnfinishedApplied = false;
      state.classicBonusHighlights = [];
      state.completedKeys = [];
      state.blWinners = null;
      state.winnerId = null;
      state.popjamWinners = null;
      state.passStreak = 0;
      state.discardPending = 0;
      state.discardPlayerId = null;
      state.discardQueue = [];
      state.discardPlacementPlayerId = null;
      state.discardColor = "";
      state.popjamExtraPlacements = 0;
      state.popjamPostDiscardPlacement = null;
      state.popjamWinDiscardShowcase = null;
      state.pendingQuestionEffects = [];
      state.pendingQuestionContext = null;
      state.pendingQuestionPlacement = null;
      state.pendingAction = null;
      state.lifeDamageQueue = [];
      state.lifeRecoveryQueue = [];
      state.lifeWounded = [];
      clearPopjamWinDiscardTimer();
      state.blPan = { x: 0, y: 0 };
      state.blZoom = document.body.classList.contains("view-mobile") ? 1 : 1.7;
      state.blCentered = false;
      lastBlScoreOrder = "";
      lastPopjamOrder = "";
      state.log = [];
      state.scoreText = "";
      state.scoreEffects = [];
      state.scoreBumpPlayerIds = [];
      state.scoreDropPlayerIds = [];
      state.stats = { completions: 0, sentTiles: 0, placedTiles: 1, startedAt: Date.now(), endedAt: null };

      if (lifeMode) {
        dealLifeTilesToPlayers();
      } else if (trapMode) {
        setupInnerQuestionTiles();
        dealAllTilesToPlayers();
        dealInnerQuestionCardsToPlayers(2);
      } else {
        refillSharedMarket();
      }

      const label = lifeMode
        ? "ライフ"
          : (trapMode ? "仕込みハテナ" : (isClassicBonusMode() ? "クラシックBT" : (state.mode === "classic" ? "クラシック" : "フリーダム")));
      addLog(label + "開始。" + (lifeMode
        ? "フリーダムと同じ自由配置で、受けたダメージ数を覚えておき、自分の手番前に手札から好きなタイルをその枚数置きます。"
        : "色を繋げて、盤面を自由に広げていこう。"));
      if (lifeMode && state.lifeCpuStrong) {
        addLog("強CPU: 回復・ダメージ・相手の残りライフを読んで配置します。");
      }
      if (lifeMode && isLifeEditMode()) {
        addLog("ダメージ中も、模様を完成させると攻撃や回復が起きます。");
      }
      if (lifeMode && isLifeTurnDebtMode()) {
        addLog("受けたダメージ分は、次の自分の手番で手札から置きます。");
      }
      if (lifeMode && lifeRecoveryRuleLabel()) {
        addLog(lifeRecoveryRuleLabel());
      }
      if (lifeMode && isLifeKoMode()) {
        addLog("回復で空いた場所には、次の自分の1手では置けません。");
      }
      blBeginTurn();
      render();
    }

    function harvestTargetScore() {
      return 8;
    }

    function defaultHarvestSeasonState() {
      return {
        targetScore: 9,
        maxHandSize: 3,
        initialHandSize: 2,
        maxDrawOnPrepare: 2,
        maxSeeds: 2,
        jackpotMinSeasonPile: 3,
        seasonPile: [],
        seasonColors: [],
        lastTurnDrawKey: ""
      };
    }

    function setupHarvestSeason() {
      state.neutralColor = "";
      state.turn = 1;
      state.currentPlayer = 0;
      state.started = true;
      state.over = false;
      state.survivalLoserId = null;
      state.selectedHandIndex = null;
      state.selectedRotation = 0;
      state.selectedColor = "red";
      state.deck = shuffle(tileDefinitions.map(cloneTile));
      state.sharedMarket = [];
      state.marketRotations = {};
      state.innerQuestionDeck = [];
      state.board = createEmptyBoard();
      state.questionBoard = createEmptyQuestionBoard();
      state.players = createPlayers(3, state.cpuEnabled);
      state.playerCount = 3;
      state.blBoard = {};
      state.blBoard[blCellKey(0, 0)] = {
        tile: { id: startTile.id, name: startTile.name, src: startTile.src, start: true },
        rotation: 0
      };
      state.startTileAnimating = true;
      resetScoreFlights();
      state.tiebreak = null;
      state.blCompletedKeys = [];
      state.blAllPlacedWin = false;
      state.completedKeys = [];
      state.blWinners = null;
      state.winnerId = null;
      state.popjamWinners = null;
      state.passStreak = 0;
      state.discardPending = 0;
      state.discardPlayerId = null;
      state.discardQueue = [];
      state.discardPlacementPlayerId = null;
      state.discardColor = "";
      state.popjamExtraPlacements = 0;
      state.popjamPostDiscardPlacement = null;
      state.popjamWinDiscardShowcase = null;
      state.pendingQuestionEffects = [];
      state.pendingQuestionContext = null;
      state.pendingQuestionPlacement = null;
      state.pendingAction = null;
      state.lifeDamageQueue = [];
      state.lifeRecoveryQueue = [];
      state.lifeWounded = [];
      clearPopjamWinDiscardTimer();
      state.blPan = { x: 0, y: 0 };
      state.blZoom = document.body.classList.contains("view-mobile") ? 1 : 1.7;
      state.blCentered = false;
      lastBlScoreOrder = "";
      lastPopjamOrder = "";
      state.log = [];
      state.scoreText = "";
      state.scoreEffects = [];
      state.scoreBumpPlayerIds = [];
      state.scoreDropPlayerIds = [];
      state.harvestLine = 3;
      state.harvestPlacedThisTurn = 0;
      state.harvestSeason = defaultHarvestSeasonState();
      dealAnimationQueue.length = 0;
      riverAnimationQueue.length = 0;
      lastRenderedDeckCount = null;
      state.stats = { completions: 0, sentTiles: 0, placedTiles: 1, startedAt: Date.now(), endedAt: null };

      state.players.forEach(function (player) {
        player.hand = [];
        player.seedPile = [];
        player.scorePile = [];
        player.harvestPile = [];
        player.score = 0;
        player.displayScore = 0;
        player.completed = 0;
        player.maxPattern = 0;
        for (let i = 0; i < state.harvestSeason.initialHandSize && state.deck.length > 0; i++) {
          player.hand.push(state.deck.shift());
        }
      });

      addLog("ハーベスト: 種と季節開始。5×5の中央から、毎手番1枚引き、1点模様で種を作り、2点以上で季節の山を育てます。");
      blBeginTurn();
      render();
    }

    function setupHarvest() {
      state.neutralColor = "";
      state.turn = 1;
      state.currentPlayer = 0;
      state.started = true;
      state.over = false;
      state.survivalLoserId = null;
      state.selectedHandIndex = null;
      state.selectedRotation = 0;
      state.selectedColor = "red";
      state.deck = shuffle(tileDefinitions.map(cloneTile));
      state.sharedMarket = [];
      state.marketRotations = {};
      state.innerQuestionDeck = [];
      state.board = createEmptyBoard();
      state.questionBoard = createEmptyQuestionBoard();
      state.players = createPlayers(state.playerCount, state.cpuEnabled);
      state.blBoard = {};
      state.blBoard[blCellKey(0, 0)] = {
        tile: { id: startTile.id, name: startTile.name, src: startTile.src, start: true },
        rotation: 0
      };
      state.startTileAnimating = true; // 開始時にスタートタイルを設置演出付きで置く
      resetScoreFlights();
      state.tiebreak = null;
      state.blCompletedKeys = [];
      state.blAllPlacedWin = false;
      state.completedKeys = [];
      state.blWinners = null;
      state.winnerId = null;
      state.popjamWinners = null;
      state.passStreak = 0;
      state.discardPending = 0;
      state.discardPlayerId = null;
      state.discardQueue = [];
      state.discardPlacementPlayerId = null;
      state.discardColor = "";
      state.popjamExtraPlacements = 0;
      state.popjamPostDiscardPlacement = null;
      state.popjamWinDiscardShowcase = null;
      state.pendingQuestionEffects = [];
      state.pendingQuestionContext = null;
      state.pendingQuestionPlacement = null;
      state.pendingAction = null;
      clearPopjamWinDiscardTimer();
      state.blPan = { x: 0, y: 0 };
      state.blZoom = document.body.classList.contains("view-mobile") ? 1 : 1.7;
      state.blCentered = false;
      lastBlScoreOrder = "";
      lastPopjamOrder = "";
      state.log = [];
      state.scoreText = "";
      state.scoreEffects = [];
      state.scoreBumpPlayerIds = [];
      state.scoreDropPlayerIds = [];
      state.harvestLine = 3;
      state.harvestPlacedThisTurn = 0;
      dealAnimationQueue.length = 0;
      riverAnimationQueue.length = 0;
      lastRenderedDeckCount = null;
      state.stats = { completions: 0, sentTiles: 0, placedTiles: 0, startedAt: Date.now(), endedAt: null };

      // 共有札5枚の形式（クラシック/フリーと同じ）。個人手札は使わない。
      refillSharedMarket();

      state.players.forEach(function (player, index) {
        player.hand = [];
        player.harvestPile = [];
        player.harvestBonus = 0;
        player.score = 0;
      });

      addLog("ハーベスト開始。中央にスタートタイルを置きました。ボーダー3点以上の模様を収穫し、集めたタイル枚数で競います。");
      blBeginTurn();
      render();
    }

    function drawHarvestTurnTile(player) {
      if (!player || state.deck.length === 0) {
        return false;
      }
      player.hand.push(state.deck.shift());
      if (state.turn > 1) {
        // 開始時（最初の手番）は手札が飛んでくる演出を出さない
        queueDealAnimation(player.id, 1, player.color);
      }
      addLog(player.name + " が山札から1枚引きました。");
      return true;
    }

    function harvestHasAnyMove(player) {
      // 共有札5枚のどれかが置けるか（全プレイヤー共通）
      const tiles = state.sharedMarket || [];
      if (tiles.length === 0) {
        return false;
      }
      for (let index = 0; index < tiles.length; index++) {
        const tile = tiles[index];
        for (let rotationIndex = 0; rotationIndex < 4; rotationIndex++) {
          const rotation = rotationIndex * 90;
          const spots = dynamicPlaceableSpots(tile, rotation);
          for (let i = 0; i < spots.length; i++) {
            if (canPlaceDynamicShared(spots[i].r, spots[i].c, tile, rotation)) {
              return true;
            }
          }
        }
      }
      return false;
    }

    function harvestCanExchange() {
      // 共有札5枚形式では手札交換は行わない
      return false;
    }

    function harvestDynamicEndReason() {
      if (!harvestHasAnyMove() && state.deck.length === 0) {
        return "共有札と山札で置ける手がなくなりました。";
      }
      return "";
    }

    function finishHarvestByScore(reason) {
      state.over = true;
      state.stats.endedAt = Date.now();
      state.tiebreak = null;
      state.blAllPlacedWin = false;
      let best = -Infinity;
      state.players.forEach(function (player) {
        player.score = player.harvestPile ? player.harvestPile.length : player.score;
        if (player.score > best) {
          best = player.score;
        }
      });
      state.blWinners = state.players
        .filter(function (player) {
          return player.score === best;
        })
        .map(function (player) {
          return player.id;
        });
      state.winnerId = state.blWinners.length === 1 ? state.blWinners[0] : null;
      addLog((reason || "ゲーム終了。") + " 収穫したタイル枚数で勝敗を判定します。");
    }

    function harvestPatternCellsStillPresent(pattern) {
      return Array.isArray(pattern.cells) && pattern.cells.every(function (cell) {
        return Boolean((state.blBoard || {})[blCellKey(cell.r, cell.c)]);
      });
    }

    function removeHarvestPatternCells(pattern) {
      const removed = [];
      if (!Array.isArray(pattern.cells)) {
        return removed;
      }
      pattern.cells.forEach(function (cell) {
        const key = blCellKey(cell.r, cell.c);
        const slot = (state.blBoard || {})[key];
        if (!slot || !slot.tile) {
          return;
        }
        removed.push(cloneTile(slot.tile));
        delete state.blBoard[key];
      });
      forgetBrokenCompletedPatterns();
      return removed;
    }

    function processHarvestCompletions(player) {
      // 現在の盤面に成立している模様（未収穫で残っているものも含む）
      const presentPatterns = WiggleRules.detectClosedPatternsDynamic(dynamicScoringBoard())
        .filter(function (pattern) {
          return harvestPatternCellsStillPresent(pattern);
        });
      const newPatterns = presentPatterns.filter(function (pattern) {
        return state.blCompletedKeys.indexOf(pattern.key) === -1;
      });

      if (newPatterns.length === 0) {
        return 0;
      }

      // 新しく完成した模様を記録＋完成演出
      newPatterns.forEach(function (pattern) {
        queueCompletionVisual(pattern, { borderless: true, marker: false });
        state.blCompletedKeys.push(pattern.key);
        state.stats.completions++;
        player.completed++;
        player.maxPattern = Math.max(player.maxPattern || 0, pattern.points);
      });

      // ボーダー判定は「盤面に残っている模様（未収穫）」も合算する
      const newPoints = newPatterns.reduce(function (sum, p) { return sum + p.points; }, 0);
      const totalPatternPoints = presentPatterns.reduce(function (sum, p) { return sum + p.points; }, 0);
      const residualPoints = totalPatternPoints - newPoints;

      if (totalPatternPoints < state.harvestLine) {
        state.scoreText = "今回" + newPoints + "点"
          + (residualPoints > 0 ? " ＋残り" + residualPoints + "＝" + totalPatternPoints + "点" : "")
          + " / ボーダー" + state.harvestLine + "未満";
        addLog(player.name + " が" + newPoints + "点を完成"
          + (residualPoints > 0 ? "（盤面の残り" + residualPoints + "点と合算で" + totalPatternPoints + "点）" : "")
          + "。ボーダー" + state.harvestLine + "点未満なので盤面に残ります。");
        scheduleToastHide();
        return newPatterns.length;
      }

      // 収穫: 残っている模様も含めて全ての色三角セルを回収（スタートタイルは取らない）
      const tileKeys = {};
      presentPatterns.forEach(function (pattern) {
        // 残っていた模様も「合算で収穫できた」ことが分かるようにハイライト
        if (newPatterns.indexOf(pattern) === -1) {
          queueCompletionVisual(pattern, { borderless: true, marker: false });
        }
        (pattern.cells || []).forEach(function (cell) {
          tileKeys[blCellKey(cell.r, cell.c)] = true;
        });
      });

      const removed = [];
      Object.keys(tileKeys).forEach(function (key) {
        const slot = (state.blBoard || {})[key];
        if (!slot || !slot.tile || slot.tile.start) {
          return; // スタートタイルは収穫しない
        }
        removed.push(cloneTile(slot.tile));
        delete state.blBoard[key];
      });
      forgetBrokenCompletedPatterns();

      if (removed.length === 0) {
        return 0;
      }

      removed.forEach(function (tile) {
        player.harvestPile.push(tile);
      });
      player.score = player.harvestPile.length;

      state.scoreBumpPlayerIds = [player.id];
      state.scoreText = (residualPoints > 0
        ? "残り" + residualPoints + " ＋ 今回" + newPoints + " ＝ " + totalPatternPoints + "点"
        : "合計" + totalPatternPoints + "点")
        + " ≧ ボーダー" + state.harvestLine + " → " + removed.length + "枚収穫";
      state.harvestLine++;
      addLog(player.name + " が"
        + (residualPoints > 0
          ? "盤面の残り" + residualPoints + "点＋今回の" + newPoints + "点＝合計" + totalPatternPoints + "点で"
          : "合計" + totalPatternPoints + "点で")
        + "ボーダー到達。" + removed.length + "枚を収穫（計" + player.score
        + "枚）。次のボーダーは" + state.harvestLine + "点です。");

      scheduleToastHide();
      setTimeout(function () {
        if (!state.started) { return; }
        state.scoreBumpPlayerIds = [];
        if (isDynamicBoardMode()) {
          renderBlScores();
        }
      }, 560);

      const endReason = harvestDynamicEndReason();
      if (endReason) {
        finishHarvestByScore(endReason);
      }

      return newPatterns.length;
    }

    function harvestSeasonConfig() {
      if (!state.harvestSeason) {
        state.harvestSeason = defaultHarvestSeasonState();
      }
      return state.harvestSeason;
    }

    function harvestSeasonAllowsCell(row, col) {
      return !isHarvestSeasonMode() || (row >= -2 && row <= 2 && col >= -2 && col <= 2);
    }

    function harvestSeasonPlayerCanPrepare(player) {
      const cfg = harvestSeasonConfig();
      return Boolean(player && !player.finished && state.deck.length > 0 && player.hand.length < cfg.maxHandSize);
    }

    function drawHarvestSeasonTurnTile(player) {
      if (!isHarvestSeasonMode() || !player || player.finished || state.deck.length === 0) {
        return false;
      }
      const cfg = harvestSeasonConfig();
      const drawKey = state.turn + ":" + player.id;
      if (cfg.lastTurnDrawKey === drawKey) {
        return false;
      }
      cfg.lastTurnDrawKey = drawKey;
      player.hand.push(state.deck.shift());
      queueDealAnimation(player.id, 1, player.color);
      addLog(player.name + " が季節の山札から1枚引きました。");
      return true;
    }

    function harvestSeasonCanPrepare(player) {
      return isHarvestSeasonMode()
        && state.harvestPlacedThisTurn === 0
        && harvestSeasonPlayerCanPrepare(player);
    }

    function harvestSeasonPlayerHasMove(player) {
      if (!player || !player.hand || player.hand.length === 0) {
        return false;
      }
      const savedIndex = state.selectedHandIndex;
      for (let index = 0; index < player.hand.length; index++) {
        const tile = player.hand[index];
        for (let rotationIndex = 0; rotationIndex < 4; rotationIndex++) {
          const rotation = rotationIndex * 90;
          const spots = dynamicPlaceableSpots(tile, rotation);
          for (let i = 0; i < spots.length; i++) {
            if (canPlaceDynamicShared(spots[i].r, spots[i].c, tile, rotation)) {
              state.selectedHandIndex = savedIndex;
              return true;
            }
          }
        }
      }
      state.selectedHandIndex = savedIndex;
      return false;
    }

    function harvestSeasonDynamicEndReason() {
      const winner = state.players.find(function (player) {
        return (player.scorePile || []).length >= harvestSeasonConfig().targetScore;
      });
      if (winner) {
        return winner.name + " が得点の山" + (winner.scorePile || []).length + "枚に到達しました。";
      }
      if (state.deck.length > 0) {
        return "";
      }
      const hasAction = state.players.some(function (player) {
        return harvestSeasonPlayerHasMove(player);
      });
      return hasAction ? "" : "山札がなく、全員が配置できなくなりました。";
    }

    function finishHarvestSeasonByScore(reason) {
      state.over = true;
      state.stats.endedAt = Date.now();
      state.tiebreak = null;
      state.blAllPlacedWin = false;
      let bestScore = -Infinity;
      let bestSeeds = -Infinity;
      state.players.forEach(function (player) {
        player.score = (player.scorePile || []).length;
        if (player.score > bestScore || (player.score === bestScore && (player.seedPile || []).length > bestSeeds)) {
          bestScore = player.score;
          bestSeeds = (player.seedPile || []).length;
        }
      });
      state.blWinners = state.players
        .filter(function (player) {
          return player.score === bestScore && (player.seedPile || []).length === bestSeeds;
        })
        .map(function (player) {
          return player.id;
        });
      state.winnerId = state.blWinners.length === 1 ? state.blWinners[0] : null;
      addLog((reason || "ゲーム終了。") + " 得点の山、同点なら種の数で判定します。");
    }

    function syncHarvestSeasonPlayerScore(player) {
      player.scorePile = player.scorePile || [];
      player.seedPile = player.seedPile || [];
      player.harvestPile = player.scorePile;
      player.score = player.scorePile.length;
      player.displayScore = player.score;
    }

    function harvestSeasonEntryTile(entry) {
      return entry && entry.tile ? entry.tile : entry;
    }

    function harvestSeasonReturnToDeckBottom(entries) {
      (entries || []).forEach(function (entry) {
        const tile = harvestSeasonEntryTile(entry);
        if (tile) {
          state.deck.push(cloneTile(tile));
        }
      });
    }

    function harvestSeasonPatternEntries(pattern) {
      const entries = [];
      const seen = {};
      (pattern.cells || []).forEach(function (cell) {
        const key = blCellKey(cell.r, cell.c);
        if (seen[key]) {
          return;
        }
        seen[key] = true;
        const slot = (state.blBoard || {})[key];
        if (!slot || !slot.tile || slot.tile.start) {
          return;
        }
        entries.push({
          key: key,
          tile: cloneTile(slot.tile),
          rotation: slot.rotation || 0
        });
      });
      return entries;
    }

    function removeHarvestSeasonPatternEntries(pattern) {
      const entries = harvestSeasonPatternEntries(pattern);
      entries.forEach(function (entry) {
        delete state.blBoard[entry.key];
      });
      forgetBrokenCompletedPatterns();
      return entries;
    }

    function harvestSeasonSeasonColorsFromEntry(entry) {
      const tile = harvestSeasonEntryTile(entry);
      if (!tile) {
        return [];
      }
      const colors = [];
      for (let i = 0; i < edgeSampleCount; i++) {
        const color = sampleTileEdgeColor(tile.id, entry.rotation || 0, "top", i);
        if (color && colors.indexOf(color) === -1) {
          colors.push(color);
        }
      }
      return colors;
    }

    function updateHarvestSeasonColors() {
      const cfg = harvestSeasonConfig();
      const top = cfg.seasonPile.length ? cfg.seasonPile[cfg.seasonPile.length - 1] : null;
      cfg.seasonColors = top ? harvestSeasonSeasonColorsFromEntry(top) : [];
    }

    function harvestSeasonAddScoreEntry(player, entry) {
      const tile = harvestSeasonEntryTile(entry);
      if (!tile) {
        return;
      }
      player.scorePile.push(cloneTile(tile));
      syncHarvestSeasonPlayerScore(player);
    }

    function harvestSeasonHandleSeed(player, pattern) {
      const cfg = harvestSeasonConfig();
      const entries = harvestSeasonPatternEntries(pattern);
      if (entries.length === 0) {
        return;
      }
      if (player.seedPile.length < cfg.maxSeeds) {
        player.seedPile.push(cloneTile(entries[0].tile));
        state.scoreText = player.name + " が種を1枚得ました";
        addLog(player.name + " が1点模様を作り、種を1枚得ました。1点模様は盤面に残ります。");
      } else {
        state.scoreText = player.name + " の種は上限です";
        addLog(player.name + " が1点模様を作りましたが、種が上限のため盤面に残しました。");
      }
      scheduleToastHide();
    }

    function harvestSeasonHandleHarvest(player, pattern) {
      const cfg = harvestSeasonConfig();
      const entries = removeHarvestSeasonPatternEntries(pattern);
      if (entries.length === 0) {
        return;
      }

      const seasonCount = cfg.seasonPile.length;
      const isSeasonColor = cfg.seasonColors.indexOf(pattern.color) !== -1;
      const neededSeeds = seasonCount - pattern.points;
      const canJackpot = seasonCount >= cfg.jackpotMinSeasonPile
        && isSeasonColor
        && neededSeeds >= 0
        && neededSeeds <= player.seedPile.length;
      const spentSeeds = canJackpot ? player.seedPile.splice(0, neededSeeds) : [];

      if (canJackpot) {
        cfg.seasonPile.forEach(function (entry) {
          harvestSeasonAddScoreEntry(player, entry);
        });
        cfg.seasonPile = [];
      }

      const nextSeasonEntry = entries.shift();
      entries.forEach(function (entry) {
        harvestSeasonAddScoreEntry(player, entry);
      });
      spentSeeds.forEach(function (seed) {
        harvestSeasonAddScoreEntry(player, seed);
      });
      if (nextSeasonEntry) {
        cfg.seasonPile.push(nextSeasonEntry);
      }
      updateHarvestSeasonColors();
      syncHarvestSeasonPlayerScore(player);

      const colorText = colorNames[pattern.color] || pattern.color;
      if (canJackpot) {
        state.scoreText = colorText + pattern.points + "点 + 種" + spentSeeds.length
          + " = 季節" + seasonCount + "枚 大収穫";
        addLog(player.name + " が" + colorText + pattern.points + "点模様で、種" + spentSeeds.length
          + "枚を使い大収穫。季節の山" + seasonCount + "枚を得点にしました。");
      } else {
        state.scoreText = player.name + " が" + colorText + pattern.points + "点を収穫";
        addLog(player.name + " が" + colorText + pattern.points + "点模様を収穫しました。季節の山は"
          + cfg.seasonPile.length + "枚です。");
      }
      state.scoreBumpPlayerIds = [player.id];
      scheduleToastHide();
      setTimeout(function () {
        if (!state.started) { return; }
        state.scoreBumpPlayerIds = [];
        if (isDynamicBoardMode()) {
          renderBlScores();
        }
      }, 560);

      if (player.scorePile.length >= cfg.targetScore) {
        finishHarvestSeasonByScore(player.name + " が得点の山" + player.scorePile.length + "枚に到達しました。");
      }
    }

    function processHarvestSeasonCompletions(player) {
      let processed = 0;
      while (!state.over) {
        const patterns = WiggleRules.detectClosedPatternsDynamic(dynamicScoringBoard())
          .filter(function (pattern) {
            return state.blCompletedKeys.indexOf(pattern.key) === -1
              && harvestPatternCellsStillPresent(pattern);
          })
          .sort(function (a, b) {
            return b.points - a.points;
          });
        if (patterns.length === 0) {
          break;
        }
        const pattern = patterns[0];
        state.blCompletedKeys.push(pattern.key);
        state.stats.completions++;
        player.completed++;
        player.maxPattern = Math.max(player.maxPattern || 0, pattern.points);
        queueCompletionVisual(pattern, { borderless: true, marker: false });
        if (pattern.points <= 1) {
          harvestSeasonHandleSeed(player, pattern);
        } else {
          harvestSeasonHandleHarvest(player, pattern);
        }
        processed++;
      }
      return processed;
    }

    function prepareHarvestSeasonTurn(options) {
      if (!isHarvestSeasonMode() || state.over || !state.started) {
        return;
      }
      const player = currentPlayer();
      if (!harvestSeasonCanPrepare(player)) {
        if (!(options && options.silent)) {
          addLog(player.name + " は準備できません。手札上限か山札切れです。");
          render();
        }
        return;
      }
      if (!(options && (options.fromCpu || options.historyPushed))) {
        pushHistory();
      }
      const cfg = harvestSeasonConfig();
      const drawCount = Math.min(cfg.maxDrawOnPrepare, cfg.maxHandSize - player.hand.length, state.deck.length);
      for (let i = 0; i < drawCount; i++) {
        player.hand.push(state.deck.shift());
      }
      if (drawCount > 0) {
        queueDealAnimation(player.id, drawCount, player.color);
      }
      state.passStreak = 0;
      state.scoreText = player.name + " が準備して" + drawCount + "枚引きました";
      addLog(player.name + " が準備して" + drawCount + "枚引きました。");
      scheduleToastHide();
      blAdvanceTurn();
      render();
    }

    function finishHarvestSeasonPlacement(options) {
      if (!isHarvestSeasonMode() || state.over || !state.started) {
        return;
      }
      const player = currentPlayer();
      if (!player || state.harvestPlacedThisTurn <= 0) {
        if (!(options && options.silent)) {
          addLog(player ? player.name + " はまだ配置していません。" : "配置するプレイヤーがいません。");
          render();
        }
        return;
      }
      const placed = state.harvestPlacedThisTurn;
      processHarvestSeasonCompletions(player);
      if (state.over) {
        render();
        return;
      }
      state.harvestPlacedThisTurn = 0;
      state.selectedHandIndex = null;
      state.selectedRotation = 0;
      addLog(player.name + " が配置を終了しました（" + placed + "枚）。");
      const endReason = harvestSeasonDynamicEndReason();
      if (endReason) {
        finishHarvestSeasonByScore(endReason);
        render();
        return;
      }
      blAdvanceTurn();
      render();
    }

    function exchangeHarvestHand(options) {
      if (!isHarvestMode() || state.over || !state.started) {
        return;
      }
      const player = currentPlayer();
      if (!harvestCanExchange(player)) {
        if (!(options && options.silent)) {
          addLog(player.name + " は交換できません。収穫済みタイルと手札3枚が必要です。");
          render();
        }
        return;
      }

      pushHistory();
      const outgoing = player.hand.splice(0, 3);
      const incomingCount = Math.min(outgoing.length, player.harvestPile.length);
      const incoming = player.harvestPile.splice(player.harvestPile.length - incomingCount, incomingCount);
      incoming.forEach(function (tile) {
        player.hand.push(tile);
      });
      outgoing.forEach(function (tile) {
        player.harvestPile.push(tile);
      });
      queueDealAnimation(player.id, incoming.length, player.color);
      state.passStreak = 0;
      addLog(player.name + " が手札3枚と収穫済みタイル" + incoming.length + "枚を交換しました。");
      blAdvanceTurn();
      render();
    }

    function activeDynamicPlayers() {
      return state.players.filter(function (player) {
        return !player.finished;
      });
    }

    function dynamicEndReason() {
      if (isHarvestSeasonMode()) {
        return harvestSeasonDynamicEndReason();
      }
      if (isHarvestMode()) {
        return harvestDynamicEndReason();
      }
      if (isDynamicPopjamMode()) {
        return "";
      }
      if (isLifeMode()) {
        return activeDynamicPlayers().length <= 1 ? "最後の1人になりました。" : "";
      }
      refillSharedMarket();
      if (activeDynamicPlayers().length === 0) {
        return "全員が完成しました。";
      }
      if (state.deck.length === 0 && state.sharedMarket.length === 0) {
        return "山札と共有札がなくなりました。";
      }
      if (!hasAnyDynamicMarketMove()) {
        return "置ける場所がなくなりました。";
      }
      return "";
    }

    // 同点判定その3用: 共有札に残ったタイルに含まれる自色の面積（4分割の三角数）。少ない方が勝ち。
    function marketColorArea(color) {
      let area = 0;
      (state.sharedMarket || []).forEach(function (tile) {
        for (let d = 0; d < 4; d++) {
          if (getTriangleColor(tile, 0, d) === color) { area++; }
        }
      });
      return area;
    }

    // 同点時の順位比較: a が上位なら負、下位なら正。
    // (1)最大模様の得点が高い (2)模様の総数が多い (3)共有札に残った自色面積が少ない
    function tiebreakCompare(a, b) {
      const am = a.maxPattern || 0, bm = b.maxPattern || 0;
      if (am !== bm) { return bm - am; }
      const ac = a.completed || 0, bc = b.completed || 0;
      if (ac !== bc) { return bc - ac; }
      const aa = marketColorArea(a.color), ba = marketColorArea(b.color);
      if (aa !== ba) { return aa - ba; }
      return a.id - b.id;
    }

    // 同点の内訳（表示用）。どの基準で決まったかと各値を返す。
    function dynamicTiebreakInfo(tied) {
      function crit(getter, lowerWins) {
        const vals = tied.map(function (p) { return { p: p, v: getter(p) }; });
        const nums = vals.map(function (x) { return x.v; });
        const best = lowerWins ? Math.min.apply(null, nums) : Math.max.apply(null, nums);
        const winners = vals.filter(function (x) { return x.v === best; }).map(function (x) { return x.p; });
        return { vals: vals, winners: winners, decided: winners.length === 1 };
      }
      const order = [
        crit(function (p) { return p.maxPattern || 0; }, false),
        crit(function (p) { return p.completed || 0; }, false)
      ];
      const labels = ["最大の模様の得点", "模様の数"];
      if ((state.sharedMarket || []).length > 0) {
        order.push(crit(function (p) { return marketColorArea(p.color); }, true));
        labels.push("共有札に残った自色の面積が少ない");
      }
      let winnerId = null;
      let decidedIndex = -1;
      for (let i = 0; i < order.length; i++) {
        if (order[i].decided) { winnerId = order[i].winners[0].id; decidedIndex = i; break; }
      }
      const lines = order.map(function (c, i) {
        return {
          label: labels[i],
          vals: c.vals.map(function (x) { return { playerId: x.p.id, name: x.p.name, v: x.v }; }),
          winnerId: i === decidedIndex && c.winners[0] ? c.winners[0].id : null,
          result: (decidedIndex >= 0 && i < decidedIndex) ? "引き分け"
            : (i === decidedIndex) ? (c.winners[0].name + " の勝ち")
            : (decidedIndex < 0 ? "引き分け" : "")
        };
      });
      return { winnerId: winnerId, decidedIndex: decidedIndex, lines: lines };
    }

    function appendClassicLimitGuides(world) {
      if (!isClassicSharedMode() || !world || !state.started || state.over) {
        return;
      }
      const bounds = currentDynamicViewBounds(false);
      if (!bounds || bounds.width <= 0 || bounds.height <= 0) {
        return;
      }

      // 現在の幅と高さ
      const currentWidth = bounds.width;
      const currentHeight = bounds.height;

      // だんだん近づく不透明度の計算 (1〜5段階)
      // 1-2枚: 表示しない (opacity=0)
      // 3枚: 少し薄く表示 (opacity=0.25)
      // 4枚: 警告気味に表示 (opacity=0.55)
      // 5枚(上限): 完全に置けない箇所を斜線にする (opacity=0.88)
      let opacityX = 0;
      if (currentWidth === 3) opacityX = 0.25;
      else if (currentWidth === 4) opacityX = 0.55;
      else if (currentWidth >= 5) opacityX = 0.88;

      let opacityY = 0;
      if (currentHeight === 3) opacityY = 0.25;
      else if (currentHeight === 4) opacityY = 0.55;
      else if (currentHeight >= 5) opacityY = 0.88;

      // 限界境界の座標（ここを越えたセルは配置不可）
      const leftLimitC = bounds.maxC - 4;
      const rightLimitC = bounds.minC + 4;
      const topLimitR = bounds.maxR - 4;
      const bottomLimitR = bounds.minR + 4;

      // 描画を十分にカバーする外枠（boundsの周囲5マス程度）
      const drawMinR = bounds.minR - 5;
      const drawMaxR = bounds.maxR + 5;
      const drawMinC = bounds.minC - 5;
      const drawMaxC = bounds.maxC + 5;

      // 1. 左側オーバーレイ
      if (opacityX > 0 && leftLimitC > drawMinC) {
        const leftOverlay = document.createElement("div");
        leftOverlay.className = "bl-limit-shading bl-limit-shading-left";
        leftOverlay.style.left = (drawMinC * BL_CELL) + "px";
        leftOverlay.style.width = ((leftLimitC - drawMinC) * BL_CELL) + "px";
        leftOverlay.style.top = (drawMinR * BL_CELL) + "px";
        leftOverlay.style.height = ((drawMaxR - drawMinR + 1) * BL_CELL) + "px";
        leftOverlay.style.opacity = opacityX;
        world.appendChild(leftOverlay);
      }

      // 2. 右側オーバーレイ
      if (opacityX > 0 && drawMaxC > rightLimitC) {
        const rightOverlay = document.createElement("div");
        rightOverlay.className = "bl-limit-shading bl-limit-shading-right";
        rightOverlay.style.left = ((rightLimitC + 1) * BL_CELL) + "px";
        rightOverlay.style.width = ((drawMaxC - rightLimitC) * BL_CELL) + "px";
        rightOverlay.style.top = (drawMinR * BL_CELL) + "px";
        rightOverlay.style.height = ((drawMaxR - drawMinR + 1) * BL_CELL) + "px";
        rightOverlay.style.opacity = opacityX;
        world.appendChild(rightOverlay);
      }

      // 3. 上側オーバーレイ
      if (opacityY > 0 && topLimitR > drawMinR) {
        const topOverlay = document.createElement("div");
        topOverlay.className = "bl-limit-shading bl-limit-shading-top";
        topOverlay.style.left = (drawMinC * BL_CELL) + "px";
        topOverlay.style.width = ((drawMaxC - drawMinC + 1) * BL_CELL) + "px";
        topOverlay.style.top = (drawMinR * BL_CELL) + "px";
        topOverlay.style.height = ((topLimitR - drawMinR) * BL_CELL) + "px";
        topOverlay.style.opacity = opacityY;
        world.appendChild(topOverlay);
      }

      // 4. 下側オーバーレイ
      if (opacityY > 0 && drawMaxR > bottomLimitR) {
        const bottomOverlay = document.createElement("div");
        bottomOverlay.className = "bl-limit-shading bl-limit-shading-bottom";
        bottomOverlay.style.left = (drawMinC * BL_CELL) + "px";
        bottomOverlay.style.width = ((drawMaxC - drawMinC + 1) * BL_CELL) + "px";
        bottomOverlay.style.top = ((bottomLimitR + 1) * BL_CELL) + "px";
        bottomOverlay.style.height = ((drawMaxR - bottomLimitR) * BL_CELL) + "px";
        bottomOverlay.style.opacity = opacityY;
        world.appendChild(bottomOverlay);
      }
    }

    function appendHarvestSeasonFixedCells(world) {
      if (!isHarvestSeasonMode() || !world || !state.started) {
        return;
      }
      for (let r = -2; r <= 2; r++) {
        for (let c = -2; c <= 2; c++) {
          const key = blCellKey(r, c);
          if ((state.blBoard || {})[key]) {
            continue;
          }
          const cell = document.createElement("div");
          cell.className = "bl-fixed-cell harvest-season";
          cell.style.left = (c * BL_CELL) + "px";
          cell.style.top = (r * BL_CELL) + "px";
          world.appendChild(cell);
        }
      }
    }

    // 同点判定の内訳を結果表示用HTMLに（WINの下に出す）。
    function buildTiebreakHtml() {
      const tb = state.tiebreak;
      if (!tb || !Array.isArray(tb.lines)) { return ""; }
      const playerName = function (playerId, fallbackName) {
        const player = state.players.find(function (p) { return p.id === playerId; });
        const name = player
          ? (state.cpuEnabled ? (player.isCpu ? "CPU" : "YOU") : player.name)
          : (fallbackName || "-");
        const colorClass = player && player.color ? player.color : "";
        return "<span class=\"tb-player-name " + colorClass + "\">" + escapeHtml(name) + "</span>";
      };
      let html = "<div class=\"tiebreak\"><div class=\"tb-head\">上から順に比較して先に該当したプレイヤーの勝ち</div>";
      tb.lines.forEach(function (ln, i) {
        const decided = i === tb.decidedIndex;
        const vals = ln.vals.map(function (v) {
          return "<span class=\"tb-value\">" + playerName(v.playerId, v.name)
            + "<span>" + escapeHtml(String(v.v)) + "</span></span>";
        }).join(" / ");
        const result = ln.winnerId !== null && ln.winnerId !== undefined
          ? "<span class=\"tb-result\">" + playerName(ln.winnerId) + "<span>の勝ち</span></span>"
          : escapeHtml(ln.result || "");
        html += "<div class=\"tb-row" + (decided ? " decided" : "") + "\">"
          + (i + 1) + ". " + escapeHtml(ln.label) + "：" + vals
          + (result ? "　→ " + result : "")
          + "</div>";
      });
      html += "</div>";
      return html;
    }

    function finishDynamicByScore(reason) {
      state.over = true;
      state.stats.endedAt = Date.now();
      state.tiebreak = null;
      applyClassicBonusUnfinishedScores();
      state.blAllPlacedWin = state.mode === "classic" && reason === "山札と共有札がなくなりました。";
      if (state.blAllPlacedWin) {
        state.blWinners = state.players.map(function (player) {
          return player.id;
        });
        state.winnerId = null;
        addLog(reason + " 全員が置ききったため、全員勝利です。");
        trackFinishOnce(reason, "all_placed_win");
        return;
      }

      state.blAllPlacedWin = false;
      let best = -Infinity;
      state.players.forEach(function (player) {
        if (player.score > best) {
          best = player.score;
        }
      });
      state.blWinners = state.players
        .filter(function (player) {
          return player.score === best;
        })
        .map(function (player) {
          return player.id;
        });

      if (state.blWinners.length > 1) {
        // 同点 → 規定の順で判定
        const tied = state.players.filter(function (p) { return state.blWinners.indexOf(p.id) >= 0; });
        const info = dynamicTiebreakInfo(tied);
        state.tiebreak = info;
        if (info.winnerId !== null && info.winnerId !== undefined) {
          state.blWinners = [info.winnerId];
          state.winnerId = info.winnerId;
          const w = state.players.find(function (p) { return p.id === info.winnerId; });
          addLog((reason || "ゲーム終了。") + " 同点のため規定で判定 → " + (w ? w.name : "") + " の勝ち。");
        } else {
          state.blWinners = [];
          state.winnerId = null;
          addLog((reason || "ゲーム終了。") + " 同点で決着がつかず引き分けです。");
        }
      } else {
        state.winnerId = state.blWinners.length === 1 ? state.blWinners[0] : null;
        addLog((reason || "ゲーム終了。") + " 得点で勝敗を判定します。");
      }
      trackFinishOnce(reason || "ゲーム終了。", state.blWinners.length === 0 ? "draw" : "score_win");
    }

    function finishLifeBySurvivor(reason) {
      state.over = true;
      state.stats.endedAt = Date.now();
      const alive = activeDynamicPlayers();
      state.blWinners = alive.map(function (player) {
        return player.id;
      });
      state.winnerId = state.blWinners.length === 1 ? state.blWinners[0] : null;
      state.tiebreak = null;
      addLog((reason || "ライフ終了。") + " 最後まで残ったプレイヤーの勝ちです。");
      trackFinishOnce(reason || "ライフ終了。", "life_survivor");
    }

    function lifeHasAnyMove(player) {
      const previousPlayer = state.currentPlayer;
      const previousIndex = state.selectedHandIndex;
      const index = state.players.indexOf(player);
      if (index < 0) { return false; }
      state.currentPlayer = index;
      const result = findFirstDynamicMarketIndex() >= 0;
      state.currentPlayer = previousPlayer;
      state.selectedHandIndex = previousIndex;
      return result;
    }

    function eliminateLifePlayer(player, reason) {
      if (!player || player.finished) { return; }
      player.finished = true;
      player.hand = [];
      player.lifeLocked = 0;
      player.lifeDamageSources = {};
      player.lifeKoBans = [];
      player.pending = [];
      state.lifeDamageQueue = (state.lifeDamageQueue || []).filter(function (item) {
        return item.playerId !== player.id;
      });
      state.lifeRecoveryQueue = (state.lifeRecoveryQueue || []).filter(function (item) {
        return item.playerId !== player.id;
      });
      if (state.pendingAction
        && (state.pendingAction.type === "life-damage"
          || state.pendingAction.type === "life-wound-damage"
          || state.pendingAction.type === "life-recover"
          || state.pendingAction.type === "life-lock-damage")
        && state.pendingAction.playerId === player.id) {
        state.pendingAction = null;
      }
      addLog(player.name + " は脱落しました。" + (reason || ""));
      if (activeDynamicPlayers().length <= 1) {
        finishLifeBySurvivor("最後の1人になりました。");
        render();
        return;
      }
      blAdvanceTurn();
      render();
    }

    function recoverLifeTilesFromPattern(player, pattern, options) {
      const recovered = [];
      const recoveredKeys = [];
      const used = {};
      const skipKey = options && options.skipKey ? options.skipKey : "";
      const recoveryPenalty = Math.max(0, options && options.recoveryPenalty ? options.recoveryPenalty : 0);
      const maxRecover = Math.max(0, options && typeof options.maxRecover === "number"
        ? options.maxRecover
        : pattern.points - recoveryPenalty);
      (pattern.cells || []).forEach(function (cell) {
        const key = blCellKey(cell.r, cell.c);
        if (used[key] || key === skipKey || recovered.length >= maxRecover) { return; }
        used[key] = true;
        const slot = state.blBoard[key];
        if (!slot || !slot.tile || slot.tile.start) { return; }
        recovered.push(cloneTile(slot.tile));
        recoveredKeys.push(key);
        delete state.blBoard[key];
      });
      if (recovered.length > 0) {
        recovered.forEach(function (tile) {
          player.hand.push(tile);
        });
        addLifeKoBans(player, recoveredKeys);
        forgetBrokenCompletedPatterns();
        addLog(player.name + " は自分の模様で" + recovered.length + "枚回復しました。");
        if (isLifeKoMode() && recoveredKeys.length > 0) {
          addLog(player.name + " は次の1手で回復跡に置けません。");
        }
      }
      return recovered.length;
    }

    function discardLifePatternTilesFromBoard(pattern) {
      const used = {};
      let removed = 0;
      (pattern.cells || []).forEach(function (cell) {
        const key = blCellKey(cell.r, cell.c);
        if (used[key]) { return; }
        used[key] = true;
        const slot = state.blBoard[key];
        if (!slot || !slot.tile || slot.tile.start) { return; }
        delete state.blBoard[key];
        removed++;
      });
      if (removed > 0) {
        forgetBrokenCompletedPatterns();
      }
      return removed;
    }

    function unlockedLifeHandIndexes(player) {
      const locked = lifeEditLockedCount(player);
      const indexes = [];
      for (let i = locked; i < (player.hand || []).length; i++) {
        indexes.push(i);
      }
      return indexes;
    }

    function finishLifeLockDamageAction(action) {
      state.pendingAction = null;
      if (startNextLifeDamageAction(action.returnAfterPlayerId)) {
        render();
        return;
      }
      if (typeof action.returnAfterPlayerId === "number") {
        state.currentPlayer = action.returnAfterPlayerId;
      }
      if (action.returnMode === "normal-turn") {
        blBeginTurn();
        render();
        return;
      }
      if (action.returnMode === "advance-turn") {
        blAdvanceTurn();
        render();
        return;
      }
      render();
    }

    function resolveLifeLockDamageChoice(action, selectedIndex) {
      const target = state.players[action.playerId];
      if (!target || target.finished) {
        return false;
      }
      const locked = lifeEditLockedCount(target);
      const available = unlockedLifeHandIndexes(target);
      if (available.length === 0) {
        eliminateLifePlayer(target, "全ての手札がダメージで裏返りました。");
        return true;
      }
      let safeIndex = Number.isInteger(selectedIndex) ? selectedIndex : available[available.length - 1];
      if (safeIndex < locked || safeIndex >= target.hand.length) {
        safeIndex = available[available.length - 1];
      }
      const chosen = target.hand.splice(safeIndex, 1)[0];
      target.hand.splice(locked, 0, chosen);
      target.lifeLocked = Math.min(target.hand.length, locked + 1);
      lifeRecordDamageSource(target, state.players[action.sourcePlayerId], 1);
      action.remaining = Math.max(0, (action.remaining || 0) - 1);
      state.scoreText = target.name + " が1枚を裏にしました（残りダメージ " + action.remaining + "）";
      scheduleToastHide();
      if (lifeEditLockedCount(target) >= target.hand.length) {
        eliminateLifePlayer(target, "全ての手札がダメージで裏返りました。");
        return true;
      }
      return false;
    }

    function startLifeLockDamageAction(action) {
      const target = state.players[action.playerId];
      if (!target || target.finished) {
        return false;
      }
      const available = unlockedLifeHandIndexes(target).length;
      if (available <= 0) {
        eliminateLifePlayer(target, "全ての手札がダメージで裏返りました。");
        return true;
      }
      action.remaining = Math.min(action.remaining || 0, available);
      if (action.remaining <= 0) {
        return false;
      }
      if (target.isCpu) {
        while (action.remaining > 0 && !target.finished) {
          const stopped = resolveLifeLockDamageChoice(action);
          if (stopped) {
            return true;
          }
        }
        return false;
      }
      state.pendingAction = action;
      state.currentPlayer = target.id;
      state.selectedHandIndex = null;
      state.scoreText = target.name + " はダメージとして" + action.remaining + "枚を選ぶ";
      addLog(target.name + " は手札から" + action.remaining + "枚を選び、裏向きのダメージにします。");
      scheduleToastHide();
      return true;
    }

    function applyLifeTurnDebtDamage(target, points, sourcePlayer) {
      if (!target || target.finished || points <= 0) {
        return;
      }
      const before = lifeEditLockedCount(target);
      const available = Math.max(0, (target.hand ? target.hand.length : 0) - before);
      if (available <= 0) {
        eliminateLifePlayer(target, "全ての手札がダメージで裏返りました。");
        return;
      }
      const added = Math.min(points, available);
      target.lifeLocked = Math.min(target.hand.length, before + added);
      lifeRecordDamageSource(target, sourcePlayer || currentPlayer(), added);
      addLog((sourcePlayer ? sourcePlayer.name : currentPlayer().name)
        + " の攻撃で " + target.name + " に" + points
        + "ダメージ。手札" + added + "枚が裏向きになりました。");
      if (lifeEditLockedCount(target) >= target.hand.length) {
        eliminateLifePlayer(target, "自分の手番前に全ての手札が裏返りました。");
      }
    }

    function selectLifeLockDamageTile(index) {
      const action = state.pendingAction;
      if (!action || action.type !== "life-lock-damage") {
        return;
      }
      const target = state.players[action.playerId];
      if (!target || target.finished || target.isCpu) {
        return;
      }
      const locked = lifeEditLockedCount(target);
      if (index < locked) {
        addLog("すでに裏向きの手札です。表の手札から選んでください。");
        render();
        return;
      }
      pushHistory();
      const stopped = resolveLifeLockDamageChoice(action, index);
      if (stopped || state.over) {
        return;
      }
      if (action.remaining <= 0) {
        finishLifeLockDamageAction(action);
        return;
      }
      state.pendingAction = action;
      state.currentPlayer = target.id;
      render();
    }

    function enqueueLifeDamage(target, points, sourcePlayer) {
      if (!target || target.finished || points <= 0) { return; }
      if (isLifeTurnDebtMode()) {
        applyLifeTurnDebtDamage(target, points, sourcePlayer);
        return;
      }
      if (isLifeEditMode()) {
        const sourceName = sourcePlayer ? sourcePlayer.name : currentPlayer().name;
        const action = {
          type: "life-lock-damage",
          playerId: target.id,
          remaining: Math.min(points, unlockedLifeHandIndexes(target).length),
          total: points,
          sourcePlayerId: sourcePlayer ? sourcePlayer.id : state.currentPlayer,
          returnAfterPlayerId: sourcePlayer ? sourcePlayer.id : state.currentPlayer,
          returnMode: "advance-turn"
        };
        if (state.pendingAction && state.pendingAction.type === "life-damage" && state.pendingAction.edit) {
          action.returnAfterPlayerId = state.pendingAction.playerId;
          action.returnMode = "normal-turn";
        }
        if (action.remaining <= 0) {
          eliminateLifePlayer(target, "全ての手札がダメージで裏返りました。");
          return;
        }
        addLog(sourceName + " の攻撃で " + target.name + " に" + points + "ダメージ。");
        if (state.pendingAction) {
          state.lifeDamageQueue = state.lifeDamageQueue || [];
          state.lifeDamageQueue.push(action);
          return;
        }
        startLifeLockDamageAction(action);
        return;
      }
      state.lifeDamageQueue = state.lifeDamageQueue || [];
      state.lifeDamageQueue.push({
        playerId: target.id,
        remaining: points,
        total: points,
        sourcePlayerId: sourcePlayer ? sourcePlayer.id : state.currentPlayer,
        returnAfterPlayerId: sourcePlayer ? sourcePlayer.id : state.currentPlayer
      });
      addLog(target.name + " に" + points + "ダメージ。"
        + (isLifeWoundMode() ? "手札を" + points + "枚、共通負傷置き場へ送ります。" : "追加で" + points + "枚置きます。"));
    }

    function enqueueLifeEliminatedColorDamage(pattern, sourcePlayer) {
      const targets = activeDynamicPlayers().filter(function (player) {
        return !sourcePlayer || player.id !== sourcePlayer.id;
      });
      targets.forEach(function (target) {
        enqueueLifeDamage(target, pattern.points, sourcePlayer);
        queueLifeEffectFlight(pattern, target, pattern.points, "damage");
      });
      return targets.length;
    }

    function startNextLifeDamageAction(defaultReturnAfterPlayerId) {
      if (state.pendingAction && (state.pendingAction.type === "life-damage"
        || state.pendingAction.type === "life-wound-damage"
        || state.pendingAction.type === "life-lock-damage")) {
        return true;
      }
      state.lifeDamageQueue = state.lifeDamageQueue || [];
      while (state.lifeDamageQueue.length > 0) {
        const next = state.lifeDamageQueue.shift();
        const target = state.players[next.playerId];
        if (!target || target.finished) { continue; }
        if (isLifeEditMode() || next.type === "life-lock-damage") {
          next.type = "life-lock-damage";
          next.returnAfterPlayerId = next.returnAfterPlayerId === undefined ? defaultReturnAfterPlayerId : next.returnAfterPlayerId;
          next.returnMode = next.returnMode || "advance-turn";
          if (startLifeLockDamageAction(next)) {
            return true;
          }
          continue;
        }
        if (isLifeWoundMode()) {
          if (target.hand.length === 0) {
            eliminateLifePlayer(target, "ライフがなくなりました。");
            return true;
          }
          const woundAction = {
            type: "life-wound-damage",
            playerId: target.id,
            remaining: Math.min(next.remaining, target.hand.length),
            total: next.total,
            sourcePlayerId: next.sourcePlayerId,
            returnAfterPlayerId: next.returnAfterPlayerId === undefined ? defaultReturnAfterPlayerId : next.returnAfterPlayerId
          };
          if (target.isCpu) {
            resolveLifeWoundDamage(woundAction);
            if (target.hand.length === 0) {
              eliminateLifePlayer(target, "負傷でライフがなくなりました。");
              return true;
            }
            continue;
          }
          state.pendingAction = woundAction;
          state.currentPlayer = target.id;
          state.selectedHandIndex = null;
          state.scoreText = target.name + " は" + woundAction.remaining + "枚を負傷へ送る";
          scheduleToastHide();
          return true;
        }
        if (target.hand.length === 0 || !lifeHasAnyMove(target)) {
          eliminateLifePlayer(target, target.hand.length === 0 ? "ライフがなくなりました。" : "ダメージを置ききれませんでした。");
          return true;
        }
        state.pendingAction = {
          type: "life-damage",
          playerId: target.id,
          remaining: next.remaining,
          total: next.total,
          returnAfterPlayerId: next.returnAfterPlayerId === undefined ? defaultReturnAfterPlayerId : next.returnAfterPlayerId
        };
        state.currentPlayer = target.id;
        state.selectedHandIndex = target.isCpu ? null : findFirstDynamicMarketIndex();
        state.scoreText = target.name + " はダメージであと" + state.pendingAction.remaining + "枚置く";
        scheduleToastHide();
        return true;
      }
      return false;
    }

    function startLifeEditDamageAction(player) {
      if (!isLifeEditMode() || !player || player.finished) {
        return false;
      }
      const locked = lifeEditLockedCount(player);
      if (locked <= 0) {
        return false;
      }
      if (player.hand.length === 0) {
        eliminateLifePlayer(player, "ダメージ分のライフを置けませんでした。");
        return true;
      }
      state.pendingAction = {
        type: "life-damage",
        edit: true,
        playerId: player.id,
        remaining: locked,
        total: locked,
        returnAfterPlayerId: player.id
      };
      state.currentPlayer = player.id;
      const firstIndex = findFirstDynamicMarketIndex();
      if (firstIndex < 0) {
        state.pendingAction = null;
        eliminateLifePlayer(player, "ダメージ分のライフを置ききれませんでした。");
        return true;
      }
      state.selectedHandIndex = player.isCpu ? null : firstIndex;
      state.scoreText = player.name + " はダメージ分をあと" + locked + "枚置く";
      addLog(player.name + " は手番前に手札から好きなタイルを" + locked + "枚置きます。");
      scheduleToastHide();
      return true;
    }

    function startLifeTurnDebtAction(player) {
      if (!isLifeTurnDebtMode() || !player || player.finished) {
        return false;
      }
      const debt = lifeEditLockedCount(player);
      if (debt <= 0) {
        return false;
      }
      if (debt >= player.hand.length) {
        eliminateLifePlayer(player, "自分の手番前に全ての手札が裏返りました。");
        return true;
      }
      state.pendingAction = {
        type: "life-damage",
        turnDebt: true,
        playerId: player.id,
        remaining: debt,
        total: debt,
        returnAfterPlayerId: player.id
      };
      state.currentPlayer = player.id;
      const firstIndex = findFirstDynamicMarketIndex();
      if (firstIndex < 0) {
        state.pendingAction = null;
        eliminateLifePlayer(player, "ダメージ分のライフを置ききれませんでした。");
        return true;
      }
      state.selectedHandIndex = player.isCpu ? null : firstIndex;
      state.scoreText = player.name + " はダメージ精算であと" + debt + "枚置く";
      addLog(player.name + " はダメージ" + debt + "枚を精算します。右側のグレー表示は置くたびに減ります。");
      scheduleToastHide();
      return true;
    }

    function processLifeCompletions(player, activeDamageAction, placedKey) {
      const patterns = WiggleRules.detectClosedPatternsDynamic(dynamicScoringBoard())
        .filter(function (pattern) {
          return state.blCompletedKeys.indexOf(pattern.key) === -1;
        });
      if (patterns.length === 0) {
        return 0;
      }

      const messages = [];
      patterns.forEach(function (pattern) {
        state.stats.completions++;
        queueCompletionVisual(pattern, { borderless: true, marker: false });

        if (activeDamageAction && activeDamageAction.edit) {
          state.blCompletedKeys.push(pattern.key);
          const owner = ownerForColor(pattern.color);
          if (owner && !owner.finished) {
            owner.completed++;
            owner.maxPattern = Math.max(owner.maxPattern || 0, pattern.points);
          }
          if (owner && owner.id === player.id) {
            const lockedAfterThisPlacement = Math.max(0, lifeEditLockedCount(player) - 1);
            const relieved = Math.min(lockedAfterThisPlacement, pattern.points);
            if (relieved > 0) {
              player.lifeLocked = Math.max(0, (player.lifeLocked || 0) - relieved);
              lifeReduceDamageSources(player, relieved);
            }
            const overflow = Math.max(0, pattern.points - relieved);
            if (overflow > 0) {
              const counterTarget = lifeCounterTarget(player);
              if (counterTarget) {
                enqueueLifeDamage(counterTarget, overflow, player);
                queueLifeEffectFlight(pattern, counterTarget, overflow, "damage");
                messages.push(player.name + " しのぎ" + relieved + " / 反撃" + overflow);
              } else {
                messages.push(player.name + " しのぎ" + relieved);
              }
            } else {
              messages.push(player.name + " しのぎ" + relieved);
            }
            if (relieved > 0) {
              queueLifeEffectFlight(pattern, player, relieved, "recover");
            }
            return;
          }
          if (owner && owner.id !== player.id && !owner.finished) {
            enqueueLifeDamage(owner, pattern.points, player);
            queueLifeEffectFlight(pattern, owner, pattern.points, "damage");
            messages.push(owner.name + " 反撃ダメージ" + pattern.points);
            return;
          }
          const targetCount = enqueueLifeEliminatedColorDamage(pattern, player);
          messages.push(colorNames[pattern.color] + " 脱落色反撃" + pattern.points
            + (targetCount > 1 ? "×" + targetCount : ""));
          return;
        }

        state.blCompletedKeys.push(pattern.key);

        const owner = ownerForColor(pattern.color);
        if (!owner || owner.finished) {
          const targetCount = enqueueLifeEliminatedColorDamage(pattern, player);
          messages.push(colorNames[pattern.color] + " 脱落色ダメージ" + pattern.points
            + (targetCount > 1 ? "×" + targetCount : ""));
          return;
        }
        owner.completed++;
        owner.maxPattern = Math.max(owner.maxPattern || 0, pattern.points);
        if (owner.id === player.id) {
          if (isLifeEditMode()) {
            const recovered = recoverLifeTilesFromPattern(owner, pattern, {
              maxRecover: Math.min(pattern.points, lifeHandSpace(owner)),
              skipKey: placedKey
            });
            queueLifeEffectFlight(pattern, owner, recovered, "recover");
            messages.push(owner.name + " 回復" + recovered + "枚");
            return;
          }
          if (isLifeWoundMode()) {
            enqueueLifeRecovery(owner, pattern, player);
            messages.push(owner.name + " 回復値" + pattern.points);
            return;
          }
          const recovery = lifeRecoveryInfo(pattern, player.hand.length, Boolean(activeDamageAction));
          const recovered = recoverLifeTilesFromPattern(owner, pattern, {
            maxRecover: recovery.recoverable,
            skipKey: placedKey
          });
          queueLifeEffectFlight(pattern, owner, recovered, "recover");
          messages.push(owner.name + " 回復" + recovered + "枚"
            + (recovery.reason ? "（" + recovery.reason + "）" : ""));
        } else {
          enqueueLifeDamage(owner, pattern.points, player);
          queueLifeEffectFlight(pattern, owner, pattern.points, "damage");
          messages.push(owner.name + " ダメージ" + pattern.points);
        }
      });

      if (messages.length > 0) {
        state.scoreText = messages.join(" / ");
        scheduleToastHide();
      }
      return patterns.length;
    }

    function finishLifePlacement(player, activeDamageAction) {
      if (player.hand.length === 0) {
        eliminateLifePlayer(player, "ライフがなくなりました。");
        return;
      }

      if (activeDamageAction) {
        const action = state.pendingAction && state.pendingAction.type === "life-damage"
          ? state.pendingAction
          : null;
        if (action) {
          if (action.turnDebt) {
            action.remaining = Math.max(0, (action.remaining || 0) - 1);
            player.lifeLocked = Math.max(0, (player.lifeLocked || 0) - 1);
            lifeReduceDamageSources(player, 1);
          } else if (action.edit) {
            player.lifeLocked = Math.max(0, (player.lifeLocked || 0) - 1);
            action.remaining = Math.min(Math.max(0, (action.remaining || 0) - 1), lifeEditLockedCount(player));
          } else {
            action.remaining = Math.max(0, (action.remaining || 0) - 1);
          }
          if (action.remaining > 0) {
            if (!lifeHasAnyMove(player)) {
              eliminateLifePlayer(player, "ダメージを置ききれませんでした。");
              return;
            }
            state.currentPlayer = player.id;
            state.selectedHandIndex = player.isCpu ? null : findFirstDynamicMarketIndex();
            state.scoreText = action.turnDebt
              ? player.name + " はダメージ精算であと" + action.remaining + "枚置く"
              : action.edit
              ? player.name + " はダメージ分をあと" + action.remaining + "枚置く"
              : player.name + " はダメージであと" + action.remaining + "枚置く";
            scheduleToastHide();
            render();
            return;
          }
          state.pendingAction = null;
          if (action.turnDebt) {
            state.currentPlayer = player.id;
            if (startNextLifeDamageAction(player.id)) {
              render();
              return;
            }
            addLog(player.name + " はダメージ精算を終え、通常手番へ移ります。");
            blBeginTurn();
            render();
            return;
          }
          if (action.edit) {
            player.lifeLocked = 0;
            state.currentPlayer = player.id;
            if (startNextLifeDamageAction(player.id)) {
              render();
              return;
            }
            addLog(player.name + " はダメージ分を置ききり、通常手番へ移ります。");
            blBeginTurn();
            render();
            return;
          }
        }
        if (startNextLifeDamageAction(activeDamageAction.returnAfterPlayerId)) {
          render();
          return;
        }
        state.currentPlayer = activeDamageAction.returnAfterPlayerId;
        blAdvanceTurn();
        render();
        return;
      }

      if (startNextLifeDamageAction(player.id)) {
        render();
        return;
      }
      blAdvanceTurn();
      render();
    }

    function nextActiveDynamicPlayerIndex(startIndex) {
      if (activeDynamicPlayers().length === 0) {
        return -1;
      }
      for (let step = 1; step <= state.players.length; step++) {
        const index = (startIndex + step) % state.players.length;
        if (!state.players[index].finished) {
          return index;
        }
      }
      return -1;
    }

    function blAdvanceTurn() {
      const nextIndex = nextActiveDynamicPlayerIndex(state.currentPlayer);
      if (nextIndex < 0) {
        if (isLifeMode()) {
          finishLifeBySurvivor("全員が脱落しました。");
        } else {
          finishDynamicByScore("全員が完成しました。");
        }
        return;
      }
      state.currentPlayer = nextIndex;
      state.turn++;
      blBeginTurn();
      trackTurnMilestone();
    }

    function blBeginTurn() {
      state.selectedRotation = 0;
      state.selectedHandIndex = null;
      if (isHarvestMode() || isHarvestSeasonMode()) {
        state.harvestPlacedThisTurn = 0;
      }
      const player = currentPlayer();
      const endReason = dynamicEndReason();
      if (endReason) {
        if (isHarvestSeasonMode()) {
          finishHarvestSeasonByScore(endReason);
        } else if (isHarvestMode()) {
          finishHarvestByScore(endReason);
        } else if (isLifeMode()) {
          finishLifeBySurvivor(endReason);
        } else {
          finishDynamicByScore(endReason);
        }
        return;
      }
      if (!player || player.finished) {
        blAdvanceTurn();
        return;
      }
      if (isHarvestSeasonMode()) {
        drawHarvestSeasonTurnTile(player);
        const firstHarvestSeasonIndex = findFirstDynamicMarketIndex();
        if (firstHarvestSeasonIndex < 0) {
          state.passStreak = (state.passStreak || 0) + 1;
          addLog(player.name + " は置ける手がなくパスしました。");
          if (state.passStreak >= state.players.length) {
            finishHarvestSeasonByScore("全員が配置できなくなりました。");
            return;
          }
          blAdvanceTurn();
          return;
        }
        state.passStreak = 0;
        if (!player.isCpu) {
          state.selectedHandIndex = firstHarvestSeasonIndex;
        }
        return;
      }
      if (isHarvestMode()) {
        refillSharedMarket();
        const firstHarvestIndex = findFirstDynamicMarketIndex();
        if (state.sharedMarket.length === 0 || firstHarvestIndex < 0) {
          state.passStreak = (state.passStreak || 0) + 1;
          addLog(player.name + " は置ける共有札がなくパスしました。");
          if (state.passStreak >= state.players.length
            || (state.deck.length === 0 && state.sharedMarket.length === 0)) {
            finishHarvestByScore("置ける共有札がなくなりました。");
            return;
          }
          blAdvanceTurn();
          return;
        }
        state.passStreak = 0;
        if (!player.isCpu) {
          state.selectedHandIndex = firstHarvestIndex;
        }
        return;
      }
      if (isLifeMode()) {
        if (isLifeTurnDebtMode() && lifeEditLockedCount(player) > 0) {
          startLifeTurnDebtAction(player);
          return;
        }
        if (isLifeEditMode() && lifeEditLockedCount(player) > 0) {
          startLifeEditDamageAction(player);
          return;
        }
        const firstLifeIndex = findFirstDynamicMarketIndex();
        if (player.hand.length === 0 || firstLifeIndex < 0) {
          eliminateLifePlayer(player, player.hand.length === 0 ? "ライフがなくなりました。" : "置けるタイルがありません。");
          return;
        }
        if (!player.isCpu) {
          state.selectedHandIndex = firstLifeIndex;
        }
        return;
      }
      if (usesSharedMarket()) {
        refillSharedMarket();
      }

      const firstMarketIndex = findFirstDynamicMarketIndex();
      if (isDynamicPopjamMode()) {
        if (!isPopjamScoreMode() && finishPopjamByZeroHands(player.id)) {
          return;
        }
        if (player.hand.length === 0 || firstMarketIndex < 0) {
          state.passStreak = (state.passStreak || 0) + 1;
          addLog(player.name + " は置ける手札がなくパスしました。");
          if (state.passStreak >= state.players.length) {
            if (isPopjamScoreMode()) {
              finishPopjamByScore("全員が置ける手札なしでパスしました。");
            } else {
              finishPopjamByHandCount();
            }
            return;
          }
          blAdvanceTurn();
          return;
        }
        if (!player.isCpu) {
          state.selectedHandIndex = firstMarketIndex;
        }
        return;
      }

      if (state.sharedMarket.length === 0 || firstMarketIndex < 0) {
        addLog(player.name + " は置ける共有札がありません。");
        finishDynamicByScore("置ける共有札がありません。");
        return;
      }

      if (!player.isCpu) {
        state.selectedHandIndex = firstMarketIndex;
      }
    }

    function blPlace(r, c) {
      if (state.over || !isDynamicBoardMode()) { return; }
      const player = currentPlayer();
      if (isPopjamMode() && state.discardPending > 0) { return; }
      const activeLifeDamageAction = state.pendingAction && state.pendingAction.type === "life-damage"
        ? Object.assign({}, state.pendingAction)
        : null;
