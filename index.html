      scheduleToastHide();
      render();
    }

    function placePendingReplaceTile(row, col) {
      const action = state.pendingAction;
      if (!canReplaceTileTo(row, col, action)) {
        return;
      }

      clearMobilePlacementConfirm();
      pushHistory();
      const sourceCell = boardCellAt(action.source.row, action.source.col);
      if (!sourceCell || sourceCell.tile !== action.tile) {
        finishPendingQuestionAction();
        return;
      }

      state.board[action.source.row][action.source.col] = null;
      state.board[row][col] = {
        tile: action.tile,
        rotation: action.rotation || 0
      };
      forgetBrokenCompletedPatterns();
      state.lastPlacedCell = { row: row, col: col };
      pendingDropCell = { row: row, col: col, rotation: action.rotation || 0 };
      state.stats.placedTiles++;

      const context = action.context || createQuestionContext();
      context.messages.push("ムーブ");
      addLog(currentPlayer().name + " が " + action.tile.name + " を "
        + (action.source.row + 1) + "," + (action.source.col + 1)
        + " から " + (row + 1) + "," + (col + 1) + " にムーブしました。");
      state.pendingAction = null;
      state.popjamPostDiscardPlacement = {
        row: row,
        col: col,
        playerId: currentPlayer().id,
        context: context
      };
      if (interruptQuestionEffectsForPopjamScore(context, state.pendingQuestionEffects.slice(), currentPlayer().id)) {
        render();
        return;
      }
      state.popjamPostDiscardPlacement = null;
      const questionContext = beginQuestionEffectsForPlacement(row, col, currentPlayer(), context);
      if (!questionContext) {
        render();
        return;
      }
      if (state.pendingQuestionEffects.length > 0 || hasPendingAction()) {
        state.pendingQuestionContext = questionContext;
        render();
        return;
      }
      finishPopjamPlacement(currentPlayer().id, questionContext);
    }

    function applyQuestionReplace(playerId, context) {
      const size = state.board.length || fixedBoardSize();
      for (let row = 0; row < size; row++) {
        for (let col = 0; col < size; col++) {
          const cell = boardCellAt(row, col);
          if (!cell || !cell.tile || cell.tile.start || isInnerQuestionTile(cell.tile) || isCellLocked(row, col)) {
            continue;
          }
          const move = findReplaceMoveForTile(row, col, cell.tile);
          if (!move) {
            continue;
          }
          state.board[row][col] = null;
          state.board[move.row][move.col] = {
            tile: cell.tile,
            rotation: move.rotation
          };
          forgetBrokenCompletedPatterns();
          state.lastPlacedCell = { row: move.row, col: move.col };
          pendingDropCell = { row: move.row, col: move.col, rotation: move.rotation };
          addLog((state.players[playerId] ? state.players[playerId].name : currentPlayer().name)
            + " が " + cell.tile.name + " をムーブしました。");
          if (context) {
            beginQuestionEffectsForPlacement(move.row, move.col, currentPlayer(), context);
          }
          return true;
        }
      }
      return false;
    }

    function salvageRiverTileForQuestion(playerId) {
      let source = null;
      state.players.forEach(function (player) {
        if (player.id !== playerId && player.river.length > 0 && (!source || player.river.length > source.river.length)) {
          source = player;
        }
      });

      if (!source) {
        return null;
      }

      return {
        tile: source.river[source.river.length - 1],
        sourcePlayerId: source.id,
        sourceRiverIndex: source.river.length - 1
      };
    }

    function selectSalvageRiverTile(sourcePlayerId, riverIndex) {
      if (!state.pendingAction || state.pendingAction.type !== "salvage") {
        return;
      }

      const source = state.players.find(function (player) {
        return player.id === sourcePlayerId;
      });
      const tile = source && source.river[riverIndex];
      if (!tile || sourcePlayerId === currentPlayer().id) {
        return;
      }

      state.pendingAction = Object.assign({}, state.pendingAction, {
        type: "salvage-place",
        tile: tile,
        sourcePlayerId: sourcePlayerId,
        sourceRiverIndex: riverIndex,
        rotation: 0
      });
      state.scoreText = hasAnyLegalMoveForTile(tile)
        ? "サルベージ: 選んだタイルを盤面に配置してください。"
        : "サルベージ: 置けないため、パスで自分の捨て札へ移せます。";
      scheduleToastHide();
      render();
    }

    function movePendingSalvageTileToOwnRiver() {
      const action = state.pendingAction;
      if (!action || action.type !== "salvage-place") {
        return false;
      }

      const source = state.players.find(function (player) {
        return player.id === action.sourcePlayerId;
      });
      const player = currentPlayer();
      const tile = source && source.river[action.sourceRiverIndex];
      if (!source || !player || !tile) {
        finishPendingQuestionAction();
        return true;
      }

      pushHistory();
      source.river.splice(action.sourceRiverIndex, 1);
      player.river.push(tile);
      queueRiverAnimation(null, player.id, tile);
      const context = action.context || createQuestionContext();
      context.messages.push("サルベージ保留");
      addLog(player.name + " は " + source.name + " の捨て札から " + tile.name
        + " をサルベージし、自分の捨て札へ移しました。");
      finishPendingQuestionAction();
      return true;
    }

    function hasAnyLegalMoveForTile(tile) {
      if (isDynamicBoardMode()) {
        return [0, 90, 180, 270].some(function (rotation) {
          return dynamicPlaceableSpots(tile, rotation).some(function (spot) {
            return canPlaceDynamicShared(spot.r, spot.c, tile, rotation);
          });
        });
      }
      const size = state.board.length || fixedBoardSize();
      for (let row = 0; row < size; row++) {
        for (let col = 0; col < size; col++) {
          for (let i = 0; i < 4; i++) {
            if (canPlaceTileAt(row, col, tile, i * 90)) {
              return true;
            }
          }
        }
      }
      return false;
    }

    function placePendingSalvageTile(row, col) {
      const action = state.pendingAction;
      if (!action || action.type !== "salvage-place") {
        return;
      }

      if (isDynamicBoardMode()) {
        placePendingSalvageTileDynamic(row, col);
        return;
      }

      if (!canPlaceAt(row, col)) {
        return;
      }

      clearMobilePlacementConfirm();
      const source = state.players.find(function (player) {
        return player.id === action.sourcePlayerId;
      });
      const tile = source && source.river[action.sourceRiverIndex];
      if (!tile) {
        finishPendingQuestionAction();
        return;
      }

      pushHistory();
      source.river.splice(action.sourceRiverIndex, 1);
      state.board[row][col] = {
        tile: tile,
        rotation: action.rotation || 0
      };
      state.lastPlacedCell = { row: row, col: col };
      pendingDropCell = { row: row, col: col, rotation: action.rotation || 0 };
      state.stats.placedTiles++;

      const context = action.context || createQuestionContext();
      context.messages.push("サルベージ");
      addLog(currentPlayer().name + " が " + source.name + " の捨て札から " + tile.name + " を盤面に配置しました。");
      state.pendingAction = null;
      state.popjamPostDiscardPlacement = {
        row: row,
        col: col,
        playerId: currentPlayer().id,
        context: context
      };
      if (interruptQuestionEffectsForPopjamScore(context, state.pendingQuestionEffects.slice(), currentPlayer().id)) {
        render();
        return;
      }
      state.popjamPostDiscardPlacement = null;
      const questionContext = beginQuestionEffectsForPlacement(row, col, currentPlayer(), context);
      if (!questionContext) {
        render();
        return;
      }
      if (state.pendingQuestionEffects.length > 0 || hasPendingAction()) {
        state.pendingQuestionContext = questionContext;
        render();
        return;
      }
      finishPopjamPlacement(currentPlayer().id, questionContext);
    }

    function placePendingSalvageTileDynamic(row, col) {
      const action = state.pendingAction;
      if (!action || action.type !== "salvage-place") {
        return;
      }

      const tile = action.tile;
      const rotation = action.rotation || 0;
      if (!canPlaceDynamicShared(row, col, tile, rotation)) {
        return;
      }

      clearMobilePlacementConfirm();
      const source = state.players.find(function (player) {
        return player.id === action.sourcePlayerId;
      });
      const sourceTile = source && source.river[action.sourceRiverIndex];
      if (!sourceTile) {
        finishPendingQuestionAction();
        return;
      }

      pushHistory();
      source.river.splice(action.sourceRiverIndex, 1);
      state.blBoard[blCellKey(row, col)] = {
        tile: isInnerQuestionTile(sourceTile) ? cloneQuestionTile(sourceTile) : cloneTile(sourceTile),
        rotation: isInnerQuestionTile(sourceTile) ? 0 : rotation
      };
      state.lastPlacedCell = { row: row, col: col, borderless: true };
      pendingDropCell = { row: row, col: col, rotation: rotation, borderless: true };
      state.stats.placedTiles++;

      const context = action.context || createQuestionContext();
      context.messages.push("サルベージ");
      addLog(currentPlayer().name + " が " + source.name + " の捨て札から " + sourceTile.name + " を盤面に配置しました。");
      state.pendingAction = null;
      state.popjamPostDiscardPlacement = {
        row: row,
        col: col,
        playerId: currentPlayer().id,
        context: context
      };
      if (interruptQuestionEffectsForPopjamScore(context, state.pendingQuestionEffects.slice(), currentPlayer().id)) {
        render();
        return;
      }
      state.popjamPostDiscardPlacement = null;
      const questionContext = beginQuestionEffectsForPlacement(row, col, currentPlayer(), context);
      if (!questionContext) {
        render();
        return;
      }
      if (state.pendingQuestionEffects.length > 0 || hasPendingAction()) {
        state.pendingQuestionContext = questionContext;
        render();
        return;
      }
      finishPopjamPlacement(currentPlayer().id, questionContext);
    }

    function placeSalvagedTileAutomatically(tile, sourcePlayerId, sourceRiverIndex, context) {
      if (isDynamicBoardMode()) {
        for (let i = 0; i < 4; i++) {
          const rotation = i * 90;
          const spots = dynamicPlaceableSpots(tile, rotation);
          for (let j = 0; j < spots.length; j++) {
            if (!canPlaceDynamicShared(spots[j].r, spots[j].c, tile, rotation)) {
              continue;
            }
            const source = state.players.find(function (player) {
              return player.id === sourcePlayerId;
            });
            if (!source || !source.river[sourceRiverIndex]) {
              return false;
            }
            source.river.splice(sourceRiverIndex, 1);
            state.blBoard[blCellKey(spots[j].r, spots[j].c)] = {
              tile: isInnerQuestionTile(tile) ? cloneQuestionTile(tile) : cloneTile(tile),
              rotation: isInnerQuestionTile(tile) ? 0 : rotation
            };
            state.lastPlacedCell = { row: spots[j].r, col: spots[j].c, borderless: true };
            pendingDropCell = { row: spots[j].r, col: spots[j].c, rotation: rotation, borderless: true };
            state.stats.placedTiles++;
            const questionContext = context || createQuestionContext();
            state.popjamPostDiscardPlacement = {
              row: spots[j].r,
              col: spots[j].c,
              playerId: currentPlayer().id,
              context: questionContext
            };
            if (interruptQuestionEffectsForPopjamScore(questionContext, state.pendingQuestionEffects.slice(), currentPlayer().id)) {
              return true;
            }
            state.popjamPostDiscardPlacement = null;
            beginQuestionEffectsForPlacement(spots[j].r, spots[j].c, currentPlayer(), questionContext);
            return true;
          }
        }
        return false;
      }
      for (let row = 0; row < 5; row++) {
        for (let col = 0; col < 5; col++) {
          for (let i = 0; i < 4; i++) {
            const rotation = i * 90;
            if (canPlaceTileAt(row, col, tile, rotation)) {
              const source = state.players.find(function (player) {
                return player.id === sourcePlayerId;
              });
              if (!source || !source.river[sourceRiverIndex]) {
                return false;
              }
              source.river.splice(sourceRiverIndex, 1);
              state.board[row][col] = { tile: tile, rotation: rotation };
              state.lastPlacedCell = { row: row, col: col };
              pendingDropCell = { row: row, col: col, rotation: rotation };
              state.stats.placedTiles++;
              const questionContext = context || createQuestionContext();
              state.popjamPostDiscardPlacement = {
                row: row,
                col: col,
                playerId: currentPlayer().id,
                context: questionContext
              };
              if (interruptQuestionEffectsForPopjamScore(questionContext, state.pendingQuestionEffects.slice(), currentPlayer().id)) {
                return true;
              }
              state.popjamPostDiscardPlacement = null;
              beginQuestionEffectsForPlacement(row, col, currentPlayer(), questionContext);
              return true;
            }
          }
        }
      }
      return false;
    }

    function togglePresentHandTile(index) {
      const action = state.pendingAction;
      if (!action || action.type !== "present") {
        return;
      }

      const existing = action.selectedHandIndexes.indexOf(index);
      if (existing !== -1) {
        action.selectedHandIndexes.splice(existing, 1);
      } else if (action.selectedHandIndexes.length < 2) {
        action.selectedHandIndexes.push(index);
      }
      render();
    }

    function selectPresentTarget(playerId) {
      const action = state.pendingAction;
      if (!action || action.type !== "present" || action.selectedHandIndexes.length === 0) {
        return;
      }

      const player = currentPlayer();
      const target = state.players.find(function (candidate) {
        return candidate.id === playerId && candidate.id !== player.id;
      });
      if (!target) {
        return;
      }

      pushHistory();
      const indexes = action.selectedHandIndexes.slice().sort(function (a, b) {
        return b - a;
      });
      const gifts = [];
      indexes.forEach(function (index) {
        const tile = player.hand[index];
        if (tile) {
          gifts.unshift(tile);
          player.hand.splice(index, 1);
        }
      });

      target.hand = target.hand.concat(gifts);
      const context = action.context || createQuestionContext();
      if (gifts.length > 0) {
        context.messages.push("プレゼント");
        addLog(player.name + " が " + target.name + " に手札" + gifts.length + "枚を渡しました。");
      } else {
        context.messages.push("プレゼント不発");
      }
      finishPendingQuestionAction();
    }

    // カラーズ/スーパーカラーズは、入れ替え先の盤面の色とつながる場所にだけ動ける（オールカラーズは例外）
    function questionSwapDestinationOk(movedTile, destSlot) {
      if (!movedTile || !destSlot) { return false; }
      if (movedTile.effect === "all-colors") { return true; }
      if (movedTile.effect !== "color" && movedTile.effect !== "super-color") { return true; }
      const dirIndex = DIR_OPP[destSlot.inwardDir];
      if (dirIndex === undefined) { return false; }
      const cell = boardCellAt(destSlot.boardRow, destSlot.boardCol);
      if (!cell || !cell.tile) { return true; }
      const edge = ["top", "right", "bottom", "left"][dirIndex];
      for (let i = 0; i < edgeSampleCount; i++) {
        if (sampleTileEdgeColor(cell.tile.id, cell.rotation || 0, edge, i) !== movedTile.color) { return false; }
      }
      return true;
    }

    function applyQuestionSwap(slot, context) {
      const player = currentPlayer();
      if (context.swapDepth > 0) {
        context.messages.push("スワップ連鎖停止");
        return false;
      }
      context.swapDepth++;

      const candidates = state.questionBoard.filter(function (candidate) {
        return candidate.id !== slot.id
          && questionSwapDestinationOk(slot.tile, candidate)
          && questionSwapDestinationOk(candidate.tile, slot);
      });
      const target = candidates.find(function (candidate) {
        return !candidate.revealed;
      }) || candidates[0];

      if (!target) {
        context.messages.push("スワップ不発");
        context.swapDepth--;
        return false;
      }

      const targetTile = target.tile;
      const targetWasRevealed = target.revealed;
      target.tile = slot.tile;
      target.revealed = true;
      target.effectUsed = false;
      if (!targetWasRevealed) {
        queueQuestionRevealAnimation(target.id);
      }
      slot.tile = targetTile;
      slot.revealed = true;
      slot.effectUsed = false;
      if (!targetWasRevealed) {
        queueQuestionRevealAnimation(slot.id);
      }
      context.messages.push("スワップ");
      addLog(player.name + " が外周ハテナをスワップしました。");

      context.swapDepth--;
      return false;
    }

    function selectQuestionSwapSlot(slotId) {
      const action = state.pendingAction;
      if (!action || action.type !== "swap") {
        return;
      }

      if (action.selectedSlotIds.indexOf(slotId) !== -1) {
        action.selectedSlotIds = action.selectedSlotIds.filter(function (id) {
          return id !== slotId;
        });
        render();
        return;
      }

      action.selectedSlotIds.push(slotId);
      if (action.selectedSlotIds.length < 2) {
        render();
        return;
      }

      const first = state.questionBoard.find(function (slot) {
        return slot.id === action.selectedSlotIds[0];
      });
      const second = state.questionBoard.find(function (slot) {
        return slot.id === action.selectedSlotIds[1];
      });

      if (!first || !second || first.id === second.id) {
        action.selectedSlotIds = [];
        render();
        return;
      }

      if (!questionSwapDestinationOk(first.tile, second) || !questionSwapDestinationOk(second.tile, first)) {
        action.selectedSlotIds.pop();
        flashInstructionNote("色がつながらないため選べません");
        return;
      }

      requestSwapConfirm(action, first, second);
    }

    function performQuestionSwap(action, first, second) {
      if (state.pendingAction !== action) {
        return;
      }
      pushHistory();
      const context = action.context || createQuestionContext();
      const firstWasRevealed = first.revealed;
      const secondWasRevealed = second.revealed;
      const firstTile = first.tile;
      first.tile = second.tile;
      second.tile = firstTile;
      first.revealed = true;
      second.revealed = true;
      first.effectUsed = false;
      second.effectUsed = false;
      if (!firstWasRevealed) {
        queueQuestionRevealAnimation(first.id);
      }
      if (!secondWasRevealed) {
        queueQuestionRevealAnimation(second.id);
      }
      context.messages.push("スワップ");
      addLog(currentPlayer().name + " が外周ハテナ2枚をスワップしました。");

      state.pendingAction = null;

      if (!state.pendingAction) {
        finishPendingQuestionAction();
      } else {
        render();
      }
    }

    function continuePopjamExtraPlacement(player) {
      if (!isPopjamMode() || state.discardPending > 0 || state.popjamExtraPlacements <= 0) {
        return false;
      }

      const hasSharedMove = usesSharedMarket();
      const nextMarketIndex = hasSharedMove
        ? (isClassicSharedMode() || isPopjamScoreMode() ? findFirstClassicMarketIndex() : findFirstBorderlessMarketIndex())
        : -1;
      const hasMove = hasSharedMove
        ? nextMarketIndex >= 0
        : (isDynamicPopjamMode() ? findFirstDynamicMarketIndex() >= 0 : hasAnyLegalMove(player));
      if (!player || (!hasSharedMove && player.hand.length === 0) || !hasMove) {
        state.popjamExtraPlacements = 0;
        return false;
      }

      state.popjamExtraPlacements--;
      state.selectedRotation = 0;
      state.selectedHandIndex = player.isCpu ? null : (hasSharedMove ? nextMarketIndex : 0);
      if (!player.isCpu) {
        state.scoreText = hasSharedMove
          ? "ワンモア: 共有札を選んで、もう1枚置いてください。"
          : "ワンモア: もう1枚置いてください。";
        state.scoreToastText = "";
        state.scoreToastHtml = "";
      }
      addLog(player.name + " はワンモアでもう1枚置けます。");
      return true;
    }

    function findFirstPopjamScoreTestKeptMove(player) {
      if (!isPopjamScoreTestMode() || !player || !Array.isArray(player.hand) || player.hand.length === 0) {
        return null;
      }
      const offset = state.sharedMarket.length;
      const size = state.board.length || fixedBoardSize();
      for (let handIndex = 0; handIndex < player.hand.length; handIndex++) {
        const tile = player.hand[handIndex];
        if (!tile) {
          continue;
        }
        for (let rotationIndex = 0; rotationIndex < 4; rotationIndex++) {
          const rotation = rotationIndex * 90;
          for (let row = 0; row < size; row++) {
            for (let col = 0; col < size; col++) {
              if (!state.board[row][col] && canPlaceTileAt(row, col, tile, rotation)) {
                return {
                  index: offset + handIndex,
                  rotation: rotation
                };
              }
            }
          }
        }
      }
      return null;
    }

    function continuePopjamScoreTestKeptPlacement(player) {
      if (!isPopjamScoreTestMode() || state.discardPending > 0 || hasPendingQuestionEffects() || hasPendingAction()) {
        return false;
      }
      const next = findFirstPopjamScoreTestKeptMove(player);
      if (!next) {
        return false;
      }
      state.selectedRotation = next.rotation;
      state.selectedHandIndex = player.isCpu ? null : next.index;
      if (!player.isCpu) {
        state.scoreText = "キープ放出: 追加手札を続けて置けます。";
        state.scoreToastText = "";
        state.scoreToastHtml = "";
      }
      addLog(player.name + " はキープしたタイルを続けて置けます。");
      return true;
    }

    function declarePopjamWin(player) {
      state.over = true;
      state.stats.endedAt = Date.now();
      updatePopjamWinnersByRank();
      addLog(player.name + " が手札を全て出し切りました。残り手札数で順位を確定します。");
    }

    function finishPopjamByHandCount() {
      state.over = true;
      state.stats.endedAt = Date.now();
      const ranking = updatePopjamWinnersByRank();
      const fewest = ranking.length > 0 ? ranking[0].handCount : 0;
      addLog("終了: 手札最少(" + fewest + "枚)のプレイヤーが勝ちです。");
    }

    function finishPopjamByScore(reason) {
      state.over = true;
      state.stats.endedAt = Date.now();
      const ranking = updatePopjamWinnersByRank();
      const topScore = ranking.length > 0 ? ranking[0].score : 0;
      addLog((reason || "終了") + " 得点最多(" + topScore + "点)のプレイヤーが勝ちです。");
    }

    function computePopjamRanking() {
      if (isPopjamScoreMode()) {
        const sortedByScore = state.players.slice().sort(function (a, b) {
          if (b.score !== a.score) {
            return b.score - a.score;
          }
          return a.id - b.id;
        });
        let lastScore = null;
        let currentScoreRank = 0;
        return sortedByScore.map(function (player, index) {
          if (lastScore === null || player.score !== lastScore) {
            currentScoreRank = index + 1;
            lastScore = player.score;
          }
          return {
            rank: currentScoreRank,
            player: player,
            handCount: player.hand.length,
            score: player.score
          };
        });
      }
      const sorted = state.players.slice().sort(function (a, b) {
        if (a.hand.length !== b.hand.length) {
          return a.hand.length - b.hand.length;
        }
        return a.id - b.id;
      });

      let lastCount = null;
      let currentRank = 0;
      return sorted.map(function (player, index) {
        if (lastCount === null || player.hand.length !== lastCount) {
          currentRank = index + 1;
          lastCount = player.hand.length;
        }
        return {
          rank: currentRank,
          player: player,
          handCount: player.hand.length,
          score: player.score
        };
      });
    }

    function survivalLoserId() {
      if (!isSurvivalFamilyMode() || !state.over || state.survivalAllCleared || boardIsFull()) {
        return null;
      }
      if (Number.isInteger(state.survivalLoserId)) {
        return state.survivalLoserId;
      }
      const loser = currentPlayer();
      return loser ? loser.id : null;
    }

    function computeScoreRanking() {
      const loserId = survivalLoserId();
      const sorted = state.players.slice().sort(function (a, b) {
        if (loserId !== null && a.id !== b.id) {
          if (a.id === loserId) {
            return 1;
          }
          if (b.id === loserId) {
            return -1;
          }
        }
        if (b.score !== a.score) {
          return b.score - a.score;
        }
        return a.id - b.id;
      });

      let lastScore = null;
      let currentRank = 0;
      return sorted.map(function (player, index) {
        if (loserId !== null && player.id === loserId) {
          return {
            rank: state.players.length,
            player: player,
            score: player.score
          };
        }
        if (lastScore === null || player.score !== lastScore) {
          currentRank = index + 1;
          lastScore = player.score;
        }
        return {
          rank: currentRank,
          player: player,
          score: player.score
        };
      });
    }

    function updatePopjamWinnersByRank() {
      const ranking = computePopjamRanking();
      const firstRank = ranking.length > 0 ? ranking[0].rank : 1;
      state.popjamWinners = ranking
        .filter(function (entry) {
          return entry.rank === firstRank;
        })
        .map(function (entry) {
          return entry.player.id;
        });
      state.winnerId = state.popjamWinners.length === 1 ? state.popjamWinners[0] : null;
      return ranking;
    }

    function finishPopjamByZeroHands() {
      const zeroPlayers = state.players.filter(function (player) {
        return player.hand.length === 0;
      });
      if (zeroPlayers.length === 0) {
        return false;
      }

      const winners = zeroPlayers;

      state.over = true;
      state.stats.endedAt = Date.now();
      state.popjamWinners = winners.map(function (player) {
        return player.id;
      });
      state.winnerId = state.popjamWinners.length === 1 ? state.popjamWinners[0] : null;

      if (winners.length === 1) {
        addLog(winners[0].name + " が手札を全て出し切りました。");
      } else {
        addLog("同時に手札を出し切りました: " + winners.map(function (player) {
          return player.name;
        }).join("・") + "。同時勝利です。");
      }
      return true;
    }

    function resumePopjamPostDiscardPlacement() {
      const continuation = state.popjamPostDiscardPlacement;
      if (!continuation) {
        return false;
      }

      state.popjamPostDiscardPlacement = null;
      const player = state.players.find(function (candidate) {
        return candidate.id === continuation.playerId;
      }) || currentPlayer();
      const context = continuation.context || createQuestionContext();
      const questionContext = beginQuestionEffectsForPlacement(
        continuation.row,
        continuation.col,
        player,
        context
      );
      if (!questionContext) {
        render();
        return true;
      }
      if (state.pendingQuestionEffects.length > 0 || hasPendingAction()) {
        state.pendingQuestionContext = questionContext;
        render();
        return true;
      }
      finishPopjamPlacement(continuation.playerId, questionContext);
      return true;
    }

    function discardPlayer() {
      if (state.discardPlayerId === null || state.discardPlayerId === undefined) {
        return currentPlayer();
      }

      return state.players.find(function (player) {
        return player.id === state.discardPlayerId;
      }) || currentPlayer();
    }

    function hasZeroHandPopjamPlayer() {
      return state.players.some(function (player) {
        return player.hand.length === 0;
      });
    }

    function clearPopjamWinDiscardTimer() {
      if (popjamWinDiscardTimer) {
        clearTimeout(popjamWinDiscardTimer);
        popjamWinDiscardTimer = null;
      }
    }

    function hasPopjamWinDiscardShowcase() {
      return isPopjamMode() && Boolean(state.popjamWinDiscardShowcase);
    }

    function popjamWinDiscardPlayer() {
      const showcase = state.popjamWinDiscardShowcase;
      if (!showcase) {
        return null;
      }
      return state.players.find(function (player) {
        return player.id === showcase.playerId;
      }) || null;
    }

    function autoDiscardEntireHandForPopjamWin(player, color, points) {
      const count = player.hand.length;
      const tiles = player.hand.splice(0);
      tiles.forEach(function (tile) {
        player.river.push(tile);
        queueRiverAnimation(null, player.id, tile);
      });
      state.discardPending = 0;
      state.discardPlayerId = null;
      state.discardColor = "";
      addLog(player.name + " は " + colorNames[color] + points
        + "点で手札" + count + "枚をすべて捨て札へ捨てました。");
    }

    function beginPopjamWinDiscardShowcase(player, color, points, placementPlayerId) {
      clearPopjamWinDiscardTimer();
      state.discardPlacementPlayerId = placementPlayerId;
      state.discardPlayerId = player.id;
      state.discardColor = color;
      state.discardPending = 0;
      state.popjamWinDiscardShowcase = {
        playerId: player.id,
        color: color,
        points: points,
        placementPlayerId: placementPlayerId,
        phase: "preview",
        tiles: player.hand.slice()
      };
      addLog(player.name + " の手札が0枚になります。捨て札へ流れるところを確認します。");
      popjamWinDiscardTimer = setTimeout(completePopjamWinDiscardShowcase, 620);
    }

    function completePopjamWinDiscardShowcase() {
      const showcase = state.popjamWinDiscardShowcase;
      const player = popjamWinDiscardPlayer();
      clearPopjamWinDiscardTimer();
      if (!showcase || !player || state.over) {
        state.popjamWinDiscardShowcase = null;
        return;
      }

      const sourceButtons = elements.hand
        ? Array.from(elements.hand.querySelectorAll(".hand-tile"))
        : [];
      const count = player.hand.length;
      const tiles = player.hand.splice(0);
      tiles.forEach(function (tile, index) {
        player.river.push(tile);
        queueRiverAnimation(sourceButtons[index] || null, player.id, tile, {
          delayMs: index * 170,
          slow: true
        });
      });

      state.discardPending = 0;
      state.discardPlayerId = null;
      state.discardColor = "";
      state.popjamWinDiscardShowcase = Object.assign({}, showcase, {
        phase: "moving",
        tiles: []
      });
      addLog(player.name + " は " + colorNames[showcase.color] + showcase.points
        + "点で手札" + count + "枚をすべて捨て札へ捨てました。");

      render();

      const waitMs = Math.max(1120, 780 + tiles.length * 170);
      popjamWinDiscardTimer = setTimeout(function () {
        clearPopjamWinDiscardTimer();
        state.popjamWinDiscardShowcase = null;
        finishPopjamDiscardFlow();
      }, waitMs);
    }

    function beginNextPopjamDiscard(placementPlayerId) {
      while (state.discardQueue.length > 0) {
        const item = state.discardQueue.shift();
        const target = state.players.find(function (player) {
          return player.id === item.playerId;
        });

        if (!target || target.hand.length === 0 || item.count <= 0) {
          continue;
        }

        state.discardPlacementPlayerId = placementPlayerId;
        state.discardPlayerId = target.id;
        state.discardColor = item.color;

        if (item.count >= target.hand.length) {
          if (!target.isCpu) {
            beginPopjamWinDiscardShowcase(target, item.color, item.count, placementPlayerId);
            return true;
          }
          autoDiscardEntireHandForPopjamWin(target, item.color, item.count);
          continue;
        }

        if (hasZeroHandPopjamPlayer()) {
          state.discardQueue = [];
          break;
        }

        state.discardPending = Math.min(item.count, target.hand.length);
        addLog(target.name + " は " + colorNames[item.color] + "の完成で "
          + state.discardPending + "枚を捨て札に捨てられます。");

        if (target.isCpu) {
          schedulePopjamCpuResolve(target.id);
        }
        return true;
      }

      state.discardPending = 0;
      state.discardPlayerId = null;
      state.discardColor = "";
      return false;
    }

    function finishPopjamDiscardFlow() {
      const placementPlayerId = state.discardPlacementPlayerId;
      if (beginNextPopjamDiscard(placementPlayerId)) {
        render();
        return;
      }

      state.discardPlacementPlayerId = null;
      finishPopjamAfterAllDiscards(placementPlayerId);
    }

    function finishPopjamAfterAllDiscards(placementPlayerId) {
      const player = currentPlayer();
      if (!player || player.id !== placementPlayerId || state.over) {
        render();
        return;
      }

      sweepSurroundedUsedInnerQuestions();

      if (!isPopjamScoreMode() && finishPopjamByZeroHands(placementPlayerId)) {
        render();
        return;
      }

      if (hasPendingQuestionEffects() || hasPendingAction()) {
        render();
        return;
      }

      if (resumePopjamPostDiscardPlacement()) {
        return;
      }

      if (state.pendingQuestionPlacement) {
        const placement = state.pendingQuestionPlacement;
        const context = state.pendingQuestionContext || createQuestionContext();
        state.pendingQuestionEffects = [];
        state.pendingQuestionContext = null;
        state.pendingQuestionPlacement = null;
        showQuestionMessages(context);
        finishPopjamPlacement(placement.playerId, context);
        return;
      }

      if (state.discardPending === 0 && continuePopjamExtraPlacement(player)) {
        render();
        return;
      }

      if (continuePopjamScoreTestKeptPlacement(player)) {
        render();
        return;
      }

      if (!isDynamicPopjamMode() && boardIsFull()) {
        if (isPopjamScoreMode()) {
          finishPopjamByScore("盤面がすべて埋まりました。");
        } else {
          finishPopjamByHandCount();
        }
        render();
        return;
      }

      render();
      schedulePopjamEndTurn(player.id);
    }

    // 放出中に手札のタイルをクリックすると、自分の前の「捨て札」へ捨てる
    function discardHandTile(index) {
      const player = discardPlayer();
      const tile = player.hand[index];
      if (!tile || state.discardPending <= 0) {
        return;
      }

      pushHistory();
      const sourceButton = elements.hand.querySelectorAll(".hand-tile")[index] || null;
      queueRiverAnimation(sourceButton, player.id, tile);
      player.hand.splice(index, 1);
      player.river.push(tile);
      state.discardPending--;
      addLog(player.name + " が " + tile.name + " を捨て札に捨てました（残り " + state.discardPending + "枚）。");

      if (player.hand.length === 0) {
        state.discardPending = 0;
      }

      if (state.discardPending === 0) {
        finishPopjamDiscardFlow();
        return;
      }

      render();
    }

    function schedulePopjamEndTurn(playerId) {
      setTimeout(function () {
        const player = currentPlayer();
        if (!state.started || state.over || !player || player.id !== playerId
          || state.discardPending > 0 || hasPopjamWinDiscardShowcase()
          || hasPendingQuestionEffects() || hasPendingAction()) {
          return;
        }
        if (continuePopjamExtraPlacement(player)) {
          render();
          return;
        }
        endTurn();
      }, 420);
    }

    function schedulePopjamCpuResolve(playerId) {
      setTimeout(function () {
        const player = discardPlayer();
        if (!state.started || state.over || !player || player.id !== playerId || state.discardPending <= 0) {
          return;
        }

        // CPU は手札の先頭から自動で捨てる
        while (state.discardPending > 0 && player.hand.length > 0) {
          const tile = player.hand.shift();
          player.river.push(tile);
          state.discardPending--;
        }
        if (player.hand.length === 0) {
          state.discardPending = 0;
        }

        finishPopjamDiscardFlow();
      }, 500);
    }

    // ===== グラフベースの完成判定（Closed color component） =====
    // 各カードを4つの三角ノード[N,E,S,W]に変換し、同色の連結成分を求める。
    // 空きマス(または盤外)に面するノードを1つでも含む成分は open（不成立）。
    // 閉じた成分のスコア = ノード数 / 2。
    // スタートタイルは全色ワイルドカード（各三角が隣接タイルの面する色を継承する）。
    // ただし白い分割線で4三角が区切られているため、スタートタイル内の三角どうしは連結しない
    // （= 隣接する各辺の模様を独立に閉じる）。
    const DIR_INDEX = { top: 0, right: 1, bottom: 2, left: 3 };
    const DIR_VEC = [[-1, 0], [0, 1], [1, 0], [0, -1]]; // N,E,S,W
    const DIR_OPP = [2, 3, 0, 1];
    const DIR_ADJ = [[1, 3], [0, 2], [1, 3], [0, 2]]; // 同一カード内で隣り合う三角
    const TRI_CX = [0.5, 0.75, 0.5, 0.25]; // N,E,S,W 三角の中心X（セル内 0-1）
    const TRI_CY = [0.25, 0.5, 0.75, 0.5]; // N,E,S,W 三角の中心Y（セル内 0-1）
    // N,E,S,W の各三角（白い分割線=対角線で区切られた領域）の clip-path
    const TRI_CLIP = [
      "polygon(0% 0%, 100% 0%, 50% 50%)",   // N（上）
      "polygon(100% 0%, 100% 100%, 50% 50%)", // E（右）
      "polygon(0% 100%, 100% 100%, 50% 50%)", // S（下）
      "polygon(0% 0%, 0% 100%, 50% 50%)"    // W（左）
    ];
    // 各三角の3辺（セル内 0-100 座標）。outer=タイル辺(隣セルと共有), 2本=対角線(同セル隣三角と共有)。
    // neighbor=その辺の向こう側の三角 (dr,dc,nd)。その三角が同じ模様に無ければ「模様を囲う白線」＝光らせる。
    const TRI_EDGE_DEFS = [
      [ // d=0 N
        { x1: 0, y1: 0, x2: 100, y2: 0, dr: -1, dc: 0, nd: 2 },
        { x1: 0, y1: 0, x2: 50, y2: 50, dr: 0, dc: 0, nd: 3 },
        { x1: 100, y1: 0, x2: 50, y2: 50, dr: 0, dc: 0, nd: 1 }
      ],
      [ // d=1 E
        { x1: 100, y1: 0, x2: 100, y2: 100, dr: 0, dc: 1, nd: 3 },
        { x1: 100, y1: 0, x2: 50, y2: 50, dr: 0, dc: 0, nd: 0 },
        { x1: 100, y1: 100, x2: 50, y2: 50, dr: 0, dc: 0, nd: 2 }
      ],
      [ // d=2 S
        { x1: 0, y1: 100, x2: 100, y2: 100, dr: 1, dc: 0, nd: 0 },
        { x1: 0, y1: 100, x2: 50, y2: 50, dr: 0, dc: 0, nd: 3 },
        { x1: 100, y1: 100, x2: 50, y2: 50, dr: 0, dc: 0, nd: 1 }
      ],
      [ // d=3 W
        { x1: 0, y1: 0, x2: 0, y2: 100, dr: 0, dc: -1, nd: 1 },
        { x1: 0, y1: 0, x2: 50, y2: 50, dr: 0, dc: 0, nd: 0 },
        { x1: 0, y1: 100, x2: 50, y2: 50, dr: 0, dc: 0, nd: 2 }
      ]
    ];
    // 模様を囲う白線のグロー色（その色の明るい版。青→水色）。
    // 黄はタイルの黄色と紛れやすいので、コントラストの出る濃いめのアンバーにする。
    const GLOW_LINE_COLOR = { red: "#ff8f8f", yellow: "#ff8c1a", blue: "#79d4ff", green: "#8fe7b6" };
    const baseEdgeCache = {};

    function baseEdgeColors(tileId) {
      if (!baseEdgeCache[tileId]) {
        baseEdgeCache[tileId] = [
          getTileBaseColor(tileId, 0.5, 0.25),
          getTileBaseColor(tileId, 0.75, 0.5),
          getTileBaseColor(tileId, 0.5, 0.75),
          getTileBaseColor(tileId, 0.25, 0.5)
        ];
      }
      return baseEdgeCache[tileId];
    }

    function rotateEdges(base, rotation) {
      const steps = (((rotation / 90) % 4) + 4) % 4;
      return base.map(function (_, i) {
        return base[(i - steps + 4) % 4];
      });
    }

    function getTriangleColor(tile, rotation, dirIndex) {
      return rotateEdges(baseEdgeColors(tile.id), rotation || 0)[dirIndex];
    }

    function detectCompletedPatterns() {
      const results = [];
      const size = state.board.length || fixedBoardSize();

      Object.keys(colorNames).forEach(function (color) {
        const active = new Set();
        const parent = {};

        function find(x) {
          while (parent[x] !== x) {
            parent[x] = parent[parent[x]];
            x = parent[x];
          }
          return x;
        }

        function union(a, b) {
          parent[find(a)] = find(b);
        }

        function nodeId(r, c, d) {
          return (r * size + c) * 4 + d;
        }

        function triColor(r, c, d) {
          const cell = state.board[r][c];
          if (!cell || isInnerQuestionCell(cell)) {
            return null;
          }
          if (cell.tile.start) {
            // ワイルドカード: 隣接タイルの面する色を写し取る（空きマスなら無色）。
            // これにより「どの色にも繋がり、模様の一部として得点する」を表現する。
            const nr = r + DIR_VEC[d][0];
            const nc = c + DIR_VEC[d][1];
            if (!hasPlacedTile(nr, nc)) {
              return null;
            }
            const ncell = state.board[nr][nc];
            if (ncell.tile.start) {
              return null;
            }
            return getTriangleColor(ncell.tile, ncell.rotation || 0, DIR_OPP[d]);
          }
          return getTriangleColor(cell.tile, cell.rotation || 0, d);
        }

        function activeNode(r, c, d) {
          const t = triColor(r, c, d);
          return t !== null && t === color;
        }

        for (let r = 0; r < size; r++) {
          for (let c = 0; c < size; c++) {
            if (!hasPlacedTile(r, c)) {
              continue;
            }
            for (let d = 0; d < 4; d++) {
              if (activeNode(r, c, d)) {
                const id = nodeId(r, c, d);
                active.add(id);
                parent[id] = id;
              }
            }
          }
        }

        active.forEach(function (id) {
          const d = id % 4;
          const cell = Math.floor(id / 4);
          const c = cell % size;
          const r = Math.floor(cell / size);

          // スタートタイルは白い分割線（X字）で4三角形が完全に区切られているため、
          // 自セル内の三角どうしは連結しない。各三角は「辺をまたいだ隣接タイルの模様」を
          // 閉じるためだけに使われる独立した区画として扱う。
          // これをしないと、スタートタイルの左と下の赤などが中心を経由して1つの成分に
          // 融合し、開いた辺を巻き込んで両方とも不成立になってしまう。
          if (!state.board[r][c].tile.start) {
            DIR_ADJ[d].forEach(function (ad) {
              const aid = nodeId(r, c, ad);
              if (active.has(aid)) {
                union(id, aid);
              }
            });
          }

          const nr = r + DIR_VEC[d][0];
          const nc = c + DIR_VEC[d][1];
          if (hasPlacedTile(nr, nc)) {
            const pid = nodeId(nr, nc, DIR_OPP[d]);
            if (active.has(pid)) {
              union(id, pid);
            }
          }
        });

        const components = new Map();
        active.forEach(function (id) {
          const root = find(id);
          if (!components.has(root)) {
            components.set(root, []);
          }
          components.get(root).push(id);
        });

        components.forEach(function (nodes) {
          let open = false;
          let sumX = 0;
          let sumY = 0;
          const coords = [];
          const capSlots = {};

          nodes.forEach(function (id) {
            const d = id % 4;
            const cell = Math.floor(id / 4);
            const c = cell % size;
            const r = Math.floor(cell / size);
            const nr = r + DIR_VEC[d][0];
            const nc = c + DIR_VEC[d][1];

            if (!hasPlacedTile(nr, nc)) {
              const cap = questionSlotForBoardEdge(r, c, d);
              if (questionTileConnectsToColor(cap, color)) {
                capSlots[cap.id] = cap;
              } else {
                open = true; // 空きマス・盤外に面する passage → boundary → 開いている
              }
            } else if (triColor(nr, nc, DIR_OPP[d]) !== color) {
              open = true; // 異なる色のカードに面する passage → boundary → 開いている
            }

            const gx = c + TRI_CX[d]; // 盤面全体での三角中心X（セル単位）
            const gy = r + TRI_CY[d];
            coords.push({ r: r, c: c, d: d, gx: gx, gy: gy, real: !state.board[r][c].tile.start });
            sumX += gx;
            sumY += gy;
          });

          // 開いている成分は模様として不成立
          if (open) {
            return;
          }

          const caps = Object.keys(capSlots).map(function (key) {
            return capSlots[key];
          });
          caps.forEach(function (slot) {
            const center = questionSlotCenter(slot);
            sumX += center.x;
            sumY += center.y;
            coords.push({
              r: slot.boardRow,
              c: slot.boardCol,
              d: slot.inwardDir,
              gx: center.x,
              gy: center.y,
              real: false,
              question: true
            });
          });

          // 模様全体の重心
          const centerX = sumX / coords.length;
          const centerY = sumY / coords.length;

          // 模様の重心（盤面座標）そのものにラベルを置く。
          // セルは overflow:visible なので、辺や交点をまたぐダイヤ型の模様でも
          // 重心位置にぴったり表示できる（三角の中心に寄せると半マスずれる）。
          const labelCol = Math.max(0, Math.min(size - 1, Math.floor(centerX)));
          const labelRow = Math.max(0, Math.min(size - 1, Math.floor(centerY)));

          // 完成演出のグロー対象となるセル一覧（重複排除）
          const cellSet = {};
          coords.forEach(function (p) {
            cellSet[p.r + "," + p.c] = { r: p.r, c: p.c };
          });
          const cells = Object.keys(cellSet).map(function (k) {
            return cellSet[k];
          });
          // グロー演出用: 模様を構成する三角（スタートタイルも含む。外周ハテナ枠だけ除外可能に）
          const triangles = coords.map(function (p) {
            return { r: p.r, c: p.c, d: p.d, question: !!p.question };
          });

          results.push({
            color: color,
            points: Math.max(1, Math.floor(coords.length / 2)),
            superMultiplier: caps.some(function (slot) {
              return slot.tile && slot.tile.effect === "super-color" && slot.tile.color === color;
            }) ? 2 : 1,
            spotlightBonus: spotlightBonusForPatternCells(cells),
            row: labelRow,
            col: labelCol,
            localX: (centerX - labelCol) * 100, // セル内%（重心の正確な位置）
            localY: (centerY - labelRow) * 100,
            cells: cells,
            triangles: triangles,
            caps: caps,
            key: color + ":" + nodes.slice().sort(function (a, b) {
              return a - b;
            }).join(",") + "|caps:" + caps.map(function (slot) {
              return slot.id + ":" + slot.tile.id;
            }).sort().join(",")
          });
        });
      });

      return results;
    }

    function createScoreColorMap(scoringColor, width, height, size) {
      const colorMap = new Array(width * height).fill("");

      state.board.forEach(function (row, rowIndex) {
        row.forEach(function (cell, colIndex) {
          if (!cell || isInnerQuestionCell(cell)) {
            return;
          }

          for (let localY = 0; localY < size; localY++) {
            for (let localX = 0; localX < size; localX++) {
              const tileColor = sampleTileColor(cell.tile.id, cell.rotation || 0, localX, localY);
              const color = cell.tile.start && tileColor ? scoringColor : tileColor;
              const x = colIndex * size + localX;
              const y = rowIndex * size + localY;
              colorMap[y * width + x] = color;
            }
          }
        });
      });

      return colorMap;
    }

    function sampleTileColor(tileId, rotation, localX, localY) {
      let x = (localX + 0.5) / detectionSampleSize;
      let y = (localY + 0.5) / detectionSampleSize;
      const normalizedRotation = ((rotation % 360) + 360) % 360;

      for (let i = 0; i < normalizedRotation / 90; i++) {
        const nextX = y;
        y = 1 - x;
        x = nextX;
      }

      return getTileBaseColor(tileId, x, y);
    }

    function nearLine(value) {
      return Math.abs(value) < lineWidth;
    }

    function getTileBaseColor(tileId, x, y) {
      const tileShapes = {
        1: { type: "solid", colors: ["red"] },
        2: { type: "solid", colors: ["yellow"] },
        3: { type: "solid", colors: ["blue"] },
        4: { type: "half", colors: ["red", "blue"] },
        5: { type: "half", colors: ["yellow", "red"] },
        6: { type: "half", colors: ["blue", "yellow"] },
        7: { type: "top", colors: ["red", "blue"] },
        8: { type: "top", colors: ["yellow", "red"] },
        9: { type: "top", colors: ["blue", "yellow"] },
        10: { type: "top", colors: ["blue", "red"] },
        11: { type: "top", colors: ["red", "yellow"] },
        12: { type: "top", colors: ["yellow", "blue"] },
        13: { type: "cross2", colors: ["red", "blue"] },
        14: { type: "cross2", colors: ["yellow", "red"] },
        15: { type: "cross2", colors: ["blue", "yellow"] },
        16: { type: "cross3", colors: ["red", "blue", "yellow"] },
        17: { type: "cross3", colors: ["yellow", "red", "blue"] },
        18: { type: "cross3", colors: ["blue", "yellow", "red"] },
        19: { type: "three", colors: ["red", "blue", "yellow"] },
        20: { type: "three", colors: ["yellow", "red", "blue"] },
        21: { type: "three", colors: ["blue", "yellow", "red"] },
        22: { type: "three", colors: ["red", "yellow", "blue"] },
        23: { type: "three", colors: ["yellow", "blue", "red"] },
        24: { type: "three", colors: ["blue", "red", "yellow"] },
        25: { type: "start", colors: ["red", "yellow", "blue"] }
      };

      const shape = tileShapes[tileId];
      if (!shape) {
        return "";
      }

      if (shape.type === "solid") {
        return shape.colors[0];
      }

      if (shape.type === "blockSolid") {
        return "block";
      }

      if (shape.type === "half") {
        if (nearLine(x + y - 1)) {
          return "";
        }
        return x + y < 1 ? shape.colors[0] : shape.colors[1];
      }

      if (shape.type === "top") {
        const leftLine = x <= 0.5 && nearLine(y - x);
        const rightLine = x >= 0.5 && nearLine(y - (1 - x));
        if (leftLine || rightLine) {
          return "";
        }
        return y < Math.min(x, 1 - x) ? shape.colors[0] : shape.colors[1];
      }

      if (shape.type === "block1") {
        const leftLine = x <= 0.5 && nearLine(y - x);
        const rightLine = x >= 0.5 && nearLine(y - (1 - x));
        if (leftLine || rightLine) {
          return "";
        }
        return y > Math.max(x, 1 - x) ? shape.colors[1] : shape.colors[0];
      }

      if (shape.type === "cross2" || shape.type === "cross3" || shape.type === "cross4") {
        if (nearLine(y - x) || nearLine(y - (1 - x))) {
          return "";
        }

        if (y < x && y < 1 - x) {
          return shape.colors[0];
        }
        if (y > x && y > 1 - x) {
          return shape.type === "cross4" ? shape.colors[2] : shape.colors[0];
        }
        if (x < 0.5) {
          return shape.colors[1];
        }
        if (shape.type === "cross4") {
          return shape.colors[3];
        }
        return shape.type === "cross3" ? shape.colors[2] : shape.colors[1];
      }

      if (shape.type === "three") {
        if (nearLine(x + y - 1) || (x + y >= 1 && nearLine(y - x))) {
          return "";
        }
        if (x + y < 1) {
          return shape.colors[0];
        }
        return y < x ? shape.colors[2] : shape.colors[1];
      }

      if (shape.type === "start") {
        if (nearLine(y - x) || nearLine(y - (1 - x))) {
          return "";
        }
        if (y < x && y < 1 - x) {
          return "red";
        }
        if (y > x && y > 1 - x) {
          return "red";
        }
        if (x < 0.5) {
          return "blue";
        }
        return "yellow";
      }

      return "";
    }

    function detectColorComponents(color, colorMap, width, height) {
      const visited = new Uint8Array(width * height);
      const patterns = [];

      for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
          const index = y * width + x;
          if (visited[index] || colorMap[index] !== color) {
            visited[index] = 1;
            continue;
          }

          const component = floodColorComponent(color, colorMap, width, height, x, y, visited);
          if (!component.open && component.cells.size > 0 && component.count > onePointPixelArea * 0.45) {
            const cells = Array.from(component.cells).sort();
            const center = getPatternCenter(component);
            const points = Math.max(1, Math.round(component.count / onePointPixelArea));
            patterns.push({
              color: color,
              points: points,
              row: center.row,
              col: center.col,
              localX: center.localX,
              localY: center.localY,
              key: color + ":" + cells.join("|") + ":" + points
            });
          }
        }
      }

      return patterns;
    }

    function getPatternCenter(component) {
      const averageX = component.sumX / component.count;
      const averageY = component.sumY / component.count;
      const size = state.board.length || fixedBoardSize();
      const row = Math.max(0, Math.min(size - 1, Math.floor(averageY / detectionSampleSize)));
      const col = Math.max(0, Math.min(size - 1, Math.floor(averageX / detectionSampleSize)));

      return {
        row: row,
        col: col,
        localX: ((averageX - col * detectionSampleSize) / detectionSampleSize) * 100,
        localY: ((averageY - row * detectionSampleSize) / detectionSampleSize) * 100
      };
    }

    function floodColorComponent(color, colorMap, width, height, startX, startY, visited) {
      const stack = [[startX, startY]];
      const cells = new Set();
      let count = 0;
      let open = false;
      let sumX = 0;
      let sumY = 0;

      while (stack.length > 0) {
        const point = stack.pop();
        const x = point[0];
        const y = point[1];

        if (x < 0 || x >= width || y < 0 || y >= height) {
          open = true;
          continue;
        }

        const index = y * width + x;
        if (visited[index]) {
          continue;
        }

        visited[index] = 1;
        if (colorMap[index] !== color) {
          continue;
        }

        count++;
        sumX += x;
        sumY += y;
        cells.add(Math.floor(y / detectionSampleSize) + "," + Math.floor(x / detectionSampleSize));

        if (colorPixelTouchesOpenSpace(x, y, color, colorMap, width, height)) {
          open = true;
        }

        stack.push([x + 1, y]);
        stack.push([x - 1, y]);
        stack.push([x, y + 1]);
        stack.push([x, y - 1]);
        pushSeamBridgeNeighbors(color, colorMap, width, height, x, y, stack);
      }

      return {
        count: count,
        cells: cells,
        open: open,
        sumX: sumX,
        sumY: sumY
      };
    }

    function pushSeamBridgeNeighbors(color, colorMap, width, height, x, y, stack) {
      const size = detectionSampleSize;
      const row = Math.floor(y / size);
      const col = Math.floor(x / size);
      const localX = x % size;
      const localY = y % size;
      const bridges = [
        { active: localX === 0, dx: -1, dy: 0, row: row, col: col - 1 },
        { active: localX === size - 1, dx: 1, dy: 0, row: row, col: col + 1 },
        { active: localY === 0, dx: 0, dy: -1, row: row - 1, col: col },
        { active: localY === size - 1, dx: 0, dy: 1, row: row + 1, col: col }
      ];

      bridges.forEach(function (bridge) {
        if (!bridge.active || !hasPlacedTile(bridge.row, bridge.col)) {
          return;
        }

        for (let distance = 1; distance <= seamBridgeDistance; distance++) {
          const nextX = x + bridge.dx * distance;
          const nextY = y + bridge.dy * distance;

          if (nextX < 0 || nextX >= width || nextY < 0 || nextY >= height) {
            return;
          }

          if (colorMap[nextY * width + nextX] === color) {
            stack.push([nextX, nextY]);
            return;
          }
        }
      });
    }

    function colorPixelTouchesOpenSpace(x, y, color, colorMap, width, height) {
      const size = detectionSampleSize;
      const row = Math.floor(y / size);
      const col = Math.floor(x / size);
      const localX = x % size;
      const localY = y % size;

      const checks = [
        { edge: localX === 0, x: x - 1, y: y, row: row, col: col - 1 },
        { edge: localX === size - 1, x: x + 1, y: y, row: row, col: col + 1 },
        { edge: localY === 0, x: x, y: y - 1, row: row - 1, col: col },
        { edge: localY === size - 1, x: x, y: y + 1, row: row + 1, col: col }
      ];

      return checks.some(function (check) {
        if (!check.edge) {
          return false;
        }

        return !hasPlacedTile(check.row, check.col);
      });
    }

    function isInnerQuestionTile(tile) {
      return Boolean(tile && tile.innerQuestion);
    }

    function isInnerQuestionCell(cell) {
      return Boolean(cell && isInnerQuestionTile(cell.tile));
    }

    function hasPlacedTile(row, col) {
      const size = state.board.length || fixedBoardSize();
      return row >= 0
        && row < size
        && col >= 0
        && col < size
        && Boolean(state.board[row][col])
        && !isInnerQuestionCell(state.board[row][col]);
    }

    function questionSlotsAdjacentToCell(row, col) {
      if (!isPopjamMode() || !Array.isArray(state.questionBoard)) {
        return [];
      }
      const slots = state.questionBoard.filter(function (slot) {
        return slot.boardRow === row && slot.boardCol === col;
      });

      if (isPopjamInnerQuestionMode()) {
        [
          [-1, 0],
          [1, 0],
          [0, -1],
          [0, 1]
        ].forEach(function (direction) {
          const questionRow = row + direction[0];
          const questionCol = col + direction[1];
          const slot = innerQuestionSlotAt(questionRow, questionCol);
          if (slot) {
            slots.push(slot);
          }
        });
      }

      return slots;
    }

    function innerQuestionSlotAt(row, col) {
      if (!isPopjamInnerQuestionMode()) {
        return null;
      }
      if (!isDynamicBoardMode() && (row < 0 || row >= 5 || col < 0 || col >= 5)) {
        return null;
      }
      const cell = isDynamicBoardMode()
        ? (state.blBoard || {})[blCellKey(row, col)]
        : (state.board[row] ? state.board[row][col] : null);
      if (!isInnerQuestionCell(cell) || cell.tile.effectUsed) {
        return null;
      }
      return {
        id: "inner:" + row + ":" + col,
        side: "inner",
        index: 0,
        boardRow: row,
        boardCol: col,
        questionRow: row,
        questionCol: col,
        inwardDir: 0,
        rotation: cell.rotation || 0,
        tile: cell.tile,
        revealed: Boolean(cell.tile.revealed),
        effectUsed: Boolean(cell.tile.effectUsed),
        inner: true
      };
    }

    function findQuestionSlotById(slotId) {
      if (!slotId) {
        return null;
      }
      if (slotId.indexOf("inner:") === 0) {
        const parts = slotId.split(":");
        return innerQuestionSlotAt(Number(parts[1]), Number(parts[2]));
      }
      if (slotId.indexOf("inner-") === 0) {
        const parts = slotId.split("-");
        return innerQuestionSlotAt(Number(parts[1]), Number(parts[2]));
      }
      return state.questionBoard.find(function (candidate) {
        return candidate.id === slotId;
      }) || null;
    }

    function canInspectInnerQuestionTile(tile) {
      if (!isInnerQuestionTile(tile)) {
        return true;
      }
      if (tile.revealed) {
        return true;
      }
      if (!state.cpuEnabled) {
        return true;
      }
      if (tile.ownerId === 0) {
        return true;
      }
      const player = currentPlayer();
      return Boolean(player && !player.isCpu && tile.ownerId === player.id);
    }

    function displayTileSrc(tile, options) {
      const opts = options || {};
      if (isInnerQuestionTile(tile) && !opts.forceFace && !canInspectInnerQuestionTile(tile)) {
        return questionBackTile.src;
      }
      return tile ? tile.src : "";
    }

    function displayTileNumber(tile, options) {
      const opts = options || {};
      if (isInnerQuestionTile(tile) && !opts.forceFace && !canInspectInnerQuestionTile(tile)) {
        return "?";
      }
      if (tile && tile.blockTile) {
        return "B" + String(tile.id % 10);
      }
      return tile ? String(tile.id).padStart(3, "0") : "";
    }

    function questionSlotForBoardEdge(row, col, dirIndex) {
      if (!isPopjamMode() || !Array.isArray(state.questionBoard)) {
        return null;
      }

      return state.questionBoard.find(function (slot) {
        return slot.boardRow === row && slot.boardCol === col && slot.inwardDir === DIR_OPP[dirIndex];
      }) || null;
    }

    function questionTileConnectsToColor(slot, color) {
      if (!slot || !slot.revealed || !slot.tile) {
        return false;
      }

      if (slot.tile.effect === "all-colors") {
        return true;
      }

      return (slot.tile.effect === "color" || slot.tile.effect === "super-color") && slot.tile.color === color;
    }

    function isQuestionColorMatchSlot(slot) {
      return Boolean(slot && slot.revealed && slot.tile
        && (slot.tile.effect === "color"
          || slot.tile.effect === "super-color"
          || slot.tile.effect === "all-colors"));
    }

    function tileEdgeMatchesQuestionSlot(tile, rotation, edge, slot) {
      if (!isQuestionColorMatchSlot(slot)) {
        return true;
      }
      for (let i = 0; i < edgeSampleCount; i++) {
        const color = sampleTileEdgeColor(tile.id, rotation, edge, i);
        if (!questionTileConnectsToColor(slot, color)) {
          return false;
        }
      }
      return true;
    }

    function fixedQuestionEdgeIssue(row, col, tile, rotation) {
      if (!tile) {
        return "";
      }
      const checks = placementEdgeChecks(row, col);
      for (let i = 0; i < checks.length; i++) {
        const check = checks[i];
        if (hasPlacedTile(check.row, check.col)) {
          continue;
        }
        const slot = questionSlotForBoardEdge(row, col, check.dirIndex);
        if (isQuestionColorMatchSlot(slot)
          && !tileEdgeMatchesQuestionSlot(tile, rotation, check.ownEdge, slot)) {
          return placementEdgeLabel(check.ownEdge) + "側の外周カラーズと色がつながっていません。";
        }
      }
      return "";
    }

    function questionSlotCenter(slot) {
      const size = state.board.length || fixedBoardSize();
      if (slot.side === "top") {
        return { x: slot.boardCol + 0.5, y: -0.28 };
      }
      if (slot.side === "bottom") {
        return { x: slot.boardCol + 0.5, y: size + 0.28 };
      }
      if (slot.side === "left") {
        return { x: -0.28, y: slot.boardRow + 0.5 };
      }
      return { x: size + 0.28, y: slot.boardRow + 0.5 };
    }

    function isAdjacentToTile(row, col) {
      const directions = [
        [-1, 0],
        [1, 0],
        [0, -1],
        [0, 1]
      ];

      return directions.some(function (direction) {
        const size = state.board.length || fixedBoardSize();
        const nextRow = row + direction[0];
        const nextCol = col + direction[1];
        return nextRow >= 0 && nextRow < size && nextCol >= 0 && nextCol < size && state.board[nextRow][nextCol];
      });
    }

    function isAdjacentToAnyBoardCard(row, col) {
      return [
        [-1, 0],
        [1, 0],
        [0, -1],
        [0, 1]
      ].some(function (direction) {
        const size = state.board.length || fixedBoardSize();
        const nextRow = row + direction[0];
        const nextCol = col + direction[1];
        return nextRow >= 0 && nextRow < size && nextCol >= 0 && nextCol < size && Boolean(state.board[nextRow][nextCol]);
      });
    }

    function hasAdjacentEmptyCell(row, col) {
      return [
        [-1, 0],
        [1, 0],
        [0, -1],
        [0, 1]
      ].some(function (direction) {
        const size = state.board.length || fixedBoardSize();
        const nextRow = row + direction[0];
        const nextCol = col + direction[1];
        return nextRow >= 0 && nextRow < size && nextCol >= 0 && nextCol < size && !state.board[nextRow][nextCol];
      });
    }

    function canPlaceInnerQuestionAt(row, col, tile) {
      return isPopjamInnerQuestionMode()
        && isInnerQuestionTile(tile)
        && row >= 0
        && row < fixedBoardSize()
        && col >= 0
        && col < fixedBoardSize()
        && !state.board[row][col]
        && isAdjacentToAnyBoardCard(row, col)
        && hasAdjacentEmptyCell(row, col);
    }

    function canPlaceTileAt(row, col, tile, rotation) {
      if (state.over || !state.started || !tile) {
        return false;
      }

      const size = state.board.length || fixedBoardSize();
      if (row < 0 || row >= size || col < 0 || col >= size) {
        return false;
      }

      if (state.board[row][col]) {
        return false;
      }

      if (isTacticsMode() && countPlacedTiles() === 0) {
        const center = fixedBoardCenter();
        return row === center && col === center;
      }

      if (isInnerQuestionTile(tile)) {
        return canPlaceInnerQuestionAt(row, col, tile);
      }

      let hasNeighbor = false;
      const checks = [
        { row: row - 1, col: col, ownEdge: "top", otherEdge: "bottom", dirIndex: 0 },
        { row: row, col: col + 1, ownEdge: "right", otherEdge: "left", dirIndex: 1 },
        { row: row + 1, col: col, ownEdge: "bottom", otherEdge: "top", dirIndex: 2 },
        { row: row, col: col - 1, ownEdge: "left", otherEdge: "right", dirIndex: 3 }
      ];

      return checks.every(function (check) {
        const neighbor = hasPlacedTile(check.row, check.col)
          ? state.board[check.row][check.col]
          : null;

        if (!neighbor) {
          const slot = questionSlotForBoardEdge(row, col, check.dirIndex);
          return tileEdgeMatchesQuestionSlot(tile, rotation, check.ownEdge, slot);
        }

        hasNeighbor = true;
        return edgesConnect(tile, rotation, check.ownEdge, neighbor.tile, neighbor.rotation || 0, check.otherEdge);
      }) && hasNeighbor;
    }

    function edgesConnect(tileA, rotationA, edgeA, tileB, rotationB, edgeB) {
      // スタートタイルはワイルドカード（どの色にも接続できる）
      if (tileA.start || tileB.start || tileA.id === startTile.id || tileB.id === startTile.id) {
        return true;
      }

      for (let i = 0; i < edgeSampleCount; i++) {
        const colorA = sampleTileEdgeColor(tileA.id, rotationA, edgeA, i);
        const colorB = sampleTileEdgeColor(tileB.id, rotationB, edgeB, i);

        if (!colorA || !colorB || colorA !== colorB) {
          return false;
        }
      }

      return true;
    }

    function sampleTileEdgeColor(tileId, rotation, edge, sampleIndex) {
      const size = detectionSampleSize;
      const t = (sampleIndex + 1) / (edgeSampleCount + 1);
      const position = Math.max(0, Math.min(size - 1, Math.floor(t * size)));

      if (edge === "top") {
        return sampleTileColor(tileId, rotation, position, 0);
      }

      if (edge === "bottom") {
        return sampleTileColor(tileId, rotation, position, size - 1);
      }

      if (edge === "left") {
        return sampleTileColor(tileId, rotation, 0, position);
      }

      return sampleTileColor(tileId, rotation, size - 1, position);
    }

    function currentPlacementTiles() {
      const player = currentPlayer();
      if (isOpen7Mode()) {
        return state.sharedMarket;
      }
      if (isTacticsMode()) {
        return state.sharedMarket.concat(player ? player.hand : []);
      }
      if (isPopjamScoreMode()) {
        return state.sharedMarket.concat(player ? player.hand : []);
      }
      return usesSharedMarket() ? state.sharedMarket : (player ? player.hand : []);
    }

    function availableTileCount(tiles) {
      return (tiles || []).filter(Boolean).length;
    }

    function marketTileRotation(index) {
      if (!isPopjamScoreMode() || !Number.isInteger(index)) {
        return 0;
      }
      return state.marketRotations && Number.isFinite(state.marketRotations[index])
        ? state.marketRotations[index]
        : 0;
    }

    function rememberMarketTileRotation() {
      if (!isPopjamScoreMode() || state.selectedHandIndex === null) {
        return;
      }
      if (!state.marketRotations) {
        state.marketRotations = {};
      }
      state.marketRotations[state.selectedHandIndex] = state.selectedRotation || 0;
    }

    function clearMarketTileRotation(index) {
      if (!state.marketRotations || !Number.isInteger(index)) {
        return;
      }
      const nextRotations = {};
      Object.keys(state.marketRotations).forEach(function (key) {
        const marketIndex = Number(key);
        if (!Number.isInteger(marketIndex) || marketIndex === index) {
          return;
        }
        nextRotations[marketIndex > index ? marketIndex - 1 : marketIndex] = state.marketRotations[key];
      });
      state.marketRotations = nextRotations;
    }

    function canHoverSelectSharedMarket(event) {
      if (!isPopjamScoreMode()) {
        return false;
      }
      if (event && event.pointerType) {
        return event.pointerType === "mouse";
      }
      return typeof window.matchMedia === "function"
        && window.matchMedia("(hover: hover) and (pointer: fine)").matches;
    }

    function selectedPlacementTile() {
      if (state.selectedHandIndex === null) {
        return null;
      }
      return currentPlacementTiles()[state.selectedHandIndex] || null;
    }

    function findFirstClassicMarketIndex() {
      const tiles = currentPlacementTiles();
      const size = state.board.length || fixedBoardSize();
      for (let index = 0; index < tiles.length; index++) {
        const tile = tiles[index];
        if (!tile) {
          continue;
        }
        for (let row = 0; row < size; row++) {
          for (let col = 0; col < size; col++) {
            if (state.board[row][col]) {
              continue;
            }
            for (let rotationIndex = 0; rotationIndex < 4; rotationIndex++) {
              if (canPlaceTileAt(row, col, tile, rotationIndex * 90)) {
                return index;
              }
            }
          }
        }
      }
      return -1;
    }

    function hasAnyClassicMarketMove() {
      return findFirstClassicMarketIndex() >= 0;
    }

    function canPlaceAt(row, col) {
      if (state.over || !state.started) {
        return false;
      }

      if (hasPendingAction() && state.pendingAction.type === "replace-place") {
        return canReplaceTileTo(row, col, state.pendingAction);
      }

      if (hasPendingAction() && state.pendingAction.type === "salvage-place") {
        const action = state.pendingAction;
        if (state.board[row][col]) {
          return false;
        }
        return canPlaceTileAt(row, col, action.tile, action.rotation || 0);
      }

      if (hasPendingQuestionEffects() || hasPendingAction()) {
        return false;
      }

      // ポップジャム: 捨て札へ移す処理が残っている間は新たに置けない
      if (isPopjamMode() && state.discardPending > 0) {
        return false;
      }

      if (state.selectedHandIndex === null) {
        return false;
      }

      if (state.board[row][col]) {
        return false;
      }

      return canPlaceTileAt(row, col, selectedPlacementTile(), state.selectedRotation);
    }

    function placeSelectedTile(row, col) {
      if (hasPendingAction() && state.pendingAction.type === "replace-place") {
        placePendingReplaceTile(row, col);
        return;
      }

      if (hasPendingAction() && state.pendingAction.type === "salvage-place") {
        placePendingSalvageTile(row, col);
        return;
      }

      if (!canPlaceAt(row, col)) {
        trackWiggleEvent("invalid_action", {
          action: "place_fixed",
          row: row,
          col: col,
          selected_hand_index: state.selectedHandIndex
        });
        return;
      }

      const player = currentPlayer();
      const placedHandIndex = state.selectedHandIndex;
      const tile = selectedPlacementTile();
      if (player && !player.isCpu) {
        trackFirstAction("place_fixed", {
          row: row,
          col: col,
          tile_id: tile && tile.id
        });
      }
      clearMobilePlacementConfirm();
      pushHistory();

      if (isInnerQuestionTile(tile)) {
        tile.ownerId = player.id;
      }

      state.board[row][col] = {
        tile: tile,
        rotation: state.selectedRotation
      };
      state.lastPlacedCell = { row: row, col: col };
      pendingDropCell = { row: row, col: col, rotation: state.selectedRotation };

      if (isOpen7Mode()) {
        state.sharedMarket[state.selectedHandIndex] = null;
        const nextTileIndex = findFirstClassicMarketIndex();
        state.selectedHandIndex = !player.isCpu && nextTileIndex >= 0 ? nextTileIndex : null;
      } else if (isTacticsMode()) {
        if (state.selectedHandIndex < state.sharedMarket.length) {
          state.sharedMarket.splice(state.selectedHandIndex, 1);
          refillSharedMarket({ animate: true });
        } else {
          const blockIndex = state.selectedHandIndex - state.sharedMarket.length;
          player.hand.splice(blockIndex, 1);
        }
        const nextTileIndex = findFirstClassicMarketIndex();
        state.selectedHandIndex = !player.isCpu && nextTileIndex >= 0 ? nextTileIndex : null;
      } else if (usesSharedMarket()) {
        const placedMarketIndex = state.selectedHandIndex;
        if (isPopjamScoreMode() && placedMarketIndex >= state.sharedMarket.length) {
          player.hand.splice(placedMarketIndex - state.sharedMarket.length, 1);
        } else {
          state.sharedMarket.splice(placedMarketIndex, 1);
          clearMarketTileRotation(placedMarketIndex);
          refillSharedMarket({ animate: true });
        }
        const nextMarketIndex = findFirstClassicMarketIndex();
        state.selectedHandIndex = !player.isCpu && nextMarketIndex >= 0 ? nextMarketIndex : null;
        state.selectedRotation = marketTileRotation(state.selectedHandIndex);
      } else {
        player.hand.splice(state.selectedHandIndex, 1);
        state.selectedHandIndex = !player.isCpu && player.hand.length > 0
          ? Math.min(placedHandIndex, player.hand.length - 1)
          : null;
      }
      if (!usesSharedMarket()) {
        state.selectedRotation = 0;
      }
      clearRotationAnimation();
      state.stats.placedTiles++;
      const placedName = isInnerQuestionTile(tile) ? "伏せハテナ" : tile.name;
      addLog(player.name + " が " + placedName + " を " + (row + 1) + "," + (col + 1) + " に置きました。");
      state.scoreText = "";

      if (isPopjamMode()) {
        if (isInnerQuestionTile(tile)) {
          const context = createQuestionContext();
          addLog(player.name + " が伏せハテナを仕込みました。隣に通常タイルが置かれると発動します。");
          finishPopjamPlacement(player.id, context);
          return;
        }

        const immediateContext = createQuestionContext();
        state.popjamPostDiscardPlacement = {
          row: row,
          col: col,
          playerId: player.id,
          context: immediateContext
        };
        if (startPopjamDiscardForNewCompletionsOnActiveBoard(immediateContext, player.id)) {
          render();
          return;
        }
        state.popjamPostDiscardPlacement = null;

        const questionContext = beginQuestionEffectsForPlacement(row, col, player);
        if (!questionContext) {
          render();
          return;
        }

        finishPopjamPlacement(player.id, questionContext);
        return;
      }

      if (isTacticsMode()) {
        markTacticsCompletions(player);
      } else if (isClassicSharedMode() || isOpen7Mode()) {
        markClassicCompletions();
      } else {
        resolveAutomaticCompletions();
      }

      if (boardIsFull()) {
        if (isClassicSharedMode() || isTacticsMode() || isOpen7Mode()) {
          finishClassicByScore((isTacticsMode() || isOpen7Mode() ? "7×7" : "5×5") + "の盤面がすべて埋まりました。得点で勝敗を判定します。");
        } else {
          finishSharedWin();
        }
      }

      if (!state.over && isOpen7Mode() && !hasAnyClassicMarketMove()) {
        finishClassicByScore("置ける外周タイルがなくなりました。得点で勝敗を判定します。");
      }

      if (!state.over && isTacticsMode() && !hasAnyClassicMarketMove()) {
        finishClassicByScore("置けるタイルがなくなりました。得点で勝敗を判定します。");
      }

      if (!state.over && (isClassicSharedMode() || isTacticsMode() || isOpen7Mode())) {
        advanceTurn();
      }

      render();

      if (!state.over && !isClassicSharedMode() && !isTacticsMode() && !isOpen7Mode() && player.hand.length === 0) {
        scheduleAutoEndTurn(player.id);
      }
    }

    function finishPopjamPlacement(playerId, questionContext) {
      const player = currentPlayer();
      if (!player || player.id !== playerId || state.over) {
        render();
        return;
      }

      if (startPopjamDiscardForNewCompletionsOnActiveBoard(questionContext || createQuestionContext(), playerId)) {
        render();
        return;
      }

      sweepSurroundedUsedInnerQuestions();

      if (!isPopjamScoreMode() && finishPopjamByZeroHands(playerId)) {
        render();
        return;
      }

      finishPopjamAfterAllDiscards(playerId);
    }

    function selectHandTile(index) {
      if (hasPopjamWinDiscardShowcase()) {
        return;
      }
