    function updateDeckVisual(deckCount) {
      const visualCount = state.started ? Math.min(3, deckCount) : 0;
      elements.deckStack.dataset.countLevel = String(visualCount);
      elements.deckStack.classList.toggle("deck-has-cards", visualCount > 0);
      elements.deckStack.style.setProperty("background-image", "none");
      elements.deckStack.style.setProperty("background-size", "cover");
      elements.deckStack.style.setProperty("background-position", "center");
      elements.deckStack.style.setProperty("background-repeat", "no-repeat");
      elements.deckStack.style.setProperty("border-radius", "8px");
      elements.deckStack.style.setProperty("box-shadow", "none");
      const deckCards = elements.deckStack ? Array.from(elements.deckStack.querySelectorAll(".deck-card")) : [];
      deckCards.forEach(function (card) {
        card.style.setProperty("opacity", "0");
        card.style.setProperty("transform", "translate(0, 10px) scale(0.86)");
      });
      const emptyOutline = elements.deckStack ? elements.deckStack.querySelector(".deck-empty-outline") : null;
      if (emptyOutline) {
        emptyOutline.style.setProperty("display", visualCount <= 0 ? "block" : "none");
        emptyOutline.style.setProperty("opacity", visualCount <= 0 ? "1" : "0");
        emptyOutline.style.setProperty("transform", visualCount <= 0 ? "scale(1)" : "scale(0.86)");
      }
      const visibleCard = elements.deckStack ? elements.deckStack.querySelector(".deck-visible-card") : null;
      if (visibleCard) {
        visibleCard.style.setProperty("opacity", visualCount <= 0 ? "0" : "1");
        visibleCard.style.setProperty("transform", visualCount <= 0 ? "translate(0, 10px) scale(0.86)" : "translate(0, 0) scale(1)");
      }
      if (elements.deckCount) {
        elements.deckCount.classList.toggle("empty", state.started && deckCount === 0);
      }

      if (lastRenderedDeckCount !== null && state.started && deckCount < lastRenderedDeckCount) {
        elements.deckStack.classList.remove("deck-decrease");
        elements.deckCount.classList.remove("deck-count-bump");
        void elements.deckStack.offsetWidth;
        elements.deckStack.classList.add("deck-decrease");
        elements.deckCount.classList.add("deck-count-bump");
      }

      lastRenderedDeckCount = deckCount;
    }

        return;
      }
      if (isHarvestSeasonMode()) {
        const cfg = harvestSeasonConfig();
        const seasonColors = cfg.seasonColors || [];
        const seasonEntry = cfg.seasonPile.length ? cfg.seasonPile[cfg.seasonPile.length - 1] : null;
        const seasonTile = seasonEntry ? harvestSeasonEntryTile(seasonEntry) : null;
        let layerHtml = "";
        for (let i = Math.min(cfg.seasonPile.length, 3); i >= 2; i--) {
          layerHtml += "<span class=\"harvest-season-layer layer-" + i + "\"></span>";
        }
        const rotation = ((seasonEntry && seasonEntry.rotation) || 0) * 90;
        const tileHtml = seasonTile
          ? "<span class=\"harvest-season-card\"><img src=\"" + tilePath + seasonTile.src + "\" alt=\"旬のタイル\" style=\"transform: rotate(" + rotation + "deg);\"></span>"

          ? seasonColors.map(function (color) {

        elements.harvestBorderChip.hidden = false;
        elements.harvestBorderChip.classList.add("harvest-season-panel");
        elements.harvestBorderChip.innerHTML = "<div class=\"harvest-season-head\"><span>季節の山</span><strong>"
          + cfg.seasonPile.length + "枚</strong></div>"
          + "<div class=\"harvest-season-stack\">" + layerHtml + tileHtml
          + "<span class=\"harvest-season-count\">x" + cfg.seasonPile.length + "</span></div>"
          + "<div class=\"harvest-season-colors\" aria-label=\"旬の色\">" + colorHtml + "</div>"
          + "<div class=\"harvest-season-note\">大収穫: 模様+種=季節</div>";
      } else if (isHarvestMode()) {
        elements.harvestBorderChip.hidden = false;
        elements.harvestBorderChip.classList.remove("harvest-season-panel");
        const line = state.harvestLine || 3;
        elements.harvestBorderChip.innerHTML = "<strong>ボーダー " + line + "点</strong>"
          + "<span>収穫で+1</span>";
      } else {
        elements.harvestBorderChip.hidden = true;
        elements.harvestBorderChip.classList.remove("harvest-season-panel");
        elements.harvestBorderChip.textContent = "";

    }

    function setLoseButtonTone(tone) {
      if (!elements.loseButton) {
        return;
      }
      elements.loseButton.classList.remove("danger", "positive");
      if (tone) {
        elements.loseButton.classList.add(tone);

    }

    function renderStatus() {
      const player = currentPlayer();
      const placed = countPlacedTiles();
      if (elements.handRow) {
        elements.handRow.classList.toggle("deck-hidden", !shouldShowDeckArea());
      }
      applyBoardTurnColor(player);
      updateHarvestBorderChip();
      if (elements.mainInfoValue) {
        elements.mainInfoValue.textContent = buildGoalText();
      }
      elements.turnValue.textContent = state.started ? String(state.turn) : "-";
      elements.sideTurnValue.textContent = state.started ? String(state.turn) : "-";
      if (state.started && player) {
        const thinking = isCpuTurn() && state.cpuThinking
          ? " <span class=\"cpu-badge\"><span class=\"dot\"></span>考え中</span>"
          : "";
        const playerChip = "<span class=\"turn-chip\"><span class=\"swatch "
          + player.color + "\">" + colorSymbols[player.color] + "</span>"
          + playerNameHtml(player) + "</span>" + thinking;
        elements.currentPlayerValue.innerHTML = playerChip;
        elements.sideCurrentPlayerValue.innerHTML = playerChip;
        if (elements.turnPlayerBadge) {

            + colorSymbols[player.color] + "</span>" + displayPlayerName(player);

      } else {
        elements.currentPlayerValue.textContent = "-";
        elements.sideCurrentPlayerValue.textContent = "-";
        if (elements.turnPlayerBadge) {
          elements.turnPlayerBadge.textContent = "-";
        }
      }
      const deckLabel = isPopjamInnerQuestionMode()
        ? state.deck.length + " / ? " + state.innerQuestionDeck.length
        : isOpen7Mode()
        ? "外周 " + availableTileCount(state.sharedMarket)
        : String(state.deck.length);
      elements.deckValue.textContent = state.started ? deckLabel : "-";
      elements.deckCount.textContent = state.started
        ? isOpen7Mode()
          ? "外周 " + availableTileCount(state.sharedMarket) + "枚"
          : isPopjamInnerQuestionMode()
          ? "? " + state.innerQuestionDeck.length + "枚"
          : state.deck.length + "枚"
        : "0枚";
      updateDeckVisual(state.deck.length);
      elements.boardValue.textContent = state.started ? placed + " / " + fixedBoardArea() : "-";
      elements.neutralValue.textContent = isSurvivalFamilyMode() && state.playerCount === 2 ? "中立色: 黄" : "中立色なし";
      const dealSurvivalNoMove = shouldShowDealSurvivalLoseButton();

      elements.endTurnButton.hidden = isSurvivalFamilyMode() || isPopjamMode();
      elements.loseButton.textContent = isPopjamMode()
        ? "⏭ パス"
        : (isTacticsMode() || isClassicSharedMode())
        ? "✓ 完成"
        : "× 置けない";
      elements.loseButton.hidden = isDealSurvivalMode() ? !dealSurvivalNoMove : false;
      elements.undoButton.disabled = true;
      const salvagePlacing = Boolean(state.pendingAction && state.pendingAction.type === "salvage-place");
      const replacePlacing = Boolean(state.pendingAction && state.pendingAction.type === "replace-place");
      const choosingQuestion = hasPendingQuestionEffects() || hasPendingAction();
      const blockingAction = choosingQuestion && !salvagePlacing && !replacePlacing;
      const winShowcase = hasPopjamWinDiscardShowcase();
      if (salvagePlacing) {
        elements.loseButton.textContent = "⏭ パスして捨て札へ";
      }
      setLoseButtonTone(!isTacticsMode() && !isPopjamMode() && !salvagePlacing ? "danger" : "");
      elements.drawButton.disabled = hasSharedMarket() || !state.started || state.over || state.deck.length === 0 || isCpuTurn() || choosingQuestion || winShowcase;
      const popDiscarding = isPopjamMode() && state.discardPending > 0;
      // ポップジャムは1手で自動的に手番が進むため手番終了ボタンは使わない
      elements.endTurnButton.disabled = !state.started || state.over || !player
        || isPopjamMode() || isTacticsMode() || player.hand.length > 0 || blockingAction || winShowcase;
      elements.loseButton.disabled = !state.started || state.over || popDiscarding || isCpuTurn() || blockingAction || winShowcase
        || (isDealSurvivalMode() && !dealSurvivalNoMove);
      elements.rotateLeftButton.disabled = !state.started || state.over || (!salvagePlacing && state.selectedHandIndex === null) || blockingAction || winShowcase;
      elements.rotateRightButton.disabled = !state.started || state.over || (!salvagePlacing && state.selectedHandIndex === null) || blockingAction || winShowcase;
      elements.applyCompletionButton.disabled = !state.started || state.over || isCpuTurn() || choosingQuestion || winShowcase;
      elements.newGameButton.disabled = !tileImagesReady;
    }

    // 得点グロー演出のタイミング定数と、模様ごとの完成（初検出）時刻の記録。
    const PATTERN_GLOW_BURST_MS = 1400; // 完成時に領域を一度だけ強く光らせて消えるまで
    const patternGlowSince = {}; // pattern.key -> 完成時刻(performance.now基準)
    const scoreMarkerSince = {}; // pattern.key -> 得点表示を出した時刻（グロー設定と独立）

    // 得点ダイヤ飛行＋カウントアップ＋グロー終了の制御
    // クラシック/フリー(動的)は盤面と得点欄が近く飛行が一瞬なので、ゆっくり飛ばし、
    // 逆に線/数字が残りすぎないよう演出時間を短めにする。サバイバル(固定)は従来どおり。
    const FLY_DIAMOND_FLY_DYNAMIC_MS = 1050;
    const FLY_DIAMOND_FLY_FIXED_MS = 720;
    const FLY_DIAMOND_STAGGER_MS = 140;
    const scoreFlyQueue = [];          // 描画末尾で再生する飛行 {key,color,points,playerId,centerR,centerC}
    const lifeFlyQueue = [];           // ライフ専用の飛行 {kind,color,points,playerId,centerR,centerC}
    const flyPendingByPlayer = {};     // playerId -> 飛行中(未着地)のダイヤ数
    const flightTriggeredKeys = {};    // pattern.key -> 既に飛行を出したか（二重起動防止）
    const patternGlowEndAt = {};       // pattern.key -> グロー(光る演出)を消す時刻
    let scoreFlightGeneration = 0;      // 新ゲームをまたいだ古いタイマーの誤反映防止
    function flyDurationMs(borderless) {
      return borderless ? FLY_DIAMOND_FLY_DYNAMIC_MS : FLY_DIAMOND_FLY_FIXED_MS;
    }
    function scoreFlightClamp(value, min, max) {
      return Math.min(max, Math.max(min, value));
    }
    function scoreFlightDurationForDistance(distance, borderless) {
      const min = borderless ? 680 : 500;
      const max = borderless ? FLY_DIAMOND_FLY_DYNAMIC_MS : 760;
      const fullDistance = borderless ? 420 : 340;
      const t = scoreFlightClamp(distance / fullDistance, 0, 1);
      return Math.round(min + (max - min) * t);
    }
    function scoreFlightArcForDistance(distance, borderless) {
      const min = borderless ? 30 : 28;
      const max = borderless ? 88 : 72;
      return scoreFlightClamp(distance * 0.2, min, max);
    }
    function scoreFlightJitter(key, index, axis) {
      const seed = String(key || "") + ":" + index + ":" + axis;
      let hash = 0;
      for (let i = 0; i < seed.length; i++) {
        hash = ((hash << 5) - hash + seed.charCodeAt(i)) | 0;
      }
      return ((Math.abs(hash) % 1000) / 999) * 2 - 1;
    }
    function flyWindowMs(points, borderless) {
      // 飛行完了＋少しの余韻で線/数字を消す。動的は短め、固定は従来どおり領域バーストも覆う。
      const tail = borderless ? 320 : 780;
      return flyDurationMs(borderless) + Math.max(0, points - 1) * FLY_DIAMOND_STAGGER_MS + tail;
    }
    function dynamicCellElement(row, col) {
      if (!Number.isFinite(row) || !Number.isFinite(col)) {
        return null;
      }
      return document.querySelector("[data-bl-cell=\"" + row + "," + col + "\"]");
    }
    function nearestPatternCell(cells, centerR, centerC) {
      if (!Array.isArray(cells) || cells.length === 0) {
        return null;
      }
      return cells.reduce(function (best, cell) {
        const dr = (cell.r || 0) - centerR;
        const dc = (cell.c || 0) - centerC;
        const dist = dr * dr + dc * dc;
        if (!best || dist < best.dist) {
          return { r: cell.r, c: cell.c, dist: dist };
        }
        return best;
      }, null);
    }
    function fixedBoardCellElement(row, col) {
      if (!elements.board || !Number.isFinite(row) || !Number.isFinite(col)) {
        return null;
      }
      if (isPopjamScoreMode()) {
        return elements.board.children[(row + 1) * 7 + (col + 1)] || null;
      }
      const size = state.board.length || fixedBoardSize();
      return elements.board.children[row * size + col] || null;
    }
    function sourceElementForFlight(item, dynamicBoard) {
      if (dynamicBoard) {
        const rounded = dynamicCellElement(Math.round(item.centerR), Math.round(item.centerC));
        if (rounded) {
          return rounded;
        }
        const nearest = nearestPatternCell(item.cells, item.centerR, item.centerC);
        if (nearest) {
          const byCell = dynamicCellElement(nearest.r, nearest.c);
          if (byCell) {
            return byCell;
          }
        }
        if (Array.isArray(item.cells)) {
          for (let i = 0; i < item.cells.length; i++) {
            const cell = item.cells[i];
            const el = dynamicCellElement(cell.r, cell.c);
            if (el) {
              return el;
            }
          }
        }
        return null;
      }
      const rr = Math.max(0, Math.round(item.centerR));
      const cc = Math.max(0, Math.round(item.centerC));
      const roundedFixed = fixedBoardCellElement(rr, cc);
      if (roundedFixed) {
        return roundedFixed;
      }
      const nearestFixed = nearestPatternCell(item.cells, item.centerR, item.centerC);
      return nearestFixed ? fixedBoardCellElement(nearestFixed.r, nearestFixed.c) : null;
    }
    // 表示用得点: 飛行中はカウントアップ途中の displayScore、そうでなければ実値に同期
    function shownScore(p) {
      if (!flyPendingByPlayer[p.id]) { p.displayScore = p.score; }
      return (typeof p.displayScore === "number") ? p.displayScore : p.score;
    }
    function renderScorePanel() {
      if (isDynamicBoardMode() && !isDynamicPopjamMode()) {
        renderBlScores();
      } else {
        renderPlayers();
      }
    }
    // 新規ゲーム時に演出系の一時記録をクリア（前ゲームの残骸で得点表示が固まらないように）
    function resetScoreFlights() {
      scoreFlightGeneration++;
      scoreFlyQueue.length = 0;
      lifeFlyQueue.length = 0;
      [flyPendingByPlayer, flightTriggeredKeys, patternGlowEndAt, patternGlowSince, scoreMarkerSince]
        .forEach(function (m) { Object.keys(m).forEach(function (k) { delete m[k]; }); });
      state.scoreBumpPlayerIds = [];
      state.scoreDropPlayerIds = [];
    }
    const SVG_NS = "http://www.w3.org/2000/svg";

    function prefersReducedMotionGlow() {
      return typeof window.matchMedia === "function"
        && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    }

    // 完成時の領域バーストを、その模様の完成時刻 since を基準に inline 設定する。
    // 負の delay で位相を復元するので、タイル回転などで要素が作り直されても一度きりで乱れない。
    function applyGlowAnim(el, since) {
      if (prefersReducedMotionGlow()) {
        el.style.opacity = "0"; // モーション抑制時は点滅させない（白線グローは残る）
        return;
      }
      const elapsed = performance.now() - since;
      el.style.animation = "pattern-glow-burst " + PATTERN_GLOW_BURST_MS
        + "ms ease-out " + (-elapsed) + "ms both";
    }

    // 模様を囲う白線のグローSVGをセル/タイルに重ねる。
    function appendPatternOutline(parent, lines) {
      const svg = document.createElementNS(SVG_NS, "svg");
      svg.setAttribute("class", "pattern-outline");
      svg.setAttribute("viewBox", "0 0 100 100");
      svg.setAttribute("preserveAspectRatio", "none");
      lines.forEach(function (l) {
        const ln = document.createElementNS(SVG_NS, "line");
        ln.setAttribute("x1", l.x1);
        ln.setAttribute("y1", l.y1);
        ln.setAttribute("x2", l.x2);
        ln.setAttribute("y2", l.y2);
        const col = GLOW_LINE_COLOR[l.color] || "#ffffff";
        ln.setAttribute("stroke", col);
        ln.style.filter = "drop-shadow(0 0 2.5px " + col + ")";
        svg.appendChild(ln);
      });
      parent.appendChild(svg);
    }

    // 新しく完成した（得点になる）模様を検出して、ダイヤ飛行＋グロー期間を仕込む。
    // 得点欄の描画より前に呼ぶこと（飛行中は displayScore を据え置くため）。
    function prepareScoreFlights(borderless) {
      // 手札増減型のポップジャム/サバイバルは得点ダイヤ演出を出さない。得点型ポップジャムは共通演出を使う。
      if ((isPopjamMode() && !isPopjamScoreMode()) || isHandSurvivalMode() || isLifeMode()) { return; }
      let patterns;
      try {
        patterns = borderless
          ? WiggleRules.detectClosedPatternsDynamic(dynamicScoringBoard())
          : detectCompletedPatterns();
      } catch (e) {
        return;
      }
      const now = performance.now();
      const seen = {};
      patterns.forEach(function (pattern) {
        const owner = ownerForColor(pattern.color);
        if (!owner) { return; }
        seen[pattern.key] = true;
        if (flightTriggeredKeys[pattern.key]) { return; } // 既に飛行済み
        const scoreInfo = borderless ? dynamicPatternScoreInfo(pattern) : { points: pattern.points, bonus: 0 };
        flightTriggeredKeys[pattern.key] = true;
        flyPendingByPlayer[owner.id] = (flyPendingByPlayer[owner.id] || 0) + scoreInfo.points;
        patternGlowEndAt[pattern.key] = now + flyWindowMs(scoreInfo.points, borderless);
        scoreFlyQueue.push({
          key: pattern.key,
          color: pattern.color,
          points: scoreInfo.points,
          bonus: scoreInfo.bonus,
          playerId: owner.id,
          centerR: borderless ? pattern.centerR : (pattern.row + (pattern.localY || 0) / 100),
          centerC: borderless ? pattern.centerC : (pattern.col + (pattern.localX || 0) / 100),
          cells: Array.isArray(pattern.cells) ? pattern.cells.slice() : [{ r: pattern.row, c: pattern.col }]
        });
        // 演出ウィンドウ終了時に再描画して光る演出を止める
        setTimeout(function () { if (state.started) { render(); } }, flyWindowMs(scoreInfo.points, borderless) + 80);
      });
      // 盤上から消えた模様は記録を破棄（崩して作り直したら再演出）
      Object.keys(flightTriggeredKeys).forEach(function (k) {
        if (!seen[k]) { delete flightTriggeredKeys[k]; delete patternGlowEndAt[k]; }
      });
    }

    // 仕込んだダイヤ飛行を再生（描画の末尾で呼ぶ＝盤面/得点欄のDOMが揃った後）。
    function playQueuedScoreFlights() {
      if (scoreFlyQueue.length === 0) { return; }
      const layer = elements.dealAnimationLayer;
      const dynamicBoard = isDynamicBoardMode();
      const queue = scoreFlyQueue.splice(0);
      const generation = scoreFlightGeneration;
      queue.forEach(function (item) {
        const owner = state.players.find(function (p) { return p.id === item.playerId; });
        const target = document.querySelector("[data-player-id=\"" + item.playerId + "\"]");
        const srcEl = sourceElementForFlight(item, dynamicBoard);
        let settled = false;
        let fallbackTimer = null;
        const reconcile = function (n, bump) {
          if (generation !== scoreFlightGeneration) { return; }
          if (settled) { return; }
          settled = true;
          if (fallbackTimer) {
            clearTimeout(fallbackTimer);
          }
          if (owner) {
            owner.displayScore = Math.min((owner.displayScore || 0) + n, owner.score);
          }
          flyPendingByPlayer[item.playerId] = Math.max(0, (flyPendingByPlayer[item.playerId] || 0) - n);
          if (bump) {
            state.scoreBumpPlayerIds = [item.playerId];
          }
          renderScorePanel();
          if (bump) {
            setTimeout(function () {
              if (state.scoreBumpPlayerIds && state.scoreBumpPlayerIds.indexOf(item.playerId) >= 0) {
                state.scoreBumpPlayerIds = [];
                renderScorePanel();
              }
            }, 380);
          }
        };
        if (!layer || !target || !srcEl || typeof srcEl.getBoundingClientRect !== "function"
          || prefersReducedMotionGlow()) {
          // アニメ不可/抑制時は即時に得点を反映
          reconcile(item.points, true);
          return;
        }
        const s = srcEl.getBoundingClientRect();
        const t = target.getBoundingClientRect();
        const startX = s.left + s.width / 2 - 9;
        const startY = s.top + s.height / 2 - 9;
        const endX = t.left + Math.min(t.width - 32, Math.max(38, t.width * 0.18)) - 9;
        const endY = t.top + t.height / 2 - 9;
        const flightDistance = Math.hypot(endX - startX, endY - startY);
        const flyDur = scoreFlightDurationForDistance(flightDistance, dynamicBoard);
        const flightArc = scoreFlightArcForDistance(flightDistance, dynamicBoard);
        const n = Math.max(1, Math.floor(item.points));
        let ended = 0;
        const finishScoreFlight = function () {
          ended++;
          if (ended < n) { return; }
          reconcile(item.points, true);
        };
        fallbackTimer = setTimeout(function () {
          reconcile(item.points, true);
        }, flyDur + (Math.max(0, n - 1) * 58) + 260);
        for (let i = 0; i < n; i++) {
          const d = document.createElement("span");
          d.className = "score-fly-diamond " + item.color;
          const spread = (i - (n - 1) / 2) * 8;
          const endJitterX = scoreFlightJitter(item.key, i, "x") * 11;
          const endJitterY = scoreFlightJitter(item.key, i, "y") * 5;
          const midJitterX = scoreFlightJitter(item.key, i, "mx") * 18;
          d.style.setProperty("--from-x", startX + "px");
          d.style.setProperty("--from-y", startY + "px");
          d.style.setProperty("--mid-x", ((startX + endX) / 2 + spread + midJitterX) + "px");
          d.style.setProperty("--mid-y", (Math.min(startY, endY) - flightArc) + "px");
          d.style.setProperty("--to-x", (endX + spread * 0.42 + endJitterX) + "px");
          d.style.setProperty("--to-y", (endY + endJitterY) + "px");
          d.style.setProperty("--delay", (i * 58) + "ms");
          d.style.animationDuration = flyDur + "ms";
          layer.appendChild(d);
          d.addEventListener("animationend", function () {
            d.remove();
            finishScoreFlight();
          });
        }
      });
    }

    function queueLifeEffectFlight(pattern, player, points, kind) {
      if (!isLifeMode() || !pattern || !player || player.finished || points <= 0) {
        return;
      }
      lifeFlyQueue.push({
        kind: kind === "recover" ? "recover" : "damage",
        color: kind === "recover" ? player.color : "locked",
        points: Math.max(1, points),
        playerId: player.id,
        centerR: pattern.centerR,
        centerC: pattern.centerC,
        cells: Array.isArray(pattern.cells) ? pattern.cells.slice() : []
      });
    }

    function playQueuedLifeFlights() {
      if (lifeFlyQueue.length === 0) { return; }
      const layer = elements.dealAnimationLayer;
      const flyDur = flyDurationMs(true);
      const queue = lifeFlyQueue.splice(0);
      queue.forEach(function (item) {
        const targetSelector = item.kind === "recover"
          ? "[data-life-life-player=\"" + item.playerId + "\"]"
          : "[data-life-damage-player=\"" + item.playerId + "\"]";
        let target = document.querySelector(targetSelector);
        const fallbackTarget = document.querySelector("[data-player-id=\"" + item.playerId + "\"]");
        const srcEl = sourceElementForFlight(item, true);
        if (target && target.getBoundingClientRect) {
          const rect = target.getBoundingClientRect();
          if (rect.width < 4 || rect.height < 4) {
            target = fallbackTarget;
          }
        }
        if (!layer || !target || !srcEl || typeof srcEl.getBoundingClientRect !== "function"
          || prefersReducedMotionGlow()) {
          return;
        }
        const s = srcEl.getBoundingClientRect();
        const t = target.getBoundingClientRect();
        const startX = s.left + s.width / 2 - 9;
        const startY = s.top + s.height / 2 - 9;
        const endX = t.left + Math.max(8, t.width / 2) - 9;
        const endY = t.top + t.height / 2 - 9;
        const n = Math.max(1, item.points);
        for (let i = 0; i < n; i++) {
          const d = document.createElement("span");
          d.className = "score-fly-diamond " + item.color;
          const spread = (i - (n - 1) / 2) * 9;
          d.style.setProperty("--from-x", startX + "px");
          d.style.setProperty("--from-y", startY + "px");
          d.style.setProperty("--mid-x", ((startX + endX) / 2 + spread) + "px");
          d.style.setProperty("--mid-y", (Math.min(startY, endY) - 58) + "px");
          d.style.setProperty("--to-x", (endX + spread * 0.18) + "px");
          d.style.setProperty("--to-y", endY + "px");
          d.style.setProperty("--delay", (i * 86) + "ms");
          d.style.animationDuration = flyDur + "ms";
          layer.appendChild(d);
          d.addEventListener("animationend", function () {
            d.remove();
          });
        }
      });
    }

    // テスト演出: 現在の盤面で「得点になっている模様」を、マスごとに
    //   { "r,c": { tris:[{d,color,since}], lines:[{x1,y1,x2,y2,color}] } } で返す。
    //   tris = 完成時に光らせる色の三角領域 / lines = 模様を囲う白線（継続グロー）。
    // ・PATTERN_GLOW.persistent が false なら空（演出オフ）。
    // ・得点にならない色も「模様が完成した」事実は見せる。
    // ・スタートタイルの白い区画は光らせない（実タイルの色三角のみ）。
    function buildPatternGlowMap(borderless) {
      const map = {};
      const resultHighlightItems = resultScoreHighlightItems(borderless);
      if (!PATTERN_GLOW.persistent && resultHighlightItems.length === 0) {
        Object.keys(patternGlowSince).forEach(function (k) { delete patternGlowSince[k]; });
        return map;
      }
      let patterns = [];
      try {
        if (PATTERN_GLOW.persistent) {
          patterns = borderless
            ? WiggleRules.detectClosedPatternsDynamic(dynamicScoringBoard())
            : detectCompletedPatterns();
        }
      } catch (e) {
        return map;
      }
      const now = performance.now();
      const seen = {};
      patterns.forEach(function (pattern) {
        // 得点が加算され終わる（演出ウィンドウ終了）までだけ光らせる
        const endAt = patternGlowEndAt[pattern.key];
        if (!endAt || now >= endAt) {
          return;
        }
        if (patternGlowSince[pattern.key] === undefined) {
          patternGlowSince[pattern.key] = now; // この模様の完成時刻を記録
        }
        seen[pattern.key] = true;
        const since = patternGlowSince[pattern.key];
        const tris = pattern.triangles || [];
        // この模様に属する三角の集合（スタート含む。白線の内外判定に使う）
        const member = {};
        tris.forEach(function (tri) { member[tri.r + "," + tri.c + "," + tri.d] = true; });
        tris.forEach(function (tri) {
          // スタートタイルの白い分割線にも演出をつなげるため start も含める。外周ハテナ枠のみ除外。
          if (tri.question) {
            return;
          }
          const key = tri.r + "," + tri.c;
          if (!map[key]) {
            map[key] = { tris: [], lines: [] };
          }
          // 完成時に光らせる領域（三角）
          map[key].tris.push({ d: tri.d, color: pattern.color, since: since });
          // 模様の外周（向こう側の三角が同じ模様に無い辺）＝囲う白線
          TRI_EDGE_DEFS[tri.d].forEach(function (e) {
            const nk = (tri.r + e.dr) + "," + (tri.c + e.dc) + "," + e.nd;
            if (member[nk]) {
              return; // 模様の内側の辺は光らせない
            }
            map[key].lines.push({ x1: e.x1, y1: e.y1, x2: e.x2, y2: e.y2, color: pattern.color });
          });
        });
      });
      if (resultHighlightItems.length > 0) {
        resultHighlightItems
          .forEach(function (pattern) {
            const tris = Array.isArray(pattern.triangles) ? pattern.triangles : [];
            const member = {};
            tris.forEach(function (tri) { member[tri.r + "," + tri.c + "," + tri.d] = true; });
            tris.forEach(function (tri) {
              if (tri.question) {
                return;
              }
              const key = tri.r + "," + tri.c;
              if (!map[key]) {
                map[key] = { tris: [], lines: [] };
              }
              TRI_EDGE_DEFS[tri.d].forEach(function (e) {
                const nk = (tri.r + e.dr) + "," + (tri.c + e.dc) + "," + e.nd;
                if (member[nk]) {
                  return;
                }
                map[key].lines.push({ x1: e.x1, y1: e.y1, x2: e.x2, y2: e.y2, color: pattern.color });
              });
            });
          });
      }
      // 盤上から消えた模様は記録を破棄（崩して作り直したら新しい完成として再バースト）
      Object.keys(patternGlowSince).forEach(function (k) {
        if (!seen[k]) { delete patternGlowSince[k]; }
      });
      return map;
    }

    function createFixedBoardCell(row, col, renderContext) {
      const cell = document.createElement("button");
      const boardTile = state.board[row] ? state.board[row][col] : null;
      const glowMap = renderContext.glowMap || {};
      const showPlacementCandidates = Boolean(renderContext.showPlacementCandidates);
      cell.type = "button";
      cell.className = "cell";
      // 効果範囲のオーバーレイは常時でなく、ムーブの対象/移動先を選ぶ間だけ表示してプレイの邪魔をしない。
      if (isPopjamMode() && state.pendingAction
        && (state.pendingAction.type === "replace" || state.pendingAction.type === "replace-place")) {
        if (isCellLocked(row, col)) { cell.classList.add("pj-locked"); }
        if (isCellSpotlit(row, col)) { cell.classList.add("pj-spotlit"); }
      }
      if (boardTile) {
        cell.classList.add("has-tile");
        const cellGlow = glowMap[row + "," + col];
        if (cellGlow) {
          cellGlow.tris.forEach(function (tri) {
            const g = document.createElement("div");
            g.className = "pattern-glow-tri";
            g.dataset.glowColor = tri.color;
            g.style.clipPath = TRI_CLIP[tri.d];
            applyGlowAnim(g, tri.since);
            cell.appendChild(g);
          });
          if (cellGlow.lines.length) {
            appendPatternOutline(cell, cellGlow.lines);
          }
        }
        if (isInnerQuestionTile(boardTile.tile)) {
          cell.classList.add("inner-question");
          if (hasPendingQuestionEffects()) {
            const pendingInnerSlot = innerQuestionSlotAt(row, col);
            if (pendingInnerSlot && state.pendingQuestionEffects.indexOf(pendingInnerSlot.id) !== -1) {
              cell.classList.add("pending-effect");
            }
          }
          if (boardTile.tile.revealed) {
            cell.classList.add("revealed");
          }
          if (!boardTile.tile.revealed && canInspectInnerQuestionTile(boardTile.tile)) {
            cell.classList.add("owned-inner-question");
          }
          if (questionRevealAnimationSlots.indexOf("inner-" + row + "-" + col) !== -1) {
            cell.classList.add("just-revealed");
          }
        }
        if (boardTile.tile.start && state.startTileAnimating) {
          cell.classList.add("tile-drop");
          renderContext.usedStartAnimation = true;
        }
        if (state.pendingAction && state.pendingAction.type === "delete" && !boardTile.tile.start) {
          cell.classList.add("action-target");
        }
        if (state.pendingAction && state.pendingAction.type === "replace" && !boardTile.tile.start && !isInnerQuestionTile(boardTile.tile)) {
          cell.classList.add("action-target");
        }
        if (state.pendingAction && state.pendingAction.type === "replace-place"
          && state.pendingAction.source
          && state.pendingAction.source.row === row
          && state.pendingAction.source.col === col) {
          cell.classList.add("action-selected");
        }
      }

      if (canPlaceAt(row, col)) {
        if (showPlacementCandidates) {
          cell.classList.add("placeable");
        }
        if (state.pendingAction && state.pendingAction.type === "salvage-place") {
          cell.classList.add("salvage-placeable");
        }
        if (state.pendingAction && state.pendingAction.type === "replace-place") {
          cell.classList.add("salvage-placeable");
        }
      } else if (!boardTile && showPlacementCandidates) {
        cell.classList.add("blocked");
      }

      cell.addEventListener("click", function () {
        if (Date.now() < blSwipeSuppressClickUntil) {
          return;
        }
        if (state.pendingAction && state.pendingAction.type === "delete") {
          selectDeleteBoardTile(row, col);
          return;
        }
        if (state.pendingAction && state.pendingAction.type === "replace") {
          selectReplaceBoardTile(row, col);
          return;
        }
        if (state.pendingAction && state.pendingAction.type === "replace-place" && boardTile) {
          selectReplaceBoardTile(row, col);
          return;
        }
        if (state.pendingAction && state.pendingAction.type === "replace-place") {
          requestPlacementConfirm(row, col, false, function () {
            placePendingReplaceTile(row, col);
          });
          return;
        }
        if (state.pendingAction && state.pendingAction.type === "salvage-place") {
          requestPlacementConfirm(row, col, false, function () {
            placePendingSalvageTile(row, col);
          });
          return;
        }
        if (hasPendingQuestionEffects()) {
          const pendingInnerSlot = innerQuestionSlotAt(row, col);
          if (pendingInnerSlot && state.pendingQuestionEffects.indexOf(pendingInnerSlot.id) !== -1) {
            selectPendingQuestionEffect(pendingInnerSlot.id);
          }
          return;
        }
        if (mobilePlacementConfirm
          && !mobilePlacementConfirm.dynamic
          && (mobilePlacementConfirm.row !== row || mobilePlacementConfirm.col !== col)) {
          clearMobilePlacementConfirm();
        }
        if (canPlaceAt(row, col) && !confirmOrArmMobilePlacement(row, col, false)) {
          return;
        }
        placeSelectedTile(row, col);
      });
      cell.addEventListener("wheel", function (event) {
        rotateSelectedByWheel(event);
      }, { passive: false });
      cell.addEventListener("contextmenu", function (event) {
        event.preventDefault();
        rotateSelected(90);
      });

      if (boardTile) {
        const img = document.createElement("img");
        img.src = tilePath + displayTileSrc(boardTile.tile);
        img.alt = boardTile.tile.name;
        img.style.transform = "rotate(" + boardTile.rotation + "deg)";
        if (pendingDropCell && pendingDropCell.row === row && pendingDropCell.col === col) {
          cell.classList.add("tile-drop");
          img.style.setProperty("--drop-rot", (boardTile.rotation || 0) + "deg");
        }
        cell.appendChild(img);
      } else if ((state.selectedHandIndex !== null
        || (state.pendingAction && (state.pendingAction.type === "salvage-place" || state.pendingAction.type === "replace-place")))
        && !state.over && !isCpuTurn()) {
        cell.addEventListener("mouseenter", function () {
          hoverCell = { r: row, c: col };
          showGhost(cell, row, col);
        });
        cell.addEventListener("mouseleave", function () {
          if (hoverCell && hoverCell.r === row && hoverCell.c === col) { hoverCell = null; }
          clearGhost(cell);
        });
        const activePreviewCell = activePlacementPreviewCell(false);
        if (activePreviewCell && activePreviewCell.r === row && activePreviewCell.c === col) {
          showGhost(cell, row, col);
        }
      }

      const coord = document.createElement("span");
      coord.className = "coord";
      coord.textContent = (row + 1) + "," + (col + 1);
      cell.appendChild(coord);

      state.scoreEffects
        .filter(function (effect) {
          return effect.row === row && effect.col === col;
        })
        .forEach(function (effect) {
          const now = performance.now();
          const since = effect.since || now;
          const endAt = effect.endAt || (since + PATTERN_GLOW_BURST_MS);
          const lifeMs = Math.max(260, endAt - since);
          const elapsed = now - since;
          if (elapsed > lifeMs) {
            return;
          }
          const marker = document.createElement("span");
          marker.className = "score-marker " + effect.color;
          marker.innerHTML = effect.html || escapeHtml(effect.text || "");
          marker.style.left = (Number.isFinite(effect.localX) ? effect.localX : 50) + "%";
          marker.style.top = (Number.isFinite(effect.localY) ? effect.localY : 50) + "%";
          if (!prefersReducedMotionGlow()) {
            const fadeMs = Math.min(320, Math.max(180, lifeMs * 0.22));
            const fadeDelay = Math.max(0, lifeMs - fadeMs);
            marker.style.animation = "marker-pop 380ms cubic-bezier(0.18, 1.2, 0.4, 1) "
              + (-elapsed) + "ms both, marker-fade " + fadeMs + "ms ease-in "
              + (fadeDelay - elapsed) + "ms both";
          }
          cell.appendChild(marker);
          effect.rendered = true;
        });

      if (resultViewMode() === "details") {
        resultScoreHighlightItems(false)
          .filter(function (item) {
            return !item.borderless && item.row === row && item.col === col;
          })
          .forEach(function (item) {
            const marker = document.createElement("span");
            marker.className = "score-marker classic-bonus-result-marker " + item.color;
            marker.innerHTML = classicBonusResultMarkerHtml(item);
            marker.style.left = (Number.isFinite(item.localX) ? item.localX : 50) + "%";
            marker.style.top = (Number.isFinite(item.localY) ? item.localY : 50) + "%";
            cell.appendChild(marker);
          });
      }

      return cell;
    }

    function questionSlotForPopjamScoreStage(row, col) {
      if (!Array.isArray(state.questionBoard)) {
        return null;
      }
      let id = null;
      if (row === 0 && col >= 1 && col <= 5) {
        id = "top-" + (col - 1);
      } else if (row === 6 && col >= 1 && col <= 5) {
        id = "bottom-" + (col - 1);
      } else if (col === 0 && row >= 1 && row <= 5) {
        id = "left-" + (row - 1);
      } else if (col === 6 && row >= 1 && row <= 5) {
        id = "right-" + (row - 1);
      }
      return id
        ? state.questionBoard.find(function (slot) { return slot.id === id; }) || null
        : null;
    }

    function createExternalQuestionButton(slot, extraClassName) {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "external-question " + slot.side + (extraClassName ? " " + extraClassName : "");
      if (slot.revealed) {
        button.classList.add("revealed");
      }
      if (questionRevealAnimationSlots.indexOf(slot.id) !== -1) {
        button.classList.add("just-revealed");
      }
      if (hasPendingQuestionEffects() && state.pendingQuestionEffects.indexOf(slot.id) !== -1) {
        button.classList.add("pending-effect");
      }
      if (state.pendingAction && state.pendingAction.type === "swap") {
        button.classList.add("swap-target");
        if (state.pendingAction.selectedSlotIds.indexOf(slot.id) !== -1) {
          button.classList.add("pending-effect");
          button.classList.add("swap-picked");
        }
      }
      button.style.setProperty("--slot-index", String(slot.index));
      button.style.setProperty("--question-rot", slot.rotation + "deg");
      button.addEventListener("click", function () {
        if (state.pendingAction && state.pendingAction.type === "swap") {
          selectQuestionSwapSlot(slot.id);
          return;
        }
        if (hasPendingQuestionEffects() && state.pendingQuestionEffects.indexOf(slot.id) !== -1) {
          selectPendingQuestionEffect(slot.id);
          return;
        }
        if (hasPendingQuestionEffects()) {
          return;
        }
        selectQuestionSwapSlot(slot.id);
      });

      const img = document.createElement("img");
      img.src = tilePath + (slot.revealed ? slot.tile.src : questionBackTile.src);
      img.alt = slot.revealed ? slot.tile.name : "ハテナ";
      button.appendChild(img);
      return button;
    }

    function renderPopjamScoreStage(renderContext) {
      elements.board.style.gridTemplateColumns = "repeat(7, minmax(0, 1fr))";
      elements.board.style.gridTemplateRows = "repeat(7, minmax(0, 1fr))";
      elements.board.dataset.size = "7";

      for (let row = 0; row < 7; row++) {
        for (let col = 0; col < 7; col++) {
          if (row >= 1 && row <= 5 && col >= 1 && col <= 5) {
            const cell = createFixedBoardCell(row - 1, col - 1, renderContext);
            cell.classList.add("pjs-board-cell");
            elements.board.appendChild(cell);
            continue;
          }

          const slot = questionSlotForPopjamScoreStage(row, col);
          if (slot && slot.tile) {
            elements.board.appendChild(createExternalQuestionButton(slot, "pjs-frame-cell"));
          } else {
            const corner = document.createElement("div");
            corner.className = "pjs-corner";
            elements.board.appendChild(corner);
          }
        }
      }
    }

    function renderBoard() {
      elements.board.innerHTML = "";
      const size = state.board.length || fixedBoardSize();
      const placementAssist = currentPlacementAssistMode();
      const renderContext = {
        glowMap: buildPatternGlowMap(false),
        showPlacementCandidates: placementAssist !== "off",
        usedStartAnimation: false
      };
      elements.board.style.gridTemplateColumns = "repeat(" + size + ", minmax(0, 1fr))";
      elements.board.style.gridTemplateRows = "";
      elements.board.dataset.size = String(size);
      elements.board.classList.toggle("hide-coords", !state.showCoords);

      if (isPopjamScoreMode()) {
        renderPopjamScoreStage(renderContext);
      } else {
        for (let row = 0; row < size; row++) {
          for (let col = 0; col < size; col++) {
            elements.board.appendChild(createFixedBoardCell(row, col, renderContext));
          }
        }

        renderExternalQuestionTiles();
      }

      if (renderContext.usedStartAnimation) {
        state.startTileAnimating = false;
      }
      pendingDropCell = null;
    }

    function renderExternalQuestionTiles() {
      if (!isPopjamMode() || !Array.isArray(state.questionBoard)) {
        return;
      }

      state.questionBoard.forEach(function (slot) {
        if (!slot || !slot.tile) {
          return;
        }

        elements.board.appendChild(createExternalQuestionButton(slot));
      });
    }

    function showGhost(cell, row, col) {
      const player = currentPlayer();
      if (!player) {
        return;
      }
      const tile = state.pendingAction && (state.pendingAction.type === "salvage-place" || state.pendingAction.type === "replace-place")
        ? state.pendingAction.tile
        : selectedPlacementTile();
      if (!tile) {
        return;
      }
      clearAllPlacementPreviews(cell);
      clearGhost(cell);
      const rotation = state.pendingAction && (state.pendingAction.type === "salvage-place" || state.pendingAction.type === "replace-place")
        ? (state.pendingAction.rotation || 0)
        : state.selectedRotation;
      const legal = canPlaceTileAt(row, col, tile, rotation);
      const placementAssist = currentPlacementAssistMode();
      if (placementAssist !== "off") {
        cell.classList.add(legal ? "ghost-legal" : "ghost-illegal");
      }
      if (mobilePlacementConfirm
        && !mobilePlacementConfirm.dynamic
        && mobilePlacementConfirm.row === row
        && mobilePlacementConfirm.col === col
        && mobilePlacementConfirm.selectionKey === mobilePlacementSelectionKey()) {
        if (placementAssist !== "off") {
        cell.classList.add("ghost-armed");
        }
      }
      const reason = placementAssist === "off" ? "" : updatePlacementFeedbackForCell(row, col, tile, rotation, false, legal);
      if (reason) {
        cell.title = reason;
      } else {
        cell.removeAttribute("title");
      }
      const ghost = document.createElement("div");
      ghost.className = "ghost-preview";
      const img = document.createElement("img");
      img.src = tilePath + displayTileSrc(tile, { forceFace: true });
      img.alt = "";
      applyRotationStyle(img, rotation, placementPreviewAnimationKey(row, col, false));
      ghost.appendChild(img);
      cell.appendChild(ghost);
    }

    function clearGhost(cell) {
      cell.classList.remove("ghost-legal", "ghost-illegal");
      cell.classList.remove("ghost-armed");
      cell.removeAttribute("title");
      clearPlacementFeedback();
      const ghost = cell.querySelector(".ghost-preview");
      if (ghost) {
        ghost.remove();
      }
    }

    function normalizePlacementFeedbackReason(reason) {
      if (!reason) {
        return "";
      }
      if (reason.indexOf("色がつながっていません") >= 0
        || reason.indexOf("同じ色でつながる辺") >= 0
        || reason.indexOf("隣にタイルがない") >= 0) {
        return "";
      }
      if (reason.indexOf("回復で空いた場所") >= 0
        || reason.indexOf("回復の模様") >= 0) {
        return "回復の模様があった場所に次の一手は置けません。";
      }
      return reason;
    }

    function syncHandFit(player) {
      if (!elements.hand) {
        return;
      }
      elements.hand.style.removeProperty("--hand-tile-size");
      elements.hand.style.removeProperty("--mobile-hand-tile-size");
      elements.hand.style.removeProperty("--hand-fit-tile-size");
      elements.hand.style.removeProperty("--hand-gap");

      const handCount = player && Array.isArray(player.hand) ? player.hand.length : 0;
      elements.hand.dataset.handCount = String(handCount);
      if (handCount <= 0) {
        return;
      }

      const isMobile = currentViewMode() === "mobile";
      const compactExtraHand = isPopjamScoreMode() && player && Array.isArray(player.hand) && player.hand.length > 0;
      const gap = compactExtraHand ? (isMobile ? 6 : 4) : (isMobile ? 4 : 8);
      const maxTileSize = compactExtraHand ? (isMobile ? 42 : 52) : (isMobile ? 54 : 68);
      const minTileSize = compactExtraHand && isMobile ? 18 : (isMobile ? 24 : 34);
      const panelRect = elements.handPanel
        ? elements.handPanel.getBoundingClientRect()
        : { width: 0 };
      const fallbackWidth = isMobile ? window.innerWidth - 36 : 520;
      const availableWidth = Math.max(120, (panelRect.width || fallbackWidth) - 12);
      const rawSize = Math.floor((availableWidth - gap * Math.max(0, handCount - 1)) / handCount);
      const tileSize = Math.max(minTileSize, Math.min(maxTileSize, rawSize || maxTileSize));

      elements.hand.style.setProperty("--hand-gap", gap + "px");
      elements.hand.style.setProperty("--hand-tile-size", tileSize + "px");
      elements.hand.style.setProperty("--mobile-hand-tile-size", tileSize + "px");
      elements.hand.style.setProperty("--hand-fit-tile-size", tileSize + "px");
    }

    function tacticsGoalDescription(goal) {
      if (!goal) {
        return "";
      }
      if (goal.type === "count") {
        return goal.targetPoints + "点の模様を"
          + goal.required + "個作成したプレイヤーがこのカードを獲得します。\n"
          + "未使用色の模様も数えます。";
      }
      if (goal.type === "point") {
        return "先に自分の色で" + goal.targetPoints
          + "点の模様を作成したプレイヤーがこのカードを獲得します。";
      }
      if (goal.type === "pattern") {
        const label = goal.rank === 1 ? "小さな" : goal.rank === 2 ? "中くらいの" : "大きな";
        return "先に自分の色でカードと同じ" + label
          + "形の模様を作成したプレイヤーがこのカードを獲得します。";
      }
      return "条件を先に満たしたプレイヤーがこのカードを獲得します。";
    }

    function tacticsGoalCompactTitle(goal) {
      if (!goal) {
        return "目標";
      }
      if (goal.type === "count") {
        return "個数 : " + goal.targetPoints + "点×" + goal.required;
      }
      if (goal.type === "point") {
        return "模様作成 : " + goal.targetPoints + "点";
      }
      if (goal.type === "pattern") {
        const label = goal.rank === 1 ? "小" : goal.rank === 2 ? "中" : "大";
        return "形指定 : " + label + "模様";

      return goal.title;

    function renderOpenPerimeter() {
      if (!elements.openPerimeter) {
        return;
      }

      const active = state.started && isOpen7Mode();
      elements.openPerimeter.hidden = !active;
      elements.openPerimeter.querySelectorAll(".open-perimeter-edge").forEach(function (edge) {
        edge.remove();
      });
      if (!active) {
        syncOpen7BoardHost();
        return;
      }
      syncOpen7BoardHost();

      const edgeNames = ["top", "right", "bottom", "left"];
      const edges = edgeNames.map(function (edge) {
        const row = document.createElement("div");
        row.className = "open-perimeter-edge " + edge;
        row.dataset.edge = edge;
        elements.openPerimeter.appendChild(row);
        return row;
      });

      const tilesPerEdge = 6;
      for (let index = 0; index < tilesPerEdge * edges.length; index++) {
        const tile = state.sharedMarket[index] || null;
        const button = document.createElement("button");
        button.type = "button";
        button.className = "open-tile";
        button.dataset.marketIndex = String(index);
        if (!tile) {
          button.classList.add("empty");
          button.disabled = true;
          button.setAttribute("aria-hidden", "true");
          edges[Math.floor(index / tilesPerEdge)].appendChild(button);
          continue;
        }
        if (state.selectedHandIndex === index) {
          button.classList.add("selected");
        }
        button.disabled = state.over || isCpuTurn();
        button.addEventListener("click", function () {
          selectHandTile(index);
        });
        button.addEventListener("pointerenter", function () {
          if (!canHoverSelectSharedMarket() || button.disabled || state.selectedHandIndex === index) {
            return;
          }
          selectHandTile(index);
        });
        button.addEventListener("contextmenu", function (event) {
          event.preventDefault();
          if (state.selectedHandIndex !== index) {
            state.selectedHandIndex = index;
            state.selectedRotation = 0;
          }
          rotateSelected(90);
        });
        button.addEventListener("wheel", function (event) {
          rotateSelectedByWheel(event, index);
        }, { passive: false });

        const img = document.createElement("img");
        img.src = tilePath + displayTileSrc(tile);
        img.alt = tile.name;
        applyRotationStyle(img, state.selectedHandIndex === index ? state.selectedRotation : 0, "hand:" + index);
        button.appendChild(img);

        edges[Math.min(edges.length - 1, Math.floor(index / tilesPerEdge))].appendChild(button);
      }
    }

    function syncOpen7BoardHost() {
      if (!elements.board || !elements.boardWrap || !elements.openPerimeter) {
        return;
      }
      if (state.started && isOpen7Mode()) {
        if (elements.board.parentElement !== elements.openPerimeter) {
          elements.openPerimeter.appendChild(elements.board);
        }
        return;
      }
      if (elements.board.parentElement !== elements.boardWrap) {
        elements.boardWrap.insertBefore(elements.board, elements.openPerimeter);
      }
    }

    // ポップジャム順位欄の共通行（左にラベル＋枚数、その下にカード列）

    let lastToastText = "";

    function toastColorChipHtml(color) {
      return "<span class=\"toast-color-chip " + color + "\">"
        + escapeHtml(colorNames[color] || color)
        + "</span>";
    }

    function dealSurvivalDeliveryToastHtml(records) {
      const targets = (records || []).filter(function (record) {
        return record && record.player && record.drawn && record.drawn.length > 0;
      });
      const parts = [];
      if (targets.length === 0) {
        parts.push("<span class=\"toast-count\">+0枚</span>");
      } else {
        targets.forEach(function (record, index) {
          if (index > 0) {
            parts.push("<span class=\"toast-separator\">/</span>");
          }
          parts.push(compactPlayerRoleHtml(record.player));
          parts.push("<span class=\"toast-count\">+" + record.drawn.length + "枚</span>");
        });
      }
      return "<span class=\"toast-score-content deal-delivery-toast\">"
        + parts.join("")
        + "</span>";
    }

    function scoreToastHtml(text) {
      const source = String(text || "");
      const tokenToColor = {
        RED: "red",
        YELLOW: "yellow",
        BLUE: "blue",
        GREEN: "green",
        赤: "red",
        黄: "yellow",
        青: "blue",
        緑: "green"
      };
      const pattern = /\b(?:RED|YELLOW|BLUE|GREEN)\b|[赤黄青緑]/g;
      let html = "";
      let last = 0;
      source.replace(pattern, function (token, offset) {
        html += escapeHtml(source.slice(last, offset));
        html += toastColorChipHtml(tokenToColor[token] || "");
        last = offset + token.length;
        return token;
      });
      html += escapeHtml(source.slice(last));
      return "<span class=\"toast-score-content\">" + html + "</span>";
    }

    function renderScore() {
      if (state.over || !state.scoreText) {
        elements.scoreToast.hidden = true;
        delete elements.scoreToast.dataset.scoreColor;
        elements.scoreToast.classList.remove("deal-delivery-score-toast");
        elements.scoreToast.innerHTML = "";
        state.scoreToastHtml = "";
        state.scoreToastText = "";
        lastToastText = "";
        return;
      }

      const latestEffect = state.scoreEffects.length > 0
        ? state.scoreEffects[state.scoreEffects.length - 1]
        : null;
      if (latestEffect && latestEffect.color) {
        elements.scoreToast.dataset.scoreColor = latestEffect.color;
      } else {
        delete elements.scoreToast.dataset.scoreColor;
      }
      const hasCustomToastHtml = Boolean(state.scoreToastHtml && state.scoreToastText === state.scoreText);
      const suppressPlainScoreToast = (isClassicSharedMode() || state.mode === "borderless") && !hasCustomToastHtml;
      if (suppressPlainScoreToast) {
        elements.scoreToast.hidden = true;
        delete elements.scoreToast.dataset.scoreColor;
        elements.scoreToast.classList.remove("deal-delivery-score-toast");
        elements.scoreToast.innerHTML = "";
        lastToastText = state.scoreText;
        return;
      }
      elements.scoreToast.classList.toggle("deal-delivery-score-toast", hasCustomToastHtml);
      elements.scoreToast.hidden = false;

      if (!guideActive) { return; }
      var overlay = guideEl("guideOverlay");

      if (!overlay || !spot || !bubble) { return; }

      var vh = window.innerHeight || document.documentElement.clientHeight;

        var pad = 6;
        spot.style.left = (r.left - pad) + "px";
        spot.style.top = (r.top - pad) + "px";
        spot.style.width = (r.width + pad * 2) + "px";
        spot.style.height = (r.height + pad * 2) + "px";
        var centerY = r.top + r.height / 2;
        if (centerY > vh / 2) {
          bubble.style.top = "16px";
          bubble.style.bottom = "auto";

          bubble.style.top = "auto";

    function renderGuideStep() {
      var step = GUIDE_STEPS[guideIndex];
      if (!step) { finishGuide(); return; }
      var textEl = guideEl("guideText");
      var progressEl = guideEl("guideProgress");
      var nextEl = guideEl("guideNext");
      if (textEl) { textEl.textContent = step.text; }
      if (progressEl) { progressEl.textContent = (guideIndex + 1) + " / " + GUIDE_STEPS.length; }
      if (nextEl) { nextEl.textContent = (guideIndex === GUIDE_STEPS.length - 1) ? "はじめる" : "次へ"; }
      positionGuide();

    function startGuide() {

      if (!overlay) { return; }

    function nextGuideStep() {
      guideIndex += 1;

    // ============================================================
    // ボーダレスモード（座標無制限・色を繋げてスコアアタック）
    // wiggle-rules.js の無制限版エンジンを使う独立パス。
    // ============================================================
    const BL_CELL = 60;
    let blDrag = null;
    let blSwipeRotate = null;
    let blSwipeSuppressClickUntil = 0;
    let blListenersReady = false;
    let lastBlScoreOrder = "";
    let lastPopjamOrder = "";

    function blGetEls() {
      return {
        viewport: document.getElementById("blViewport"),
        world: document.getElementById("blWorld"),
        overlay: document.getElementById("blResultOverlay")
      };
    }

    function borderlessColors(playerCount) {
      if (playerCount <= 1) { return ["red"]; }
      if (playerCount === 2) { return ["red", "blue"]; }
      if (playerCount === 3) { return ["red", "yellow", "blue"]; }
      return ["red", "yellow", "blue", "green"];
    }

    function blCellKey(r, c) { return r + "," + c; }

    function dynamicBoardBoundsWithCell(row, col) {
      let minR = row, maxR = row, minC = col, maxC = col;
      Object.keys(state.blBoard || {}).forEach(function (key) {
        const parts = key.split(",");
        const r = parseInt(parts[0], 10);
        const c = parseInt(parts[1], 10);
        if (r < minR) { minR = r; }
        if (r > maxR) { maxR = r; }
        if (c < minC) { minC = c; }
        if (c > maxC) { maxC = c; }
      });
      return {
        minR: minR,
        maxR: maxR,
        minC: minC,
        maxC: maxC,
        height: maxR - minR + 1,
        width: maxC - minC + 1
      };
    }

    function classicAllowsDynamicCell(row, col) {
      if (isLifeMode()) {
        return true;
      }
      if (!isClassicSharedMode()) {
        return true;
      }
      const bounds = dynamicBoardBoundsWithCell(row, col);
      return bounds.width <= 5 && bounds.height <= 5;
    }

    function hasAdjacentDynamicBoardCell(row, col) {
      return [
        [-1, 0],
        [1, 0],
        [0, -1],
        [0, 1]
      ].some(function (direction) {
        return Boolean((state.blBoard || {})[blCellKey(row + direction[0], col + direction[1])]);
      });
    }

    function hasAdjacentDynamicEmptyCell(row, col) {
      return [
        [-1, 0],
        [1, 0],
        [0, -1],
        [0, 1]
      ].some(function (direction) {
        return !Boolean((state.blBoard || {})[blCellKey(row + direction[0], col + direction[1])]);
      });
    }

    function canPlaceDynamicInnerQuestionAt(row, col, tile) {
      return isPopjamInnerQuestionMode()
        && isInnerQuestionTile(tile)
        && !Boolean((state.blBoard || {})[blCellKey(row, col)])
        && hasAdjacentDynamicBoardCell(row, col)
        && hasAdjacentDynamicEmptyCell(row, col);
    }

    function placementEdgeChecks(row, col) {
      return [
        { row: row - 1, col: col, ownEdge: "top", otherEdge: "bottom", dirIndex: 0 },
        { row: row, col: col + 1, ownEdge: "right", otherEdge: "left", dirIndex: 1 },
        { row: row + 1, col: col, ownEdge: "bottom", otherEdge: "top", dirIndex: 2 },
        { row: row, col: col - 1, ownEdge: "left", otherEdge: "right", dirIndex: 3 }
      ];
    }

    function placementEdgeLabel(edge) {
      if (edge === "top") { return "上"; }
      if (edge === "right") { return "右"; }
      if (edge === "bottom") { return "下"; }
      if (edge === "left") { return "左"; }
      return "隣";
    }

    function firstDynamicEdgePlacementIssue(row, col, tile, rotation) {
      const board = state.blBoard || {};
      let hasNeighbor = false;
      const checks = placementEdgeChecks(row, col);
      for (let i = 0; i < checks.length; i++) {
        const check = checks[i];
        const neighbor = board[blCellKey(check.row, check.col)];
        if (!neighbor || isInnerQuestionCell(neighbor)) {
          continue;
        }

        hasNeighbor = true;
        if (!edgesConnect(tile, rotation, check.ownEdge, neighbor.tile, neighbor.rotation || 0, check.otherEdge)) {
          return placementEdgeLabel(check.ownEdge) + "側の隣接タイルと色がつながっていません。";
        }
      }

      return hasNeighbor ? "" : "隣にタイルがないため置けません。";
    }

    function firstFixedEdgePlacementIssue(row, col, tile, rotation) {
      let hasNeighbor = false;
      const checks = placementEdgeChecks(row, col);
      for (let i = 0; i < checks.length; i++) {
        const check = checks[i];
        const neighbor = hasPlacedTile(check.row, check.col)
          ? state.board[check.row][check.col]
          : null;
        if (!neighbor) {
          continue;
        }

        hasNeighbor = true;
        if (!edgesConnect(tile, rotation, check.ownEdge, neighbor.tile, neighbor.rotation || 0, check.otherEdge)) {
          return placementEdgeLabel(check.ownEdge) + "側の隣接タイルと色がつながっていません。";
        }
      }

      return hasNeighbor ? "" : "隣にタイルがないため置けません。";
    }

    function dynamicPlacementIssue(row, col, tile, rotation) {
      if (canPlaceDynamicShared(row, col, tile, rotation)) {
        return "";
      }
      if (!tile) {
        return "置くタイルを選んでください。";
      }
      if ((state.blBoard || {})[blCellKey(row, col)]) {
        return "すでにタイルがあります。";
      }
      if (lifeKoBanActiveFor(currentPlayer(), row, col)) {
        return "回復の模様があった場所に次の一手は置けません。";
      }
      if (isInnerQuestionTile(tile)) {
        if (!isPopjamInnerQuestionMode()) {
          return "このモードでは盤面内ハテナを置けません。";
        }
        if (!hasAdjacentDynamicBoardCell(row, col)) {
          return "隣にタイルがないため置けません。";
        }
        if (!hasAdjacentDynamicEmptyCell(row, col)) {
          return "めくるための空き辺がないため置けません。";
        }
        return "このハテナはここには置けません。";
      }
      if (isHarvestMode() && Object.keys(state.blBoard || {}).length === 0) {
        return "";
      }
      if (!harvestSeasonAllowsCell(row, col)) {
        return "このモードの配置範囲を超えています。";
      }
      if (!classicAllowsDynamicCell(row, col)) {
        return "このモードの配置範囲を超えています。";
      }

      const edgeIssue = firstDynamicEdgePlacementIssue(row, col, tile, rotation);
      return edgeIssue || "同じ色でつながる辺がありません。";
    }

    function fixedPlacementIssue(row, col, tile, rotation) {
      if (canPlaceTileAt(row, col, tile, rotation)) {
        return "";
      }
      if (state.over) {
        return "ゲームが終了しています。";
      }
      if (!state.started) {
        return "ゲーム開始後に置けます。";
      }
      if (!tile) {
        return "置くタイルを選んでください。";
      }

      const size = state.board.length || fixedBoardSize();
      if (row < 0 || row >= size || col < 0 || col >= size) {
        return "盤面の外には置けません。";
      }
      if (state.board[row][col]) {
        return "すでにタイルがあります。";
      }
      if (isTacticsMode() && countPlacedTiles() === 0) {
        return "最初のタイルは中央に置きます。";
      }
      if (isInnerQuestionTile(tile)) {
        if (!canPlaceInnerQuestionAt(row, col, tile)) {
          return "ハテナは隣にタイルと空き辺がある場所に置きます。";
        }
        return "";
      }

      const edgeIssue = firstFixedEdgePlacementIssue(row, col, tile, rotation);
      const questionEdgeIssue = fixedQuestionEdgeIssue(row, col, tile, rotation);
      return edgeIssue || questionEdgeIssue || "同じ色でつながる辺がありません。";
    }

    function updatePlacementFeedbackForCell(row, col, tile, rotation, isDynamic, legal) {
      const reason = legal
        ? ""
        : (isDynamic ? dynamicPlacementIssue(row, col, tile, rotation) : fixedPlacementIssue(row, col, tile, rotation));
      if (!reason) {
        clearPlacementFeedback(row, col, isDynamic);
        return "";
      }

      placementFeedback = {
        row: row,
        col: col,
        dynamic: Boolean(isDynamic),
        reason: reason
      };
      renderInstructionPanel();
      return reason;
    }

    function clearPlacementFeedback(row, col, isDynamic) {
      if (!placementFeedback) {
        return;
      }
      if (typeof row === "number"
        && (placementFeedback.row !== row || placementFeedback.col !== col || placementFeedback.dynamic !== Boolean(isDynamic))) {
        return;
      }
      placementFeedback = null;
      renderInstructionPanel();
    }

    function canPlaceDynamicShared(row, col, tile, rotation) {
      if (!tile || Boolean((state.blBoard || {})[blCellKey(row, col)])) {
        return false;
      }
      if (lifeKoBanActiveFor(currentPlayer(), row, col)) {
        return false;
      }
      if (isInnerQuestionTile(tile)) {
        return canPlaceDynamicInnerQuestionAt(row, col, tile);
      }
      if (isHarvestMode() && Object.keys(state.blBoard || {}).length === 0) {
        return true;
      }
      if (!harvestSeasonAllowsCell(row, col)) {
        return false;
      }
      return classicAllowsDynamicCell(row, col)
        && WiggleRules.canPlaceDynamic(dynamicScoringBoard(), row, col, tile, rotation);
    }

    function dynamicPlaceableSpots(tile, rotation) {
      if (isHarvestMode() && Object.keys(state.blBoard || {}).length === 0) {
        return [{ r: 0, c: 0 }];
      }
      if (isInnerQuestionTile(tile)) {
        const seen = {};
        const spots = [];
        Object.keys(state.blBoard || {}).forEach(function (key) {
          const parts = key.split(",");
          const r = Number(parts[0]);
          const c = Number(parts[1]);
          [
            [-1, 0],
            [1, 0],
            [0, -1],
            [0, 1]
          ].forEach(function (direction) {
            const nr = r + direction[0];
            const nc = c + direction[1];
            const nextKey = blCellKey(nr, nc);
            if (seen[nextKey] || (state.blBoard || {})[nextKey]) {
              return;
            }
            seen[nextKey] = true;
            if (canPlaceDynamicShared(nr, nc, tile, 0)) {
              spots.push({ r: nr, c: nc });
            }
          });
        });
        return spots;
      }

      return WiggleRules.placeableSpotsDynamic(dynamicScoringBoard(), tile).filter(function (spot) {
        if ((state.blBoard || {})[blCellKey(spot.r, spot.c)]) {
          return false;
        }
        if (!harvestSeasonAllowsCell(spot.r, spot.c)) {
          return false;
        }
        if (!classicAllowsDynamicCell(spot.r, spot.c)) {
          return false;
        }
        if (typeof rotation === "number") {
          return canPlaceDynamicShared(spot.r, spot.c, tile, rotation);
        }
        return true;
      });
    }

    function findFirstDynamicMarketIndex() {
      const tiles = currentPlacementTiles();
      for (let index = 0; index < tiles.length; index++) {
        const tile = tiles[index];
        for (let rotationIndex = 0; rotationIndex < 4; rotationIndex++) {
          const rotation = rotationIndex * 90;
          const spots = dynamicPlaceableSpots(tile, rotation);
          for (let i = 0; i < spots.length; i++) {
            if (canPlaceDynamicShared(spots[i].r, spots[i].c, tile, rotation)) {
              return index;
            }
          }
        }
      }
      return -1;
    }

    function findFirstBorderlessMarketIndex() {
      return findFirstDynamicMarketIndex();
    }

    function hasAnyDynamicMarketMove() {
      if (usesSharedMarket()) {
        refillSharedMarket();
      }
      return findFirstDynamicMarketIndex() >= 0;
    }

    function chooseBorderlessCpuMove() {
      const moves = [];
      currentPlacementTiles().forEach(function (tile, marketIndex) {
        [0, 90, 180, 270].forEach(function (rotation) {
          dynamicPlaceableSpots(tile, rotation).forEach(function (spot) {
            if (!canPlaceDynamicShared(spot.r, spot.c, tile, rotation)) {
              return;
            }
            moves.push({
              marketIndex: marketIndex,
              rotation: rotation,
              r: spot.r,
              c: spot.c,
              score: scoreBorderlessCpuMove(tile, rotation, spot.r, spot.c, marketIndex)
            });
          });
        });
      });
      if (moves.length === 0) {
        return null;
      }
      moves.sort(function (a, b) {
        return b.score - a.score;
      });
      return moves[0];
    }

    function dynamicScoringBoardForCandidate(tile, rotation, row, col) {
      const map = dynamicScoringBoard();
      map[blCellKey(row, col)] = {
        tile: cloneTile(tile),
        rotation: rotation
      };
      return map;
    }

    function countDynamicAdjacentTiles(row, col) {
      return [
        [-1, 0],
        [1, 0],
        [0, -1],
        [0, 1]
      ].filter(function (direction) {
        return Boolean((state.blBoard || {})[blCellKey(row + direction[0], col + direction[1])]);
      }).length;
    }

    function scoreBorderlessCpuMove(tile, rotation, row, col, marketIndex) {
      if (isLifeMode() && state.lifeCpuStrong) {
        return scoreStrongLifeCpuMove(tile, rotation, row, col, marketIndex);
      }
      if (isHarvestSeasonMode()) {
        const cfg = harvestSeasonConfig();
        const player = currentPlayer();
        const board = dynamicScoringBoardForCandidate(tile, rotation, row, col);
        const patterns = WiggleRules.detectClosedPatternsDynamic(board)
          .filter(function (pattern) {
            return state.blCompletedKeys.indexOf(pattern.key) === -1;
          });
        let score = countDynamicAdjacentTiles(row, col) * 2 + Math.random();
        patterns.forEach(function (pattern) {
          score += pattern.points <= 1 ? 10 : pattern.points * 24;
          if (cfg.seasonColors.indexOf(pattern.color) !== -1) {
            score += 14;
          }
          const neededSeeds = cfg.seasonPile.length - pattern.points;
          if (cfg.seasonPile.length >= cfg.jackpotMinSeasonPile
            && neededSeeds >= 0
            && player
            && neededSeeds <= (player.seedPile || []).length
            && cfg.seasonColors.indexOf(pattern.color) !== -1) {
            score += 90;
          }
        });
        return score;
      }
      const player = currentPlayer();
      const board = dynamicScoringBoardForCandidate(tile, rotation, row, col);
      const patterns = WiggleRules.detectClosedPatternsDynamic(board);
      return countDynamicAdjacentTiles(row, col) * 10
        + cpuPatternImpactScore(player, patterns, state.blCompletedKeys)
        + Math.random();
    }

    function lifeRecoveryRuleLabel(rule) {
      const value = rule || state.lifeRecoveryRule || "normal";
      if (value === "noDamageRecovery") {
        return "ダメージで置いたタイルでは回復できない";
      }
      if (value === "noOnePointRecovery") {
        return "1点模様では回復できない";
      }
      return "";
    }

    function lifeRecoveryInfo(pattern, lifeAfterPlace, fromDamagePlacement) {
      const blockedReason = lifeRecoveryRuleLabel(
        state.lifeRecoveryRule === "noDamageRecovery" && fromDamagePlacement
          ? "noDamageRecovery"
          : state.lifeRecoveryRule === "noOnePointRecovery" && pattern.points <= 1
            ? "noOnePointRecovery"
            : "normal"
      );
      if (blockedReason) {
        return {
          recoverable: 0,
          reason: blockedReason
        };
      }

      const lastLifePenalty = lifeAfterPlace === 0 ? 1 : 0;
      return {
        recoverable: Math.max(0, pattern.points - lastLifePenalty),
        reason: lastLifePenalty ? "最後の1枚補正" : ""
      };
    }

    function lifeHandSpace(player) {
      return Math.max(0, 8 - ((player && player.hand) ? player.hand.length : 0));
    }

    function lifeWoundPool() {
      state.lifeWounded = state.lifeWounded || [];
      return state.lifeWounded;
    }

    function normalizeLifeKoBans(player) {
      if (!player || !Array.isArray(player.lifeKoBans)) {
        if (player) {
          player.lifeKoBans = [];
        }
        return [];
      }
      player.lifeKoBans = player.lifeKoBans.filter(function (key, index, list) {
        return typeof key === "string" && key.length > 0 && list.indexOf(key) === index;
      });
      return player.lifeKoBans;
    }

    function lifeKoBanActiveFor(player, row, col) {
      return isLifeKoMode()
        && player
        && normalizeLifeKoBans(player).indexOf(blCellKey(row, col)) !== -1;
    }

    function addLifeKoBans(player, keys) {
      if (!isLifeKoMode() || !player || !Array.isArray(keys) || keys.length === 0) {
        return;
      }
      const bans = normalizeLifeKoBans(player);
      keys.forEach(function (key) {
        if (key && bans.indexOf(key) === -1) {
          bans.push(key);
        }
      });
    }

    function clearLifeKoBansAfterLegalPlacement(player, placedKey) {
      if (!isLifeKoMode() || !player) {
        return;
      }
      const bans = normalizeLifeKoBans(player);
      if (bans.length === 0 || bans.indexOf(placedKey) !== -1) {
        return;
      }
      player.lifeKoBans = [];
    }

    function lifeEditLockedCount(player) {
      if ((!isLifeEditMode() && !isLifeTurnDebtMode()) || !player || player.finished) {
        return 0;
      }
      player.lifeLocked = Math.max(0, Math.min(player.hand ? player.hand.length : 0, player.lifeLocked || 0));
      return player.lifeLocked;
    }

    function lifeRecordDamageSource(target, sourcePlayer, amount) {
      if (!target || !sourcePlayer || target.id === sourcePlayer.id || amount <= 0) {
        return;
      }
      target.lifeDamageSources = target.lifeDamageSources || {};
      const key = String(sourcePlayer.id);
      target.lifeDamageSources[key] = Math.max(0, (target.lifeDamageSources[key] || 0) + amount);
    }

    function lifeReduceDamageSources(player, amount) {
      if (!player || !player.lifeDamageSources || amount <= 0) {
        return;
      }
      let remaining = amount;
      while (remaining > 0) {
        const entries = Object.keys(player.lifeDamageSources)
          .map(function (id) {
            return { id: id, value: player.lifeDamageSources[id] || 0 };
          })
          .filter(function (entry) { return entry.value > 0; })
          .sort(function (a, b) { return b.value - a.value; });
        if (entries.length === 0) {
          break;
        }
        const top = entries[0];
        player.lifeDamageSources[top.id] = Math.max(0, top.value - 1);
        remaining--;
      }
    }

    function lifeCounterTarget(player) {
      if (!player || !player.lifeDamageSources) {
        return null;
      }
      const candidates = Object.keys(player.lifeDamageSources)
        .map(function (id) {
          const target = state.players[Number(id)];
          return {
            player: target,
            amount: player.lifeDamageSources[id] || 0
          };
        })
        .filter(function (entry) {
          return entry.player && !entry.player.finished && entry.amount > 0 && entry.player.id !== player.id;
        })
        .sort(function (a, b) {
          if (b.amount !== a.amount) { return b.amount - a.amount; }
          return (b.player.hand ? b.player.hand.length : 0) - (a.player.hand ? a.player.hand.length : 0);
        });
      return candidates.length ? candidates[0].player : null;
    }

    function lifePatternCellKeys(pattern) {
      const used = {};
      const keys = [];
      (pattern.cells || []).forEach(function (cell) {
        const key = blCellKey(cell.r, cell.c);
        if (used[key]) { return; }
        used[key] = true;
        keys.push(key);
      });
      return keys;
    }

    function lifeBoardRecoveryCandidates(action) {
      if (!action || action.boardRecovered || action.remaining < 2 || action.patternPoints <= 1) {
        return [];
      }
      const placedKey = action.placedKey || "";
      return (action.patternCellKeys || []).map(function (key) {
        const slot = (state.blBoard || {})[key];
        if (!slot || !slot.tile || slot.tile.start || key === placedKey) {
          return null;
        }
        return {
          key: key,
          tile: slot.tile
        };
      }).filter(Boolean);
    }

    function lifeRecoveryChoiceSummary(action) {
      const player = action ? state.players[action.playerId] : null;
      if (!player || player.finished || lifeHandSpace(player) <= 0 || action.remaining <= 0) {
        return { wounded: 0, board: [] };
      }
      return {
        wounded: action.remaining >= 1 ? lifeWoundPool().length : 0,
        board: lifeBoardRecoveryCandidates(action)
      };
    }

    function lifeRecoveryHasChoice(action) {
      const choices = lifeRecoveryChoiceSummary(action);
      return choices.wounded > 0 || choices.board.length > 0;
    }

    function enqueueLifeRecovery(player, pattern, sourcePlayer) {
      if (!player || player.finished || !pattern || pattern.points <= 0) { return; }
      state.lifeRecoveryQueue = state.lifeRecoveryQueue || [];
      state.lifeRecoveryQueue.push({
        type: "life-recover",
        playerId: player.id,
        sourcePlayerId: sourcePlayer ? sourcePlayer.id : player.id,
        returnAfterPlayerId: sourcePlayer ? sourcePlayer.id : player.id,
        remaining: pattern.points,
        total: pattern.points,
        patternKey: pattern.key,
        patternPoints: pattern.points,
        patternColor: pattern.color,
        patternCellKeys: lifePatternCellKeys(pattern),
        placedKey: state.lastPlacedCell && state.lastPlacedCell.borderless
          ? blCellKey(state.lastPlacedCell.row, state.lastPlacedCell.col)
          : "",
        boardRecovered: false
      });
    }

    function finishLifePendingAfterRecovery(action) {
      state.pendingAction = null;
      if (state.over) { return; }
      if (startNextLifeRecoveryAction(action.returnAfterPlayerId)) {
        render();
        return;
      }
      const source = state.players[action.returnAfterPlayerId];
      if (source && !source.finished) {
        state.currentPlayer = source.id;
        finishLifePlacement(source, null);
        return;
      }
      blAdvanceTurn();
      render();
    }

    function maybeFinishLifeRecoveryAction(action) {
      if (!action || action.remaining <= 0 || !lifeRecoveryHasChoice(action)) {
        finishLifePendingAfterRecovery(action);
        return true;
      }
      return false;
    }

    function selectLifeRecoveryWound(index) {
      const action = state.pendingAction;
      const player = action && state.players[action.playerId];
      if (!action || action.type !== "life-recover" || !player || player.finished || lifeHandSpace(player) <= 0) {
        return;
      }
      const wounded = lifeWoundPool();
      const tile = wounded[index];
      if (!tile || action.remaining < 1) {
        return;
      }
