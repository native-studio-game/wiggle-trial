      if (isPopjamMode() && state.discardPending > 0) {
        const target = discardPlayer();
        if (state.over || !state.started || !target || target.isCpu) {
          return;
        }
        discardHandTile(index);
        return;
      }

      if (state.pendingAction && state.pendingAction.type === "present") {
        togglePresentHandTile(index);
        return;
      }

      if (state.pendingAction && state.pendingAction.type === "collect") {
        if (isPopjamScoreMode() && index >= state.sharedMarket.length) {
          rememberMarketTileRotation();
          state.selectedHandIndex = index;
          state.selectedRotation = marketTileRotation(index);
          clearAllPlacementPreviews();
          clearMobilePlacementConfirm();
          clearRotationAnimation();
          render();
          return;
        }
        collectSelectedMarketTile(index);
        return;
      }

      if (state.pendingAction && state.pendingAction.type === "survival-gift") {
        giveSurvivalHandTile(index);
        return;
      }

      if (state.pendingAction && state.pendingAction.type === "life-lock-damage") {
        selectLifeLockDamageTile(index);
        return;
      }

      if (state.pendingAction && state.pendingAction.type === "life-wound-damage") {
        selectLifeWoundDamageTile(index);
        return;
      }

      if (state.over || !state.started || isCpuTurn()) {
        return;
      }

      if (hasPendingQuestionEffects() || (hasPendingAction() && state.pendingAction.type !== "life-damage")) {
        return;
      }

      const previousIndex = state.selectedHandIndex;
      if (usesSharedMarket()) {
        rememberMarketTileRotation();
        state.selectedHandIndex = index;
        if (previousIndex !== index) {
          clearAllPlacementPreviews();
          clearMobilePlacementConfirm();
          state.selectedRotation = marketTileRotation(index);
          clearRotationAnimation();
        }
        render();
        return;
      }

      state.selectedHandIndex = index;
      if (previousIndex !== index || isInnerQuestionTile(selectedPlacementTile())) {
        clearAllPlacementPreviews();
        clearMobilePlacementConfirm();
        state.selectedRotation = 0;
        clearRotationAnimation();
      }
      render();
    }

    function rotateSelected(delta) {
      if (state.over || !state.started || isCpuTurn() || hasPopjamWinDiscardShowcase()) {
        return false;
      }

      const actionPlacement = hasPendingAction()
        && (state.pendingAction.type === "salvage-place" || state.pendingAction.type === "replace-place");
      if ((hasPendingQuestionEffects() && !actionPlacement)
        || (hasPendingAction() && !actionPlacement && state.pendingAction.type !== "life-damage")) {
        return false;
      }

      const tile = actionPlacement
        ? state.pendingAction.tile
        : selectedPlacementTile();
      if (!tile) {
        return false;
      }

      const animKey = rotationAnimationKey();
      const fromRotation = currentSelectedRotation();
      const toRotation = fromRotation + delta;
      if (actionPlacement) {
        state.pendingAction.rotation = ((state.pendingAction.rotation || 0) + delta + 360) % 360;
      } else if (isInnerQuestionTile(selectedPlacementTile())) {
        state.selectedRotation = 0;
      } else {
        state.selectedRotation = (state.selectedRotation + delta + 360) % 360;
        rememberMarketTileRotation();
      }
      rotationAnimation = {
        key: animKey,
        previewKey: currentPlacementPreviewAnimationKey(),
        from: fromRotation,
        to: toRotation,
        at: Date.now()
      };
      render();
      return true;
    }

    function rotateSelectedByWheel(event, handIndex) {
      if (state.over || !state.started || isCpuTurn() || hasPopjamWinDiscardShowcase()) {
        return false;
      }

      const actionPlacement = hasPendingAction()
        && (state.pendingAction.type === "salvage-place" || state.pendingAction.type === "replace-place");
      if ((hasPendingQuestionEffects() && !actionPlacement)
        || (hasPendingAction() && !actionPlacement && state.pendingAction.type !== "life-damage")) {
        return false;
      }

      event.preventDefault();
      const now = Date.now();
      if (now - lastWheelRotateAt < 210) {
        return false;
      }
      lastWheelRotateAt = now;

      if (Number.isInteger(handIndex)) {
        if (state.selectedHandIndex !== handIndex) {
          rememberMarketTileRotation();
          state.selectedRotation = marketTileRotation(handIndex);
        }
        state.selectedHandIndex = handIndex;
      }

      return rotateSelected(event.deltaY >= 0 ? 90 : -90);
    }

    function normalizeRotation(rotation) {
      return ((rotation % 360) + 360) % 360;
    }

    function currentSelectedRotation() {
      if (hasPendingAction() && (state.pendingAction.type === "salvage-place" || state.pendingAction.type === "replace-place")) {
        return state.pendingAction.rotation || 0;
      }
      return state.selectedRotation || 0;
    }

    function rotationAnimationKey() {
      if (hasPendingAction() && (state.pendingAction.type === "salvage-place" || state.pendingAction.type === "replace-place")) {
        return state.pendingAction.type;
      }
      return "hand:" + String(state.selectedHandIndex);
    }

    function placementPreviewAnimationKey(row, col, dynamicBoard) {
      return "preview:" + (dynamicBoard ? "dynamic:" : "fixed:") + row + "," + col;
    }

    function currentPlacementPreviewAnimationKey() {
      const activeCell = activePlacementPreviewCell(isDynamicBoardMode());
      if (!activeCell) {
        return null;
      }
      return placementPreviewAnimationKey(activeCell.r, activeCell.c, isDynamicBoardMode());
    }

    function activePlacementPreviewCell(dynamicBoard) {
      const isDynamic = Boolean(dynamicBoard);
      const selectionKey = mobilePlacementSelectionKey();
      if (hoverCell) {
        return hoverCell;
      }
      if (mobilePlacementConfirm
        && mobilePlacementConfirm.dynamic === isDynamic
        && mobilePlacementConfirm.selectionKey === selectionKey) {
        return { r: mobilePlacementConfirm.row, c: mobilePlacementConfirm.col };
      }
      return null;
    }

    function mobilePlacementSelectionKey() {
      const tile = state.pendingAction && (state.pendingAction.type === "salvage-place" || state.pendingAction.type === "replace-place")
        ? state.pendingAction.tile
        : selectedPlacementTile();
      if (!tile) {
        return "";
      }
      const source = state.pendingAction ? state.pendingAction.type : "hand";
      return source + ":" + String(state.selectedHandIndex) + ":" + String(tile.id || tile.name || "");
    }

    function clearMobilePlacementConfirm() {
      mobilePlacementConfirm = null;
    }

    function clearAllPlacementPreviews(exceptNode) {
      const placementAssist = currentPlacementAssistMode();
      clearPlacementFeedback();
      document.querySelectorAll(".ghost-preview").forEach(function (ghost) {
        if (!exceptNode || !exceptNode.contains(ghost)) {
          ghost.remove();
        }
      });
      document.querySelectorAll(".ghost-legal, .ghost-illegal, .ghost-armed").forEach(function (cell) {
        if (!exceptNode || cell !== exceptNode) {
          cell.classList.remove("ghost-legal", "ghost-illegal", "ghost-armed");
          cell.removeAttribute("title");
        }
      });
      document.querySelectorAll(".bl-ghost").forEach(function (ghost) {
        if (!exceptNode || ghost !== exceptNode) {
          ghost.innerHTML = "";
          ghost.classList.remove("bl-ghost-armed");
          if (placementAssist !== "on") {
            ghost.classList.remove("bl-ghost-legal", "bl-ghost-illegal");
            ghost.removeAttribute("title");
          }
        }
      });
    }

    function isMobileInteractionMode() {
      return currentViewMode() === "mobile" || document.body.classList.contains("view-mobile");
    }

    function swipeRotationDelta(dx, dy) {
      const absX = Math.abs(dx);
      const absY = Math.abs(dy);
      if (Math.max(absX, absY) < 24) {
        return 0;
      }
      return absX >= absY
        ? (dx < 0 ? -90 : 90)
        : (dy < 0 ? -90 : 90);
    }

    function swipeGestureEndPoint(event, gesture) {
      const endX = Number.isFinite(event.clientX) && event.clientX !== 0
        ? event.clientX
        : gesture.lastX;
      const endY = Number.isFinite(event.clientY) && event.clientY !== 0
        ? event.clientY
        : gesture.lastY;
      return { x: endX, y: endY };
    }

    function releaseSwipePointer(event) {
      if (event.currentTarget && typeof event.currentTarget.releasePointerCapture === "function") {
        try { event.currentTarget.releasePointerCapture(event.pointerId); } catch (_) {}
      }
    }

    function completeSwipeRotate(gesture, event) {
      const point = swipeGestureEndPoint(event, gesture);
      const dx = point.x - gesture.x;
      const dy = point.y - gesture.y;
      const delta = swipeRotationDelta(dx, dy);
      if (!delta) {
        return false;
      }
      if (rotateSelected(delta)) {
        blSwipeSuppressClickUntil = Date.now() + 320;
        if (event.cancelable) {
          event.preventDefault();
        }
        return true;
      }
      return false;
    }

    function confirmOrArmMobilePlacement(row, col, dynamicBoard) {
      if (!isMobileInteractionMode() || isCpuTurn() || state.over || !state.started) {
        return true;
      }
      const selectionKey = mobilePlacementSelectionKey();
      const sameTarget = mobilePlacementConfirm
        && mobilePlacementConfirm.row === row
        && mobilePlacementConfirm.col === col
        && mobilePlacementConfirm.dynamic === Boolean(dynamicBoard)
        && mobilePlacementConfirm.selectionKey === selectionKey;
      if (sameTarget) {
        clearAllPlacementPreviews();
        clearMobilePlacementConfirm();
        return true;
      }
      clearAllPlacementPreviews();
      mobilePlacementConfirm = {
        row: row,
        col: col,
        dynamic: Boolean(dynamicBoard),
        selectionKey: selectionKey
      };
      hoverCell = { r: row, c: col };
      render();
      return false;
    }

    function clearRotationAnimation() {
      rotationAnimation = null;
    }

    function applyRotationStyle(img, rotation, key) {
      const normalized = normalizeRotation(rotation || 0);
      img.style.transform = "rotate(" + normalized + "deg)";
      const shouldAnimate = rotationAnimation && key
        && (rotationAnimation.key === key || rotationAnimation.previewKey === key)
        && Date.now() - rotationAnimation.at < 330;
      if (shouldAnimate) {
        img.style.setProperty("--rotate-from", rotationAnimation.from + "deg");
        img.style.setProperty("--rotate-to", rotationAnimation.to + "deg");
        img.classList.add("rotate-anim");
      }
    }

    function isKeyboardInputTarget(target) {
      if (!target) {
        return false;
      }
      const tag = String(target.tagName || "").toLowerCase();
      return tag === "input" || tag === "select" || tag === "textarea" || target.isContentEditable;
    }

    function rotateSelectedFromKeyboard(delta, event) {
      if (isKeyboardInputTarget(event.target)) {
        return false;
      }
      if (!elements.goalDialog.hidden
        || !elements.tacticsGoalDialog.hidden
        || !elements.settingsDialog.hidden
        || !elements.completionConfirmDialog.hidden) {
        return false;
      }
      return rotateSelected(delta);
    }

    function beginFixedBoardSwipeRotate(event) {
      if (!isMobileInteractionMode() || isDynamicBoardMode()) {
        return;
      }
      if (typeof event.button === "number" && event.button !== 0) {
        return;
      }
      if (event.pointerType === "mouse" && event.target.closest(".cell")) {
        return;
      }
      if (event.target.closest("button:not(.cell), select, input, textarea, a")) {
        return;
      }
      fixedBoardSwipeRotate = {
        pointerId: event.pointerId,
        x: event.clientX,
        y: event.clientY,
        lastX: event.clientX,
        lastY: event.clientY
      };
      if (event.currentTarget && typeof event.currentTarget.setPointerCapture === "function") {
        try { event.currentTarget.setPointerCapture(event.pointerId); } catch (_) {}
      }
    }

    function moveFixedBoardSwipeRotate(event) {
      if (!fixedBoardSwipeRotate || fixedBoardSwipeRotate.pointerId !== event.pointerId) {
        return;
      }
      fixedBoardSwipeRotate.lastX = event.clientX;
      fixedBoardSwipeRotate.lastY = event.clientY;
      if (completeSwipeRotate(fixedBoardSwipeRotate, event)) {
        releaseSwipePointer(event);
        fixedBoardSwipeRotate = null;
      }
    }

    function cancelFixedBoardSwipeRotate(event) {
      if (fixedBoardSwipeRotate && fixedBoardSwipeRotate.pointerId === event.pointerId) {
        releaseSwipePointer(event);
        fixedBoardSwipeRotate = null;
      }
    }

    function endFixedBoardSwipeRotate(event) {
      if (!fixedBoardSwipeRotate || fixedBoardSwipeRotate.pointerId !== event.pointerId) {
        return;
      }
      const gesture = fixedBoardSwipeRotate;
      releaseSwipePointer(event);
      fixedBoardSwipeRotate = null;
      completeSwipeRotate(gesture, event);
    }

    function ensureDefaultHandSelection() {
      const player = currentPlayer();
      if (!state.started || state.over || !player || player.isCpu) {
        return;
      }

      if (hasPendingQuestionEffects() || hasPendingAction()) {
        state.selectedHandIndex = null;
        state.selectedRotation = 0;
        return;
      }

      // ポップジャム放出中は配置用の選択をしない（クリック＝捨てる）
      if (isPopjamMode() && state.discardPending > 0) {
        state.selectedHandIndex = null;
        state.selectedRotation = 0;
        return;
      }

      if (isOpen7Mode()) {
        const currentTiles = currentPlacementTiles();
        if (state.selectedHandIndex !== null
          && state.selectedHandIndex < currentTiles.length
          && hasAnyLegalMoveForTile(currentTiles[state.selectedHandIndex])) {
          return;
        }
        const firstTileIndex = findFirstClassicMarketIndex();
        state.selectedHandIndex = firstTileIndex >= 0 ? firstTileIndex : null;
        if (state.selectedHandIndex === null) {
          state.selectedRotation = 0;
        }
        return;
      }

      if (usesSharedMarket()) {
        refillSharedMarket();
        if (isPopjamScoreMode()) {
          const currentTiles = currentPlacementTiles();
          if (state.selectedHandIndex !== null
            && state.selectedHandIndex < currentTiles.length
            && currentTiles[state.selectedHandIndex]
            && hasAnyLegalMoveForTile(currentTiles[state.selectedHandIndex])) {
            return;
          }
        }
        const firstMarketIndex = (isClassicSharedMode() || isPopjamScoreMode())
          ? findFirstClassicMarketIndex()
          : findFirstBorderlessMarketIndex();
        state.selectedHandIndex = firstMarketIndex >= 0 ? firstMarketIndex : null;
        state.selectedRotation = state.selectedHandIndex === null ? 0 : marketTileRotation(state.selectedHandIndex);
        return;
      }

      if (isTacticsMode()) {
        refillSharedMarket();
        const currentTiles = currentPlacementTiles();
        if (state.selectedHandIndex !== null
          && state.selectedHandIndex < currentTiles.length
          && hasAnyLegalMoveForTile(currentTiles[state.selectedHandIndex])) {
          return;
        }
        const firstTileIndex = findFirstClassicMarketIndex();
        state.selectedHandIndex = firstTileIndex >= 0 ? firstTileIndex : null;
        if (state.selectedHandIndex === null) {
          state.selectedRotation = 0;
        }
        return;
      }

      if (isDealSurvivalMode()) {
        const currentTiles = currentPlacementTiles();
        if (state.selectedHandIndex !== null
          && state.selectedHandIndex < currentTiles.length
          && hasAnyLegalMoveForTile(currentTiles[state.selectedHandIndex])) {
          return;
        }
        const firstTileIndex = findFirstClassicMarketIndex();
        state.selectedHandIndex = firstTileIndex >= 0 ? firstTileIndex : null;
        if (state.selectedHandIndex === null) {
          state.selectedRotation = 0;
        }
        return;
      }

      if (player.hand.length === 0) {
        state.selectedHandIndex = null;
        state.selectedRotation = 0;
        return;
      }

      if (player.hand.length === 1 || state.selectedHandIndex === null || state.selectedHandIndex >= player.hand.length) {
        state.selectedHandIndex = 0;
      }
    }

    function drawExtraTile() {
      if (state.over || !state.started || isCpuTurn() || state.deck.length === 0) {
        return;
      }

      if (hasPendingQuestionEffects() || hasPendingAction()) {
        return;
      }

      pushHistory();
      const tile = state.deck.shift();
      currentPlayer().hand.push(tile);
      ensureDefaultHandSelection();
      addLog(currentPlayer().name + " がテスト用に追加で1枚引きました。");
      render();
    }

    function applyCompletion() {
      if (state.over || !state.started) {
        return;
      }

      if (hasPendingQuestionEffects() || hasPendingAction()) {
        return;
      }

      const points = Math.max(1, Math.min(12, Number(elements.completionPoints.value) || 1));
      const color = state.selectedColor;

      pushHistory();
      state.scoreText = "";
      sendFallingTiles(color, points, "manual", state.lastPlacedCell);
      render();
    }

    function takeRandomHandTile(player) {
      if (!player || !player.hand || player.hand.length === 0) {
        return null;
      }
      const index = Math.floor(Math.random() * player.hand.length);
      return player.hand.splice(index, 1)[0] || null;
    }

    function deliverDealSurvivalTiles(color, points, source, scorer, targets) {
      const completingPlayer = currentPlayer();
      const targetRecords = (targets || [])
        .filter(function (target) {
          return target && target.player && !target.player.finished && target.player.id !== completingPlayer.id;
        })
        .map(function (target) {
          return {
            player: target.player,
            drawn: []
          };
        });

      if (!completingPlayer || targetRecords.length === 0) {
        if (scorer) {
          const scoreMessageOnly = scoreLabel(scorer, color, points);
          state.scoreText = state.scoreText ? state.scoreText + " / " + scoreMessageOnly : scoreMessageOnly;
          scheduleToastHide();
        }
        return;
      }

      let totalSent = 0;
      for (let i = 0; i < points; i++) {
        targetRecords.forEach(function (record) {
          const tile = takeRandomHandTile(completingPlayer);
          if (!tile) {
            return;
          }
          record.drawn.push(tile);
          record.player.hand.push(tile);
          record.player.received++;
          completingPlayer.sent++;
          totalSent++;
        });
        if (!completingPlayer.hand || completingPlayer.hand.length === 0) {
          break;
        }
      }

      targetRecords.forEach(function (record) {
        if (record.drawn.length > 0) {
          queueDealAnimation(record.player.id, record.drawn.length, color, {
            sourcePlayerId: completingPlayer.id
          });
        }
      });

      state.stats.sentTiles += totalSent;
      const prefix = source === "auto" ? "自動判定: " : "";
      const deliveries = targetRecords.map(function (record) {
        return record.player.name + " +" + record.drawn.length + "枚";
      });
      const deliveryText = deliveries.join(" / ");
      const scoreMessage = deliveryText;
      state.scoreText = state.scoreText ? state.scoreText + " / " + scoreMessage : scoreMessage;
      state.scoreToastHtml = dealSurvivalDeliveryToastHtml(targetRecords);
      state.scoreToastText = state.scoreText;
      scheduleToastHide();

      addLog(prefix + completingPlayer.name + " が" + colorNames[color] + points + "点を完成。"
        + deliveryText + " をランダムに渡しました。");
    }

    function sendFallingTiles(color, points, source, origin) {
      const completingPlayer = currentPlayer();
      const scorer = ownerForColor(color);
      const handDonor = isHandSurvivalMode() ? completingPlayer : scorer;
      const targets = getSurvivalTargets(color, scorer);
      const hasConsequence = Boolean(scorer) || targets.length > 0;

      if (scorer) {
        scorer.completed++;
        scorer.score += points;
        scorer.maxPattern = Math.max(scorer.maxPattern || 0, points);
        awardRogueXp(scorer, points);
      } else {
        addLog(colorNames[color] + "の担当プレイヤーがいないため、得点は入りません。");
      }

      state.stats.completions++;
      if (origin && Array.isArray(origin.cells) && origin.cells.length > 0) {
        queueCompletionVisual(origin, { color: color, points: points, marker: hasConsequence });
      }

      if (targets.length === 0) {
        if (scorer) {
          const scoreMessageOnly = scoreLabel(scorer, color, points);
          state.scoreText = state.scoreText ? state.scoreText + " / " + scoreMessageOnly : scoreMessageOnly;
          scheduleToastHide();
        }
        return;
      }

      // 各ターゲットがそれぞれ points 枚を受け取る。
      // サバイバルで山札が足りない時は、不足分だけ完成者の手札から選んで渡せる。
      const records = targets.map(function (target) {
        return {
          player: target.player,
          drawn: [],
          missing: 0,
          fromHand: 0
        };
      });
      let totalMissing = 0;

      records.forEach(function (record) {
        for (let i = 0; i < points; i++) {
          if (state.deck.length === 0) {
            break;
          }
          record.drawn.push(state.deck.shift());
        }
        record.missing = Math.max(0, points - record.drawn.length);
        totalMissing += record.missing;
      });

      let handFallbackTotal = 0;
      let handChoiceTotal = 0;
      if (totalMissing > 0 && isHandSurvivalMode() && handDonor && handDonor.hand.length > 0) {
        if (isDealSurvivalMode() || handDonor.isCpu) {
          const missingRecords = records.filter(function (record) {
            return record.missing > 0;
          });
          let cursor = 0;
          while (handDonor.hand.length > 0 && missingRecords.some(function (record) {
            return record.fromHand < record.missing;
          })) {
            const record = missingRecords[cursor % missingRecords.length];
            cursor++;
            if (record.fromHand >= record.missing) {
              continue;
            }
            const fallbackTile = isDealSurvivalMode() ? takeRandomHandTile(handDonor) : handDonor.hand.shift();
            if (!fallbackTile) {
              break;
            }
            record.drawn.push(fallbackTile);
            record.fromHand++;
            handFallbackTotal++;
          }
        } else {
          handChoiceTotal = queueSurvivalGiftChoice(handDonor, records, totalMissing, color);
        }
      }

      const deliveries = [];
      records.forEach(function (record) {
        record.player.pending = record.player.pending.concat(record.drawn);
        record.player.received += record.drawn.length;
        if (handDonor) {
          handDonor.sent += record.drawn.length;
        }
        state.stats.sentTiles += record.drawn.length;

        if (record.drawn.length > 0) {
          queueDealAnimation(record.player.id, record.drawn.length, color);
        }
        deliveries.push(record.player.name + "に" + record.drawn.length + "枚"
          + (record.fromHand > 0 ? "（手札から" + record.fromHand + "枚）" : ""));
      });

      const prefix = source === "auto" ? "自動判定: " : "";
      const deliveryText = deliveries.join(" / ");
      const handChoiceText = handChoiceTotal > 0
        ? " / 不足" + handChoiceTotal + "枚を手札から選択"
        : "";
      const scoreMessage = isDealSurvivalMode()
        ? deliveryText
        : (scorer ? scoreLabel(scorer, color, points) : colorNames[color] + points + "点")
          + " → " + deliveryText + handChoiceText;
      state.scoreText = state.scoreText ? state.scoreText + " / " + scoreMessage : scoreMessage;
      if (isDealSurvivalMode()) {
        state.scoreToastHtml = dealSurvivalDeliveryToastHtml(records);
        state.scoreToastText = state.scoreText;
      }
      scheduleToastHide();

      addLog(prefix + currentPlayer().name + " が" + colorNames[color] + points + "点を完成。"
        + (scorer
          ? scorer.name + " の得点。"
          : "担当プレイヤーなし。")
        + deliveryText + " 降らせます。"
        + (handFallbackTotal > 0 ? " 山札不足分は手札から渡しました。" : "")
        + (handChoiceTotal > 0 ? " 山札不足分は手札から選んで渡します。" : ""));
    }

    function queuedSurvivalGiftCount(playerId) {
      return state.pendingAction
        && state.pendingAction.type === "survival-gift"
        && state.pendingAction.playerId === playerId
        ? state.pendingAction.remaining || 0
        : 0;
    }

    function queueSurvivalGiftChoice(scorer, targetRecords, missingCount, color) {
      if (!isHandSurvivalMode() || !scorer || scorer.isCpu || missingCount <= 0) {
        return 0;
      }

      const available = Math.max(0, scorer.hand.length - queuedSurvivalGiftCount(scorer.id));
      const queuedCount = Math.min(missingCount, available);
      if (queuedCount <= 0) {
        return 0;
      }

      const targetNeeds = {};
      let assignable = queuedCount;
      (targetRecords || []).forEach(function (record) {
        if (!record || !record.player || record.player.id === scorer.id || assignable <= 0) {
          return;
        }
        const need = Math.min(record.missing || 0, assignable);
        if (need <= 0) {
          return;
        }
        const id = String(record.player.id);
        targetNeeds[id] = (targetNeeds[id] || 0) + need;
        assignable -= need;
      });

      const targetIds = Object.keys(targetNeeds).map(function (id) {
        return Number(id);
      });
      if (targetIds.length === 0) {
        return 0;
      }

      if (state.pendingAction && state.pendingAction.type === "survival-gift") {
        const action = state.pendingAction;
        action.targetNeeds = action.targetNeeds || {};
        targetIds.forEach(function (id) {
          if (action.targetIds.indexOf(id) === -1) {
            action.targetIds.push(id);
          }
          action.targetNeeds[String(id)] = (action.targetNeeds[String(id)] || 0) + (targetNeeds[String(id)] || 0);
        });
        action.remaining += queuedCount;
        action.total += queuedCount;
        action.color = color;
        if (action.targetIds.indexOf(action.selectedTargetId) === -1 || (action.targetNeeds[String(action.selectedTargetId)] || 0) <= 0) {
          action.selectedTargetId = action.targetIds.find(function (id) {
            return (action.targetNeeds[String(id)] || 0) > 0;
          }) || action.targetIds[0];
        }
      } else {
        state.pendingAction = {
          type: "survival-gift",
          playerId: scorer.id,
          targetIds: targetIds,
          selectedTargetId: targetIds[0],
          targetNeeds: targetNeeds,
          remaining: queuedCount,
          total: queuedCount,
          color: color
        };
      }

      state.scoreText = scorer.name + " は山札不足分として、渡すタイルと相手を選びます。残り"
        + state.pendingAction.remaining + "枚。";
      scheduleToastHide();
      return queuedCount;
    }

    function selectSurvivalGiftTarget(playerId) {
      const action = state.pendingAction;
      if (!action || action.type !== "survival-gift" || action.targetIds.indexOf(playerId) === -1) {
        return;
      }
      if (action.targetNeeds && (action.targetNeeds[String(playerId)] || 0) <= 0) {
        return;
      }
      action.selectedTargetId = playerId;
      render();
    }

    function giveSurvivalHandTile(index) {
      const action = state.pendingAction;
      if (!action || action.type !== "survival-gift") {
        return;
      }

      const player = state.players.find(function (candidate) {
        return candidate.id === action.playerId;
      });
      const target = state.players.find(function (candidate) {
        return candidate.id === action.selectedTargetId && candidate.id !== action.playerId;
      });
      if (!player || player.id !== currentPlayer().id || player.isCpu || !target || action.remaining <= 0) {
        return;
      }
      if (action.targetNeeds && (action.targetNeeds[String(target.id)] || 0) <= 0) {
        return;
      }

      const tile = player.hand[index];
      if (!tile) {
        return;
      }

      pushHistory();
      const sourceElement = document.querySelector("[data-market-index=\"" + index + "\"]");
      player.hand.splice(index, 1);
      target.pending.push(tile);
      target.received++;
      player.sent++;
      state.stats.sentTiles++;
      action.remaining = Math.max(0, action.remaining - 1);
      if (action.targetNeeds) {
        action.targetNeeds[String(target.id)] = Math.max(0, (action.targetNeeds[String(target.id)] || 0) - 1);
      }
      queueRiverAnimation(sourceElement, target.id, tile, { slow: true });

      addLog(player.name + " が山札不足分として " + target.name + " に " + tile.name + " を渡しました。");

      if (action.remaining <= 0 || player.hand.length === 0) {
        state.pendingAction = null;
        state.scoreText = player.name + " は手札から渡し終えました。";
        if (player.hand.length === 0) {
          scheduleAutoEndTurn(player.id);
        }
      } else {
        if (action.targetNeeds && (action.targetNeeds[String(action.selectedTargetId)] || 0) <= 0) {
          action.selectedTargetId = action.targetIds.find(function (id) {
            return (action.targetNeeds[String(id)] || 0) > 0;
          }) || action.selectedTargetId;
        }
        state.scoreText = "渡すタイルと相手を選んでください。残り" + action.remaining + "枚。";
      }
      scheduleToastHide();
      render();
    }

    function awardRogueXp(player, points) {
      if (!isRoguelikeMode() || !player) {
        return;
      }
      player.rogueXp = (player.rogueXp || 0) + Math.max(1, points || 1);
      player.rogueNextXp = player.rogueNextXp || 5;
      while (player.rogueXp >= player.rogueNextXp) {
        player.rogueXp -= player.rogueNextXp;
        player.rogueLevel = (player.rogueLevel || 1) + 1;
        player.rogueNextXp += 2;
        addLog(player.name + " がLv" + player.rogueLevel + "になりました。");
      }
    }

    function queueDealAnimation(targetPlayerId, count, color, options) {
      if (!isDealSurvivalMode()) {
        return;
      }
      dealAnimationQueue.push({
        mode: state.mode,
        targetPlayerId: targetPlayerId,
        count: count,
        color: color,
        sourcePlayerId: options && Number.isInteger(options.sourcePlayerId) ? options.sourcePlayerId : null
      });
    }

    function queueSharedMarketDealAnimation(marketIndex, tile) {
      if (!isDealSurvivalMode()) {
        return;
      }
      dealAnimationQueue.push({
        mode: state.mode,
        marketIndex: marketIndex,
        count: 1,
        tileSrc: displayTileSrc(tile, { forceFace: true })
      });
    }

    function queueRiverAnimation(sourceElement, targetPlayerId, tile, options) {
      if (!isDealSurvivalMode()) {
        return;
      }
      let fromRect = null;
      if (sourceElement && typeof sourceElement.getBoundingClientRect === "function") {
        const rect = sourceElement.getBoundingClientRect();
        fromRect = {
          left: rect.left,
          top: rect.top,
          width: rect.width,
          height: rect.height
        };
      }

      riverAnimationQueue.push({
        fromRect: fromRect,
        targetPlayerId: targetPlayerId,
        tile: tile,
        delayMs: options && Number.isFinite(options.delayMs) ? options.delayMs : 0,
        slow: Boolean(options && options.slow)
      });
    }

    let scoreToastTimer = null;

    function scheduleToastHide() {
      if (scoreToastTimer) {
        clearTimeout(scoreToastTimer);
      }
      scoreToastTimer = setTimeout(function () {
        state.scoreText = "";
        render();
      }, 3200);
    }

    function expireScoreEffect(effectId, delay) {
      setTimeout(function () {
        const before = state.scoreEffects.length;
        state.scoreEffects = state.scoreEffects.filter(function (effect) {
          return effect.id !== effectId;
        });
        if (state.scoreEffects.length !== before) {
          render();
        }
      }, delay);
    }

    function playCompletionFlashes() {
      if (completionFlashQueue.length === 0) {
        return;
      }

      // キューは必ず消費する（演出オフでも次の描画に持ち越さない）
      const queue = completionFlashQueue.splice(0);
      if (!PATTERN_GLOW.scorePulse) {
        return;
      }
      queue.forEach(function (item) {
        const size = state.board.length || fixedBoardSize();
        item.cells.forEach(function (pos) {
          const cell = item.borderless
            ? document.querySelector("[data-bl-cell=\"" + pos.r + "," + pos.c + "\"]")
            : elements.board.children[pos.r * size + pos.c];
          if (!cell) {
            return;
          }
          cell.dataset.flashColor = item.color;
          cell.classList.remove("completion-flash");
          void cell.offsetWidth;
          cell.classList.add("completion-flash");
          setTimeout(function () {
            cell.classList.remove("completion-flash");
          }, 950);
        });
      });
    }

    function getSurvivalTargets(color, scorer) {
      const player = scorer || currentPlayer();

      // サバイバル: 担当色あり。自色完成なら他全員へ、他色完成ならその担当者へ渡す。
      if (isHandSurvivalMode()) {
        const completingPlayer = currentPlayer();
        const owner = ownerForColor(color);
        if (!owner || !completingPlayer || state.players.length <= 1) {
          return [];
        }

        if (owner.id === completingPlayer.id) {
          return state.players
            .filter(function (candidate) {
              return candidate.id !== owner.id && (!isDealSurvivalMode() || !candidate.finished);
            })
            .map(function (candidate) {
              return { player: candidate, reason: "自色完成" };
            });
        }

        if (isDealSurvivalMode() && owner.finished) {
          return [];
        }

        return [{ player: owner, reason: "他色完成" }];
      }

      const owner = scorer || ownerForColor(color);
      // ローグライク等: 完成した模様の色を担当するプレイヤーの得点として扱い、その相手へ降らせる
      if (owner) {
        return state.players
          .filter(function (candidate) {
            return candidate.id !== owner.id;
          })
          .map(function (candidate) {
            return { player: candidate, reason: "押し返し(全員)" };
          });
      }

      // 2人戦の中立色 → 相手へ
      if (state.playerCount === 2 && color === state.neutralColor) {
        const other = state.players.find(function (candidate) {
          return candidate.id !== player.id;
        });
        return other ? [{ player: other, reason: "中立色" }] : [];
      }

      return [];
    }

    function endTurn() {
      if (state.over || !state.started) {
        return;
      }

      if (hasPendingQuestionEffects() || hasPendingAction()) {
        const pendingLabel = state.pendingAction && state.pendingAction.type === "survival-gift"
          ? "手札から渡す処理"
          : "ハテナ効果";
        addLog(currentPlayer().name + " は" + pendingLabel + "の処理中です。");
        render();
        return;
      }

      if (isDynamicBoardMode()) {
        pushHistory();
        const player = currentPlayer();
        if (isHarvestSeasonMode()) {
          addLog(player.name + " がパスしました。");
          blAdvanceTurn();
          render();
          return;
        }
        if (isLifeMode()) {
          addLog(player.name + " はライフモードではパスできません。1枚置いてください。");
          render();
          return;
        }
        if (isHarvestMode()) {
          addLog(player.name + " が手番を終了しました。");
          blAdvanceTurn();
          render();
          return;
        }
        state.passStreak = (state.passStreak || 0) + 1;
        addLog(player.name + " がパスしました。");
        blAdvanceTurn();
        render();
        return;
      }

      const player = currentPlayer();

      if (isPopjamMode()) {
        if (state.discardPending > 0) {
          addLog(player.name + " はまだ捨て札へ移す手札が残っています。");
          render();
          return;
        }
      } else if (player.hand.length > 0) {
        addLog(player.name + " はまだ手札にタイルが残っています。");
        render();
        return;
      }

      pushHistory();
      advanceTurn();
      render();
    }

    function scheduleAutoEndTurn(playerId) {
      setTimeout(function () {
        const player = currentPlayer();
        if (!state.started || state.over || !player || player.id !== playerId || player.hand.length > 0) {
          return;
        }

        endTurn();
      }, 360);
    }

    function hasAnyLegalMove(player) {
      if (!player) {
        return false;
      }

      const tiles = isOpen7Mode()
        ? state.sharedMarket
        : isTacticsMode() ? state.sharedMarket.concat(player.hand) : (usesSharedMarket() ? state.sharedMarket : player.hand);
      if (availableTileCount(tiles) === 0) {
        return false;
      }

      const size = state.board.length || fixedBoardSize();
      for (let row = 0; row < size; row++) {
        for (let col = 0; col < size; col++) {
          const canPlaceAnyTile = tiles.some(function (tile) {
            if (!tile) {
              return false;
            }
            return [0, 90, 180, 270].some(function (rotation) {
              return canPlaceTileAt(row, col, tile, rotation);
            });
          });

          if (canPlaceAnyTile) {
            return true;
          }
        }
      }

      return false;
    }

    function isCpuTurn() {
      const player = currentPlayer();
      return Boolean(state.started && !state.over && player && player.isCpu);
    }

    function cpuThinkDelayMs() {
      return 760 + Math.floor(Math.random() * 540);
    }

    function scheduleCpuTurn() {
      if (!isCpuTurn() || state.cpuThinking || hasPopjamWinDiscardShowcase()) {
        return;
      }
      if (state.discardPending > 0 || hasPendingQuestionEffects() || hasPendingAction()) {
        return;
      }

      state.cpuThinking = true;
      renderStatus(); // 「考え中」バッジを即時反映
      renderPlayers();
      setTimeout(runCpuTurnStep, cpuThinkDelayMs());
    }

    function runCpuTurnStep() {
      state.cpuThinking = false;
      if (!isCpuTurn()) {
        return;
      }
      if (state.discardPending > 0 || hasPendingQuestionEffects() || hasPendingAction()) {
        return;
      }

      const player = currentPlayer();
      if (isDealSurvivalMode()) {
        if (player && player.hand.length > 0 && !hasAnyLegalMove(player)) {
          declareLose();
          return;
        }
      }

      if (!usesSharedMarket() && !isTacticsMode() && !isOpen7Mode() && player.hand.length === 0) {
        endTurn();
        return;
      }

      const move = chooseCpuMove(player);
      if (!move) {
        if (isClassicSharedMode()) {
          finishClassicByScore("置ける共有札がありません。");
          render();
          return;
        }
        if (isOpen7Mode()) {
          finishClassicByScore("置ける外周タイルがありません。");
          render();
          return;
        }
        if (isTacticsMode()) {
          finishClassicByScore("置ける共有札・自色タイルがありません。");
          render();
          return;
        }
        if (isPopjamMode()) {
          // 置けない時はパス（beginTurn 側でも判定するが保険）
          state.passStreak = (state.passStreak || 0) + 1;
          addLog(player.name + " は置ける場所がなくパスしました。");
          if (state.passStreak >= state.players.length) {
            if (isPopjamScoreMode()) {
              finishPopjamByScore("全員が置ける場所なしでパスしました。");
            } else {
              finishPopjamByHandCount();
            }
            render();
            return;
          }
          advanceTurn();
          render();
          return;
        }
        declareLose();
        return;
      }

      state.selectedHandIndex = move.handIndex;
      state.selectedRotation = move.rotation;
      placeSelectedTile(move.row, move.col);
    }

    function chooseCpuMove(player) {
      const moves = [];
      const tiles = isOpen7Mode()
        ? state.sharedMarket
        : (isTacticsMode() || isPopjamScoreMode()) ? state.sharedMarket.concat(player.hand) : (usesSharedMarket() ? state.sharedMarket : player.hand);
      const size = state.board.length || fixedBoardSize();

      tiles.forEach(function (tile, handIndex) {
        if (!tile) {
          return;
        }
        [0, 90, 180, 270].forEach(function (rotation) {
          for (let row = 0; row < size; row++) {
            for (let col = 0; col < size; col++) {
              if (state.board[row][col]) {
                continue;
              }

              if (!canPlaceTileAt(row, col, tile, rotation)) {
                continue;
              }

              moves.push({
                handIndex: handIndex,
                rotation: rotation,
                row: row,
                col: col,
                score: scoreCpuMove(row, col, tile, rotation, player) + Math.random()
              });
            }
          }
        });
      });

      if (moves.length === 0) {
        return null;
      }

      moves.sort(function (a, b) {
        return b.score - a.score;
      });

      return moves[0];
    }

    function cpuPatternImpactScore(player, patterns, completedKeys) {
      const existing = completedKeys || [];
      let ownPoints = 0;
      let opponentPoints = 0;
      let neutralPoints = 0;
      (patterns || []).forEach(function (pattern) {
        if (!pattern || existing.indexOf(pattern.key) !== -1) {
          return;
        }
        const owner = ownerForColor(pattern.color);
        if (owner && player && owner.id === player.id) {
          ownPoints += pattern.points;
        } else if (owner) {
          opponentPoints += pattern.points;
        } else {
          neutralPoints += pattern.points;
        }
      });

      let score = ownPoints * 130 - opponentPoints * 180 + neutralPoints * 8;
      if (ownPoints > 0) {
        score += 90;
      }
      if (opponentPoints > 0 && ownPoints === 0) {
        score -= 320 + opponentPoints * 70;
      }
      return score;
    }

    function fixedCpuPatternImpact(tile, rotation, row, col, player) {
      const previousCell = state.board[row][col];
      state.board[row][col] = {
        tile: cloneTile(tile),
        rotation: rotation
      };
      try {
        return cpuPatternImpactScore(player, detectCompletedPatterns(), state.completedKeys);
      } finally {
        state.board[row][col] = previousCell;
      }
    }

    function scoreCpuMove(row, col, tile, rotation, player) {
      const center = fixedBoardCenter();
      const centerDistance = Math.abs(row - center) + Math.abs(col - center);
      return countAdjacentTiles(row, col) * 12
        - centerDistance * 2
        + fixedCpuPatternImpact(tile, rotation, row, col, player);
    }

    function countAdjacentTiles(row, col) {
      return [
        [-1, 0],
        [1, 0],
        [0, -1],
        [0, 1]
      ].filter(function (direction) {
        const nextRow = row + direction[0];
        const nextCol = col + direction[1];
        return hasPlacedTile(nextRow, nextCol);
      }).length;
    }

    function confirmThen(message, onYes, onNo) {
      inlineConfirm = { message: message, onYes: onYes, onNo: onNo || null };
      render();
    }

    function flashInstructionNote(message, ms) {
      instructionFlash = { message: message };
      render();
      setTimeout(function () {
        if (instructionFlash && instructionFlash.message === message) {
          instructionFlash = null;
          render();
        }
      }, ms || 1600);

    function cleanupInlineConfirm() {
      if (inlineConfirm && (state.over || !state.started || isCpuTurn())) {
        inlineConfirm = null;
      }
    }

    function resolveInlineConfirm(accepted) {
      const pending = inlineConfirm;
      inlineConfirm = null;
      if (pending) {
        if (accepted) {
          pending.onYes();
        } else if (pending.onNo) {
          pending.onNo();
        }
      }
      render();
    }

    function renderInlineConfirmPanel(confirmState) {
      const panel = document.createElement("div");
      panel.className = "inline-confirm-panel";
      const title = document.createElement("strong");
      title.textContent = confirmState.message;
      panel.appendChild(title);
      const actions = document.createElement("div");
      actions.className = "inline-confirm-actions";
      const no = document.createElement("button");
      no.type = "button";
      no.textContent = "いいえ";
      no.addEventListener("click", function () {
        resolveInlineConfirm(false);
      });
      const yes = document.createElement("button");
      yes.type = "button";
      yes.className = "inline-confirm-yes";
      yes.textContent = "はい";
      yes.addEventListener("click", function () {
        resolveInlineConfirm(true);
      });
      actions.appendChild(yes);
      actions.appendChild(no);
      panel.appendChild(actions);
      return panel;
    }

    function openTurnConfirm(action) {
      pendingConfirmAction = action || "complete";
      if (!elements.completionConfirmDialog) {
        if (pendingConfirmAction === "pass") {
          endTurn();
        } else {
          declareLose({ confirmed: true });
        }
        return;
      }
      if (elements.completionConfirmTitle) {

          ? "パスしますか？"

      }
      if (elements.completionConfirmNote) {

          ? "※この手番を終了します。"
          : "※以降手番が回ってこなくなります。";

      if (elements.confirmCompletionYes) {

      }

      openTurnConfirm("complete");

      openTurnConfirm("pass");

    function handleDeclareButton() {
      if (isHarvestSeasonMode()) {
        finishHarvestSeasonPlacement();
        return;
      }
      if (isHarvestMode()) {
        exchangeHarvestHand();
        return;
      }
      if (isLifeMode()) {
        addLog(currentPlayer().name + " はライフモードでは完成宣言できません。1枚置いてください。");
        render();
        return;
      }
      if (isDynamicBoardMode() && !isDynamicPopjamMode()) {
        openCompletionConfirm();
        return;
      }
      if (isTacticsMode()) {
        openCompletionConfirm();
        return;
      }
      declareLose();
    }

    function confirmTurnDeclaration() {
      const action = pendingConfirmAction;
      closeCompletionConfirm();
      if (action === "pass") {
        endTurn();
      } else {
        declareLose({ confirmed: true });
      }
    }

    function declareLose(options) {
      if (state.over || !state.started) {
        return;
      }

      if (movePendingSalvageTileToOwnRiver()) {
        render();
        return;
      }

      // ポップジャムではこのボタンは「パス」。完成宣言や敗北宣言にはしない。
      if (isPopjamMode()) {
        trackFirstAction("pass", { turn: state.turn });
        pushHistory();
        state.passStreak = (state.passStreak || 0) + 1;
        addLog(currentPlayer().name + " がパスしました。");
        if (state.passStreak >= state.players.length) {
          if (isPopjamScoreMode()) {
            finishPopjamByScore("全員がパスしました。");
          } else {
            finishPopjamByHandCount();
          }
          render();
          return;
        }
        if (isDynamicBoardMode()) {
          blAdvanceTurn();
        } else {
          advanceTurn();
        }
        render();
        return;
      }

      if (isTacticsMode()) {
        if (!options || !options.confirmed) {
          openCompletionConfirm();
          return;
        }
        trackFirstAction("complete_declare", { turn: state.turn });
        pushHistory();
        const player = currentPlayer();
        player.finished = true;
        state.selectedHandIndex = null;
        state.selectedRotation = 0;
        addLog(player.name + " が完成しました。以後このプレイヤーには手番が回りません。");
        if (activeDynamicPlayers().length === 0) {
          finishClassicByScore("全員が完成しました。");
        } else {
          const nextIndex = nextActiveDynamicPlayerIndex(state.currentPlayer);
          if (nextIndex < 0) {
            finishClassicByScore("全員が完成しました。");
          } else {
            state.currentPlayer = nextIndex;
            state.turn++;
            beginTurn();
            trackTurnMilestone();
          }
        }
        render();
        return;
      }

      if (isDynamicBoardMode()) {
        if (isLifeMode()) {
          addLog(currentPlayer().name + " はライフモードでは完成宣言できません。1枚置いてください。");
          render();
          return;
        }
        if (!options || !options.confirmed) {
          openCompletionConfirm();
          return;
        }
        trackFirstAction("complete_declare", { turn: state.turn });
        pushHistory();
        const player = currentPlayer();
        player.finished = true;
        state.selectedHandIndex = null;
        state.selectedRotation = 0;
        addLog(player.name + " が完成しました。以後このプレイヤーには手番が回りません。");
        const endReason = dynamicEndReason();
        if (endReason) {
          finishDynamicByScore(endReason);
        } else {
          blAdvanceTurn();
        }
        render();
        return;
      }

      if (isDealSurvivalMode() && hasAnyLegalMove(currentPlayer())) {
        addLog(currentPlayer().name + " はまだ置けるタイルがあります。");
        render();
        return;
      }

      pushHistory();
      trackFirstAction("unable_to_place", { turn: state.turn });
      state.over = true;
      state.survivalLoserId = currentPlayer().id;
      state.stats.endedAt = Date.now();
      addLog(currentPlayer().name + " が置けなくなりました。");
      trackFinishOnce("置けなくなりました。", "survival_unable_to_place");
      render();
    }

    function finishSharedWin() {
      state.over = true;
      state.stats.endedAt = Date.now();
      addLog("5x5の盤面がすべて埋まりました。全員勝利です。");
      trackFinishOnce("5x5の盤面がすべて埋まりました。", "shared_win");

    function finishClassicByScore(reason) {
      state.over = true;
      state.stats.endedAt = Date.now();
      state.blAllPlacedWin = false;
      applyClassicBonusUnfinishedScores();
      const best = state.players.reduce(function (max, player) {
        return Math.max(max, player.score);
      }, -Infinity);
      state.popjamWinners = state.players
        .filter(function (player) {
          return player.score === best;
        })
        .map(function (player) {
          return player.id;
        });
      state.winnerId = state.popjamWinners.length === 1 ? state.popjamWinners[0] : null;
      addLog((reason || "クラシック終了。") + " 得点で勝敗を判定します。");
      trackFinishOnce(reason || "クラシック終了。", state.winnerId === null ? "draw_or_multi_win" : "score_win");
    }

    function copySummary() {
      const summary = buildSummary();
      if (navigator.clipboard) {
        navigator.clipboard.writeText(summary).then(function () {
          addLog("テスト結果をコピーしました。");
          render();

    function buildSummary() {
      const minutes = state.stats.startedAt
        ? Math.max(1, Math.round(((state.stats.endedAt || Date.now()) - state.stats.startedAt) / 60000))
        : 0;

      const lines = [
        "Wiggle サバイバル プレイメモ",
        "人数: " + state.playerCount,
        "手番: " + state.turn,
        "経過: 約" + minutes + "分",
        "盤面: " + countPlacedTiles() + "/" + fixedBoardArea(),
        "完成処理: " + state.stats.completions + "回",
        "降ったタイル: " + state.stats.sentTiles + "枚",
        "山札残り: " + state.deck.length
      ];

      state.players.forEach(function (player) {
        lines.push(player.name + "(" + colorNames[player.color] + ") 受け取り:"
          + player.received + " 送った:" + player.sent + " 未処理:" + player.pending.length + " 手札:" + player.hand.length);
      });

      return lines.join("\n");
    }

    function getPlayerOutcome(index) {
      if (!state.started || !state.over) {
        return "";
      }

      if (isDrawResult()) {
        return "";
      }

      if (isClassicSharedMode() || state.mode === "borderless" || isOpen7Mode() || isTacticsMode() || isPopjamMode() || isLifeMode() || isHarvestMode() || isHarvestSeasonMode()) {
        const player = state.players[index];
        if (!player) {
          return "";
        }
        if (state.winnerId !== null && state.winnerId !== undefined) {
          return player.id === state.winnerId ? "win" : "lose";
        }
        if (Array.isArray(state.blWinners)) {
          return state.blWinners.indexOf(player.id) >= 0 ? "win" : "lose";
        }
        if (Array.isArray(state.popjamWinners)) {
          return state.popjamWinners.indexOf(player.id) >= 0 ? "win" : "lose";
        }
        return "";
      }

      if (state.survivalAllCleared || boardIsFull()) {
        return "win";
      }

      const loserId = survivalLoserId();
      return loserId !== null && state.players[index] && state.players[index].id === loserId ? "lose" : "win";
    }

    function buildResultText() {
      if (isClassicSharedMode() || isOpen7Mode() || isTacticsMode()) {
        const ranking = state.players.slice().sort(function (a, b) {
          return b.score - a.score;
        });
        return "順位: " + ranking.map(function (player, index) {
          return (index + 1) + "位 " + player.name + "（" + player.score + "点）";
        }).join(" / ");
      }

      if (isPopjamMode()) {
        const ranking = computePopjamRanking();
        if (ranking.length === 0) {
          return "終了";
        }
        return "順位: " + ranking.map(function (entry) {
          return entry.rank + "位 " + entry.player.name + (isPopjamScoreMode()
            ? "（" + entry.score + "点）"
            : "（手札" + entry.handCount + "枚）");
        }).join(" / ");
      }

      if (isHandSurvivalMode()) {
        if (state.survivalAllCleared || boardIsFull()) {
          return "全員クリア";
        }
        const loserId = survivalLoserId();
        const winners = state.players.filter(function (player) {
          return player.id !== loserId;
        });
        const loser = state.players.find(function (player) {
          return player.id === loserId;
        });
        return "勝ち: " + (winners.length ? winners.map(function (player) { return player.name; }).join("・") : "-")
          + (loser ? " / 負け: " + loser.name : "");
      }

      if (isLifeMode()) {
        const winners = state.players.filter(function (player) {
          return state.blWinners && state.blWinners.indexOf(player.id) >= 0;
        });
        const losers = state.players.filter(function (player) {
          return !state.blWinners || state.blWinners.indexOf(player.id) < 0;
        });
        return "勝ち: " + (winners.length ? winners.map(function (player) { return player.name; }).join("・") : "-")
          + " / 脱落: " + (losers.length ? losers.map(function (player) { return player.name; }).join("・") : "-");
      }

      const scoreRankingText = computeScoreRanking().map(function (entry) {
        return entry.rank + "位 " + entry.player.name + "（" + entry.score + "点）";
      }).join(" / ");

      if (state.survivalAllCleared) {
        return "全員クリア / 得点順位: " + scoreRankingText;
      }

      if (boardIsFull()) {
        return "盤面満了 / 得点順位: " + scoreRankingText;
      }

      const loserId = survivalLoserId();
      const loser = state.players.find(function (player) {
        return player.id === loserId;
      }) || currentPlayer();
      return "負け: " + loser.name + "（置けない） / 得点順位: " + scoreRankingText;
    }

    function classicBonusResultDetailHtml(player) {
      if (!isClassicBonusMode() || !player) {
        return "";
      }
      const parts = [];
      const details = Array.isArray(player.classicBonusCompleteDetails)
        ? player.classicBonusCompleteDetails
        : [];
      const completeBonus = player.classicBonusCompleteBonus || 0;
      if (completeBonus > 0) {
        const shortDetails = details
          .filter(function (detail) { return detail && detail.bonus > 0; })
          .map(function (detail) {
            return (colorNames[detail.color] || detail.color) + detail.base + "点 BONUS+" + detail.bonus;
          })
          .join(" / ");
        parts.push("完成BONUS +" + completeBonus + (shortDetails ? "（" + shortDetails + "）" : ""));
      }
      if ((player.classicBonusUnfinishedScore || 0) > 0) {
        parts.push("未完成 +" + player.classicBonusUnfinishedScore
          + "（最大" + (player.classicBonusUnfinishedBase || 0) + "点の半分）");
      }
      if (parts.length === 0) {
        parts.push("BONUSなし");
      }
      return "<div class=\"result-score-detail\">" + parts.map(escapeHtml).join("<br>") + "</div>";
    }

    function buildCompactScoreResultRowsHtml(ranking) {
      const rows = ranking.map(function (entry) {
        const outcome = getPlayerOutcome(entry.player.id);
        return "<div class=\"result-score-row " + outcome + "\">"
          + "<div class=\"result-score-main\">"
          + compactPlayerRoleHtml(entry.player)
          + "</div>"
          + "<span class=\"result-score-points\">" + entry.score + "</span>"
          + classicBonusResultDetailHtml(entry.player)
          + "</div>";
      }).join("");
      return "<div class=\"result-rows result-score-rows\">" + rows + "</div>";
    }

    function dealSurvivalStatusInfo(player) {
      if (!isDealSurvivalMode() || !player) {
        return null;
      }

      const loserId = survivalLoserId();
      if (state.over && loserId !== null && player.id === loserId) {
        return { label: "置けなくなった...", className: "fail" };
      }

      if (state.over) {
        return { label: "セーフ", className: "escape" };
      }

      return null;
    }

    function isDealSurvivalFailedPlayer(player) {
      return Boolean(isDealSurvivalMode()
        && state.over
        && player
        && survivalLoserId() !== null
        && player.id === survivalLoserId());
    }

    function dealSurvivalStatusHtml(player) {
      const status = dealSurvivalStatusInfo(player);
      if (!status) {
        return "";
      }
      return "<span class=\"survival-state " + status.className + "\">"
        + escapeHtml(status.label) + "</span>";
    }

    function survivalRemainingTileCount(player) {
      if (!player) {
        return 0;
      }
      const handCount = Array.isArray(player.hand) ? player.hand.length : 0;
      const pendingCount = Array.isArray(player.pending) ? player.pending.length : 0;
      return handCount + pendingCount;
    }

    function inlineHandSpacing(count) {
      if (count <= 4) {
        return "5px";
      }
      if (count <= 7) {
        return "3px";
      }
      if (count <= 10) {
        return "1px";
      }
      return "-3px";

    // 中央オーバーレイ用: 順位・得点を縦並びで表示（負けは「（置けない）」を行末に付記）
    function buildResultRowsHtml() {
      if (isClassicSharedMode() || state.mode === "borderless" || isOpen7Mode()) {
        return buildCompactScoreResultRowsHtml(computeScoreRanking());
      }

      if (isHandSurvivalMode()) {
        if (isDealSurvivalMode()) {
          const rows = state.players.map(function (player) {
            const status = dealSurvivalStatusInfo(player) || { label: player.hand.length + "枚", className: "" };
            return "<span class=\"rr-name\">" + compactPlayerRoleHtml(player) + "</span>"
              + "<span class=\"rr-note survival-state " + status.className + "\">"
              + escapeHtml(status.label) + "</span>";
          }).join("");
          return "<div class=\"result-rows deal-result-rows\">" + rows + "</div>";
        }

        const rows = state.players.map(function (player) {
          const outcome = getPlayerOutcome(player.id);
          const nameHtml = isDealSurvivalMode() ? compactPlayerRoleHtml(player) : escapeHtml(player.name);
          const note = outcome === "lose"
            ? "置けない"
            : isDealSurvivalMode()
            ? (player.finished ? "早抜け" : "生存")
            : "";
          return "<span class=\"rr-rank\">" + (outcome === "lose" ? "LOSE" : "WIN") + "</span>"
            + "<span class=\"rr-name\">" + nameHtml + "</span>"
            + "<span class=\"rr-note" + (outcome === "lose" ? "" : " rr-note-clear") + "\">"
            + note + "</span>";
        }).join("");
        return "<div class=\"result-rows\">" + rows + "</div>";
      }

      if (isLifeMode()) {
        const rows = state.players.map(function (player) {
          const outcome = getPlayerOutcome(player.id);
          return "<span class=\"rr-rank\">" + (outcome === "win" ? "WIN" : "LOSE") + "</span>"
            + "<span class=\"rr-name\">" + escapeHtml(player.name) + "</span>"
            + "<span class=\"rr-score\">ライフ" + player.hand.length + "枚</span>"
            + "<span class=\"rr-note" + (outcome === "win" ? " rr-note-clear" : "") + "\">"
            + (outcome === "win" ? "生存" : "脱落") + "</span>";
        }).join("");
        return "<div class=\"result-rows\">" + rows + "</div>";
      }

      const loserId = survivalLoserId();
      const ranking = computeScoreRanking();
      const rows = ranking.map(function (entry) {
        const isLoser = loserId !== null && entry.player.id === loserId;
        return "<span class=\"rr-rank\">" + entry.rank + "位</span>"
          + "<span class=\"rr-name\">" + escapeHtml(entry.player.name) + "</span>"
          + "<span class=\"rr-score\">" + entry.score + "点</span>"
          + "<span class=\"rr-note\">" + (isLoser ? "（置けない）" : "") + "</span>";
      }).join("");
      return "<div class=\"result-rows\">" + rows + "</div>";
    }

    // ポップジャム終了時の短い勝者ライン（順位の長文は順位パネルに集約）
    function buildPopjamWinnerLine() {
      if (Array.isArray(state.popjamWinners) && state.popjamWinners.length > 0) {
        const winners = state.popjamWinners.map(function (id) {
          return state.players.find(function (player) {
            return player.id === id;
          });
        }).filter(Boolean);
        const names = winners.map(function (player) {
          return player.name;
        }).join("・");
        const prefix = winners.length > 1 ? "同時勝利: " : "勝者: ";
        if (isPopjamScoreMode()) {
          const score = winners.length > 0 ? shownScore(winners[0]) : 0;
          return prefix + names + "（" + score + "点）";
        }
        const handCount = winners.length > 0 ? winners[0].hand.length : 0;
        return prefix + names + "（手札" + handCount + "枚）";
      }

      const ranking = computePopjamRanking();
      if (ranking.length === 0) { return "ゲーム終了"; }
      const firstRank = ranking[0].rank;
      const winners = ranking.filter(function (e) { return e.rank === firstRank; });
      const names = winners.map(function (e) { return e.player.name; }).join("・");
      const prefix = winners.length > 1 ? "同点1位: " : "勝者: ";
      if (isPopjamScoreMode()) {
        return prefix + names + "（" + ranking[0].score + "点）";
      }
      return prefix + names + "（手札" + ranking[0].handCount + "枚）";
    }

    function isDrawResult() {
      return Boolean(state.started && state.over
        && state.tiebreak
        && state.tiebreak.winnerId === null
        && state.tiebreak.decidedIndex < 0);
    }

    function buildResultTitle() {
      if (isDrawResult()) {
        return "DRAW";
      }

      if (!state.cpuEnabled) {
        return "RESULT";
      }

      if (isDealSurvivalMode()) {
        return getPlayerOutcome(0) === "lose" ? "YOU LOSE" : "YOU WIN";
      }

      if (isClassicSharedMode() || state.mode === "borderless" || isOpen7Mode()) {
        return getPlayerOutcome(0) === "lose" ? "YOU LOSE" : "YOU WIN";
      }

      return getPlayerOutcome(0) === "lose" ? "LOSE" : "WIN";
    }

    function shouldShowDealSurvivalLoseButton() {
      const player = currentPlayer();

        && state.started
        && !state.over
        && player
        && !player.isCpu
        && player.hand.length > 0

    function relocateDeclarePanel() {
      if (!elements.declarePanel || !elements.boardDeclareSlot || !elements.actionDeclareSlot || !elements.sideDeclareSlot) {
        return;

      const useActionDeclareSlot = isDealSurvivalMode() || isClassicSharedMode() || isPopjamScoreMode();

        ? elements.actionDeclareSlot

        ? elements.boardDeclareSlot
        : elements.sideDeclareSlot;
      if (elements.declarePanel.parentElement !== target) {

      }
      const hideDeclarePanel = state.mode === "borderless" || isOpen7Mode() || isLifeMode() || isPopjamScoreMode() || !state.started || state.over
        || (isDealSurvivalMode() && !shouldShowDealSurvivalLoseButton());
      elements.declarePanel.hidden = hideDeclarePanel;
      elements.boardDeclareSlot.hidden = hideDeclarePanel || target !== elements.boardDeclareSlot;
      elements.actionDeclareSlot.hidden = hideDeclarePanel || target !== elements.actionDeclareSlot;
      elements.sideDeclareSlot.hidden = hideDeclarePanel || target !== elements.sideDeclareSlot;
    }

      const placementAssistMode = currentPlacementAssistMode();

      document.body.classList.toggle("view-desktop", viewMode === "desktop");

      document.body.classList.toggle("mode-life", isLifeMode());

        blZoomSlider.hidden = !isDynamicBoardMode() || isOpen7Mode();

        elements.coordToggle.checked = state.showCoords;
      }

        elements.debugToggle.checked = state.debugMode;
      }

        elements.debugActionToggle.checked = state.debugActionMode;
      }

      renderSharedMarket();
      renderOpenPerimeter();
      renderHand();
      renderDealResultRibbon();
      renderInstructionPanel();
      renderPlayers();
      renderLog();
      renderCompletionControls();
      renderResult();
      renderScore();
      playQueuedDealAnimations();

    function renderDealResultRibbon() {
      if (!elements.dealResultRibbon) {
        return;
      }
      const showDealResult = isDealSurvivalMode();
      const showScoreResult = isClassicSharedMode() || state.mode === "borderless" || isOpen7Mode();
      const show = (showDealResult || showScoreResult)
        && currentMode() === state.mode
        && state.started
        && state.over
        && resultViewMode() === "ribbon";
      elements.dealResultRibbon.hidden = !show;
      if (!show) {
        elements.dealResultRibbon.textContent = "";
        elements.dealResultRibbon.className = "deal-result-ribbon";
        return;
      }
      const outcome = getPlayerOutcome(0);
      const isDraw = isDrawResult();
      const hasTiebreak = Boolean(showScoreResult
        && state.tiebreak
        && Array.isArray(state.tiebreak.lines)
        && state.tiebreak.lines.length > 0);
      const resultClass = isDraw ? "draw" : (outcome === "lose" ? "lose" : "win");
      elements.dealResultRibbon.className = "deal-result-ribbon "
        + resultClass
        + (hasTiebreak ? " score-result-ribbon tiebreak-result-ribbon" : "");
      if (hasTiebreak) {
        elements.dealResultRibbon.innerHTML = "<strong>" + escapeHtml(buildResultTitle()) + "</strong>"
          + buildTiebreakHtml();
        return;
      }
      elements.dealResultRibbon.innerHTML = "<strong>" + escapeHtml(buildResultTitle()) + "</strong>";
    }

    function playQueuedDealAnimations() {
      if (dealAnimationQueue.length === 0) {
        return;
      }

      const queue = dealAnimationQueue.splice(0);
      const layer = elements.dealAnimationLayer;

      if (!layer) {
        return;
      }

      function usableRect(element) {
        if (!element || typeof element.getBoundingClientRect !== "function") {
          return null;
        }
        const rect = element.getBoundingClientRect();
        if (rect.width <= 0 || rect.height <= 0) {
          return null;
        }
        return rect;
      }

      function dealAnimationSourceRect(item) {
        if (Number.isInteger(item.sourcePlayerId)) {
          return usableRect(document.querySelector("[data-pending-player=\"" + item.sourcePlayerId + "\"]"))
            || usableRect(document.querySelector("[data-player-id=\"" + item.sourcePlayerId + "\"]"));
        }
        return usableRect(elements.deckStack)
          || usableRect(elements.hand)
          || usableRect(elements.boardWrap);
      }

      queue.forEach(function (item) {
        if (item.mode && item.mode !== state.mode) {
          return;
        }
        const isMarketDeal = Number.isInteger(item.marketIndex);
        if (isMarketDeal && (!usesSharedMarket() || !state.started || state.over)) {
          return;
        }
        const target = isMarketDeal
          ? document.querySelector("[data-market-index=\"" + item.marketIndex + "\"]")
          : document.querySelector("[data-pending-player=\"" + item.targetPlayerId + "\"]")
            || document.querySelector("[data-player-id=\"" + item.targetPlayerId + "\"]");

        if (!target || typeof target.getBoundingClientRect !== "function") {
          return;
        }

        const sourceRect = dealAnimationSourceRect(item);
        if (!sourceRect) {
          return;
        }

        const startX = sourceRect.left + sourceRect.width / 2 - 21;
        const startY = sourceRect.top + sourceRect.height / 2 - 21;
        const targetRect = target.getBoundingClientRect();
        const endX = targetRect.left + targetRect.width / 2 - 21;
        const endY = targetRect.top + targetRect.height / 2 - 21;
        const visibleCards = isMarketDeal ? 1 : Math.min(item.count, 8);

        target.classList.remove(isMarketDeal ? "market-refill" : "deal-target-flash");
        void target.offsetWidth;
        target.classList.add(isMarketDeal ? "market-refill" : "deal-target-flash");
        setTimeout(function () {
          target.classList.remove(isMarketDeal ? "market-refill" : "deal-target-flash");
        }, 900);

        // 受け取り枚数 +N を相手パネル上にポップ（サバイバル含む全モード）
        if (!isMarketDeal) {
          const bump = document.createElement("span");
          bump.className = "receive-bump";
          bump.textContent = "+" + item.count;
          bump.style.left = (targetRect.left + targetRect.width / 2) + "px";
          bump.style.top = (targetRect.top - 4) + "px";
          layer.appendChild(bump);
          bump.addEventListener("animationend", function () {
            bump.remove();
          });
        }

        for (let i = 0; i < visibleCards; i++) {
          const flyer = document.createElement("img");
          const spread = (i - (visibleCards - 1) / 2) * 8;
          const arcHeight = 80 + i * 4;
          flyer.className = "deal-card-flyer";
          flyer.src = tilePath + (item.tileSrc || "tile-000-back.png");
          flyer.alt = "";
          flyer.style.setProperty("--from-x", startX + "px");
          flyer.style.setProperty("--from-y", startY + "px");
          flyer.style.setProperty("--mid-x", ((startX + endX) / 2 + spread) + "px");
          flyer.style.setProperty("--mid-y", (Math.min(startY, endY) - arcHeight) + "px");
          flyer.style.setProperty("--to-x", (endX + spread * 0.35) + "px");
          flyer.style.setProperty("--to-y", (endY + Math.min(i, 3) * 2) + "px");
          flyer.style.setProperty("--delay", (i * 74) + "ms");
          layer.appendChild(flyer);

          flyer.addEventListener("animationend", function () {
            flyer.remove();
          });
        }
      });
    }

    function playQueuedRiverAnimations() {
      if (riverAnimationQueue.length === 0) {
        return;
      }

      const queue = riverAnimationQueue.splice(0);
      const layer = elements.dealAnimationLayer;
      if (!layer) {
        return;
      }

      queue.forEach(function (item) {
        const target = document.querySelector("[data-river-player=\"" + item.targetPlayerId + "\"]")
          || document.querySelector("[data-player-id=\"" + item.targetPlayerId + "\"]");
        const fallbackSource = document.querySelector("[data-player-id=\"" + item.targetPlayerId + "\"]");
        if (!target || typeof target.getBoundingClientRect !== "function") {
          return;
        }

        const sourceRect = item.fromRect || (fallbackSource && fallbackSource.getBoundingClientRect());
        if (!sourceRect) {
          return;
        }

        const targetRect = target.getBoundingClientRect();
        const startX = sourceRect.left + sourceRect.width / 2 - 29;
        const startY = sourceRect.top + sourceRect.height / 2 - 29;
        const endX = targetRect.left + Math.min(targetRect.width - 42, 18);
        const endY = targetRect.top + targetRect.height / 2 - 29;

        const flyer = document.createElement("img");
        flyer.className = "river-card-flyer" + (item.slow ? " slow" : "");
        flyer.src = tilePath + item.tile.src;
        flyer.alt = "";
        flyer.style.setProperty("--from-x", startX + "px");
        flyer.style.setProperty("--from-y", startY + "px");
        flyer.style.setProperty("--mid-x", ((startX + endX) / 2) + "px");
        flyer.style.setProperty("--mid-y", (Math.min(startY, endY) - 44) + "px");
        flyer.style.setProperty("--to-x", endX + "px");
        flyer.style.setProperty("--to-y", endY + "px");
        flyer.style.setProperty("--delay", (item.delayMs || 0) + "ms");
        layer.appendChild(flyer);
        flyer.addEventListener("animationend", function () {
          flyer.remove();
        });

        target.classList.remove("deal-target-flash");
        void target.offsetWidth;
        target.classList.add("deal-target-flash");
        setTimeout(function () {
          target.classList.remove("deal-target-flash");
        }, 900);
      });
    }

    function buildMainInfoHtml(player) {
      if (!state.started) {
        return "開始を押してください。";
      }

      if (state.over) {
        // 順位の長文は右の順位パネルに集約。状況バーは短い勝者ラインのみ。
        if (isPopjamMode()) {
          return "🏁 ゲーム終了 ｜ " + escapeHtml(buildPopjamWinnerLine());
        }
        return escapeHtml(buildResultText());
      }

      if (isClassicSharedMode() || state.mode === "borderless") {
        return (state.scoreText ? "<span>" + escapeHtml(state.scoreText) + "</span> " : "") + buildScoreLineHtml();
      }

      if (state.scoreText) {
        return escapeHtml(state.scoreText);
      }

      if (isPopjamMode() && state.discardPending > 0) {
        const target = discardPlayer();
        return playerNameHtml(target) + " が手札から " + state.discardPending + "枚を選んで捨て札へ移します。";
      }

      if (hasPendingQuestionEffects()) {
        return playerNameHtml(player) + " はハテナの発動順を選択中です。";
      }

      if (hasPendingAction()) {
        return playerNameHtml(player) + " は " + escapeHtml(actionHandTitle()) + " 操作中です。";
      }

      if (isOpen7Mode()) {
        const thinking = player.isCpu && state.cpuThinking ? "（考え中）" : "";
        return playerNameHtml(player) + " の手番" + thinking
          + "。外周タイル " + availableTileCount(state.sharedMarket) + "枚";
      }

      const falling = state.players
        .filter(function (target) {
          return target.pending.length > 0;
        })
        .map(function (target) {
          return playerNameHtml(target) + "に" + target.pending.length + "枚";
        })
        .join(" / ");

      const thinking = player.isCpu && state.cpuThinking ? "（考え中）" : "";
      return playerNameHtml(player) + " の手番" + thinking
        + "。手札 " + player.hand.length + "枚"
        + (falling ? " / 降る: " + falling : "");

        return "7×7固定盤面。山札と手札は使わず、盤面外周の公開タイルから1枚選んで配置する。通常の色接続と得点で競う完全情報モード。";

          return "手札がライフ。ダメージ分は次の自分の手番に手札から置きます。自分の色を作ると回復し、相手の色を作られるとダメージ。最後まで残ったプレイヤーの勝ち。";

      }

      }

        if (isPopjamInnerQuestionMode()) {
          return "手札を減らす。ハテナを盤面に仕込み、隣に通常タイルが置かれると効果がめくれる。";
        }
        if (isPopjamScoreMode()) {
          if (isPopjamScoreTestMode()) {
            return "ポップジャム検証。外周ハテナは公開状態。キープした追加手札は自分の手番に続けて何枚でも置けます。外周カラーズに接する辺は色を合わせる必要があります。";
          }

            return "ポップジャム。山札から公開された5枚の中から1枚選び、5×5盤面に置く。外周ハテナの効果を使い、模様完成と得点を狙う。";

    function buildScoreLineHtml() {

      const thinking = player && player.isCpu && state.cpuThinking ? "（考え中）" : "";
