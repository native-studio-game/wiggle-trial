      const tile = selectedPlacementTile();
      if (!tile) { return; }
      if (!canPlaceDynamicShared(r, c, tile, state.selectedRotation)) {
        if (player && !player.isCpu) {
          trackWiggleEvent("invalid_action", {
            action: "place_dynamic",
            row: r,
            col: c,
            selected_hand_index: state.selectedHandIndex
          });
        }
        return;
      }
      if (player && !player.isCpu) {
        trackFirstAction("place_dynamic", {
          row: r,
          col: c,
          tile_id: tile && tile.id
        });
      }
      clearMobilePlacementConfirm();
      pushHistory();

      const placedKey = blCellKey(r, c);
      clearLifeKoBansAfterLegalPlacement(player, placedKey);
      const placedHandIndex = state.selectedHandIndex;
      const placedTile = isInnerQuestionTile(tile)
        ? Object.assign(cloneQuestionTile(tile), {
            ownerId: player.id,
            revealed: false,
            effectUsed: false
          })
        : cloneTile(tile);
      state.blBoard[placedKey] = {
        tile: placedTile,
        rotation: isInnerQuestionTile(tile) ? 0 : state.selectedRotation
      };
      pendingDropCell = { row: r, col: c, rotation: isInnerQuestionTile(tile) ? 0 : state.selectedRotation, borderless: true };
      state.lastPlacedCell = { row: r, col: c, borderless: true };
      if (usesSharedMarket()) {
        const placedMarketIndex = state.selectedHandIndex;
        state.sharedMarket.splice(placedMarketIndex, 1);
        clearMarketTileRotation(placedMarketIndex);
        refillSharedMarket({ animate: true });
        const nextMarketIndex = findFirstClassicMarketIndex();
        state.selectedHandIndex = !player.isCpu && nextMarketIndex >= 0 ? nextMarketIndex : null;
        state.selectedRotation = marketTileRotation(state.selectedHandIndex);
      } else {
        player.hand.splice(state.selectedHandIndex, 1);
        state.selectedHandIndex = !player.isCpu && player.hand.length > 0
          ? Math.min(placedHandIndex, player.hand.length - 1)
          : null;
        state.selectedRotation = 0;
      }
      clearRotationAnimation();
      state.stats.placedTiles++;
      state.passStreak = 0;
      state.scoreText = "";

      if (isHarvestSeasonMode()) {
        state.harvestPlacedThisTurn++;
        addLog(player.name + " が " + tile.name + " を " + r + "," + c + " に置きました（"
          + state.harvestPlacedThisTurn + "/3）。");
        const shouldFinish = state.harvestPlacedThisTurn >= harvestSeasonConfig().maxHandSize
          || player.hand.length === 0
          || findFirstDynamicMarketIndex() < 0;
        if (shouldFinish) {
          finishHarvestSeasonPlacement({ silent: true });
        } else {
          render();
        }
        return;
      }

      if (isHarvestMode()) {
        // 共有札から1枚ずつ配置。置いたら手番終了。
        addLog(player.name + " が " + tile.name + " を " + r + "," + c + " に置きました。");
        processHarvestCompletions(player);
        if (state.over) {
          render();
          return;
        }
        blAdvanceTurn();
        render();
        return;
      }

      if (isDynamicPopjamMode()) {
        const placedName = isInnerQuestionTile(tile) ? "伏せハテナ" : tile.name;
        addLog(player.name + " が " + placedName + " を " + r + "," + c + " に置きました。");

        if (isInnerQuestionTile(tile)) {
          addLog(player.name + " が伏せハテナを仕込みました。隣に通常タイルが置かれると発動します。");
          finishPopjamPlacement(player.id, createQuestionContext());
          return;
        }

        const immediateContext = createQuestionContext();
        state.popjamPostDiscardPlacement = {
          row: r,
          col: c,
          playerId: player.id,
          context: immediateContext
        };
        if (startPopjamDiscardForNewCompletionsOnActiveBoard(immediateContext, player.id)) {
          render();
          return;
        }
        state.popjamPostDiscardPlacement = null;

        const questionContext = beginQuestionEffectsForPlacement(r, c, player, immediateContext);
        if (!questionContext) {
          render();
          return;
        }

        finishPopjamPlacement(player.id, questionContext);
        return;
      }

      if (isLifeMode()) {
        addLog(player.name + " が " + tile.name + " を " + r + "," + c + " に置きました。");
        processLifeCompletions(player, activeLifeDamageAction, placedKey);
        if (state.over) {
          render();
          return;
        }
        if (state.pendingAction && state.pendingAction.type === "life-lock-damage") {
          render();
          return;
        }
        if (isLifeWoundMode() && startNextLifeRecoveryAction(player.id)) {
          render();
          return;
        }
        finishLifePlacement(player, activeLifeDamageAction);
        return;
      }

      // 模様の色を担当するプレイヤーに加点（置いた人ではない）
      const patterns = WiggleRules.detectClosedPatternsDynamic(dynamicScoringBoard());
      const gains = [];
      patterns.forEach(function (pattern) {
        if (state.blCompletedKeys.indexOf(pattern.key) !== -1) { return; }
        state.blCompletedKeys.push(pattern.key);
        const owner = ownerForColor(pattern.color);
        const scoreInfo = dynamicPatternScoreInfo(pattern);
        if (owner) {
          owner.score += scoreInfo.points;
          owner.completed++;
          owner.maxPattern = Math.max(owner.maxPattern || 0, pattern.points);
          recordClassicBonusCompletion(owner, pattern, scoreInfo, true);
          gains.push(scoreLabel(owner, pattern.color, scoreInfo.points));
        }
        state.stats.completions++;
        queueCompletionVisual(pattern, { borderless: true, marker: false, points: scoreInfo.points, bonus: scoreInfo.bonus });
      });
      if (gains.length > 0) {
        state.scoreText = gains.join(" / ");
        scheduleToastHide();
        addLog(player.name + " が " + r + "," + c + " に置いて完成 → " + gains.join(" / ") + "。");
      } else {
        state.scoreBumpPlayerIds = [];
        addLog(player.name + " が " + r + "," + c + " に置きました。");
      }

      blAdvanceTurn();
      render();
    }

    function endBorderless() {
      finishDynamicByScore("山札を引き切りました。");

    function buildBlResultText() {
      if (isLifeMode()) {
        const winners = state.players.filter(function (player) {
          return state.blWinners && state.blWinners.indexOf(player.id) >= 0;
        });
        const losers = state.players.filter(function (player) {
          return !state.blWinners || state.blWinners.indexOf(player.id) < 0;
        });
        return "勝ち: " + (winners.length ? winners.map(function (player) { return player.name; }).join("・") : "-")
          + " / 脱落: " + (losers.length ? losers.map(function (player) { return player.name; }).join("・") : "-");
      }
      const ranked = state.players.slice().sort(function (a, b) { return b.score - a.score; });
      const parts = ranked.map(function (p) {
        return p.name + " " + p.score + (isHarvestSeasonMode() ? "枚" : "点");
      });
      if (state.blAllPlacedWin) {
        return "全員置ききり / " + parts.join(" / ");
      }
      if (state.players.length === 1) {
        return "スコア: " + state.players[0].score + "点";
      }
      return parts.join(" / ");
    }

    function applyBlTransform() {
      const els = blGetEls();
      if (!els.world) { return; }
      els.world.style.transform = "translate(" + state.blPan.x + "px," + state.blPan.y + "px) scale(" + state.blZoom + ")";
      const slider = document.getElementById("blZoomSlider");
      if (slider) {
        slider.value = String(Math.round(state.blZoom * 100));
      }
    }

    function centerBl() {
      const els = blGetEls();
      if (!els.viewport) { return; }
      const rect = els.viewport.getBoundingClientRect();
      let minR = Infinity, maxR = -Infinity, minC = Infinity, maxC = -Infinity;
      Object.keys(state.blBoard).forEach(function (k) {
        const p = k.split(",");
        const r = parseInt(p[0], 10), c = parseInt(p[1], 10);
        if (r < minR) minR = r; if (r > maxR) maxR = r;
        if (c < minC) minC = c; if (c > maxC) maxC = c;
      });
      if (!isFinite(minR)) { minR = maxR = minC = maxC = 0; }
      const centerWorldX = ((minC + maxC + 1) / 2) * BL_CELL;
      const centerWorldY = ((minR + maxR + 1) / 2) * BL_CELL;
      state.blPan.x = rect.width / 2 - centerWorldX * state.blZoom;
      state.blPan.y = rect.height / 2 - centerWorldY * state.blZoom;
      applyBlTransform();
    }

    function currentDynamicViewBounds(includePlaceable) {
      let minR = Infinity, maxR = -Infinity, minC = Infinity, maxC = -Infinity;
      function includeCell(r, c) {
        if (r < minR) { minR = r; }
        if (r > maxR) { maxR = r; }
        if (c < minC) { minC = c; }
        if (c > maxC) { maxC = c; }
      }

      Object.keys(state.blBoard || {}).forEach(function (key) {
        const parts = key.split(",");
        includeCell(parseInt(parts[0], 10), parseInt(parts[1], 10));
      });

      if (isHarvestSeasonMode()) {
        for (let r = -2; r <= 2; r++) {
          for (let c = -2; c <= 2; c++) {
            includeCell(r, c);
          }
        }
      }

      if (includePlaceable && !isCpuTurn() && !state.over && !isDynamicAutoCameraMode()) {
        (state.sharedMarket || []).forEach(function (tile) {
          [0, 90, 180, 270].forEach(function (rotation) {
            dynamicPlaceableSpots(tile, rotation).forEach(function (spot) {
              includeCell(spot.r, spot.c);
            });
          });
        });
      }

      if (!isFinite(minR)) {
        minR = maxR = minC = maxC = 0;
      }

      function includeAutoPadding() {
        const height = maxR - minR + 1;
        const width = maxC - minC + 1;
        const rowPadding = isClassicSharedMode() ? (height < 5 ? 1 : 0) : 1;
        const colPadding = isClassicSharedMode() ? (width < 5 ? 1 : 0) : 1;
        includeCell(minR - rowPadding, minC - colPadding);
        includeCell(maxR + rowPadding, maxC + colPadding);
      }

      if (includePlaceable && !state.over && isDynamicAutoCameraMode()) {
        includeAutoPadding();
      }

      return {
        minR: minR,
        maxR: maxR,
        minC: minC,
        maxC: maxC,
        width: maxC - minC + 1,
        height: maxR - minR + 1
      };
    }

    function dynamicCameraSafeMargin() {
      if (currentViewMode() === "mobile") {
        return 34;
      }
      if (window.matchMedia && window.matchMedia("(max-width: 760px)").matches) {
        return 36;
      }
      if (currentViewMode() === "desktop") {
        return 84;
      }
      return 74;
    }

    function fitClassicBlCamera() {
      const els = blGetEls();
      if (!els.viewport) { return; }
      const rect = els.viewport.getBoundingClientRect();
      const bounds = currentDynamicViewBounds(true);
      const margin = dynamicCameraSafeMargin();
      const worldW = Math.max(1, bounds.width * BL_CELL);
      const worldH = Math.max(1, bounds.height * BL_CELL);
      const availableW = Math.max(BL_CELL, rect.width - margin * 2);
      const availableH = Math.max(BL_CELL, rect.height - margin * 2);
      const fitZoom = Math.min(
        availableW / worldW,
        availableH / worldH
      );
      const isMobileCamera =
        currentViewMode() === "mobile" ||
        (window.matchMedia && window.matchMedia("(max-width: 760px)").matches);
      const minZoom = isDynamicPopjamMode() ? 0.42 : (isMobileCamera ? 0.48 : 0.72);
      const placedCount = Object.keys(state.blBoard || {}).length;
      const classicCameraExtent = Math.max(bounds.width, bounds.height);
      const isCompactClassicCamera = (isClassicSharedMode() || state.mode === "borderless")
        && placedCount <= 6
        && classicCameraExtent <= 5;
      const compactClassicMaxZoom = classicCameraExtent <= 3
        ? (isMobileCamera ? 1.16 : 1.85)
        : classicCameraExtent <= 4
        ? (isMobileCamera ? 1.04 : 1.72)
        : (isMobileCamera ? 0.94 : 1.58);
      const maxZoom = isCompactClassicCamera
        ? compactClassicMaxZoom
        : isDynamicPopjamMode()
        ? (isMobileCamera ? 1.22 : 1.45)
        : (isMobileCamera ? 0.8 : 1.65);
      const holdZoom = (!isMobileCamera && (isClassicSharedMode() || state.mode === "borderless"))
        ? 1.7
        : maxZoom;
      state.blZoom = Math.max(minZoom, Math.min(holdZoom, fitZoom));
      const centerWorldX = ((bounds.minC + bounds.maxC + 1) / 2) * BL_CELL;
      const centerWorldY = ((bounds.minR + bounds.maxR + 1) / 2) * BL_CELL;
      state.blPan.x = rect.width / 2 - centerWorldX * state.blZoom;
      state.blPan.y = rect.height / 2 - centerWorldY * state.blZoom;
      applyBlTransform();
    }

    function appendClassicLimitGuides(world) {
      if (!isClassicSharedMode() || !world || !state.started || state.over) {
        return;
      }
      const bounds = currentDynamicViewBounds(false);
      if (!bounds || bounds.width <= 0 || bounds.height <= 0) {
        return;
      }
      const seen = {};
      function addGuide(r, c) {
        const key = r + "," + c;
        if (seen[key]) {
          return;
        }
        seen[key] = true;
        const guide = document.createElement("div");
        guide.className = "bl-limit-guide";
        guide.style.left = (c * BL_CELL) + "px";
        guide.style.top = (r * BL_CELL) + "px";
        world.appendChild(guide);
      }
      if (bounds.width >= 5) {
        for (let r = bounds.minR; r <= bounds.maxR; r++) {
          addGuide(r, bounds.minC - 1);
          addGuide(r, bounds.maxC + 1);
        }
      }
      if (bounds.height >= 5) {
        for (let c = bounds.minC; c <= bounds.maxC; c++) {
          addGuide(bounds.minR - 1, c);
          addGuide(bounds.maxR + 1, c);
        }
      }
    }

    function blZoomAt(cx, cy, factor) {
      const newZoom = Math.max(0.4, Math.min(2.2, state.blZoom * factor));
      const worldX = (cx - state.blPan.x) / state.blZoom;
      const worldY = (cy - state.blPan.y) / state.blZoom;
      state.blPan.x = cx - worldX * newZoom;
      state.blPan.y = cy - worldY * newZoom;
      state.blZoom = newZoom;
      applyBlTransform();
    }

    function ensureBlListeners() {
      if (blListenersReady) { return; }
      const els = blGetEls();
      if (!els.viewport) { return; }
      blListenersReady = true;

      els.viewport.addEventListener("mousedown", function (event) {
        if (isDynamicAutoCameraMode()) { return; }
        if (event.target.closest(".bl-ghost")) { return; } // 配置クリックは邪魔しない
        blDrag = { x: event.clientX - state.blPan.x, y: event.clientY - state.blPan.y };
        els.viewport.classList.add("dragging");
      });
      window.addEventListener("mousemove", function (event) {
        if (!blDrag) { return; }
        state.blPan.x = event.clientX - blDrag.x;
        state.blPan.y = event.clientY - blDrag.y;
        applyBlTransform();
      });
      window.addEventListener("mouseup", function () {
        blDrag = null;
        if (els.viewport) { els.viewport.classList.remove("dragging"); }
      });
      els.viewport.addEventListener("wheel", function (event) {
        event.preventDefault();
        rotateSelectedByWheel(event);
      }, { passive: false });
      els.viewport.addEventListener("contextmenu", function (event) {
        event.preventDefault();
        rotateSelected(90);
      });
      els.viewport.addEventListener("pointerdown", function (event) {
        if (!isMobileInteractionMode()) { return; }
        if (typeof event.button === "number" && event.button !== 0) { return; }
        if (event.pointerType === "mouse" && event.target.closest(".bl-ghost")) { return; }
        if (event.target.closest("button:not(.cell), select, input, textarea, a")) { return; }
        blSwipeRotate = {
          pointerId: event.pointerId,
          x: event.clientX,
          y: event.clientY,
          lastX: event.clientX,
          lastY: event.clientY
        };
        if (event.currentTarget && typeof event.currentTarget.setPointerCapture === "function") {
          try { event.currentTarget.setPointerCapture(event.pointerId); } catch (_) {}
        }
      });
      els.viewport.addEventListener("pointermove", function (event) {
        if (!blSwipeRotate || blSwipeRotate.pointerId !== event.pointerId) { return; }
        blSwipeRotate.lastX = event.clientX;
        blSwipeRotate.lastY = event.clientY;
        if (completeSwipeRotate(blSwipeRotate, event)) {
          releaseSwipePointer(event);
          blSwipeRotate = null;
        }
      });
      els.viewport.addEventListener("pointercancel", function (event) {
        if (blSwipeRotate && blSwipeRotate.pointerId === event.pointerId) {
          releaseSwipePointer(event);
          blSwipeRotate = null;
        }
      });
      els.viewport.addEventListener("pointerup", function (event) {
        if (!blSwipeRotate || blSwipeRotate.pointerId !== event.pointerId) { return; }
        const gesture = blSwipeRotate;
        releaseSwipePointer(event);
        blSwipeRotate = null;
        completeSwipeRotate(gesture, event);
      });

      const zin = document.getElementById("blZoomIn");
      const zout = document.getElementById("blZoomOut");
      const rec = document.getElementById("blRecenter");
      const slider = document.getElementById("blZoomSlider");
      if (zin) { zin.addEventListener("click", function () { const r = els.viewport.getBoundingClientRect(); blZoomAt(r.width / 2, r.height / 2, 1.15); }); }
      if (zout) { zout.addEventListener("click", function () { const r = els.viewport.getBoundingClientRect(); blZoomAt(r.width / 2, r.height / 2, 0.87); }); }
      if (rec) { rec.addEventListener("click", function () { centerBl(); }); }
      if (slider) {
        slider.addEventListener("input", function () {
          const rect = els.viewport.getBoundingClientRect();
          const nextZoom = Math.max(0.4, Math.min(2.2, Number(slider.value) / 100 || 1));
          const centerX = rect.width / 2;
          const centerY = rect.height / 2;
          const worldX = (centerX - state.blPan.x) / state.blZoom;
          const worldY = (centerY - state.blPan.y) / state.blZoom;
          state.blPan.x = centerX - worldX * nextZoom;
          state.blPan.y = centerY - worldY * nextZoom;
          state.blZoom = nextZoom;
          applyBlTransform();
        });
      }
    }

    function scheduleBorderlessCpuTurn() {
      if (!isDynamicBoardMode() || !isCpuTurn() || state.cpuThinking || state.over || hasPopjamWinDiscardShowcase()) {
        return;
      }
      state.cpuThinking = true;
      if (isDynamicPopjamMode()) {
        renderPlayers();
      } else {
        renderBlScores();
      }
      setTimeout(runBorderlessCpuTurnStep, cpuThinkDelayMs());
    }

    function runHarvestSeasonCpuTurnStep() {
      const player = currentPlayer();
      if (!player || !isHarvestSeasonMode()) {
        render();
        return;
      }
      let guard = 0;
      while (!state.over && currentPlayer() === player && state.harvestPlacedThisTurn < harvestSeasonConfig().maxHandSize && guard < 3) {
        const move = chooseBorderlessCpuMove();
        if (!move) {
          break;
        }
        state.selectedHandIndex = move.marketIndex;
        state.selectedRotation = move.rotation;
        blPlace(move.r, move.c);
        guard++;
        if (state.over || currentPlayer() !== player || state.harvestPlacedThisTurn === 0) {
          return;
        }
      }
      if (state.over || currentPlayer() !== player) {
        return;
      }
      if (state.harvestPlacedThisTurn > 0) {
        finishHarvestSeasonPlacement({ silent: true });
        return;
      }
      state.passStreak = (state.passStreak || 0) + 1;
      addLog(player.name + " は置ける手がなくパスしました。");
      if (state.passStreak >= state.players.length) {
        finishHarvestSeasonByScore("全員が配置できなくなりました。");
      } else {
        blAdvanceTurn();
      }
      render();
    }

    function runBorderlessCpuTurnStep() {
      state.cpuThinking = false;
      if (!isDynamicBoardMode() || !isCpuTurn() || state.over) {
        render();
        return;
      }
      if (isHarvestSeasonMode()) {
        runHarvestSeasonCpuTurnStep();
        return;
      }
      const move = chooseBorderlessCpuMove();
      if (!move) {
        if (isHarvestMode()) {
          const player = currentPlayer();
          state.passStreak = (state.passStreak || 0) + 1;
          addLog(player.name + " は置ける共有札がなくパスしました。");
          if ((state.passStreak >= state.players.length)
            || (state.deck.length === 0 && (state.sharedMarket || []).length === 0)) {
            finishHarvestByScore("置ける共有札がなくなりました。");
          } else {
            blAdvanceTurn();
          }
          render();
          return;
        }
        if (isDynamicPopjamMode()) {
          state.passStreak = (state.passStreak || 0) + 1;
          addLog(currentPlayer().name + " は置ける手札がなくパスしました。");
          if (state.passStreak >= state.players.length) {
            if (isPopjamScoreMode()) {
              finishPopjamByScore("全員が置ける手札なしでパスしました。");
            } else {
              finishPopjamByHandCount();
            }
          } else {
            blAdvanceTurn();
          }
          render();
          return;
        }
        if (isLifeMode()) {
          eliminateLifePlayer(currentPlayer(), "置けるタイルがありません。");
          return;
        }
        finishDynamicByScore("置ける共有札がありません。");
        render();
        return;
      }
      state.selectedHandIndex = move.marketIndex;
      state.selectedRotation = move.rotation;
      blPlace(move.r, move.c);
    }

    function scoreDiamondHtml(player) {
      const shown = shownScore(player);
      const whole = Math.max(0, Math.floor(Number(shown) || 0));
      const visible = Math.min(whole, 16);
      let html = "";
      for (let i = 0; i < visible; i++) {
        html += "<span class=\"score-diamond " + player.color + "\"></span>";
      }
      if (whole > visible) {
        html += "<span class=\"score-extra\">+" + (whole - visible) + "</span>";
      }
      return html;
    }

    function lifeDiamondHtml(player) {
      const count = player.hand ? player.hand.length : 0;
      const visible = Math.min(count, 18);
      const locked = lifeEditLockedCount(player);
      const liveCount = Math.max(0, count - locked);
      const liveVisible = Math.min(liveCount, visible);
      const lockedVisible = Math.min(locked, Math.max(0, visible - liveVisible));
      let html = "";
      if (count <= 0 && locked <= 0) {
        return "<span class=\"score-extra\">0</span>";
      }
      html += "<span class=\"life-stack-groups\">";
      html += "<span class=\"life-life-diamonds\" data-life-life-player=\"" + player.id + "\">";
      for (let i = 0; i < liveVisible; i++) {
        html += "<span class=\"score-diamond " + player.color + "\"></span>";
      }
      html += "</span>";
      html += "<span class=\"life-damage-diamonds\" data-life-damage-player=\"" + player.id + "\">";
      for (let j = 0; j < lockedVisible; j++) {
        html += "<span class=\"score-diamond locked\"></span>";
      }
      html += "</span>";
      html += "</span>";
      if (count > visible) {
        html += "<span class=\"score-extra\">+" + (count - visible) + "</span>";
      }
      if (locked > visible) {
        html += "<span class=\"score-extra\">DMG " + locked + "</span>";
      }
      return html;
    }

    function renderBlScores() {
      elements.players.innerHTML = "";
      if (elements.playersTitle) {
        elements.playersTitle.textContent = isLifeMode()
          ? "ライフ"
          : (isHarvestMode() || isHarvestSeasonMode() ? "順位 / 収穫枚数" : "順位 / 得点");
      }
      const wrap = document.createElement("div");
      wrap.className = "bl-scores";
      const ranked = state.players
        .map(function (player, index) {
          return { player: player, index: index };
        })
        .sort(function (a, b) {
          if (isLifeMode()) {
            if (a.player.finished !== b.player.finished) {
              return a.player.finished ? 1 : -1;
            }
            if (b.player.hand.length !== a.player.hand.length) {
              return b.player.hand.length - a.player.hand.length;
            }
            return a.player.id - b.player.id;
          }
          if (b.player.score !== a.player.score) {
            return b.player.score - a.player.score;
          }
          // 終了時に同点判定で勝者が決まっていれば、その順で並べる
          if (state.over && state.tiebreak && state.tiebreak.winnerId !== null) {
            return tiebreakCompare(a.player, b.player);
          }
          return a.player.id - b.player.id;
        });
      const currentOrder = ranked.map(function (entry) {
        return entry.player.id;
      }).join("|");

      // 同点判定で決着している時は1位/2位を分ける。それ以外は同点=同順位。
      const tiebroken = state.over && state.tiebreak && state.tiebreak.winnerId !== null && state.winnerId !== null;
      let blLastScore = null;
      let blLastRank = 0;

      ranked.forEach(function (entry, visualIndex) {
        const p = entry.player;
        const index = entry.index;
        let rank;
        if (isLifeMode()) {
          rank = visualIndex + 1;
        } else if (tiebroken) {
          rank = visualIndex + 1;
        } else if (blLastScore === null || p.score !== blLastScore) {
          rank = visualIndex + 1;
          blLastScore = p.score;
          blLastRank = rank;
        } else {
          rank = blLastRank;
        }
        const row = document.createElement("div");
        let cls = "bl-score-row";
        if (!state.over && index === state.currentPlayer) { cls += " current"; }
        if (state.over && state.blWinners && state.blWinners.indexOf(p.id) >= 0) { cls += " win"; }
        if (p.finished) { cls += " finished"; }
        if (state.scoreBumpPlayerIds && state.scoreBumpPlayerIds.indexOf(p.id) >= 0) { cls += " score-bump"; }
        if (state.scoreDropPlayerIds && state.scoreDropPlayerIds.indexOf(p.id) >= 0) { cls += " score-drop"; }
        if (lastBlScoreOrder) {
          const previousIndex = lastBlScoreOrder.split("|").indexOf(String(p.id));
          if (previousIndex >= 0 && previousIndex !== visualIndex) {
            cls += " rank-shift";
          }
        }
        row.className = cls;
        row.dataset.playerId = String(p.id);
        const thinking = index === state.currentPlayer && p.isCpu && state.cpuThinking
          ? " <span class=\"cpu-badge\"><span class=\"dot\"></span>考え中</span>"
          : "";
        const finished = p.finished ? " <span class=\"cpu-badge\">" + (isLifeMode() ? "脱落" : "完成") + "</span>" : "";
        if (isLifeMode()) {
          row.innerHTML = "<span class=\"bl-rank\">" + (p.finished ? "-" : rank + "位") + "</span>"
            + "<span class=\"player-name\">" + turnIndicatorHtml(p) + "<span class=\"swatch " + p.color + "\">"
            + colorSymbols[p.color] + "</span>" + playerNameHtml(p) + thinking + finished + "</span>"
            + "<span class=\"pts\">" + (p.finished ? "LOSE" : p.hand.length + "枚") + "</span>"
            + "<span class=\"score-stack\">" + lifeDiamondHtml(p) + "</span>";
          wrap.appendChild(row);
          return;
        }
        if (isHarvestSeasonMode()) {
          row.innerHTML = "<span class=\"bl-rank\">" + rank + "位</span>"
            + "<span class=\"player-name\">" + turnIndicatorHtml(p) + "<span class=\"swatch " + p.color + "\">"
            + colorSymbols[p.color] + "</span>" + playerNameHtml(p) + thinking + finished + "</span>"
            + "<span class=\"pts\">" + (p.scorePile || []).length + "枚</span>"
            + "<span class=\"score-stack\">" + harvestSeasonPileHtml(p) + "</span>";
          wrap.appendChild(row);
          return;
        }
        row.classList.add("compact-score-row");
        row.innerHTML = "<span class=\"player-name compact-score-name\">"
          + turnIndicatorHtml(p)
          + compactPlayerRoleHtml(p)
          + "<span class=\"score-stack compact-score-inline\">" + scoreDiamondHtml(p) + "</span>"
          + thinking
          + "</span>"
          + "<span class=\"pts\">" + shownScore(p) + "</span>";
        wrap.appendChild(row);
      });
      if (isLifeWoundMode()) {
        wrap.insertAdjacentHTML("beforeend", lifeWoundedHtml());
      }
      elements.players.appendChild(wrap);
      lastBlScoreOrder = currentOrder;
    }

    function renderBlBoard() {
      const els = blGetEls();
      if (!els.world) { return; }
      els.world.innerHTML = "";

      const glowMap = buildPatternGlowMap(true);
      let usedStartAnimation = false;

      appendHarvestSeasonFixedCells(els.world);

      // 配置済みタイル
      Object.keys(state.blBoard).forEach(function (k) {
        const p = k.split(",");
        const r = parseInt(p[0], 10), c = parseInt(p[1], 10);
        const cell = state.blBoard[k];
        const div = document.createElement("div");
        div.className = "bl-tile";
        div.dataset.blCell = r + "," + c;
        const cellGlow = glowMap[r + "," + c];
        div.style.left = (c * BL_CELL) + "px";
        div.style.top = (r * BL_CELL) + "px";
        if (cell.tile && cell.tile.start && state.startTileAnimating) {
          div.classList.add("tile-drop"); // 通常配置と同じ落下演出
          usedStartAnimation = true;
        }
        if (isInnerQuestionCell(cell)) {
          div.classList.add("inner-question");
          if (cell.tile.revealed) {
            div.classList.add("revealed");
          }
          if (cell.tile.ownerId === 0 || (!isCpuTurn() && cell.tile.ownerId === (currentPlayer() && currentPlayer().id))) {
            div.classList.add("owned-inner-question");
          }
          if (questionRevealAnimationSlots.indexOf("inner:" + r + ":" + c) !== -1) {
            div.classList.add("just-revealed");
          }
        }
        if (state.pendingAction && state.pendingAction.type === "delete" && cell.tile && !cell.tile.start) {
          div.classList.add("action-selectable");
          div.addEventListener("click", function () {
            selectDeleteBoardTile(r, c);
          });
        }
        const img = document.createElement("img");
        img.src = tilePath + displayTileSrc(cell.tile);
        img.alt = cell.tile.name || "";
        img.style.transform = "rotate(" + (cell.rotation || 0) + "deg)";
        if (pendingDropCell && pendingDropCell.borderless && pendingDropCell.row === r && pendingDropCell.col === c) {
          div.classList.add("tile-drop");
          img.style.setProperty("--drop-rot", (cell.rotation || 0) + "deg");
        }
        div.appendChild(img);
        if (cellGlow) {
          cellGlow.tris.forEach(function (tri) {
            const g = document.createElement("div");
            g.className = "pattern-glow-tri";
            g.dataset.glowColor = tri.color;
            g.style.clipPath = TRI_CLIP[tri.d];
            applyGlowAnim(g, tri.since);
            div.appendChild(g);
          });
          if (cellGlow.lines.length) {
            appendPatternOutline(div, cellGlow.lines);
          }
        }
        els.world.appendChild(div);
      });

      // スタートタイル設置演出は描画した瞬間に使い切る（回転などの再描画で動かし直さない）
      if (usedStartAnimation) {
        state.startTileAnimating = false;
      }

      appendClassicLimitGuides(els.world);

      // 配置プレビュー（全モード共通方針）: 隣接する空きマス全てにゴーストを出し、
      // 置ける=緑/置けない=赤で示す。ホバー中マスにタイルのプレビューを表示し、
      // 「置けない所」でも消えず、回転で再描画されても hoverCell から復元して消えない。
      if (!state.over && currentPlayer() && !isCpuTurn()
        && (!hasPendingAction() || (state.pendingAction && (state.pendingAction.type === "salvage-place" || state.pendingAction.type === "life-damage")))) {
        const isSalvage = Boolean(state.pendingAction && state.pendingAction.type === "salvage-place");
        const tile = isSalvage ? state.pendingAction.tile : selectedPlacementTile();
        const rotation = isSalvage ? (state.pendingAction.rotation || 0) : state.selectedRotation;
        if (tile) {
          const placementAssist = currentPlacementAssistMode();
          const previewSpots = isHarvestMode() && Object.keys(state.blBoard || {}).length === 0
            ? [{ r: 0, c: 0 }]
            : WiggleRules.placeableSpotsDynamic(state.blBoard, null);
          previewSpots.forEach(function (spot) {
            if (!harvestSeasonAllowsCell(spot.r, spot.c)) {
              return;
            }
            if (!classicAllowsDynamicCell(spot.r, spot.c)) {
              return;
            }
            const legal = canPlaceDynamicShared(spot.r, spot.c, tile, rotation);
            const koBlocked = lifeKoBanActiveFor(currentPlayer(), spot.r, spot.c);
            const placementReason = legal ? "" : dynamicPlacementIssue(spot.r, spot.c, tile, rotation);
            const ghost = document.createElement("div");
            ghost.className = "bl-ghost";
            if (placementAssist === "on") {
              ghost.classList.add(legal ? "bl-ghost-legal" : "bl-ghost-illegal");
            }
            if (mobilePlacementConfirm
              && mobilePlacementConfirm.dynamic
              && mobilePlacementConfirm.row === spot.r
              && mobilePlacementConfirm.col === spot.c
              && mobilePlacementConfirm.selectionKey === mobilePlacementSelectionKey()) {
              if (placementAssist === "on") {
                ghost.classList.add("bl-ghost-armed");
              }
            }
            if (koBlocked) {
              ghost.classList.add("bl-ghost-ko");
            }
            if (placementAssist !== "off" && placementReason) {
              ghost.title = placementReason;
            }
            ghost.style.left = (spot.c * BL_CELL) + "px";
            ghost.style.top = (spot.r * BL_CELL) + "px";

            const fillPreview = function () {
              clearAllPlacementPreviews(ghost);
              ghost.classList.remove("bl-ghost-legal", "bl-ghost-illegal", "bl-ghost-armed");
              ghost.removeAttribute("title");
              if (placementAssist !== "off") {
                ghost.classList.add(legal ? "bl-ghost-legal" : "bl-ghost-illegal");
                updatePlacementFeedbackForCell(spot.r, spot.c, tile, rotation, true, legal);
              }
              if (placementAssist === "on"
                && mobilePlacementConfirm
                && mobilePlacementConfirm.dynamic
                && mobilePlacementConfirm.row === spot.r
                && mobilePlacementConfirm.col === spot.c
                && mobilePlacementConfirm.selectionKey === mobilePlacementSelectionKey()) {
                ghost.classList.add("bl-ghost-armed");
              }
              if (placementAssist !== "off" && placementReason) {
                ghost.title = placementReason;
              }
              ghost.innerHTML = "";
              const img = document.createElement("img");
              img.src = tilePath + displayTileSrc(tile, { forceFace: true });
              img.alt = "";
              applyRotationStyle(img, rotation, placementPreviewAnimationKey(spot.r, spot.c, true));
              ghost.appendChild(img);
            };

            ghost.addEventListener("click", function (event) {
              if (event && typeof event.button === "number" && event.button !== 0) {
                return;
              }
              if (Date.now() < blSwipeSuppressClickUntil) {
                return;
              }
              if (mobilePlacementConfirm
                && mobilePlacementConfirm.dynamic
                && (mobilePlacementConfirm.row !== spot.r || mobilePlacementConfirm.col !== spot.c)) {
                clearMobilePlacementConfirm();
              }
              hoverCell = { r: spot.r, c: spot.c };
              fillPreview();
              if (!legal) {
                return;
              }
              if (!confirmOrArmMobilePlacement(spot.r, spot.c, true)) {
                return;
              }
              if (isSalvage) {
                placePendingSalvageTileDynamic(spot.r, spot.c);
              } else {
                blPlace(spot.r, spot.c);
              }
            });
            ghost.addEventListener("contextmenu", function (event) {
              event.preventDefault();
              rotateSelected(90);
            });
            ghost.addEventListener("mouseenter", function () {
              hoverCell = { r: spot.r, c: spot.c };
              fillPreview();
            });
            ghost.addEventListener("mouseleave", function () {
              if (hoverCell && hoverCell.r === spot.r && hoverCell.c === spot.c) { hoverCell = null; }
              clearPlacementFeedback(spot.r, spot.c, true);
              ghost.innerHTML = "";
              if (placementAssist !== "on") {
                ghost.classList.remove("bl-ghost-legal", "bl-ghost-illegal", "bl-ghost-armed");
              }
            });
            // 回転などの再描画後も、仮置き中のマスのプレビューを復元
            const activePreviewCell = activePlacementPreviewCell(true);
            if (activePreviewCell && activePreviewCell.r === spot.r && activePreviewCell.c === spot.c) {
              fillPreview();
            }
            els.world.appendChild(ghost);
          });
        }
      }

      // 得点した模様の中心にマーカー（担当プレイヤーがいない色は出さない）。
      // 得点表示は完成時に出して、少し経つと消える（盤面に残り続けない）。
      const markerSeen = {};
      const nowMarker = performance.now();
      WiggleRules.detectClosedPatternsDynamic(dynamicScoringBoard()).forEach(function (pattern) {
        if (!ownerForColor(pattern.color)) { return; }
        const endAt = patternGlowEndAt[pattern.key];
        if (!endAt || nowMarker >= endAt) { return; }
        if (scoreMarkerSince[pattern.key] === undefined) {
          scoreMarkerSince[pattern.key] = patternGlowSince[pattern.key] || nowMarker; // 枠線と同じ開始時刻で同期
        }
        markerSeen[pattern.key] = true;
        const elapsed = nowMarker - scoreMarkerSince[pattern.key];
        const lifeMs = Math.max(420, endAt - scoreMarkerSince[pattern.key]); // 線/飛行と同じ長さで消す
        if (elapsed > lifeMs) { return; } // 演出後は消す
        const scoreInfo = dynamicPatternScoreInfo(pattern);
        const marker = document.createElement("span");
        marker.className = "bl-score-marker " + pattern.color;
        marker.style.left = (pattern.centerC * BL_CELL) + "px";
        marker.style.top = (pattern.centerR * BL_CELL) + "px";
        marker.innerHTML = scoreMarkerHtml(scoreInfo.points, scoreInfo.bonus);
        if (!prefersReducedMotionGlow()) {
          marker.style.animation = "bl-marker-life " + lifeMs
            + "ms ease-out " + (-elapsed) + "ms both";
        }
        els.world.appendChild(marker);
      });
      // 盤上から消えた模様は記録を破棄（崩して作り直したら再び表示）
      Object.keys(scoreMarkerSince).forEach(function (k) {
        if (!markerSeen[k]) { delete scoreMarkerSince[k]; }
      });

      if (resultViewMode() === "details") {
        resultScoreHighlightItems(true)
          .filter(function (item) {
            return item.borderless && Number.isFinite(item.centerR) && Number.isFinite(item.centerC);
          })
          .forEach(function (item) {
            const marker = document.createElement("span");
            marker.className = "bl-score-marker classic-bonus-result-marker " + item.color;
            marker.style.left = (item.centerC * BL_CELL) + "px";
            marker.style.top = (item.centerR * BL_CELL) + "px";
            marker.innerHTML = classicBonusResultMarkerHtml(item);
            els.world.appendChild(marker);
          });
      }

      if (isDynamicAutoCameraMode()) {
        fitClassicBlCamera();
      } else if (!state.blCentered) {
        centerBl();
        state.blCentered = true;
      } else {
        applyBlTransform();
      }

      // 動的盤面の配置アニメも一度だけ。回転などの再描画で直前の手が動き直さないようにする。
      if (pendingDropCell && pendingDropCell.borderless) {
        pendingDropCell = null;
      }
    }

    // デバッグ用: コンソールで wiggleDump() を実行すると盤面と判定結果を出力
    window.wiggleDump = function () {
      const board = state.board.map(function (row) {
        return row.map(function (cell) {
          if (!cell) {
            return ".";
          }
          return (cell.tile.start ? "S" : cell.tile.id) + "@" + (cell.rotation || 0);
        });
      });
      const patterns = detectCompletedPatterns();
      const text = "BOARD(id@rot):\n"
        + board.map(function (row) { return row.join("\t"); }).join("\n")
        + "\n\nCLOSED components:\n"
        + (patterns.length === 0 ? "(none)" : patterns.map(function (p) {
            return colorNames[p.color] + " " + p.points + "点 / " + (p.points * 2) + "ノード @ " + (p.row + 1) + "," + (p.col + 1);
          }).join("\n"));
      console.log(text);
      return text;
    };

    window.wiggleEdgeDebug = function (tileId, rotation = 0) {
      return ["top", "right", "bottom", "left"].reduce(function (result, edge) {
        result[edge] = Array.from({ length: edgeSampleCount }, function (_, index) {
          return sampleTileEdgeColor(tileId, rotation, edge, index);
        });
        return result;
      }, {});
    };

    window.wiggleEdgesConnectDebug = function (tileAId, edgeA, tileBId, edgeB, rotationA = 0, rotationB = 0) {
      return edgesConnect(
        { id: tileAId, start: tileAId === startTile.id },
        rotationA,
        edgeA,
        { id: tileBId, start: tileBId === startTile.id },
        rotationB,
        edgeB
      );
    };

    const initialParams = new URLSearchParams(window.location.search);
    const initialMode = initialParams.get("mode");
    const internalModeLabels = { borderless: "フリーダム（内部）", classicBonus: "クラシックBT（内部）" };
    if (internalModeLabels[initialMode] && elements.modeSelect && !elements.modeSelect.querySelector("option[value=\"" + initialMode + "\"]")) {
      const internalOption = document.createElement("option");
      internalOption.value = initialMode;
      internalOption.textContent = internalModeLabels[initialMode];
      elements.modeSelect.appendChild(internalOption);
    }
    if (["classic", "popjamScoreOpen", "borderless", "classicBonus"].indexOf(initialMode) >= 0) {
      elements.modeSelect.value = initialMode;
    }
    if (elements.viewModeSelect) {
      elements.viewModeSelect.value = "mobile";
    }
    const storedPlacementAssist = safeStorageGet(window.localStorage, "wiggle_placement_assist");
    const requestedPlacementAssist = initialParams.get("assist") || storedPlacementAssist || "on";
    const initialPlacementAssist = requestedPlacementAssist === "simple" ? "on" : requestedPlacementAssist;
    if (elements.placementAssistSelect && ["on", "off"].indexOf(initialPlacementAssist) >= 0) {
      elements.placementAssistSelect.value = initialPlacementAssist;
    }

    populatePlayerCountOptions(currentMode());
    const initialSetup = initialParams.get("setup");
    if (initialSetup && elements.playerCountSelect) {
      const hasInitialSetup = Array.prototype.some.call(elements.playerCountSelect.options, function (option) {
        return option.value === initialSetup;
      });
      if (hasInitialSetup) {
        elements.playerCountSelect.value = initialSetup;
      }
    }
    preloadTileImages();
    resetGame(false);
    trackPageViewOnce();

    if (initialParams.get("autostart") === "1") {
      setupGame();
    }
  </script>
</body>
</html>
