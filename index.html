<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@700&display=swap" rel="stylesheet">
  <title>Wiggle</title>
  <meta name="description" content="Wiggle — 色を囲んできれいな模様を作るだけ。ルールは簡単、ブラウザですぐ遊べる対戦パズルゲーム。">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Wiggle">
  <meta property="og:description" content="色を囲んできれいな模様を作るだけ。ルールは簡単、ブラウザですぐ遊べる対戦パズルゲーム。">
  <meta property="og:image" content="assets/ogp-wiggle.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="assets/ogp-wiggle.png">
  <style>
    :root {
      --bg: #f6f8fb;
      --ink: #111827;
      --muted: #667085;
      --line: #dfe6ef;
      --panel: #ffffff;
      --soft: #f1f4f8;
      --red: #ef4444;
      --yellow: #ffd400;
      --blue: #0b8fcf;
      --green: #237a57;
      --shadow-card: 0 14px 36px rgba(15, 23, 42, 0.08);
      --shadow-soft: 0 7px 20px rgba(15, 23, 42, 0.07);
      --shadow-tile: 0 10px 20px rgba(15, 23, 42, 0.15);
      --safe-zone: clamp(14px, 1.4vw, 28px);
      --safe-zone-y: clamp(10px, 1.1vw, 20px);
      --panel-gap: clamp(10px, 0.9vw, 14px);
    }

    * {
      box-sizing: border-box;
    }

    html {
      height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button,
    select,
    input {
      font: inherit;
    }

    [hidden] {
      display: none;
    }

    .dialog-backdrop[hidden],
    .settings-item[hidden],
    .settings-nested[hidden],
    .bl-viewport[hidden],
    .bl-hint[hidden] {
      display: none;
    }

    button {
      border: 1px solid #85785e;
      border-radius: 8px;
      padding: 9px 12px;
      background: #fff8e8;
      color: var(--ink);
      cursor: pointer;
      font-weight: 700;
    }

    button:hover {
      background: #ffffff;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }

    select,
    input {
      border: 1px solid #a79978;
      border-radius: 8px;
      padding: 8px 10px;
      background: #fffdfa;
      color: var(--ink);
      font-weight: 700;
    }

    .app {
      position: relative;
      width: min(1500px, calc(100vw - (var(--safe-zone) * 2)));
      height: 100vh;
      height: 100dvh;
      margin: 0 auto;
      padding: var(--safe-zone-y) 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: var(--panel-gap);
      overflow: hidden;
    }

    .topbar {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 14px;
      align-items: center;
      margin-bottom: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 12px;
      background: #fff7e3;
    }

    .title {
      min-width: 0;
    }

    .kicker {
      margin: 0 0 2px;
      color: #87691e;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.08em;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 3.2vw, 40px);
      line-height: 1;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
      align-items: center;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 420px;
      gap: var(--panel-gap);
      align-items: stretch;
      min-height: 0;
    }

    .play-area,
    .side {
      display: grid;
      gap: var(--panel-gap);
      min-height: 0;
    }

    .play-area {
      grid-template-rows: minmax(0, 1fr) auto;
    }

    .side {
      align-content: start;
      overflow: auto;
      padding-right: 2px;
    }

    .message-bar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px 14px;
      background: var(--panel);
    }

    .side .message-bar {
      grid-template-columns: 1fr;
      align-items: stretch;
    }

    .side .instruction-panel {
      grid-column: 1 / -1;
    }

    .side .message-bar .label {
      margin-bottom: 5px;
    }

    .side .main-info-value {
      min-height: 0;
      font-size: 18px;
    }

    .side .scoreline {
      grid-template-columns: 1fr;
      gap: 8px;
    }

    .side .score-pills {
      display: grid;
      grid-template-columns: 1fr;
    }

    .side .scoreline .score-pill {
      justify-content: space-between;
    }

    .main-info-value {
      display: block;
      min-height: 28px;
      font-size: clamp(18px, 2vw, 25px);
      font-weight: 900;
      line-height: 1.25;
      white-space: normal;
    }

    .scoreline {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 7px 10px;
      align-items: center;
      font-size: clamp(20px, 2.4vw, 30px);
      line-height: 1.1;
    }

    .score-lead {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      border-radius: 999px;
      padding: 5px 10px;
      background: #2f3338;
      color: #fff;
      font-size: 16px;
      font-weight: 950;
      white-space: nowrap;
    }

    .score-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      min-width: 0;
    }

    .scoreline .score-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border-radius: 999px;
      padding: 4px 10px;
      background: rgba(255, 255, 255, 0.68);
      box-shadow: inset 0 0 0 1px rgba(32, 36, 42, 0.12);
      font-size: 17px;
    }

    .scoreline .score-pill.current {
      background: #fffdfa;
      box-shadow: inset 0 0 0 2px rgba(32, 36, 42, 0.72);
    }

    .debug-status {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .stat {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
      background: var(--panel);
    }

    .label {
      display: block;
      margin-bottom: 3px;
      color: #74664e;
      font-size: 12px;
      font-weight: 800;
    }

    .value {
      display: block;
      font-size: 20px;
      font-weight: 900;
      white-space: nowrap;
    }

    .board-wrap {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 10px;
      align-items: start;
      min-height: 0;
      height: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: var(--safe-zone);
      background: #fbf3df;
      overflow: hidden;
      transition: background 180ms ease, border-color 180ms ease, box-shadow 180ms ease;
    }

    .board-wrap > .notification-lane {
      position: absolute;
      left: 50%;
      bottom: 6px;
      transform: translateX(-50%);
      width: calc(100% - 16px);
      z-index: 5;
      pointer-events: none;
    }

    .notification-lane {
      display: grid;
      place-items: center;
      min-height: 34px;
      margin-top: -2px;
      margin-bottom: 2px;
      padding-inline: 8px;
    }

    /* トーストが隠れている間は通知レーンの予約高さを消す（盤面と手札の隙間の原因） */
    .notification-lane:has(.score-toast[hidden]) {
      min-height: 0;
      margin-block: 0;
      padding: 0;
    }

    body.mode-popjam-score .notification-lane:has(.score-toast[hidden]) {
      min-height: 0;
      margin-block: 0;
      padding: 0;
    }

    /* 山札（共有札）を手札の左側に配置。全モード共通の並び。 */
    .hand-row {
      display: grid;
      grid-template-columns: 96px minmax(0, 1fr);
      gap: var(--panel-gap);
      align-items: start;
      min-height: 0;
    }

    .hand-row.deck-hidden {
      grid-template-columns: minmax(0, 1fr);
    }

    .board-wrap[data-turn-color="red"] {
      --turn-accent: var(--red);
      --turn-soft: rgba(239, 68, 68, 0.13);
      --turn-wash: #fff0ef;
      background: var(--turn-wash);
      border-color: rgba(239, 68, 68, 0.48);
      box-shadow: 0 0 0 2px rgba(239, 68, 68, 0.12);
    }

    .board-wrap[data-turn-color="yellow"] {
      --turn-accent: #d8a900;
      --turn-soft: rgba(255, 212, 0, 0.16);
      --turn-wash: #fff4bd;
      background: var(--turn-wash);
      border-color: rgba(216, 169, 0, 0.55);
      box-shadow: 0 0 0 2px rgba(216, 169, 0, 0.12);
    }

    .board-wrap[data-turn-color="blue"] {
      --turn-accent: var(--blue);
      --turn-soft: rgba(11, 143, 207, 0.13);
      --turn-wash: #e4f5ff;
      background: var(--turn-wash);
      border-color: rgba(11, 143, 207, 0.52);
      box-shadow: 0 0 0 2px rgba(11, 143, 207, 0.11);
    }

    .board-wrap[data-turn-color="green"] {
      --turn-accent: var(--green);
      --turn-soft: rgba(35, 122, 87, 0.13);
      --turn-wash: #e8f7eb;
      background: var(--turn-wash);
      border-color: rgba(35, 122, 87, 0.52);
      box-shadow: 0 0 0 2px rgba(35, 122, 87, 0.11);
    }

    .score-toast {
      z-index: 4;
      width: fit-content;
      max-width: calc(100% - 24px);
      border: 2px solid #20242a;
      border-radius: 999px;
      padding: 8px 16px;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 8px 22px rgba(45, 36, 20, 0.2);
      font-size: 18px;
      font-weight: 900;
      text-align: center;
    }

    .score-toast[data-score-color="red"] {
      border-color: var(--red);
      box-shadow: 0 8px 22px rgba(238, 67, 67, 0.2);
    }

    .score-toast[data-score-color="yellow"] {
      border-color: #d9aa00;
      box-shadow: 0 8px 22px rgba(217, 170, 0, 0.2);
    }

    .score-toast[data-score-color="blue"] {
      border-color: var(--blue);
      box-shadow: 0 8px 22px rgba(14, 139, 201, 0.2);
    }

    .score-toast[data-score-color="green"] {
      border-color: var(--green);
      box-shadow: 0 8px 22px rgba(72, 184, 59, 0.2);
    }

    .score-toast .toast-score-content {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 5px;
    }

    .score-toast .toast-color-chip {
      display: inline-grid;
      place-items: center;
      min-width: 28px;
      height: 22px;
      padding: 0 8px;
      border-radius: 999px;
      color: #fff;
      font-size: 12px;
      font-weight: 950;
      line-height: 1;
      box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.5);
    }

    .score-toast .toast-color-chip.red { background: var(--red); }
    .score-toast .toast-color-chip.yellow {
      background: #d6a800;
      color: #fff;
      text-shadow: 0 1px 1px rgba(23, 18, 8, 0.35);
    }
    .score-toast .toast-color-chip.blue { background: var(--blue); }
    .score-toast .toast-color-chip.green { background: var(--green); }

    .score-toast .player-role-chip {
      height: 22px;
      padding: 0 9px;
      font-size: 12px;
    }

    .score-toast .toast-count {
      color: #0f172a;
      font-weight: 950;
      white-space: nowrap;
    }

    .score-toast .toast-separator {
      color: #94a3b8;
      font-weight: 950;
      white-space: nowrap;
    }

    .score-marker {
      position: absolute;
      left: 50%;
      top: 50%;
      z-index: 6; /* ハテナ(外周 z4)・グロー(z3)より前面に出して得点ラベルが見切れないように */
      transform: translate(-50%, -50%);
      min-width: 62px;
      border: 2px solid #20242a;
      border-radius: 999px;
      padding: 6px 9px;
      background: rgba(255, 255, 255, 0.95);
      box-shadow: 0 6px 16px rgba(45, 36, 20, 0.22);
      color: #20242a;
      font-size: 13px;
      font-weight: 900;
      text-align: center;
      pointer-events: none;
    }

    .score-marker.red {
      border-color: var(--red);
      background: var(--red);
      color: #fff;
      box-shadow: 0 6px 16px rgba(238, 67, 67, 0.22);
    }

    .score-marker.yellow {
      border-color: #b89600;
      background: #f5c542;
      color: #fff;
      text-shadow: 0 1px 1px rgba(23, 18, 8, 0.35);
      box-shadow: 0 6px 16px rgba(217, 170, 0, 0.24);
    }

    .score-marker.blue {
      border-color: var(--blue);
      background: var(--blue);
      color: #fff;
      box-shadow: 0 6px 16px rgba(14, 139, 201, 0.22);
    }

    .score-marker.green {
      border-color: var(--green);
      background: var(--green);
      color: #fff;
      box-shadow: 0 6px 16px rgba(72, 184, 59, 0.22);
    }

    .score-marker.classic-bonus-result-marker,
    .bl-score-marker.classic-bonus-result-marker {
      z-index: 8;
      opacity: 0.94;
      animation: none;
    }

    .deck {
      display: grid;
      justify-items: center;
      gap: 6px;
    }

    .hand-row.deck-hidden .deck {
      display: none;
    }

    .deck-label {
      margin: 0;
      color: #5d4e2e;
      font-size: 15px;
      font-weight: 900;
      line-height: 1.1;
    }

    .deck-stack {
      position: relative;
      width: 70px;
      height: 70px;
    }

    .deck-stack::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 3;
      border-radius: 8px;
      background: url("assets/tiles/tile-000-back.png") center / cover no-repeat;
      box-shadow: 0 7px 14px rgba(45, 36, 20, 0.22);
      opacity: 0;
      transform: translate(0, 10px) scale(0.86);
      transition: opacity 160ms ease, transform 160ms ease;
      pointer-events: none;
    }

    .deck-stack.deck-has-cards::after {
      opacity: 0;
      transform: translate(0, 10px) scale(0.86);
    }

    .deck-card {
      position: absolute;
      inset: 0;
      width: 70px;
      height: 70px;
      border-radius: 8px;
      box-shadow: 0 7px 14px rgba(45, 36, 20, 0.22);
      object-fit: cover;
      transition: opacity 160ms ease, transform 160ms ease;
    }

    .deck-empty-outline {
      position: absolute;
      inset: 0;
      border: 3px dashed #bcae8f;
      border-radius: 9px;
      background: rgba(255, 255, 255, 0.18);
      opacity: 0;
      transform: scale(0.94);
      transition: opacity 160ms ease, transform 160ms ease;
    }

    .deck-visible-card {
      position: absolute;
      inset: 0;
      z-index: 2;
      width: 100%;
      height: 100%;
      border-radius: 8px;
      object-fit: cover;
      opacity: 0;
      transform: translate(0, 10px) scale(0.86);
      box-shadow: 0 7px 14px rgba(45, 36, 20, 0.22);
      transition: opacity 160ms ease, transform 160ms ease;
      pointer-events: none;
      image-rendering: auto;
      backface-visibility: hidden;
    }

    .deck-stack:not([data-count-level="0"]) .deck-visible-card {
      opacity: 1;
      transform: translate(0, 0) scale(1);
    }

    .deck-card:nth-child(1) {
      transform: translate(8px, 8px);
      opacity: 0.55;
    }

    .deck-card:nth-child(2) {
      transform: translate(4px, 4px);
      opacity: 0.78;
    }

    .deck-count {
      min-width: 70px;
      border-radius: 8px;
      padding: 6px;
      background: #2f3338;
      color: #fff;
      text-align: center;
      font-weight: 900;
    }

    .deck-count.empty {
      background: transparent;
      color: #5d4e2e;
      box-shadow: inset 0 0 0 1px #d2bf96;
    }

    .deck-stack[data-count-level="0"] .deck-card {
      opacity: 0;
      transform: translate(0, 10px) scale(0.86);
    }

    .deck-stack[data-count-level="0"] .deck-empty-outline {
      opacity: 1;
      transform: scale(1);
    }

    .deck-stack.deck-has-cards .deck-card {
      opacity: 0;
      transform: translate(0, 10px) scale(0.86);
    }

    .deck-stack.deck-has-cards .deck-empty-outline {
      opacity: 0;
      transform: scale(0.86);
    }

    .deck-stack[data-count-level="1"] .deck-card:nth-child(1),
    .deck-stack[data-count-level="1"] .deck-card:nth-child(2) {
      opacity: 0;
    }

    .deck-stack[data-count-level="2"] .deck-card:nth-child(1) {
      opacity: 0;
    }

    .deck-stack.deck-decrease .deck-card:nth-child(3) {
      animation: deck-peel 360ms ease-out;
    }

    .deck-count.deck-count-bump {
      animation: deck-count-bump 360ms ease-out;
    }

    .shared-market {
      display: none;
      gap: 10px;
    }

    .shared-market.active {
      display: flex;
      flex-wrap: wrap;
      margin-top: 4px;
    }

    .shared-market-label {
      margin-top: 10px;
      color: #74664e;
      font-size: 12px;
      font-weight: 900;
      line-height: 1.2;
    }

    .shared-market .hand-tile {
      width: 72px;
      min-width: 72px;
    }

    .hand-tile.market-refill {
      animation: market-refill-pop 520ms ease-out;
    }

    @keyframes deck-peel {
      0% { transform: translateY(-12px) rotate(-7deg); opacity: 0.2; }
      70% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(0) rotate(0deg); opacity: 1; }
    }

    @keyframes deck-count-bump {
      0% { transform: scale(1); }
      45% { transform: scale(1.12); background: #237a57; }
      100% { transform: scale(1); }
    }

    @keyframes market-refill-pop {
      0% {
        transform: translateY(-8px) scale(0.9);
        box-shadow: 0 0 0 0 rgba(35, 122, 87, 0), 0 7px 15px rgba(45, 36, 20, 0.18);
      }
      54% {
        transform: translateY(0) scale(1.06);
        box-shadow: 0 0 0 5px rgba(35, 122, 87, 0.28), 0 10px 18px rgba(45, 36, 20, 0.22);
      }
      100% {
        transform: translateY(0) scale(1);
        box-shadow: 0 7px 15px rgba(45, 36, 20, 0.18);
      }
    }

    .deal-animation-layer {
      position: fixed;
      inset: 0;
      z-index: 30;
      pointer-events: none;
    }

    .river-card-flyer {
      position: fixed;
      left: 0;
      top: 0;
      width: 58px;
      height: 58px;
      border-radius: 8px;
      box-shadow: 0 12px 24px rgba(38, 32, 20, 0.32);
      object-fit: cover;
      opacity: 0;
      animation: river-card-fly 620ms cubic-bezier(0.18, 0.82, 0.22, 1) forwards;
      animation-delay: var(--delay, 0ms);
    }

    .river-card-flyer.slow {
      animation-duration: 1120ms;
    }

    /* 完成した色と点数 → 得点欄へ飛ぶスコアポップ */
    .score-fly-pop {
      position: fixed;
      left: 0;
      top: 0;
      display: inline-grid;
      place-items: center;
      min-width: 42px;
      height: 34px;
      padding: 0 12px;
      border: 2px solid rgba(255, 255, 255, 0.72);
      border-radius: 999px;
      color: #fff;
      font-size: 18px;
      font-weight: 950;
      line-height: 1;
      letter-spacing: 0;
      box-shadow: 0 8px 18px rgba(38, 32, 20, 0.28), inset 0 0 0 1px rgba(255, 255, 255, 0.28);
      opacity: 0;
      z-index: 60;
      animation: score-pop-fly 720ms cubic-bezier(0.3, 0.7, 0.2, 1) forwards;
      animation-delay: var(--delay, 0ms);
    }
    .score-fly-pop.red { background: #ef4444; }
    .score-fly-pop.yellow { background: #f5c542; color: #fff; text-shadow: 0 1px 1px rgba(23, 18, 8, 0.35); }
    .score-fly-pop.blue { background: #0ea5e9; }
    .score-fly-pop.green { background: #4cc33f; }
    .score-marker .bonus-line,
    .score-fly-pop .bonus-line,
    .bl-score-marker .bonus-line {
      display: block;
      margin-top: 2px;
      font-size: 10px;
      font-weight: 850;
      line-height: 1;
      opacity: 0.88;
    }
    @keyframes score-pop-fly {
      0% { opacity: 0; transform: translate(var(--from-x), var(--from-y)) translate(-50%, -50%) scale(0.72); }
      16% { opacity: 1; }
      62% { opacity: 1; transform: translate(var(--mid-x), var(--mid-y)) translate(-50%, -50%) scale(1.08); }
      100% { opacity: 1; transform: translate(var(--to-x), var(--to-y)) translate(-50%, -50%) scale(0.72); }
    }

    /* ライフ系の小さな移動演出では従来のひし形を使う */
    .score-fly-diamond {
      position: fixed;
      left: 0;
      top: 0;
      width: 18px;
      height: 18px;
      border-radius: 3px;
      box-shadow: 0 4px 10px rgba(38, 32, 20, 0.3), inset 0 0 0 1px rgba(255, 255, 255, 0.55);
      opacity: 0;
      z-index: 60;
      animation: score-fly 720ms linear forwards;
      animation-delay: var(--delay, 0ms);
    }
    .score-fly-diamond.red { background: #ef4444; }
    .score-fly-diamond.yellow { background: #f5c542; }
    .score-fly-diamond.blue { background: #0ea5e9; }
    .score-fly-diamond.green { background: #4cc33f; }
    .score-fly-diamond.locked { background: #6b7280; }
    @keyframes score-fly {
      0% {
        opacity: 0;
        transform: translate(var(--from-x), var(--from-y)) rotate(45deg) scale(0.55);
        animation-timing-function: cubic-bezier(0.12, 0.6, 0.35, 1);
      }
      12% { opacity: 1; }
      46% {
        opacity: 1;
        transform: translate(var(--mid-x), var(--mid-y)) rotate(45deg) scale(1.06);
        animation-timing-function: cubic-bezier(0.55, 0, 0.75, 0.4);
      }
      86% { opacity: 1; transform: translate(var(--to-x), var(--to-y)) rotate(45deg) scale(0.6); }
      100% { opacity: 0; transform: translate(var(--to-x), var(--to-y)) rotate(45deg) scale(0.42); }
    }

    .pending-target {
      position: relative;
      overflow: hidden;
    }

    @keyframes river-card-fly {
      0% {
        opacity: 0;
        transform: translate(var(--from-x), var(--from-y)) scale(1) rotate(var(--from-rot, 0deg));
      }

      16% {
        opacity: 1;
      }

      68% {
        opacity: 1;
        transform: translate(var(--mid-x), var(--mid-y)) scale(0.92) rotate(5deg);
      }

      100% {
        opacity: 0;
        transform: translate(var(--to-x), var(--to-y)) scale(0.54) rotate(0deg);
      }
    }

    .board {
      position: relative;
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 0;
      width: min(68%, 500px, calc(100dvh - 390px));
      min-width: min(300px, 68%);

      justify-self: center;
      margin: 0 auto;
      border: 2px solid #d3bf92;
      background: #d3bf92;
      overflow: visible;
    }

    .board-result-overlay {

    .board-result-card {

    .board-result-card .tiebreak .player-role-chip {

    .board-result-card .result-rows {
      display: inline-grid;
      grid-template-columns: auto auto auto auto;
      column-gap: 14px;
      row-gap: 5px;
      align-items: baseline;
      text-align: left;
      font-size: 17px;
      font-weight: 900;
    }

    .board-result-card .result-rows .rr-rank,
    .board-result-card .result-rows .rr-name {
      white-space: nowrap;
    }

    .board-result-card .result-rows .rr-score {
      white-space: nowrap;
      text-align: right;
    }

    .board-result-card .result-rows .rr-note {
      white-space: nowrap;

      font-weight: 700;
      color: #b8443a;
    }

    .board-result-card .result-rows .rr-note-clear {

    }

    .board-result-card .result-rows.result-score-rows {
      display: grid;
      grid-template-columns: minmax(0, 1fr);

    }

    .board-result-card .result-score-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;

      column-gap: 10px;
      padding: 2px 0;

      border-radius: 0;
      background: transparent;
      box-shadow: none;
    }

    .board-result-card .result-score-row.win {
      background: transparent;
      border-color: transparent;
    }

    .board-result-card .result-score-row.lose {
      background: transparent;
      border-color: transparent;
    }

    .board-result-card .result-score-main {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      overflow: hidden;
    }

    .board-result-card .result-score-main .compact-score-inline {
      flex: 0 1 138px;
      min-width: 74px;
      max-width: min(132px, 34vw);
      flex-wrap: wrap;
    }

    .board-result-card .result-score-points {
      min-width: 28px;
      text-align: right;
      font-size: 20px;
      font-weight: 950;
      color: #0f172a;
    }

    .board-result-card .result-score-outcome {
      justify-self: end;
      border-radius: 999px;
      padding: 3px 7px;
      font-size: 10px;
      font-weight: 950;
      line-height: 1;
      white-space: nowrap;
      color: #fff;
      background: #237a57;
    }

    .board-result-card .result-score-outcome.lose {
      background: #c84242;
    }

    .cell {
      position: relative;
      aspect-ratio: 1;
      border: 0;
      border-radius: 0;
      padding: 0;
      background: #f7ead0;
      overflow: visible;
      outline: 1px dashed #c8b78f;
      outline-offset: -5px;
    }

    .cell.placeable {
      background: #ecf7ec;
      outline: 3px solid #317858;
      outline-offset: -4px;
      border-radius: 4px;
    }

    .cell.blocked {
      opacity: 0.75;
    }

    .cell.has-tile {
      background: transparent;
      outline: 0;
    }

    .cell.inner-question {
      background: #dde1e4;
      box-shadow: inset 0 0 0 2px #4f5358;
    }

    .cell.inner-question.revealed {
      background: #eef2f4;
    }

    .cell.owned-inner-question {
      box-shadow: inset 0 0 0 3px #f0c542, 0 0 0 2px rgba(32, 36, 42, 0.2);
    }

    .cell.inner-question.just-revealed img {
      animation: question-reveal 420ms cubic-bezier(0.18, 0.9, 0.2, 1.05);
    }

    .external-question {
      position: absolute;
      z-index: 4;
      width: 20%;
      height: 20%;
      border: 0;
      border-radius: 0;
      padding: 0;
      background: transparent;
      overflow: visible;
    }

    .external-question.top,
    .external-question.bottom {
      left: calc(var(--slot-index) * 20%);
    }

    .external-question.top {
      top: -20%;
    }

    .external-question.bottom {
      top: 100%;
    }

    .external-question.left,
    .external-question.right {
      top: calc(var(--slot-index) * 20%);
    }

    .external-question.left {
      left: -20%;
    }

    .external-question.right {
      left: 100%;
    }

    .external-question img {
      width: 100%;
      height: 100%;
      border-radius: 0;
      object-fit: cover;
      display: block;
      transform: rotate(var(--question-rot, 0deg));
      transform-origin: center;
      box-shadow: 0 7px 14px rgba(45, 36, 20, 0.22);
    }

    .external-question.just-revealed img {
      animation: question-reveal 420ms cubic-bezier(0.18, 0.9, 0.2, 1.05);
    }

    .external-question.action-used img {
      opacity: 0.78;
    }

    .external-question.pending-effect img,
    .cell.inner-question.pending-effect img {
      outline: 4px solid #f0c419;
      outline-offset: -4px;
      box-shadow: 0 0 0 5px rgba(240, 196, 25, 0.32), 0 10px 20px rgba(45, 36, 20, 0.28);
    }

    @keyframes question-reveal {
      0% { opacity: 0; transform: rotate(var(--question-rot, 0deg)) rotateY(86deg) scale(0.86); }
      65% { opacity: 1; transform: rotate(var(--question-rot, 0deg)) rotateY(0deg) scale(1.08); }
      100% { opacity: 1; transform: rotate(var(--question-rot, 0deg)) rotateY(0deg) scale(1); }
    }

    .cell img,
    .hand-tile img,
    .small-tile img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      border-radius: 0;
      transform-origin: center;
    }

    .hand-tile img,
    .small-tile img,
    .ghost-preview img,

    img.rotate-anim {

    }

    @keyframes tile-rotate-step {
      from { transform: rotate(var(--rotate-from, 0deg)) scale(0.985); }
      58% { transform: rotate(var(--rotate-to, 0deg)) scale(1.04); }
      to { transform: rotate(var(--rotate-to, 0deg)) scale(1); }
    }

    .coord {

    .player-label.green {

    .turn-icon {

      border-radius: 999px;

    .turn-radio::after {
      content: "";

      height: 9px;
      border-radius: 999px;
      background: var(--turn-radio-color);
      opacity: 0;
      transform: scale(0.82);

    .turn-radio.active::after {
      opacity: 1;
      animation: turn-radio-pulse 1.45s ease-in-out infinite;
    }

    .turn-radio.red {
      --turn-radio-color: #ef4444;
      --turn-radio-glow: rgba(239, 68, 68, 0.24);
    }

    .turn-radio.yellow {
      --turn-radio-color: #d6a800;
      --turn-radio-glow: rgba(214, 168, 0, 0.26);
    }

    .turn-radio.blue {
      --turn-radio-color: #0ea5e9;
      --turn-radio-glow: rgba(14, 165, 233, 0.24);
    }

    .turn-radio.green {
      --turn-radio-color: #4cc33f;
      --turn-radio-glow: rgba(76, 195, 63, 0.24);

      100% {

      50% {
        opacity: 1;
        transform: scale(1.06);
        box-shadow: 0 0 0 5px rgba(255, 255, 255, 0);

    .player,

      bottom: 14px;
      z-index: 12;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      width: min(320px, 36%);
      border-color: rgba(185, 203, 226, 0.8);
      background: rgba(255, 255, 255, 0.76);
      box-shadow: 0 14px 34px rgba(23, 34, 50, 0.14);
      backdrop-filter: blur(8px);
    }

    body:not(.debug-log-on) .log-overlay {
      display: none;
    }

    .log-overlay .section-head {
      margin-bottom: 8px;
    }

    .log-overlay .log {
      max-height: none;
      min-height: 0;
      padding-right: 2px;
    }

    .log-entry {
      border-radius: 8px;
      padding: 7px 8px;
      background: #f2e8d3;
      font-size: 13px;
      line-height: 1.4;
    }

    .result {
      border: 2px solid #2f3338;
      border-radius: 8px;
      padding: 10px 12px;
      background: #2f3338;
      color: #fff;
      font-weight: 900;

    .result.compact {
      max-width: 460px;
      font-size: 14px;
      line-height: 1.35;
    }

    .danger {
      background: #ffefef;
      border-color: #c84242;
      color: #7e1f1f;
    }

    .positive {
      background: #e8f7eb;
      border-color: #237a57;
      color: #15543b;
    }

    .positive:hover {
      background: #f5fff8;
    }

    .dialog-backdrop {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: grid;
      place-items: center;
      padding: 18px;
      background: rgba(32, 36, 42, 0.22);
    }

    .confirm-dialog {
      width: min(360px, calc(100vw - 40px));
      border: 1px solid #8e8064;
      border-radius: 10px;
      padding: 18px;
      background: #fffaf0;
      box-shadow: 0 18px 44px rgba(45, 36, 20, 0.24);
      text-align: center;
    }

    .confirm-dialog h2 {
      margin: 0 0 7px;
      font-size: 22px;
    }

    .confirm-dialog .note {
      margin: 0 0 16px;
      color: #6f624b;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.5;
    }

    .confirm-dialog .button-row {
      justify-content: center;
    }

    .primary {
      background: #237a57;
      border-color: #1e674a;
      color: #fff;
    }

    @media (max-width: 900px) {
      .layout {
        grid-template-columns: 1fr;
        grid-template-rows: minmax(0, 1fr) minmax(145px, 30dvh);
        gap: 8px;
      }

      .side {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        align-content: start;
      }

      .side .message-bar,
      .side .players {
        grid-column: 1 / -1;
      }
    }

    @media (max-width: 760px) {
      .app {
        width: calc(100vw - 12px);
        padding: 6px 0;
        gap: 6px;
      }

      .topbar,
      .board-wrap,
      .hand-row,
      .action-grid,
      .debug-status,
      .message-bar,
      .turn-panel-grid,
      .side {
        grid-template-columns: 1fr;
      }

      .topbar {
        gap: 6px;
        padding: 7px;
      }

      .kicker {
        display: none;
      }

      h1 {
        font-size: 28px;
      }

      .controls {
        display: grid;
        grid-template-columns: 1fr 1fr;
        justify-content: stretch;
        gap: 6px;
      }

      .controls > * {
        width: 100%;
        min-width: 0;
      }

      button,
      select,
      input {
        padding: 7px 8px;
      }

      .board {
        grid-template-columns: repeat(5, 1fr);
        width: min(86vw, calc(100dvh - 420px));
        min-width: min(250px, 86vw);
      }

      .scoreline {
        grid-template-columns: 1fr;
      }

      .score-lead {
        width: fit-content;
      }

      .play-area {
        gap: 6px;
      }

      .board-wrap,
      .hand-panel,
      .players,
      .turn-panel,
      .log-panel,
      .message-bar {
        padding: 7px;
      }

      .bl-viewport {
        min-height: 0;
      }

      .hand-row {
        grid-template-columns: 62px minmax(0, 1fr);
        gap: 6px;
      }

      .deck-label {
        font-size: 12px;
      }

      .deck-stack,
      .deck-card {
        width: 52px;
        height: 52px;
      }

      .deck-count {
        min-width: 52px;
        padding: 4px;
        font-size: 12px;
      }

      .section-head {
        gap: 6px;
        margin-bottom: 6px;
      }

      .section-head h2,
      .section-head h3 {
        font-size: 14px;
      }

      .hand {
        grid-template-columns: repeat(auto-fill, minmax(46px, 1fr));
        gap: 6px;
        min-height: 50px;
        max-height: 72px;
      }

      .rotate-button {
        min-width: 76px;
        padding: 6px 7px;
        font-size: 12px;
      }

      .side {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 6px;
      }

      .side .message-bar,
      .side .players {
        grid-column: 1 / -1;
      }

      .side .main-info-value {
        font-size: 13px;
        line-height: 1.25;
      }

      .log {
        max-height: 64px;
      }

      .log-entry {
        padding: 5px 6px;
        font-size: 11px;
      }
    }

    @media (max-height: 760px) and (min-width: 901px) {
      .app {
        padding: 6px 0;
        gap: 6px;
      }

      .topbar {
        padding: 6px 10px;
      }

      .kicker {
        font-size: 10px;
      }

      h1 {
        font-size: 32px;
      }

      button,
      select,
      input {
        padding: 7px 9px;
      }

      .layout,
      .play-area,
      .side {
        gap: 8px;
      }

      .board-wrap,
      .hand-panel,
      .players,
      .turn-panel,
      .log-panel,
      .message-bar {
        padding: 8px;
      }

      .hand {
        min-height: 58px;
        max-height: 104px;
      }

      .bl-viewport {
        min-height: 260px;
      }

      .log {
        max-height: 145px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .deal-card-flyer,
      .pending-target.deal-target-flash {
        animation-duration: 120ms;
      }
    }

    /* ===== 演出・UI改善 追加スタイル ===== */

    /* 完成トースト: スッと出てフェード */
    .score-toast {
      animation: toast-in 320ms cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    @keyframes toast-in {
      0% { opacity: 0; transform: translateY(-4px) scale(0.96); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* 得点ラベル: ポップして出て、少し待ってフェードアウト */
    .score-marker {
      animation: marker-pop 380ms cubic-bezier(0.18, 1.2, 0.4, 1) both,
                 marker-fade 600ms ease-in 2200ms both;
    }

    .score-marker.score-marker-static {
      animation: none;
      opacity: 1;
    }

    @keyframes marker-pop {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(0.3); }
      70% { opacity: 1; transform: translate(-50%, -50%) scale(1.12); }
      100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    }

    @keyframes marker-fade {
      0% { opacity: 1; }
      100% { opacity: 0; }
    }

    .score-marker .marker-sym {
      margin-right: 3px;
      font-size: 11px;
    }

    /* 完成した模様マスのグロー */
    .cell.completion-flash::after,
    .bl-tile.completion-flash::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      border-radius: 2px;
      animation: completion-glow 900ms ease-out forwards;
    }

    .cell.completion-flash[data-flash-color="red"]::after { box-shadow: inset 0 0 0 3px var(--red); }
    .cell.completion-flash[data-flash-color="yellow"]::after { box-shadow: inset 0 0 0 3px #b89600; }
    .cell.completion-flash[data-flash-color="blue"]::after { box-shadow: inset 0 0 0 3px var(--blue); }
    .cell.completion-flash[data-flash-color="green"]::after { box-shadow: inset 0 0 0 3px var(--green); }
    .bl-tile.completion-flash[data-flash-color="red"]::after { box-shadow: inset 0 0 0 3px var(--red); }
    .bl-tile.completion-flash[data-flash-color="yellow"]::after { box-shadow: inset 0 0 0 3px #b89600; }
    .bl-tile.completion-flash[data-flash-color="blue"]::after { box-shadow: inset 0 0 0 3px var(--blue); }
    .bl-tile.completion-flash[data-flash-color="green"]::after { box-shadow: inset 0 0 0 3px var(--green); }

    @keyframes completion-glow {
      0% { opacity: 0; transform: scale(1.04); }
      30% { opacity: 1; }
      100% { opacity: 0; transform: scale(1); }
    }

    /* ===== テスト: 得点した模様の常時グロー（PATTERN_GLOW.persistent で制御） =====
       白い分割線で囲われた色の三角領域だけを、模様の形でゆっくり弱く点滅させて「得点源」を強調。
       clip-path で三角に切り抜き、screen 合成で元の色面を発光させる。
       不要なら PATTERN_GLOW.persistent = false（または setPatternGlow(false)）で消えます。 */
    /* 完成した瞬間に「模様の領域内」を一度だけ強く光らせて消える（mix-blend screen で発光）。
       animation は JS が各模様の完成時刻を基準に inline 設定（回転等の再描画でも一度きり）。 */
    .pattern-glow-tri {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      mix-blend-mode: screen;
      opacity: 0;
    }
    .pattern-glow-tri[data-glow-color="red"] { background: rgba(239, 68, 68, 0.95); }
    .pattern-glow-tri[data-glow-color="yellow"] { background: rgba(245, 205, 45, 0.95); }
    .pattern-glow-tri[data-glow-color="blue"] { background: rgba(45, 165, 225, 0.95); }
    .pattern-glow-tri[data-glow-color="green"] { background: rgba(65, 190, 125, 0.95); }
    @keyframes pattern-glow-burst {
      0% { opacity: 0; }
      12% { opacity: 0.95; }
      38% { opacity: 0.5; }
      60% { opacity: 0.85; }
      100% { opacity: 0; }
    }

    /* 完成後も継続: 模様を囲う白い線を、その色の明るい版（青→水色）で光らせ続ける。 */
    .pattern-outline {
      position: absolute;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      overflow: visible;
    }
    .pattern-outline line {
      stroke-width: 6.5;
      stroke-linecap: round;
    }

    /* 配置アニメ: スッと落ちて弾む */
    .cell.tile-drop img,
    .bl-tile.tile-drop img {
      animation: tile-drop 420ms cubic-bezier(0.2, 0.9, 0.25, 1.05);
    }

    .cell.start-auto-place img {
      animation: start-place 700ms cubic-bezier(0.18, 0.9, 0.2, 1.05);
    }

    @keyframes tile-drop {
      0% { opacity: 0; transform: translateY(-26px) scale(0.86) rotate(var(--drop-rot, 0deg)); }
      60% { opacity: 1; }
      100% { opacity: 1; transform: translateY(0) scale(1) rotate(var(--drop-rot, 0deg)); }
    }

    @keyframes start-place {
      0% { opacity: 0; transform: translateY(-58px) scale(0.72) rotate(-10deg); }
      58% { opacity: 1; transform: translateY(4px) scale(1.03) rotate(2deg); }
      100% { opacity: 1; transform: translateY(0) scale(1) rotate(0deg); }
    }

    /* ゴーストプレビュー */
    .ghost-preview {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      opacity: 0.5;
    }

    .ghost-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .cell.ghost-legal {
      outline: 3px solid #317858;
      outline-offset: -4px;
      border-radius: 4px;
    }

    .cell.ghost-armed {
      outline-width: 4px;
      box-shadow: inset 0 0 0 5px rgba(35, 122, 87, 0.12), 0 8px 24px rgba(15, 23, 42, 0.12);
    }

    .cell.ghost-illegal {
      outline: 3px dashed #c84242;
      outline-offset: -4px;
      border-radius: 4px;
    }

    .cell.ghost-illegal .ghost-preview {
      opacity: 0.32;
      filter: grayscale(0.4);
    }

    /* CPU思考バッジ */
    .cpu-badge {
      display: inline-flex;
      gap: 5px;
      align-items: center;
      border-radius: 999px;
      padding: 3px 9px;
      background: #2f3338;
      color: #fff;
      font-size: 12px;
      font-weight: 800;
    }

    .cpu-badge .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ffd400;
      animation: cpu-pulse 900ms ease-in-out infinite;
    }

    @keyframes cpu-pulse {
      0%, 100% { opacity: 0.3; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    /* 受け取りバンプ "+N" */
    .receive-bump {
      position: fixed;
      z-index: 31;
      transform: translate(-50%, 0);
      border-radius: 999px;
      padding: 2px 8px;
      background: #237a57;
      color: #fff;
      font-size: 12px;
      font-weight: 900;
      pointer-events: none;
      animation: receive-bump 1100ms ease-out forwards;
    }

    @keyframes receive-bump {
      0% { opacity: 0; transform: translate(-50%, 6px) scale(0.7); }
      25% { opacity: 1; transform: translate(-50%, -6px) scale(1.1); }
      70% { opacity: 1; transform: translate(-50%, -14px) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -30px) scale(0.95); }
    }

    /* 手番強調（現在プレイヤー名のチップ） */
    .turn-chip {
      display: inline-flex;
      gap: 6px;
      align-items: center;
    }

    .turn-chip .swatch {
      width: 14px;
      height: 14px;
    }

    /* 座標ラベル: 既定は薄く、OFFで非表示 */
    .coord {
      opacity: 0.5;
      transition: opacity 140ms ease;
    }

    .board.hide-coords .coord {
      display: none;
    }

    /* 色記号（アクセシビリティ）: スウォッチ/ボタンに文字を重ねる */
    .swatch {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 11px;
      font-weight: 900;
      text-shadow: 0 1px 1px rgba(0, 0, 0, 0.45);
      line-height: 1;
    }

    .swatch.yellow {
      color: #5a4a00;
      text-shadow: 0 1px 1px rgba(255, 255, 255, 0.5);
    }

    /* デバッグUIの隔離 */
    body:not(.debug-on) [data-debug] {
      display: none;
    }

    body:not(.debug-status-on) [data-debug-status],
    body:not(.debug-actions-on) [data-debug-action] {
      display: none;
    }

    .toggle-row {
      display: flex;
      gap: 6px;
      align-items: center;
      font-size: 13px;
      font-weight: 800;
      color: #5d4e2e;
    }

    .toggle-row input {
      width: auto;
      margin: 0;
    }

    .settings-button {
      min-width: 94px;
    }

    .settings-dialog {
      width: min(430px, calc(100vw - 40px));
      text-align: left;
    }

    .settings-dialog h2 {
      margin-bottom: 14px;
    }

    .settings-group {
      display: grid;
      gap: 10px;
      margin: 0 0 14px;
    }

    .settings-item {
      display: grid;
      gap: 6px;
      padding: 12px;
      border: 1px solid #d7dee8;
      border-radius: 14px;
      background: #f8fafc;
    }

    .settings-item .label {
      color: #4b5563;
      font-size: 12px;
      font-weight: 800;
    }

    .settings-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-weight: 850;
    }

    .settings-toggle input {
      width: 22px;
      height: 22px;
      min-height: 0;
      margin: 0;
      box-shadow: none;
    }

    /* ===== ポップジャム: 川・放出UI ===== */

    /* 手札が多くなるのでパネル内でスクロール */
    .hand {
      max-height: min(16dvh, 150px);
      overflow: auto;
    }

    body.mode-popjam .hand {
      max-height: clamp(148px, 23dvh, 230px);
      padding-bottom: 12px;
      align-content: start;
      /* 計算済みの縮小サイズをトラック最小に使い、増えても1行に収める（はみ出しスクロールバー防止） */
      grid-template-columns: repeat(auto-fill, minmax(var(--hand-fit-tile-size, 70px), 1fr));
      overflow: hidden;
    }

    body.view-mobile.mode-popjam .hand {
      max-height: clamp(150px, 26dvh, 220px);
    }

    /* 放出（捨てる）モード: 手札パネルを強調し、捨てられることを示す */
    .hand-panel.discard-mode {
      box-shadow: 0 0 0 3px rgba(35, 122, 87, 0.35);
    }

    .hand-panel.discard-mode #handTitle {
      color: #1f7a5b;
    }

    .hand-panel.win-discard-mode {
      box-shadow: 0 0 0 3px rgba(220, 70, 70, 0.34), 0 16px 34px rgba(80, 44, 20, 0.1);
    }

    .hand-panel.win-discard-mode #handTitle {
      color: #b53939;
    }

    .hand-tile.hidden-hand {
      cursor: default;
      opacity: 0.86;
    }

    .score-diamond.locked {
      background: #6b7280;
      box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.28);
    }

    .hand-tile.showcase-discard {
      cursor: default;
      border-color: #b53939;
      box-shadow: 0 0 0 3px rgba(220, 70, 70, 0.28), 0 7px 15px rgba(45, 36, 20, 0.18);
    }

    .question-choice-panel {
      display: grid;
      grid-column: 1 / -1;
      gap: 10px;
      margin-bottom: 12px;
      padding: 12px;
      border: 2px solid #e0b83e;
      border-radius: 10px;
      background: #fff8d8;
    }

    .question-choice-panel strong {
      font-size: 15px;
    }

    .question-choice-list {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .question-choice-button {
      display: grid;
      gap: 5px;
      justify-items: center;
      width: 86px;
      padding: 7px;
      border: 2px solid #2f3338;
      border-radius: 8px;
      background: #fffdf5;
      font-weight: 900;
    }

    .question-choice-button img {
      width: 62px;
      height: 62px;
      object-fit: cover;
      box-shadow: 0 4px 10px rgba(45, 36, 20, 0.18);
    }

    .question-choice-button.selected,
    .small-tile.selectable.selected,
    .hand-tile.action-selected {
      box-shadow: 0 0 0 4px #ffd400, 0 7px 15px rgba(45, 36, 20, 0.18);
      border-color: #23282d;
    }

    .action-target-panel {
      display: grid;
      grid-column: 1 / -1;
      gap: 10px;
      margin-bottom: 12px;
      padding: 12px;
      border: 2px solid #5c86d6;
      border-radius: 10px;
      background: #eef5ff;
    }

    .action-target-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .target-player-button {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      border: 2px solid #2f3338;
      background: #fffdf5;
      font-weight: 900;
    }

    .target-player-button.selected {
      border-color: #237a57;
      background: #e8f7eb;
      box-shadow: 0 0 0 3px rgba(35, 122, 87, 0.2);
    }

    .hand-tile.giftable {
      cursor: pointer;
      border-color: #237a57;
      box-shadow: 0 0 0 2px rgba(35, 122, 87, 0.2), 0 7px 15px rgba(45, 36, 20, 0.18);
    }

    .hand-tile.giftable:hover {
      box-shadow: 0 0 0 4px rgba(35, 122, 87, 0.35), 0 9px 18px rgba(45, 36, 20, 0.2);
    }

    .cell.action-target {
      outline: 4px solid #5c86d6;
      outline-offset: -5px;
      cursor: pointer;
    }

    .cell.salvage-placeable {
      background: #e8f5ff;
      outline: 4px solid #237a9b;
      outline-offset: -5px;
    }

    /* POP JAM: ロック/スポットライトの効果範囲を可視化(2026-09-23)。スポットライト=温色グロー(::before)、ロック=寒色斜線(::after)。両立可・発動中のみ。 */
    .cell.pj-spotlit, .cell.pj-locked { position: relative; }
    .cell.pj-spotlit::before {
      content: ""; position: absolute; inset: 0; border-radius: inherit;
      background: radial-gradient(circle at 50% 42%, rgba(255,214,90,0.45), rgba(255,206,70,0.16));
      box-shadow: inset 0 0 14px rgba(255,190,40,0.6);
      pointer-events: none; z-index: 5;
      animation: pj-spotlit-pulse 1.8s ease-in-out infinite;
    }
    @keyframes pj-spotlit-pulse { 0%, 100% { opacity: 0.8; } 50% { opacity: 1; } }
    .cell.pj-locked::after {
      content: ""; position: absolute; inset: 0; border-radius: inherit;
      background: repeating-linear-gradient(45deg, rgba(52,84,140,0.26) 0 6px, rgba(52,84,140,0.06) 6px 12px);
      box-shadow: inset 0 0 0 3px rgba(58,90,150,0.65);
      pointer-events: none; z-index: 5;
    }

    .external-question.swap-target img,
    .small-tile.selectable {
      cursor: pointer;
      outline: 3px solid #5c86d6;
      outline-offset: -3px;
    }

    .hand-tile.discardable {
      cursor: pointer;
      border-color: #237a57;
      animation: discardable-pulse 1200ms ease-in-out infinite;
    }

    .hand-tile.discardable:hover {
      box-shadow: 0 0 0 4px #237a57, 0 7px 15px rgba(45, 36, 20, 0.18);
    }

    @keyframes discardable-pulse {
      0%, 100% { box-shadow: 0 0 0 2px rgba(35, 122, 87, 0.25), 0 7px 15px rgba(45, 36, 20, 0.18); }
      50% { box-shadow: 0 0 0 3px rgba(35, 122, 87, 0.55), 0 7px 15px rgba(45, 36, 20, 0.18); }
    }

    /* 川（麻雀の河のように一列に並べて捨てる） */
    .river-preview {
      display: flex;
      flex-wrap: wrap;
      gap: 3px;
      margin-top: 8px;
      padding: 6px;
      min-height: 30px;
      border-radius: 8px;
      background: #efe6d2;
      box-shadow: inset 0 0 0 1px rgba(120, 100, 60, 0.25);
    }

    .river-empty {
      color: #9a8a66;
      font-size: 12px;
      font-weight: 800;
    }

    /* サバイバル: プレイヤー欄の手持ち（表）プレビュー */
    .preview-label {
      display: block;
      margin: 8px 0 3px;
      color: #74664e;
      font-size: 11px;
      font-weight: 800;
    }

    .hand-preview {
      display: flex;
      flex-wrap: wrap;
      gap: 3px;
      min-height: 30px;
      padding: 6px;
      border-radius: 8px;
      background: #f3ecda;
      box-shadow: inset 0 0 0 1px rgba(120, 100, 60, 0.2);
    }
    /* 次に降る分（裏向き）を手札の後ろに少し区切って表示 */
    .hand-preview .small-tile.incoming { opacity: 0.85; }
    .hand-preview .small-tile.incoming-first { margin-left: 9px; }

    .hand-preview.status-only {
      align-items: center;
      gap: 8px;
      min-height: 24px;
      padding: 0;
      background: transparent;
      box-shadow: none;
    }

    .hand-count-visual {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-top: 8px;
      padding: 7px;
      border-radius: 9px;
      background: #f3ecda;
      box-shadow: inset 0 0 0 1px rgba(120, 100, 60, 0.2);
    }

    .hand-count-cards {
      display: flex;
      flex-wrap: wrap;
      gap: 3px;
      flex: 1;
      min-height: 30px;
    }

    .hand-count-card {
      width: 22px;
      height: 28px;
      border-radius: 4px;
      overflow: hidden;
      box-shadow: 0 2px 5px rgba(45, 36, 20, 0.16);
    }

    .hand-count-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .hand-count-number {
      min-width: 42px;
      border-radius: 999px;
      padding: 5px 8px;
      background: #2f3338;
      color: #fff;
      text-align: center;
      font-size: 17px;
      font-weight: 900;
    }

    /* ===== ボーダレスモード ===== */
    .bl-viewport {
      display: none;
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 320px;
      /* 内側の枠線は出さない（外側の手番色パネルだけで盤面を表現） */
      border: 1px solid transparent;
      border-radius: 8px;
      background:
        radial-gradient(circle, rgba(120,100,60,0.10) 1px, transparent 1px) 0 0 / 30px 30px,
        transparent;
      overflow: hidden;
      cursor: grab;
      user-select: none;
      touch-action: none;
    }
    .board-wrap[data-turn-color] .bl-viewport {
      border-color: transparent;
      box-shadow: none;
      background:
        radial-gradient(circle, rgba(120,100,60,0.12) 1px, transparent 1px) 0 0 / 30px 30px,
        transparent;
    }
    .bl-viewport.dragging { cursor: grabbing; }
    body.mode-classic-auto .bl-viewport {
      cursor: default;
    }
    body.mode-classic-auto .bl-viewport.dragging {
      cursor: default;
    }
    .bl-world { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
    .bl-fixed-cell {
      position: absolute;
      width: 60px;
      height: 60px;
      box-sizing: border-box;
      border: 1px dashed rgba(74, 101, 128, 0.16);
      background: rgba(245, 249, 252, 0.58);
      border-radius: 4px;
      pointer-events: none;
    }
    .bl-tile { position: absolute; width: 60px; height: 60px; }
    .bl-tile img { width: 100%; height: 100%; display: block; }
    .bl-tile.inner-question {
      box-shadow: inset 0 0 0 2px #4f5358, 0 5px 12px rgba(45, 36, 20, 0.16);
      background: #dde1e4;
    }
    .bl-tile.inner-question.revealed {
      background: #eef2f4;
    }
    .bl-tile.owned-inner-question {
      box-shadow: inset 0 0 0 3px #f0c542, 0 0 0 2px rgba(32, 36, 42, 0.2);
    }
    .bl-tile.inner-question.just-revealed img {
      animation: question-reveal 420ms cubic-bezier(0.18, 0.9, 0.2, 1.05);
    }
    .bl-tile.action-selectable {
      cursor: pointer;
      box-shadow: inset 0 0 0 4px #ffd400, 0 7px 15px rgba(45, 36, 20, 0.18);
    }
    .bl-ghost {
      position: absolute;
      width: 60px;
      height: 60px;
      box-sizing: border-box;
      border-radius: 4px;
    }
    /* 置ける候補=緑の四角ハイライト（サバイバルの placeable と統一。クリック可） */
    .bl-ghost-legal {
      border: 2px solid #317858;
      background: #ecf7ec;
      cursor: pointer;
    }
    .bl-ghost-legal:hover { background: rgba(35, 122, 87, 0.28); }
    .bl-ghost-armed {
      border-width: 3px;
      background: rgba(35, 122, 87, 0.18);
      box-shadow: 0 0 0 4px rgba(35, 122, 87, 0.14), 0 10px 28px rgba(15, 23, 42, 0.12);
    }
    body[data-placement-assist="off"] .bl-ghost-armed {
      background: transparent;
      box-shadow: none;
    }
    /* 置けない所=常時は何も出さず、ホバー時だけ赤い点線（サバイバルと統一） */
    .bl-ghost-illegal {
      border: 2px dashed transparent;
      cursor: not-allowed;
    }
    .bl-ghost-illegal:hover {
      border-color: #c84242;
      background: rgba(200, 66, 66, 0.12);
    }
    .bl-ghost-ko {
      border-color: rgba(239, 68, 68, 0.78);
      background: rgba(239, 68, 68, 0.10);
    }
    .bl-ghost-ko::after {
      content: "×";
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: #dc2626;
      font-size: 30px;
      font-weight: 900;
      text-shadow: 0 2px 10px rgba(255, 255, 255, 0.9);
      pointer-events: none;
    }
    .bl-ghost img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      opacity: 0.58;
      filter: saturate(0.96);
      pointer-events: none;
    }
    .bl-ghost-illegal img { opacity: 0.4; filter: grayscale(0.35); }
    .bl-limit-shading {
      position: absolute;
      z-index: 1;
      box-sizing: border-box;
      pointer-events: none;
      background:
        repeating-linear-gradient(
          -45deg,
          rgba(220, 66, 66, 0.08) 0,
          rgba(220, 66, 66, 0.08) 8px,
          transparent 8px,
          transparent 16px
        );
      background-color: rgba(220, 66, 66, 0.02);
      transition: opacity 0.3s ease;
    }
    .bl-limit-shading-left {
      border-right: 2px dashed rgba(220, 66, 66, 0.58);
    }
    .bl-limit-shading-right {
      border-left: 2px dashed rgba(220, 66, 66, 0.58);
    }
    .bl-limit-shading-top {
      border-bottom: 2px dashed rgba(220, 66, 66, 0.58);
    }
    .bl-limit-shading-bottom {
      border-top: 2px dashed rgba(220, 66, 66, 0.58);
    }
    @keyframes bl-marker-life {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(0.4); }
      8% { opacity: 1; transform: translate(-50%, -50%) scale(1.12); }
      16% { transform: translate(-50%, -50%) scale(1); }
      68% { opacity: 1; }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(1); }
    }

    .bl-score-marker {
      position: absolute;
      z-index: 6; /* タイル・グローより前面に出して得点ラベルが見切れないように */
      transform: translate(-50%, -50%);
      border: 2px solid rgba(255, 255, 255, 0.68);
      border-radius: 999px;
      padding: 4px 9px;
      background: #20242a;
      color: #fff;
      font-size: 14px;
      font-weight: 950;
      line-height: 1;
      text-align: center;
      pointer-events: none;
      white-space: nowrap;
      box-shadow: 0 6px 16px rgba(15, 23, 42, 0.2);
    }
    .bl-score-marker.red { background: #ef4444; }
    .bl-score-marker.yellow { background: #f5c542; color: #fff; text-shadow: 0 1px 1px rgba(23, 18, 8, 0.35); }
    .bl-score-marker.blue { background: #0ea5e9; }
    .bl-score-marker.green { background: #4cc33f; }
    .bl-zoom { position: absolute; right: 10px; bottom: 10px; display: flex; gap: 6px; align-items: center; z-index: 5; }
    .bl-zoom button { min-width: 40px; }
    .bl-zoom input[type="range"] { width: 120px; padding: 0; }
    body.mode-classic-auto .bl-zoom {
      display: none;
    }
    .bl-hint {
      position: absolute;
      left: 10px;
      bottom: 10px;
      z-index: 5;
      font-size: 11px;
      color: #6f6043;
      background: rgba(255, 255, 255, 0.75);
      padding: 3px 7px;
      border-radius: 6px;
    }
    .bl-scores { display: grid; gap: 5px; }
    .bl-score-row {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      padding: 11px 10px;
      border-radius: 8px;
      background: #f2e8d3;
      font-weight: 800;
    }
    .bl-score-row.current { box-shadow: inset 0 0 0 2px #1f7a5b; background: #eaf6ee; }
    .bl-score-row.finished { opacity: 0.72; }
    .bl-score-row.score-bump { animation: score-row-bump 0.48s ease; }
    .bl-score-row.rank-shift { animation: rank-shift 360ms ease-out; }
    .bl-score-row.compact-score-row {
      grid-template-columns: minmax(0, 1fr) auto;
    }
    .bl-rank {
      display: inline-grid;
      place-items: center;
      min-width: 34px;
      height: 34px;
      border-radius: 999px;
      background: #2f3338;
      color: #fff;
      font-size: 13px;
      font-weight: 950;
    }
    .bl-score-row .pts {
      min-width: 48px;
      text-align: right;
      font-size: 28px;
      line-height: 1;
      font-weight: 950;
    }
    .bl-score-row.win { background: #e7f6ea; box-shadow: inset 0 0 0 2px #1f7a5b; }
    .score-stack {
      grid-column: 2 / -1;
      display: flex;
      flex-wrap: wrap;
      gap: 3px;
      min-height: 16px;
      padding-top: 2px;
    }
    .compact-score-name {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    .compact-score-inline {
      grid-column: auto;
      align-items: center;
      gap: 4px;
      min-height: 20px;
      max-width: none;
      padding: 0 1px 0 4px;
      box-sizing: border-box;
      flex: 1 1 auto;
      flex-wrap: nowrap;
      overflow: hidden;
    }
    .compact-score-inline .score-diamond {
      width: 12px;
      height: 12px;
      border-radius: 2px;
      flex: 0 0 12px;
    }
    .score-diamond {
      width: 12px;
      height: 12px;
      transform: rotate(45deg);
      border-radius: 2px;
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.16);
    }
    .score-diamond.red { background: #ef4444; }
    .score-diamond.yellow { background: #f5c542; }
    .score-diamond.blue { background: #0ea5e9; }
    .score-diamond.green { background: #4cc33f; }
    .score-extra {
      align-self: center;
      font-size: 11px;
      font-weight: 900;
      color: #6f6043;
      padding-left: 3px;
    }
    @keyframes rank-shift {
      0% { transform: translateY(6px); box-shadow: inset 0 0 0 2px rgba(255, 212, 0, 0.7); }
      100% { transform: translateY(0); }
    }

    /* ポップジャム: 順位パネル（残り手札順に並べ替え） */
    .player.rank-shift { animation: rank-shift 360ms ease-out; }
    .player-rank {
      display: inline-grid;
      place-items: center;
      min-width: 30px;
      height: 26px;
      margin-right: 6px;
      padding: 0 6px;
      border-radius: 999px;
      background: #2f3338;
      color: #fff;
      font-size: 13px;
      font-weight: 950;
    }
    .player.win .player-rank { background: #1f7a5b; }
    .hand-count-number .hand-count-label {
      font-size: 11px;
      font-weight: 800;
      color: #74664e;
      margin-right: 2px;
    }
    .hand-count-number .hand-count-unit { font-size: 13px; font-weight: 800; }

    /* ポップジャム順位欄: 残り手札／川を同じ形式で（左にラベル＋枚数→カード列） */
    .pj-row { margin-top: 8px; }
    .pj-row-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; }
    .pj-label { font-size: 12px; font-weight: 800; color: #74664e; }
    .pj-count { font-weight: 950; line-height: 1; }
    .pj-unit { font-size: 11px; font-weight: 800; margin-left: 1px; }
    .pj-hand .pj-count { font-size: 26px; color: #20242a; }
    .pj-river .pj-count { font-size: 16px; color: #5d4e2e; }
    .pj-cards {
      display: flex;
      flex-wrap: wrap;
      gap: 3px;
      min-height: 22px;
      padding: 5px;
      border-radius: 8px;
      background: #f2e8d3;
    }
    .pj-card {
      width: 20px;
      height: 20px;
      border-radius: 3px;
      overflow: hidden;
      box-shadow: 0 1px 3px rgba(45, 36, 20, 0.18);
    }
    .pj-card img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .pj-card.selectable { outline: 2px solid #237a57; cursor: pointer; }
    @keyframes score-row-bump {
      0% { transform: scale(1); }
      45% { transform: scale(1.012); box-shadow: inset 0 0 0 3px rgba(35, 122, 87, 0.45); }
      100% { transform: scale(1); }
    }

    .player.score-drop,
    .bl-score-row.score-drop {
      animation: score-row-drop 0.46s ease;
    }

    @keyframes score-row-drop {
      0% { transform: scale(1); }
      42% { transform: scale(0.988); box-shadow: inset 0 0 0 3px rgba(220, 70, 70, 0.28); }
      100% { transform: scale(1); }
    }

    /* ===== 白基調の製品版寄りUIテーマ ===== */
    body {
      background: var(--bg);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
    }

    button,
    select,
    input {
      min-height: 42px;
      border-color: #d7dee8;
      border-radius: 12px;
      background: #ffffff;
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.85), 0 2px 8px rgba(15, 23, 42, 0.04);
      color: #111827;
      transition: transform 140ms ease, box-shadow 140ms ease, border-color 140ms ease, background 140ms ease;
    }

    button:hover:not(:disabled),
    select:hover,
    input:hover {
      border-color: #b9c4d2;
      background: #ffffff;
      box-shadow: 0 7px 18px rgba(15, 23, 42, 0.08);
      transform: translateY(-1px);
    }

    button:active:not(:disabled) {
      transform: translateY(0);
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.06);
    }

    .topbar {
      border-color: #e3e9f2;
      border-radius: 16px;
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: var(--shadow-soft);
    }

    .kicker {
      color: #8a94a6;
      font-size: 11px;
      letter-spacing: 0.11em;
    }

    h1 {
      color: #101828;
      font-weight: 850;
    }

    .message-bar,
    .hand-panel,
    .action-panel,
    .turn-panel,
    .players,
    .log-panel,
    .stat {
      border-color: #e3e9f2;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: var(--shadow-soft);
    }

    .label,
    .shared-market-label,
    .deck-label,
    .confirm-dialog .note {
      color: var(--muted);
    }

    .main-info-value {
      color: #101828;
      font-weight: 850;
    }

    .board-wrap {
      border-color: #e4ebf3;
      border-radius: 18px;
      background: #ffffff;
      box-shadow: var(--shadow-card), inset 0 0 0 1px rgba(255, 255, 255, 0.7);
    }

    .board-wrap[data-turn-color="red"] {
      --turn-soft: rgba(239, 68, 68, 0.10);
      --turn-wash: #fffafa;
      background: linear-gradient(180deg, #ffffff 0%, #fff7f7 100%);
      border-color: rgba(239, 68, 68, 0.34);
      box-shadow: var(--shadow-card), inset 0 0 0 2px rgba(239, 68, 68, 0.08);
    }

    .board-wrap[data-turn-color="yellow"] {
      --turn-soft: rgba(255, 212, 0, 0.11);
      --turn-wash: #fffdf2;
      background: linear-gradient(180deg, #ffffff 0%, #fffbed 100%);
      border-color: rgba(216, 169, 0, 0.36);
      box-shadow: var(--shadow-card), inset 0 0 0 2px rgba(216, 169, 0, 0.08);
    }

    .board-wrap[data-turn-color="blue"] {
      --turn-soft: rgba(11, 143, 207, 0.10);
      --turn-wash: #f7fcff;
      background: linear-gradient(180deg, #ffffff 0%, #f3fbff 100%);
      border-color: rgba(11, 143, 207, 0.34);
      box-shadow: var(--shadow-card), inset 0 0 0 2px rgba(11, 143, 207, 0.08);
    }

    .board-wrap[data-turn-color="green"] {
      --turn-soft: rgba(35, 122, 87, 0.10);
      --turn-wash: #f8fffb;
      background: linear-gradient(180deg, #ffffff 0%, #f3fff8 100%);
      border-color: rgba(35, 122, 87, 0.34);
      box-shadow: var(--shadow-card), inset 0 0 0 2px rgba(35, 122, 87, 0.08);
    }

    .board,
    .bl-viewport {
      border-radius: 16px;
    }

    .board {
      border: 0;
      background: #e8eef5;
      box-shadow: 0 18px 44px rgba(15, 23, 42, 0.12);
    }

    .cell {
      background: #f8fafc;
      outline-color: #d8e1ec;
    }

    .cell.placeable,
    .bl-ghost-legal {
      background: #ecfdf5;
      outline-color: #159f72;
      border-color: #159f72;
    }

    .cell.blocked {
      opacity: 0.55;
    }

    .bl-viewport {
      background:
        radial-gradient(circle, rgba(15, 23, 42, 0.055) 1px, transparent 1px) 0 0 / 30px 30px,
        transparent;
    }

    .board-wrap[data-turn-color] .bl-viewport {
      background:
        radial-gradient(circle, rgba(15, 23, 42, 0.06) 1px, transparent 1px) 0 0 / 30px 30px,
        transparent;
    }

    .board-wrap[data-turn-color] .board {
      background:
        radial-gradient(circle, rgba(15, 23, 42, 0.055) 1px, transparent 1px) 0 0 / 30px 30px,
        var(--turn-wash);
    }

    .deck-card,
    .hand-tile,
    .small-tile,
    .external-question img {
      box-shadow: var(--shadow-tile);
    }

    .deck-card,
    .hand-tile {
      border-radius: 14px;
    }

    .deck-empty-outline {
      border-color: #c8d2df;
      background: #ffffff;
    }

    .deck-count,
    .score-lead,
    .turn-icon,
    .bl-rank {
      background: #111827;
      color: #ffffff;
    }

    .deck-count {
      border-radius: 999px;
      box-shadow: 0 6px 14px rgba(15, 23, 42, 0.12);
    }

    .deck-count.empty {
      background: #ffffff;
      color: var(--muted);
      box-shadow: inset 0 0 0 1px #d8e1ec;
    }

    .hand-tile {
      border-width: 2px;
      background: #ffffff;

    }

    .hand-tile img,
    .small-tile img {
      border-radius: inherit;
    }

    .hand-tile.selected {
      border-color: #ffffff;
      box-shadow: 0 0 0 3px #111827, 0 0 0 7px #ffd400, var(--shadow-tile);
    }

    .hand-tile:hover {
      transform: translateY(-3px);
    }

    .small-tile {
      border-radius: 7px;
      background: #ffffff;
    }

    .player {
      border: 1px solid #e3e9f2;
      border-radius: 15px;
      background: #ffffff;
      box-shadow: 0 8px 22px rgba(15, 23, 42, 0.06);
    }

    .player.current {
      border-color: #1f7a5b;
      background: #f8fffb;
      box-shadow: inset 0 0 0 2px rgba(35, 122, 87, 0.10), 0 12px 26px rgba(15, 23, 42, 0.08);
    }

    .player.win {
      border-color: #1f7a5b;
      background: #f2fbf5;
      box-shadow: inset 0 0 0 2px rgba(35, 122, 87, 0.12), 0 12px 26px rgba(15, 23, 42, 0.08);
    }

    .player.lose {
      border-color: rgba(200, 66, 66, 0.42);
      background: #fff8f8;
      box-shadow: inset 0 0 0 2px rgba(200, 66, 66, 0.08), 0 12px 26px rgba(15, 23, 42, 0.06);
    }

    .mini-stat,
    .hand-preview,
    .hand-count-visual,
    .log-entry,
    .bl-score-row {
      border: 1px solid #e3e9f2;
      background: #f8fafc;
      box-shadow: none;
    }

    .mini-stat,
    .hand-preview,
    .hand-count-visual {
      border-radius: 12px;
    }

    .log-entry {
      border-radius: 12px;
      color: #344054;
    }

    .bl-score-row {
      border-radius: 14px;
      background: #ffffff;

    const analyticsParams = new URLSearchParams(window.location.search);
    const wiggleAnalyticsConfig = Object.assign({
      enabled: analyticsParams.get("analytics") !== "0",

      debug: analyticsParams.get("debug_analytics") === "1"
    }, window.WIGGLE_ANALYTICS_CONFIG || {});

    const wiggleAnalytics = {
      visitorId: getOrCreateStorageId("wiggle_trial_visitor_id", "v"),
      sessionId: getOrCreateSessionId(),
      source: detectTrialSource(),
      pageTracked: false
    };

    function safeStorageGet(storage, key) {
      try {
        return storage.getItem(key);
      } catch (error) {
        return "";
      }
    }

    function safeStorageSet(storage, key, value) {
      try {
        storage.setItem(key, value);
      } catch (error) {
        // Storage can be blocked in private contexts. Analytics should never block play.
      }
    }

    function shortRandomId(prefix) {
      if (window.crypto && typeof window.crypto.randomUUID === "function") {
        return prefix + "_" + window.crypto.randomUUID();
      }
      return prefix + "_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 10);
    }

    function getOrCreateStorageId(key, prefix) {
      const existing = safeStorageGet(window.localStorage, key);
      if (existing) {
        return existing;
      }
      const created = shortRandomId(prefix);
      safeStorageSet(window.localStorage, key, created);
      return created;
    }

    function getOrCreateSessionId() {
      const key = "wiggle_trial_session_id";
      const existing = safeStorageGet(window.sessionStorage, key);
      if (existing) {
        return existing;
      }
      const created = shortRandomId("s");
      safeStorageSet(window.sessionStorage, key, created);
      return created;
    }

    function getFirstParam(names) {
      for (let i = 0; i < names.length; i++) {
        const value = analyticsParams.get(names[i]);
        if (value) {
          return value;
        }
      }
      return "";
    }

    function detectTrialSource() {
      const explicit = getFirstParam(["source", "src", "qr"]);
      const utmSource = analyticsParams.get("utm_source") || "";
      const referrer = document.referrer || "";
      return {
        code: explicit || utmSource || (referrer ? "referrer" : "direct"),
        explicit: Boolean(explicit || utmSource),
        source: explicit || "",
        utm_source: utmSource,
        utm_medium: analyticsParams.get("utm_medium") || "",
        utm_campaign: analyticsParams.get("utm_campaign") || "",
        utm_content: analyticsParams.get("utm_content") || "",
        utm_term: analyticsParams.get("utm_term") || "",
        referrer: referrer
      };
    }

    function currentAnalyticsMode() {
      if (state && state.started) {
        return state.mode;
      }
      return typeof currentMode === "function" ? currentMode() : (analyticsParams.get("mode") || "unknown");
    }

    function analyticsBasePayload(extra) {
      return Object.assign({
        turn: state.turn,
        player_count: state.playerCount,
        cpu_enabled: state.cpuEnabled,
        placed_tiles: state.stats && state.stats.placedTiles,
        completions: state.stats && state.stats.completions,
        deck_left: state.deck ? state.deck.length : 0
      }, extra || {});
    }

    function sanitizeAnalyticsPayload(payload) {
      const result = {};
      Object.keys(payload || {}).forEach(function (key) {
        const value = payload[key];
        if (value === undefined || typeof value === "function") {
          return;
        }
        if (typeof value === "string") {
          result[key] = value.slice(0, 180);
          return;
        }
        result[key] = value;
      });
      return result;
    }

    function trackWiggleEvent(eventName, payload) {
      if (!wiggleAnalyticsConfig.enabled) {
        return;
      }
      const cleanPayload = sanitizeAnalyticsPayload(analyticsBasePayload(payload));
      const event = {
        event: eventName,
        visitor_id: wiggleAnalytics.visitorId,
        session_id: wiggleAnalytics.sessionId,
        mode: currentAnalyticsMode(),
        ts: new Date().toISOString(),
        source: wiggleAnalytics.source,
        payload: cleanPayload
      };

      window.wiggleAnalyticsEvents = window.wiggleAnalyticsEvents || [];
      window.wiggleAnalyticsEvents.push(event);
      if (window.wiggleAnalyticsEvents.length > 80) {
        window.wiggleAnalyticsEvents.shift();
      }

      if (wiggleAnalyticsConfig.debug) {
        console.log("wiggle_analytics", event);
      }

      if (window.posthog && typeof window.posthog.capture === "function") {
        window.posthog.capture(eventName, Object.assign({
          visitor_id: event.visitor_id,
          session_id: event.session_id,
          mode: event.mode
        }, event.source, cleanPayload));
      }

      if (typeof window.gtag === "function") {
        window.gtag("event", eventName, Object.assign({
          visitor_id: event.visitor_id,
          session_id: event.session_id,
          mode: event.mode
        }, event.source, cleanPayload));
      }

      if (wiggleAnalyticsConfig.apiEnabled && window.location.protocol.indexOf("http") === 0) {
        fetch("/api/events", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify(event),
          keepalive: true
        }).catch(function () {});
      }
    }

    function trackPageViewOnce() {
      if (wiggleAnalytics.pageTracked) {
        return;
      }
      wiggleAnalytics.pageTracked = true;
      trackWiggleEvent("page_view", {
        path: window.location.pathname,
        view: analyticsParams.get("view") || "",
        autostart: analyticsParams.get("autostart") === "1"
      });
      trackWiggleEvent("source_detected", {
        source_code: wiggleAnalytics.source.code,
        explicit_source: wiggleAnalytics.source.explicit
      });
    }

    function trackFirstAction(action, payload) {
      if (!state.stats) {
        return;
      }
      if (!state.stats.firstActionTracked) {
        state.stats.firstActionTracked = true;
        state.stats.firstActionAt = Date.now();
        trackWiggleEvent("first_action", Object.assign({ action: action }, payload || {}));
      }
    }

    function trackTurnMilestone() {
      if (state.stats && !state.stats.turn3Tracked && state.turn >= 3) {
        state.stats.turn3Tracked = true;
        trackWiggleEvent("turn_3_reached", { turn: state.turn });
      }
    }

    function finishOutcomePlayers() {
      return (state.players || []).map(function (player) {
        return {
          id: player.id,
          name: player.name,
          color: player.color,
          score: player.score,
          hand: player.hand ? player.hand.length : 0,
          pending: player.pending ? player.pending.length : 0,
          finished: Boolean(player.finished),
          is_cpu: Boolean(player.isCpu),
          win: state.blWinners ? state.blWinners.indexOf(player.id) >= 0 : state.winnerId === player.id,
          lose: state.survivalLoserId === player.id
        };
      });
    }

    function trackFinishOnce(reason, outcome) {
      if (!state.stats || state.stats.finishTracked) {
        return;
      }
      state.stats.finishTracked = true;
      if (!state.stats.endedAt) {
        state.stats.endedAt = Date.now();
      }
      trackWiggleEvent("finish", {
        reason: reason || "",
        outcome: outcome || "",
        duration_ms: state.stats.startedAt ? state.stats.endedAt - state.stats.startedAt : null,
        players: finishOutcomePlayers()
      });
    }

    window.addEventListener("error", function (event) {
      trackWiggleEvent("error", {
        message: event.message || "",
        filename: event.filename || "",
        lineno: event.lineno || 0
      });
    });

    window.addEventListener("unhandledrejection", function (event) {
      trackWiggleEvent("error", {
        message: event.reason && event.reason.message ? event.reason.message : String(event.reason || "unhandledrejection")
      });
    });

    function shuffle(array) {
      const copy = array.slice();
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const item = copy[i];
        copy[i] = copy[j];
        copy[j] = item;
      }
      return copy;
    }

    function createQuestionSlots() {
      const slots = [];

      for (let col = 0; col < 5; col++) {
        slots.push({
          id: "top-" + col,
          side: "top",
          index: col,
          boardRow: 0,
          boardCol: col,
          inwardDir: 2,
          rotation: 180
        });
      }

      for (let row = 0; row < 5; row++) {
        slots.push({
          id: "right-" + row,
          side: "right",
          index: row,
          boardRow: row,
          boardCol: 4,
          inwardDir: 3,
          rotation: 270
        });
      }

      for (let col = 4; col >= 0; col--) {
        slots.push({
          id: "bottom-" + col,
          side: "bottom",
          index: col,
          boardRow: 4,
          boardCol: col,
          inwardDir: 0,
          rotation: 0
        });
      }

      for (let row = 4; row >= 0; row--) {
        slots.push({
          id: "left-" + row,
          side: "left",
          index: row,
          boardRow: row,
          boardCol: 0,
          inwardDir: 1,
          rotation: 90
        });
      }

      return slots;
