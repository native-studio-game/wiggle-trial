    function getSetupConfig() {
      let mode = currentMode();
      const setupValue = elements.playerCountSelect.value;
      if (mode === "popjam" && setupValue === "popjam3cpu3") {
        mode = "popjam3";
      }
      if (mode === "life" && setupValue === "lifeCpu3") {
        return {
          mode: mode,
          cpuEnabled: true,
          lifeCpuStrong: true,
          lifeVariant: "edit",
          lifeRecoveryRule: "normal",
          lifeReturnRule: "none",
          playerCount: 3
        };
      }
      if (mode === "life" && (
        setupValue === "lifeStrongCpu3"
        || setupValue === "lifeKoCpu3"
        || setupValue === "lifeTurnDebtCpu3"
        || setupValue === "lifeWoundCpu3"

        || setupValue === "lifeEditCpu3"

              : "normal",
          lifeReturnRule: (setupValue === "lifeKoCpu3" || setupValue === "lifeTurnDebtCpu3") ? "ko" : "none",
          playerCount: 3
        };
      }
      const maxPlayers = isRoguelikeMode(mode)
        ? 1
        : isLifeMode(mode) ? 3
        : (isClassicSharedMode(mode) || mode === "tactics" || mode === "open7") ? 2 : ((mode === "popjam" || mode === "borderless") ? 4 : 3);

          cpuEnabled: true,
          lifeCpuStrong: isLifeMode(mode),
          lifeVariant: isLifeMode(mode) ? "edit" : "classic",
          lifeRecoveryRule: "normal",
          lifeReturnRule: "none",
          playerCount: Math.min(cpuSetupCounts[setupValue], maxPlayers)
        };
      }

        return {
          mode: mode,
          cpuEnabled: true,
          lifeCpuStrong: false,
          lifeVariant: "classic",
          lifeRecoveryRule: "normal",
          lifeReturnRule: "none",
          playerCount: 3
        };
      }

      const minPlayers = mode === "borderless" || isRoguelikeMode(mode) ? 1 : (isLifeMode(mode) ? 3 : 2);

        mode: mode,
        cpuEnabled: false,
        lifeCpuStrong: false,
        lifeVariant: isLifeMode(mode) ? "edit" : "classic",
        lifeRecoveryRule: "normal",
        lifeReturnRule: "none",
        playerCount: Math.max(minPlayers, Math.min(Number(setupValue) || minPlayers, maxPlayers))
      };

      return String(text).replace(/[&<>"']/g, function (char) {
        return {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          "\"": "&quot;",
          "'": "&#39;"
        }[char];
      });
    }

    function currentPlayer() {
      return state.players[state.currentPlayer];
    }

    function pushHistory() {
      state.history.push(JSON.stringify({
        started: state.started,
        over: state.over,
        mode: state.mode,
        playerCount: state.playerCount,
        cpuEnabled: state.cpuEnabled,
        lifeCpuStrong: state.lifeCpuStrong,
        lifeVariant: state.lifeVariant,
        lifeRecoveryRule: state.lifeRecoveryRule,
        lifeReturnRule: state.lifeReturnRule,
        neutralColor: state.neutralColor,
        survivalAllCleared: state.survivalAllCleared,
        discardPending: state.discardPending,
        discardPlayerId: state.discardPlayerId,
        discardQueue: state.discardQueue,
        discardPlacementPlayerId: state.discardPlacementPlayerId,
        discardColor: state.discardColor,
        passStreak: state.passStreak,
        winnerId: state.winnerId,
        popjamWinners: state.popjamWinners,
        popjamExtraPlacements: state.popjamExtraPlacements,
        popjamPostDiscardPlacement: state.popjamPostDiscardPlacement,
        popjamWinDiscardShowcase: state.popjamWinDiscardShowcase,
        harvestLine: state.harvestLine,
        harvestPlacedThisTurn: state.harvestPlacedThisTurn,
        harvestSeason: state.harvestSeason,
        pendingQuestionEffects: state.pendingQuestionEffects,
        pendingQuestionContext: state.pendingQuestionContext,
        pendingQuestionPlacement: state.pendingQuestionPlacement,
        pendingAction: state.pendingAction,
        popjamScorePatterns: state.popjamScorePatterns,
        lifeDamageQueue: state.lifeDamageQueue,
        lifeRecoveryQueue: state.lifeRecoveryQueue,
        lifeWounded: state.lifeWounded,
        turn: state.turn,
        currentPlayer: state.currentPlayer,
        selectedHandIndex: state.selectedHandIndex,
        selectedColor: state.selectedColor,
        selectedRotation: state.selectedRotation,
        deck: state.deck,
        innerQuestionDeck: state.innerQuestionDeck,
        sharedMarket: state.sharedMarket,
        marketRotations: state.marketRotations,
        tacticsGoals: state.tacticsGoals,
        boardSize: state.boardSize,
        board: state.board,
        questionBoard: state.questionBoard,
        blBoard: state.blBoard,
        blCompletedKeys: state.blCompletedKeys,
        classicBonusUnfinishedApplied: state.classicBonusUnfinishedApplied,
        classicBonusHighlights: state.classicBonusHighlights,
        blPan: state.blPan,
        blZoom: state.blZoom,
        blCentered: state.blCentered,
        blWinners: state.blWinners,
        tiebreak: state.tiebreak,
        resultOverlayHidden: state.resultOverlayHidden,
        resultViewStep: state.resultViewStep,
        players: state.players,
        log: state.log,
        completedKeys: state.completedKeys,
        scoreText: state.scoreText,
        scoreEffects: state.scoreEffects,
        scoreBumpPlayerIds: state.scoreBumpPlayerIds,
        scoreDropPlayerIds: state.scoreDropPlayerIds,
        startTileAnimating: state.startTileAnimating,
        lastPlacedCell: state.lastPlacedCell,
        stats: state.stats
      }));

      if (state.history.length > 80) {
        state.history.shift();
      }
    }

    function restoreHistory() {
      if (state.history.length === 0) {
        return;
      }

      closeCompletionConfirm();
      clearPopjamWinDiscardTimer();
      const snapshot = JSON.parse(state.history.pop());
      Object.assign(state, snapshot);
      state.cpuThinking = false;
      questionRevealAnimationSlots = [];
      dealAnimationQueue.length = 0;
      riverAnimationQueue.length = 0;
      render();
    }

    function addLog(text) {
      state.log.unshift("T" + state.turn + " " + text);
      state.log = state.log.slice(0, 80);
    }

    function setupGame() {
      if (!tileImagesReady) {
        if (tileImageLoadPromise) {
          tileImageLoadPromise.then(setupGame);
        }
        return;
      }

      closeCompletionConfirm();
      clearMobilePlacementConfirm();
      pushHistory();
      const titleScreenEl = document.getElementById("titleScreen");
      if (titleScreenEl) { titleScreenEl.hidden = true; }
      const setupConfig = getSetupConfig();
      state.mode = setupConfig.mode;
      state.cpuEnabled = setupConfig.cpuEnabled;
      state.lifeCpuStrong = Boolean(setupConfig.lifeCpuStrong);
      state.lifeVariant = setupConfig.lifeVariant || "classic";
      state.lifeRecoveryRule = setupConfig.lifeRecoveryRule || "normal";
      state.lifeReturnRule = setupConfig.lifeReturnRule || "none";
      state.playerCount = setupConfig.playerCount;
      state.boardSize = fixedBoardSize(state.mode);
      state.resultOverlayHidden = false;
      state.resultViewStep = 0;
      trackWiggleEvent("start_click", {
        setup: elements.playerCountSelect ? elements.playerCountSelect.value : "",
        view: currentViewMode()
      });

      // クラシック/フリー系は動的盤面の独立パス（固定5×5前提の処理を通さない）
      if (isDynamicBoardMode()) {
        if (isHarvestSeasonMode()) {
          setupHarvestSeason();
          return;
        }
        if (isHarvestMode()) {
          setupHarvest();
          return;
        }
        setupBorderless();
        return;
      }

      // 中立色(黄)はサバイバル2人戦のみ。ポップジャムは中立色なし。
      state.neutralColor = (isSurvivalFamilyMode() && state.playerCount === 2) ? "yellow" : "";
      state.turn = 1;
      state.currentPlayer = 0;
      state.selectedHandIndex = null;
      state.selectedRotation = 0;
      state.selectedColor = "red";
      state.started = true;
      state.over = false;
      state.survivalAllCleared = false;
      state.survivalLoserId = null;
      state.blAllPlacedWin = false;
      state.deck = shuffle(deckDefinitionsForSetup(state.mode, state.playerCount).map(cloneTile));
      state.innerQuestionDeck = [];
      state.sharedMarket = [];
      state.marketRotations = {};
      state.tacticsGoals = [];
      state.board = createEmptyBoard();
      state.questionBoard = createEmptyQuestionBoard();
      state.players = createPlayers(state.playerCount, state.cpuEnabled);
      state.log = [];
      state.completedKeys = [];
      state.scoreText = "";
      state.scoreEffects = [];
      state.scoreBumpPlayerIds = [];
      state.scoreDropPlayerIds = [];
      state.startTileAnimating = true;
      resetScoreFlights();
      state.tiebreak = null;
      state.lastPlacedCell = null;
      lastPopjamOrder = "";
      state.discardPending = 0;
      state.discardPlayerId = null;
      state.discardQueue = [];
      state.discardPlacementPlayerId = null;
      state.discardColor = "";
      state.passStreak = 0;
      state.winnerId = null;
      state.popjamWinners = null;
      state.popjamExtraPlacements = 0;
      state.popjamPostDiscardPlacement = null;
      state.popjamWinDiscardShowcase = null;
      state.harvestLine = 3;
      state.harvestPlacedThisTurn = 0;
      state.harvestSeason = null;
      state.pendingQuestionEffects = [];
      state.pendingQuestionContext = null;
      state.pendingQuestionPlacement = null;
      state.pendingAction = null;
      state.popjamScorePatterns = {};
      state.lifeDamageQueue = [];
      state.lifeRecoveryQueue = [];
      state.lifeWounded = [];
      questionRevealAnimationSlots = [];
      clearPopjamWinDiscardTimer();
      dealAnimationQueue.length = 0;
      riverAnimationQueue.length = 0;
      lastRenderedDeckCount = null;
      state.stats = {
        completions: 0,
        sentTiles: 0,
        placedTiles: 1,
        startedAt: Date.now(),
        endedAt: null
      };

      const center = fixedBoardCenter(state.mode);
      state.board[center][center] = {
        tile: cloneTile(startTile),
        rotation: 0
      };

      // ポップジャム得点: クラシック/フリーダムと同じく山札から5枚公開して選ぶ
      if (isPopjamInnerQuestionMode()) {
        setupInnerQuestionTiles();
        dealAllTilesToPlayers();
        dealInnerQuestionCardsToPlayers(2);
      } else if (isPopjamScoreMode()) {
        setupQuestionTiles();
        refillSharedMarket();
      } else if (isPopjamMode()) {
        // 手札型ポップジャム: 山札からドローせず、全タイルを各プレイヤーへ均等に配り切る
        setupQuestionTiles();
        dealAllTilesToPlayers();
      } else if (isOpen7Mode()) {
        setupOpen7();
      } else if (isTacticsMode()) {
        setupTactics();
      } else if (isClassicSharedMode()) {
        refillSharedMarket();
      }

      addLog(isOpen7Mode()
        ? "オープン開始。山札と手札は使わず、外周タイルから1枚選んで置きます。"
        : isTacticsMode()
        ? "タクティクス開始。7×7の盤面で共有札と自色タイルを使って目標達成を狙います。"
        : isPopjamScoreMode()
        ? "ポップジャム開始。山札から公開された5枚の中から1枚選んで置きます。"
        : isRoguelikeMode()
        ? "ローグライク開始。7×7の盤面で、何ターン生き残れるかに挑戦します。"
        : isDealSurvivalMode()
        ? "サバイバル開始。山札から1枚ずつ引き、置けない時は負けです。"
        : "ゲーム開始。中央にスタートタイルを置きました。");
      beginTurn();
      rememberExistingCompletedPatterns();
      render();
      maybeStartFirstRunGuide();
      setTimeout(function () {
        if (state.started && state.startTileAnimating) {
          state.startTileAnimating = false;
          renderBoard();
        }
      }, 760);
    }

    function setupTactics() {
      refillSharedMarket();
      state.tacticsGoals = shuffle(tacticsGoalDefinitions).slice(0, 3).map(function (goal) {
        return Object.assign({ claimedBy: null }, goal);
      });
      state.players.forEach(function (player) {
        player.hand = (blockTileDefinitionsByColor[player.color] || []).map(cloneTile);
        player.tacticsBonus = 0;
        player.tacticsCounts = {};
        player.tacticsGoals = [];
      });
    }

    function setupOpen7() {
      state.deck = [];
      state.sharedMarket = shuffle(tileDefinitions.map(cloneTile));
      state.marketRotations = {};
      state.players.forEach(function (player) {
        player.hand = [];
      });
    }

    function dealAllTilesToPlayers(options) {
      // 山札を空にし、全タイルをラウンドロビンで各プレイヤーの手札へ配り切る
      const label = options && options.label ? options.label : popjamModeLabel();
      let index = 0;
      while (state.deck.length > 0) {
        const tile = state.deck.shift();
        state.players[index % state.players.length].hand.push(tile);
        index++;
      }
      addLog(label + ": 通常タイル全" + index + "枚を各プレイヤーへ配りました。");
    }

    function dealLifeTilesToPlayers() {
      let index = 0;
      state.lifeWounded = [];
      state.players.forEach(function (player) {
        player.hand = [];
        player.lifeLocked = 0;
        player.lifeDamageSources = {};
        player.wounded = [];
        player.pending = [];
        player.river = [];
        player.finished = false;
        player.score = 0;
        player.displayScore = 0;
        player.completed = 0;
        player.maxPattern = 0;
      });
      while (state.deck.length > 0) {
        state.players[index % state.players.length].hand.push(state.deck.shift());
        index++;
      }
      addLog("ライフ: 通常タイル全" + index + "枚を8枚ずつ配りました。");
    }

    function popjamModeLabel() {
      if (isPopjamScoreTestMode()) {
        return "ポップジャム検証";
      }
      if (isPopjamScoreAltMode()) {
        return "ポップジャム";
      }
      if (isPopjamScoreOpenMode()) {
        return "ポップジャム公開";
      }
      if (isPopjamScoreMode()) {
        return "ポップジャム";
      }
      if (isPopjamInnerQuestionMode()) {
        return "トラップ";
      }
      return isPopjamThreeColorMode() ? "ポップジャム（3色）" : "ポップジャム";
    }

    function setupInnerQuestionTiles() {
      state.innerQuestionDeck = createInnerQuestionTileDeck();
      addLog(popjamModeLabel() + ": ハテナは別山札から配り、内側に伏せて仕込めます。");
    }

    function dealInnerQuestionCardsToPlayers(count) {
      let dealt = 0;
      state.players.forEach(function (player) {
        for (let i = 0; i < count && state.innerQuestionDeck.length > 0; i++) {
          player.hand.push(state.innerQuestionDeck.shift());
          dealt++;
        }
      });
      if (dealt > 0) {
        addLog("仕込みハテナ " + dealt + "枚を別山札から配りました。");
      }
    }

    function setupQuestionTiles() {
      const deck = createQuestionTileDeck();
      const revealAll = isPopjamScoreOpenMode() || isPopjamScoreAltMode() || isPopjamScoreTestMode();
      state.questionBoard = createQuestionSlots().map(function (slot) {
        const tile = deck.shift();
        return Object.assign({}, slot, {
          tile: tile || null,
          revealed: Boolean(tile && revealAll),
          effectUsed: false
        });
      });
      addLog(popjamModeLabel() + ": ハテナタイル " + state.questionBoard.length + "枚を外周に配置しました。");
      if (revealAll) {
        addLog("すべての外周ハテナを公開した状態で開始します。");
      }
    }

    function advanceTurn() {
      if (isDealSurvivalMode()) {
        if (finishDealSurvivalIfReady()) {
          return;
        }
        const nextIndex = nextDealSurvivalPlayerIndex(state.currentPlayer);
        if (nextIndex < 0) {
          finishDealSurvivalIfReady("手番を続けられるプレイヤーがいません。");
          return;
        }
        state.currentPlayer = nextIndex;
        state.turn++;
        beginTurn();
        trackTurnMilestone();
        return;
      }
      state.currentPlayer = (state.currentPlayer + 1) % state.players.length;
      state.turn++;
      beginTurn();
      trackTurnMilestone();
    }

    function survivalAllPlayersHaveNoTiles() {
      return isSurvivalFamilyMode()
        && state.deck.length === 0
        && state.players.length > 0
        && state.players.every(function (player) {
          return player.hand.length === 0 && player.pending.length === 0;
        });
    }

    function finishSurvivalAllCleared() {
      state.survivalAllCleared = true;
      state.survivalLoserId = null;
      state.over = true;
      state.stats.endedAt = Date.now();
      addLog("山札がなくなり、全員生存で終了です。");
      trackFinishOnce("山札がなくなり、全員生存で終了です。", "survival_all_cleared");
    }

    function activeDealSurvivalPlayers() {
      if (!isDealSurvivalMode()) {
        return [];
      }
      return state.players.filter(function (player) {
        return !player.finished;
      });
    }

    function finishDealSurvivalIfReady(reason) {
      if (!isDealSurvivalMode() || state.over) {
        return false;
      }

      const active = activeDealSurvivalPlayers();
      if (active.length > 1) {
        return false;
      }

      state.over = true;
      state.stats.endedAt = Date.now();
      if (active.length === 0) {
        state.survivalAllCleared = true;
        state.survivalLoserId = null;
        const message = reason || "全員が手札をなくしました。";
        addLog(message);
        trackFinishOnce(message, "survival_deal_all_cleared");
        return true;
      }

      state.survivalAllCleared = false;
      state.survivalLoserId = active[0].id;
      const message = reason || (active[0].name + " が最後まで残りました。");
      addLog(message + " " + active[0].name + " の負けです。");
      trackFinishOnce(message, "survival_deal_last_remaining");
      return true;
    }

    function finishDealSurvivalPlayer(player, reason) {
      if (!isDealSurvivalMode() || !player || player.finished || state.over) {
        return false;
      }
      player.finished = true;
      state.selectedHandIndex = null;
      state.selectedRotation = 0;
      addLog(player.name + " は手札をなくして早抜けしました。");
      return finishDealSurvivalIfReady(reason);
    }

    function nextDealSurvivalPlayerIndex(startIndex) {
      if (!isDealSurvivalMode() || activeDealSurvivalPlayers().length === 0) {
        return -1;
      }
      for (let step = 1; step <= state.players.length; step++) {
        const index = (startIndex + step) % state.players.length;
        const player = state.players[index];
        if (player && !player.finished) {
          return index;
        }
      }
      return -1;
    }

    function scheduleSurvivalEmptyHandAutoEnd(playerId) {
      setTimeout(function () {
        const player = currentPlayer();
        if (!state.started || state.over || !isSurvivalFamilyMode() || !player || player.id !== playerId
          || player.hand.length > 0 || state.deck.length > 0 || hasPendingQuestionEffects() || hasPendingAction()) {
          return;
        }

        if (survivalAllPlayersHaveNoTiles()) {
          finishSurvivalAllCleared();
          render();
          return;
        }

        addLog(player.name + " は手札も引く山札もないため、自動で手番終了しました。");
        advanceTurn();
        render();
      }, 360);
    }

    function beginTurn() {
      const player = currentPlayer();
      state.selectedHandIndex = null;
      state.selectedRotation = 0;
      state.discardPending = 0;
      state.discardPlayerId = null;
      state.discardQueue = [];
      state.discardPlacementPlayerId = null;
      state.discardColor = "";
      state.popjamExtraPlacements = 0;
      state.popjamPostDiscardPlacement = null;
      state.popjamWinDiscardShowcase = null;
      clearPopjamWinDiscardTimer();
      state.pendingQuestionEffects = [];
      state.pendingQuestionContext = null;
      state.pendingQuestionPlacement = null;
      state.pendingAction = null;

      if (isClassicSharedMode()) {
        refillSharedMarket();
        const firstMarketIndex = findFirstClassicMarketIndex();
        if (state.sharedMarket.length === 0 || firstMarketIndex < 0) {
          finishClassicByScore("置ける共有札がありません。");
          return;
        }
        if (!player.isCpu) {
          state.selectedHandIndex = firstMarketIndex;
        }
        return;
      }

      if (isOpen7Mode()) {
        const firstTileIndex = findFirstClassicMarketIndex();
        if (state.sharedMarket.length === 0 || firstTileIndex < 0) {
          finishClassicByScore("置ける外周タイルがありません。");
          return;
        }
        if (!player.isCpu) {
          state.selectedHandIndex = firstTileIndex;
        }
        return;
      }

      if (isTacticsMode()) {
        refillSharedMarket();
        const firstTileIndex = findFirstClassicMarketIndex();
        if (currentPlacementTiles().length === 0 || firstTileIndex < 0) {
          finishClassicByScore("置ける共有札・自色タイルがありません。");
          return;
        }
        if (!player.isCpu) {
          state.selectedHandIndex = firstTileIndex;
        }
        return;
      }

      if (isPopjamScoreMode()) {
        refillSharedMarket();
        const firstMarketIndex = findFirstClassicMarketIndex();
        if (state.sharedMarket.length === 0 || firstMarketIndex < 0) {
          if (state.passStreak >= state.players.length - 1 || state.deck.length === 0) {
            finishPopjamByScore("置ける公開札がありません。");
            return;
          }
          state.passStreak = (state.passStreak || 0) + 1;
          addLog(player.name + " は置ける公開札がなくパスしました。");
          advanceTurn();
          return;
        }
        if (!player.isCpu) {
          state.selectedHandIndex = firstMarketIndex;
        }
        return;
      }

      // サバイバルのみ: 降ってきたタイルの解禁と山札ドロー
      if (!isPopjamMode()) {
        if (player.pending.length > 0) {
          player.hand = player.hand.concat(player.pending);
          addLog(player.name + " が降ってきたタイル " + player.pending.length + "枚を表にしました。");
          player.pending = [];
        }

        if (isRoguelikeMode() && state.deck.length === 0) {
          state.deck = shuffle(tileDefinitions.map(cloneTile));
          addLog("山札をシャッフルして戻しました。");
        }

        if (state.deck.length > 0) {
          const tile = state.deck.shift();
          player.hand.push(tile);
          addLog(player.name + " が山札から1枚引きました。");
        } else {
          addLog(player.name + " は引くタイルがありません。");
        }
      }

      if (isSurvivalFamilyMode() && player.hand.length === 0 && state.deck.length === 0) {
        scheduleSurvivalEmptyHandAutoEnd(player.id);
        return;
      }

      if (player.hand.length > 0 && !hasAnyLegalMove(player)) {
        if (isPopjamMode()) {
          // ポップジャム: 置けない時は敗北ではなくパス（全員パスで手札最少勝ち）
          state.passStreak = (state.passStreak || 0) + 1;
          addLog(player.name + " は置ける場所がなくパスしました。");
          if (state.passStreak >= state.players.length) {
            if (isPopjamScoreMode()) {
              finishPopjamByScore("全員が置ける場所なしでパスしました。");
            } else {
              finishPopjamByHandCount();
            }
            return;
          }
          advanceTurn();
          return;
        }

        if (isDealSurvivalMode() && !player.isCpu) {
          state.scoreText = "";
          scheduleToastHide();
          return;
        }

        state.over = true;
        state.survivalLoserId = player.id;
        state.stats.endedAt = Date.now();
        addLog(player.name + " は置ける場所がありません。自動で敗北です。");
        trackFinishOnce("置ける場所がありません。自動で敗北です。", "survival_auto_unable_to_place");
        return;
      }

      if (isPopjamMode()) {
        state.passStreak = 0;
      }

      if (!player.isCpu && player.hand.length > 0) {
        state.selectedHandIndex = 0;
      }
    }

    function boardIsFull() {
      return state.board.every(function (row) {
        return row.every(Boolean);
      });
    }

    function countPlacedTiles() {
      let count = 0;
      state.board.forEach(function (row) {
        row.forEach(function (cell) {
          if (cell) {
            count++;
          }
        });
      });
      return count;
    }

    function rememberExistingCompletedPatterns() {
      state.completedKeys = detectCompletedPatterns().map(function (pattern) {
        return pattern.key;
      });
    }

    function forgetBrokenCompletedPatterns() {
      if (isDynamicBoardMode()) {
        const currentKeys = WiggleRules.detectClosedPatternsDynamic(dynamicScoringBoard()).map(function (pattern) {
          return pattern.key;
        });
        state.blCompletedKeys = state.blCompletedKeys.filter(function (key) {
          return currentKeys.indexOf(key) !== -1;
        });
        return;
      }

      const currentKeys = detectCompletedPatterns().map(function (pattern) {
        return pattern.key;
      });
      state.completedKeys = state.completedKeys.filter(function (key) {
        return currentKeys.indexOf(key) !== -1;
      });
    }

    function resolveAutomaticCompletions() {
      const patterns = detectCompletedPatterns();
      const newPatterns = patterns.filter(function (pattern) {
        return !state.completedKeys.includes(pattern.key);
      });

      if (newPatterns.length === 0) {
        return;
      }

      newPatterns.forEach(function (pattern) {
        state.completedKeys.push(pattern.key);
        sendFallingTiles(pattern.color, pattern.points, "auto", pattern);
      });
    }

    function rememberCompletionGlow(pattern, borderless, points) {
      if (!pattern || !pattern.key) {
        return null;
      }
      const now = performance.now();
      const visualPoints = Math.max(1, points || pattern.points || 1);
      patternGlowSince[pattern.key] = now;
      patternGlowEndAt[pattern.key] = now + flyWindowMs(visualPoints, Boolean(borderless));
      setTimeout(function () {
        if (state.started) {
          render();
        }
      }, flyWindowMs(visualPoints, Boolean(borderless)) + 80);
      return {
        since: patternGlowSince[pattern.key],
        endAt: patternGlowEndAt[pattern.key]
      };
    }

    function queueCompletionVisual(pattern, options) {
      const opts = options || {};
      if (!pattern) {
        return;
      }
      const color = opts.color || pattern.color;
      const points = Math.max(1, opts.points || pattern.points || 1);
      const glowTiming = rememberCompletionGlow(pattern, opts.borderless, points);
      if (Array.isArray(pattern.cells) && pattern.cells.length > 0) {
        completionFlashQueue.push({ cells: pattern.cells, color: color, borderless: Boolean(opts.borderless) });
      }
      if (opts.marker === false) {
        return;
      }
      const effectId = ++scoreEffectId;
      state.scoreEffects.push({
        id: effectId,
        row: pattern.row,
        col: pattern.col,
        localX: pattern.localX,
        localY: pattern.localY,
        color: color,
        text: scoreMarkerText(points),
        html: scoreMarkerHtml(points, opts.bonus || 0),
        since: glowTiming ? glowTiming.since : performance.now(),
        endAt: glowTiming ? glowTiming.endAt : performance.now() + PATTERN_GLOW_BURST_MS
      });
      state.scoreEffects = state.scoreEffects.slice(-6);
      expireScoreEffect(effectId, Math.max(0, (glowTiming ? glowTiming.endAt : performance.now() + PATTERN_GLOW_BURST_MS) - performance.now()) + 80);
    }

    function classicBonusCompletionInfo(baseScore) {
      const base = Math.max(1, Math.floor(baseScore || 1));
      if (!isClassicBonusMode() || base < 3) {
        return { base: base, points: base, bonus: 0 };
      }
      return { base: base, points: base * 2 - 2, bonus: base - 2 };
    }

    function classicBonusUnfinishedScore(baseScore) {
      return Math.max(0, Math.floor(Math.max(0, baseScore || 0) / 2));
    }

    function dynamicPatternScoreInfo(pattern) {
      return classicBonusCompletionInfo(pattern ? pattern.points : 1);
    }

    function cloneClassicBonusPattern(pattern, opts) {
      const options = opts || {};
      return {
        key: (options.kind || "bonus") + ":" + (pattern && pattern.key ? pattern.key : Math.random()),
        patternKey: pattern ? pattern.key : "",
        kind: options.kind || "bonus",
        playerId: options.playerId,
        color: pattern ? pattern.color : "",
        base: options.base || (pattern ? pattern.points : 0) || 0,
        points: options.points || 0,
        bonus: options.bonus || 0,
        borderless: Boolean(options.borderless),
        row: pattern && Number.isFinite(pattern.row) ? pattern.row : null,
        col: pattern && Number.isFinite(pattern.col) ? pattern.col : null,
        localX: pattern && Number.isFinite(pattern.localX) ? pattern.localX : 50,
        localY: pattern && Number.isFinite(pattern.localY) ? pattern.localY : 50,
        centerR: pattern && Number.isFinite(pattern.centerR) ? pattern.centerR : null,
        centerC: pattern && Number.isFinite(pattern.centerC) ? pattern.centerC : null,
        triangles: Array.isArray(pattern && pattern.triangles)
          ? pattern.triangles.map(function (tri) {
            return {
              r: tri.r,
              c: tri.c,
              d: tri.d,
              color: tri.color,
              question: Boolean(tri.question)
            };
          })
          : []
      };
    }

    function recordClassicBonusCompletion(player, pattern, scoreInfo, borderless) {
      if (!isClassicBonusMode() || !player || !pattern || !scoreInfo || scoreInfo.bonus <= 0) {
        return;
      }
      player.classicBonusCompleteBonus = (player.classicBonusCompleteBonus || 0) + scoreInfo.bonus;
      if (!Array.isArray(player.classicBonusCompleteDetails)) {
        player.classicBonusCompleteDetails = [];
      }
      player.classicBonusCompleteDetails.push({
        color: pattern.color,
        base: scoreInfo.base,
        points: scoreInfo.points,
        bonus: scoreInfo.bonus
      });
      if (!Array.isArray(state.classicBonusHighlights)) {
        state.classicBonusHighlights = [];
      }
      state.classicBonusHighlights.push(cloneClassicBonusPattern(pattern, {
        kind: "bonus",
        playerId: player.id,
        base: scoreInfo.base,
        points: scoreInfo.points,
        bonus: scoreInfo.bonus,
        borderless: borderless
      }));
    }

    function resultScoreHighlightItems(borderless) {
      if (resultViewMode() !== "details") {
        return [];
      }
      let patterns = [];
      try {
        patterns = borderless
          ? WiggleRules.detectClosedPatternsDynamic(dynamicScoringBoard())
          : detectCompletedPatterns();
      } catch (e) {
        patterns = [];
      }
      const items = [];
      patterns.forEach(function (pattern) {
        const owner = ownerForColor(pattern.color);
        if (!owner) {
          return;
        }
        const scoreInfo = borderless ? dynamicPatternScoreInfo(pattern) : classicBonusCompletionInfo(pattern.points);
        items.push(cloneClassicBonusPattern(pattern, {
          kind: "score",
          playerId: owner.id,
          base: scoreInfo.base || pattern.points || 0,
          points: scoreInfo.points || pattern.points || 0,
          bonus: scoreInfo.bonus || 0,
          borderless: borderless
        }));
      });
      if (isClassicBonusMode() && Array.isArray(state.classicBonusHighlights)) {
        state.classicBonusHighlights.forEach(function (item) {
          if (item && item.kind === "unfinished" && Boolean(item.borderless) === Boolean(borderless)) {
            items.push(item);
          }
        });
      }
      return items;
    }

    function applyClassicBonusUnfinishedScores() {
      if (!isClassicBonusMode() || state.classicBonusUnfinishedApplied) {
        return;
      }
      state.classicBonusUnfinishedApplied = true;
      if (typeof WiggleRules === "undefined" || typeof WiggleRules.detectOpenPatternsDynamic !== "function") {
        return;
      }
      const bestByPlayer = {};
      WiggleRules.detectOpenPatternsDynamic(dynamicScoringBoard()).forEach(function (pattern) {
        const owner = ownerForColor(pattern.color);
        if (!owner) {
          return;
        }
        const previous = bestByPlayer[owner.id];
        if (!previous || (pattern.points || 0) > previous.points) {
          bestByPlayer[owner.id] = pattern;
        }
      });
      const gains = [];
      state.players.forEach(function (player) {
        const bestPattern = bestByPlayer[player.id];
        const base = bestPattern ? (bestPattern.points || 0) : 0;
        const unfinished = classicBonusUnfinishedScore(base);
        player.classicBonusUnfinishedScore = unfinished;
        player.classicBonusUnfinishedBase = base;
        if (unfinished > 0) {
          player.score += unfinished;
          gains.push(player.name + " 未完成+" + unfinished);
          if (!Array.isArray(state.classicBonusHighlights)) {
            state.classicBonusHighlights = [];
          }
          state.classicBonusHighlights.push(cloneClassicBonusPattern(bestPattern, {
            kind: "unfinished",
            playerId: player.id,
            base: base,
            points: unfinished,
            bonus: 0,
            borderless: true
          }));
        }
      });
      if (gains.length > 0) {
        addLog("クラシックBT終了時の最大未完成模様: " + gains.join(" / ") + "。");
      }
    }

    function markClassicCompletions() {
      const patterns = detectCompletedPatterns();
      const newPatterns = patterns.filter(function (pattern) {
        return !state.completedKeys.includes(pattern.key);
      });

      const gains = [];
      newPatterns.forEach(function (pattern) {
        state.completedKeys.push(pattern.key);
        const owner = ownerForColor(pattern.color);
        const scoreInfo = classicBonusCompletionInfo(pattern.points);
        if (owner) {
          owner.score += scoreInfo.points;
          owner.completed++;
          owner.maxPattern = Math.max(owner.maxPattern || 0, pattern.points);
          recordClassicBonusCompletion(owner, pattern, scoreInfo, false);
          gains.push(scoreLabel(owner, pattern.color, scoreInfo.points));
        }
        state.stats.completions++;
        queueCompletionVisual(pattern, { marker: Boolean(owner), points: scoreInfo.points, bonus: scoreInfo.bonus });
      });

      if (gains.length > 0) {
        state.scoreText = gains.join(" / ");
        scheduleToastHide();
      }

      return gains.length;
    }

    function tacticsPatternRank(pattern) {
      if (!pattern || pattern.points <= 2) {
        return 1;
      }
      if (pattern.points <= 4) {
        return 2;
      }
      return 3;
    }

    function awardTacticsGoal(goal, player) {
      if (!goal || goal.claimedBy !== null || !player) {
        return "";
      }
      goal.claimedBy = player.id;
      player.score += goal.bonus;
      player.tacticsBonus = (player.tacticsBonus || 0) + goal.bonus;
      player.tacticsGoals = player.tacticsGoals || [];
      player.tacticsGoals.push(goal.id);
      return player.name + " +" + goal.bonus + "目標";
    }

    function markTacticsCompletions(placementPlayer) {
      const patterns = detectCompletedPatterns();
      const newPatterns = patterns.filter(function (pattern) {
        return !state.completedKeys.includes(pattern.key);
      });

      const messages = [];
      newPatterns.forEach(function (pattern) {
        state.completedKeys.push(pattern.key);
        state.stats.completions++;
        const owner = ownerForColor(pattern.color);
        if (owner) {
          owner.score += pattern.points;
          owner.completed++;
          owner.maxPattern = Math.max(owner.maxPattern || 0, pattern.points);
          messages.push(scoreLabel(owner, pattern.color, pattern.points));
        }

        if (placementPlayer) {
          placementPlayer.tacticsCounts = placementPlayer.tacticsCounts || {};
          placementPlayer.tacticsCounts[pattern.points] = (placementPlayer.tacticsCounts[pattern.points] || 0) + 1;
        }

        queueCompletionVisual(pattern, { marker: Boolean(owner) });

        state.tacticsGoals.forEach(function (goal) {
          if (goal.claimedBy !== null) {
            return;
          }

          let awarded = "";
          if (goal.type === "count" && placementPlayer) {
            const count = (placementPlayer.tacticsCounts && placementPlayer.tacticsCounts[goal.targetPoints]) || 0;
            if (count >= goal.required) {
              awarded = awardTacticsGoal(goal, placementPlayer);
            }
          } else if (goal.type === "point" && owner && pattern.points === goal.targetPoints) {
            awarded = awardTacticsGoal(goal, owner);
          } else if (goal.type === "pattern" && owner && tacticsPatternRank(pattern) === goal.rank) {
            awarded = awardTacticsGoal(goal, owner);
          }

          if (awarded) {
            messages.push(awarded);
            addLog(goal.title + " 達成: " + awarded);
          }
        });
      });

      if (messages.length > 0) {
        state.scoreText = messages.join(" / ");
        scheduleToastHide();
      }

      return messages.length;
    }

    // ポップジャム: 新たに完成した模様を演出表示し、色の担当プレイヤーが放出する枚数をキューに積む。
    function markPopjamCompletions(questionContext) {
      if (isPopjamScoreMode()) {
        return markPopjamScoreCompletions(questionContext);
      }

      const patterns = detectCompletedPatterns();
      const newPatterns = patterns.filter(function (pattern) {
        return !state.completedKeys.includes(pattern.key);
      });

      let total = 0;
      if (newPatterns.length > 0) {
        currentPlayer().completed += newPatterns.length;
      }
      state.discardQueue = [];
      newPatterns.forEach(function (pattern) {
        state.completedKeys.push(pattern.key);
        const points = adjustedPopjamPatternPoints(pattern, questionContext);
        total += points;
        state.stats.completions++;
        let owner = null;
        if (isPopjamScoreMode()) {
          owner = popjamOwnerForColor(pattern.color);
          if (owner) {
            owner.score += points;
            owner.completed++;
          }
        } else {
          queuePopjamDiscardForPattern(pattern.color, points);
        }
        queueCompletionVisual(pattern, { color: pattern.color, points: points, marker: !isPopjamScoreMode() || Boolean(owner) });
      });

      if (total > 0) {
        const message = isPopjamScoreMode()
          ? "模様得点 +" + total
          : "手札から" + total + "枚捨てる";
        state.scoreText = state.scoreText ? state.scoreText + " / " + message : message;
        scheduleToastHide();
      }

      return total;
    }

    function dynamicScoringBoard() {
      const map = {};
      Object.keys(state.blBoard || {}).forEach(function (key) {
        const cell = state.blBoard[key];
        if (cell && !isInnerQuestionCell(cell)) {
          map[key] = cell;
        }
      });
      return map;
    }

    function isNormalDynamicBoardCell(row, col) {
      const cell = (state.blBoard || {})[blCellKey(row, col)];
      return Boolean(cell && !isInnerQuestionCell(cell));
    }

    function isSurroundedUsedInnerQuestion(row, col, cell) {
      return isInnerQuestionCell(cell)
        && cell.tile.effectUsed
        && [
          [-1, 0],
          [1, 0],
          [0, -1],
          [0, 1]
        ].every(function (direction) {
          return isNormalDynamicBoardCell(row + direction[0], col + direction[1]);
        });
    }

    function sweepSurroundedUsedInnerQuestions() {
      if (!isDynamicPopjamMode()) {
        return 0;
      }

      const removals = [];
      Object.keys(state.blBoard || {}).forEach(function (key) {
        const parts = key.split(",");
        const row = Number(parts[0]);
        const col = Number(parts[1]);
        const cell = state.blBoard[key];
        if (isSurroundedUsedInnerQuestion(row, col, cell)) {
          removals.push({
            key: key,
            row: row,
            col: col,
            tile: cell.tile
          });
        }
      });

      removals.forEach(function (item) {
        const owner = state.players.find(function (player) {
          return player.id === item.tile.ownerId;
        }) || currentPlayer();
        delete state.blBoard[item.key];
        if (owner) {
          owner.river.push(item.tile);
          queueRiverAnimation(null, owner.id, item.tile);
        }
        addLog("四方を囲まれた " + item.tile.name + " が盤面から消えて捨て札へ流れました。");
      });

      if (removals.length > 0) {
        state.scoreText = removals.length + "枚の発動済みハテナが囲まれて消えました。";
        scheduleToastHide();
      }

      return removals.length;
    }

    function markDynamicPopjamCompletions(questionContext) {
      const patterns = WiggleRules.detectClosedPatternsDynamic(dynamicScoringBoard());
      const newPatterns = patterns.filter(function (pattern) {
        return state.blCompletedKeys.indexOf(pattern.key) === -1;
      });

      let total = 0;
      if (newPatterns.length > 0) {
        currentPlayer().completed += newPatterns.length;
      }

      state.discardQueue = [];
      newPatterns.forEach(function (pattern) {
        state.blCompletedKeys.push(pattern.key);
        const points = adjustedPopjamPatternPoints(pattern, questionContext);
        total += points;
        state.stats.completions++;
        if (isPopjamScoreMode()) {
          const owner = popjamOwnerForColor(pattern.color);
          if (owner) {
            owner.score += points;
            owner.displayScore = owner.score;
            owner.completed++;
          }
        } else {
          queuePopjamDiscardForPattern(pattern.color, points);
        }

        queueCompletionVisual(pattern, { points: points, borderless: true, marker: false });
      });

      if (total > 0) {
        const message = isPopjamScoreMode()
          ? "模様得点 +" + total
          : "手札から" + total + "枚捨てる";
        state.scoreText = state.scoreText ? state.scoreText + " / " + message : message;
        scheduleToastHide();
      }

      return total;
    }

    function popjamScorePatternEntry(pattern, points, owner) {
      return {
        key: pattern.key,
        playerId: owner.id,
        color: pattern.color,
        points: points,
        row: pattern.row,
        col: pattern.col,
        localX: pattern.localX,
        localY: pattern.localY,
        cells: Array.isArray(pattern.cells) ? pattern.cells.slice() : []
      };
    }

    function queuePopjamScoreLossVisual(entry) {
      if (!entry) {
        return;
      }
      const effectId = ++scoreEffectId;
      const now = performance.now();
      const duration = Math.max(560, PATTERN_GLOW_BURST_MS * 0.72);
      state.scoreEffects.push({
        id: effectId,
        row: entry.row,
        col: entry.col,
        localX: entry.localX,
        localY: entry.localY,
        color: "loss " + entry.color,
        text: "-" + Math.max(1, Math.floor(entry.points || 1)),
        html: "<span>-" + escapeHtml(String(Math.max(1, Math.floor(entry.points || 1)))) + "</span>",
        since: now,
        endAt: now + duration
      });
      state.scoreEffects = state.scoreEffects.slice(-6);
      expireScoreEffect(effectId, duration + 80);
    }

    function pulseScoreDrops(playerIds) {
      const ids = Array.from(new Set((playerIds || []).filter(function (id) {
        return Number.isInteger(id);
      })));
      if (ids.length === 0) {
        return;
      }
      state.scoreDropPlayerIds = ids;
      setTimeout(function () {
        if (!state.started) { return; }
        state.scoreDropPlayerIds = [];
        renderScorePanel();
      }, 420);
    }

    function markPopjamScoreCompletions(questionContext) {
      const patterns = detectCompletedPatterns();
      const previous = state.popjamScorePatterns || {};
      const current = {};
      const totals = {};
      const completionCounts = {};
      const droppedPlayers = [];
      let gained = 0;
      let lost = 0;

      patterns.forEach(function (pattern) {
        const owner = popjamOwnerForColor(pattern.color);
        if (!owner) {
          return;
        }
        const points = adjustedPopjamPatternPoints(pattern, questionContext);
        const entry = popjamScorePatternEntry(pattern, points, owner);
        current[pattern.key] = entry;
        totals[owner.id] = (totals[owner.id] || 0) + points;
        completionCounts[owner.id] = (completionCounts[owner.id] || 0) + 1;

        const old = previous[pattern.key];
        if (!old) {
          gained += points;
          state.stats.completions++;
          queueCompletionVisual(pattern, { color: pattern.color, points: points, marker: true });
        } else if (old.playerId !== owner.id || old.points !== points) {
          lost += old.points || 0;
          gained += points;
          queuePopjamScoreLossVisual(old);
          queueCompletionVisual(pattern, { color: pattern.color, points: points, marker: true });
        }
      });

      Object.keys(previous).forEach(function (key) {
        if (current[key]) {
          return;
        }
        const entry = previous[key];
        lost += entry.points || 0;
        queuePopjamScoreLossVisual(entry);
      });

      state.players.forEach(function (player) {
        const before = player.score || 0;
        player.score = totals[player.id] || 0;
        player.completed = completionCounts[player.id] || 0;
        if (player.score < before) {
          droppedPlayers.push(player.id);
        }
      });

      state.completedKeys = Object.keys(current);
      state.popjamScorePatterns = current;
      pulseScoreDrops(droppedPlayers);

      const messages = [];
      if (gained > 0) {
        messages.push("模様得点 +" + gained);
      }
      if (lost > 0) {
        messages.push("模様消滅 -" + lost);
      }
      if (messages.length > 0) {
        state.scoreText = state.scoreText ? state.scoreText + " / " + messages.join(" / ") : messages.join(" / ");
        scheduleToastHide();
      }

      return gained;
    }

    function ownerForColor(color) {
      // ソロ（1人）は担当色に関係なく、全ての色の模様を自分の得点にする
      if (state.players.length === 1) {
        return state.players[0];
      }
      return state.players.find(function (player) {
        return player.color === color;
      }) || null;
    }

    function popjamOwnerForColor(color) {
      return ownerForColor(color);
    }

    function queuePopjamDiscardForPattern(color, points) {
      const owner = popjamOwnerForColor(color);
      if (!owner) {
        addLog(colorNames[color] + "の担当プレイヤーがいないため、捨て札への移動は発生しません。");
        return;
      }

      const existing = state.discardQueue.find(function (item) {
        return item.playerId === owner.id && item.color === color;
      });

      if (existing) {
        existing.count += points;
      } else {
        state.discardQueue.push({
          playerId: owner.id,
          count: points,
          color: color
        });
      }
    }

    // 外周ハテナは、発動元の縁マス(boardRow,boardCol)にタイルが在る間だけ有効。喪失で失効・再配置で再発動(2026-09-23)。
    function isQuestionEffectActive(slot) {
      if (!slot) {
        return false;
      }
      const cell = boardCellAt(slot.boardRow, slot.boardCol);
      return Boolean(cell && cell.tile);
    }

    // ロック: 有効なロック対象セルを集める。ここに在るタイルはムーブで動かせない。
    function lockedCellSet() {
      if (isPopjamScoreAltMode()) {
        return new Set();
      }

      const set = new Set();
      if (!Array.isArray(state.questionBoard)) {
        return set;
      }
      const size = state.board.length || fixedBoardSize();
      state.questionBoard.forEach(function (slot) {
        if (!slot || !slot.revealed || !slot.tile || slot.tile.effect !== "lock" || !isQuestionEffectActive(slot)) {
          return;
        }
        if (slot.side === "top" || slot.side === "bottom") {
          for (let r = 0; r < size; r++) {
            set.add(r + "," + slot.boardCol);
          }
        } else if (slot.side === "left" || slot.side === "right") {
          for (let c = 0; c < size; c++) {
            set.add(slot.boardRow + "," + c);
          }
        }
      });
      return set;
    }

    function isCellLocked(row, col) {
      return lockedCellSet().has(row + "," + col);
    }

    // スポットライト: 有効なスポットライトの行/列(盤端まで)のセル。視覚ハイライト用。
    function spotlitCellSet() {
      const set = new Set();
      if (!Array.isArray(state.questionBoard)) {
        return set;
      }
      const size = state.board.length || fixedBoardSize();
      state.questionBoard.forEach(function (slot) {
        if (!slot || !slot.revealed || !slot.tile || slot.tile.effect !== "spotlight" || !isQuestionEffectActive(slot)) {
          return;
        }
        if (slot.side === "top" || slot.side === "bottom") {
          for (let r = 0; r < size; r++) {
            set.add(r + "," + slot.boardCol);
          }
        } else if (slot.side === "left" || slot.side === "right") {
          for (let c = 0; c < size; c++) {
            set.add(slot.boardRow + "," + c);
          }
        }
      });
      return set;
    }

    function isCellSpotlit(row, col) {
      return spotlitCellSet().has(row + "," + col);
    }

    function spotlightBonusForPatternCells(cells) {
      if (!Array.isArray(cells) || !Array.isArray(state.questionBoard)) {
        return 0;
      }
      const rows = new Set();
      const cols = new Set();
      cells.forEach(function (cell) {
        rows.add(cell.r);
        cols.add(cell.c);
      });
      return state.questionBoard.filter(function (slot) {
        if (!slot || !slot.revealed || !slot.tile || slot.tile.effect !== "spotlight" || !isQuestionEffectActive(slot)) {
          return false;
        }
        if (slot.side === "top" || slot.side === "bottom") {
          return cols.has(slot.boardCol);
        }
        if (slot.side === "left" || slot.side === "right") {
          return rows.has(slot.boardRow);
        }
        return false;
      }).length;
    }

    function adjustedPopjamPatternPoints(pattern, questionContext) {
      return Math.max(1, (pattern.points * (pattern.superMultiplier || 1)) + (pattern.spotlightBonus || 0));
    }

    function startPopjamDiscardForNewCompletions(questionContext, placementPlayerId) {
      if (!isPopjamMode() || state.over || state.discardPending > 0) {
        return false;
      }

      const released = markPopjamCompletions(questionContext || createQuestionContext());
      if (released <= 0) {
        return false;
      }
      if (isPopjamScoreMode()) {
        return false;
      }

      const placement = state.pendingQuestionPlacement;
      const resolvedPlacementPlayerId = placementPlayerId !== null && placementPlayerId !== undefined
        ? placementPlayerId
        : placement
        ? placement.playerId
        : currentPlayer().id;
      state.discardPlacementPlayerId = resolvedPlacementPlayerId;

      if (beginNextPopjamDiscard(resolvedPlacementPlayerId)) {
        return true;
      }

      return finishPopjamByZeroHands(resolvedPlacementPlayerId);
    }

    function startPopjamDiscardForNewCompletionsOnActiveBoard(questionContext, placementPlayerId) {
      if (!isDynamicPopjamMode()) {
        return startPopjamDiscardForNewCompletions(questionContext, placementPlayerId);
      }
      if (!isPopjamMode() || state.over || state.discardPending > 0) {
        return false;
      }

      const released = markDynamicPopjamCompletions(questionContext || createQuestionContext());
      if (released <= 0) {
        return false;
      }
      if (isPopjamScoreMode()) {
        return false;
      }

      const placement = state.pendingQuestionPlacement;
      const resolvedPlacementPlayerId = placementPlayerId !== null && placementPlayerId !== undefined
        ? placementPlayerId
        : placement
        ? placement.playerId
        : currentPlayer().id;
      state.discardPlacementPlayerId = resolvedPlacementPlayerId;

      if (beginNextPopjamDiscard(resolvedPlacementPlayerId)) {
        return true;
      }

      return finishPopjamByZeroHands(resolvedPlacementPlayerId);
    }

    function interruptQuestionEffectsForPopjamScore(context, remainingSlotIds, placementPlayerId) {
      if (!startPopjamDiscardForNewCompletionsOnActiveBoard(context, placementPlayerId)) {
        return false;
      }

      if (state.over) {
        state.pendingQuestionEffects = [];
        state.pendingQuestionContext = null;
        state.pendingQuestionPlacement = null;
        return true;
      }

      state.pendingQuestionEffects = Array.isArray(remainingSlotIds) ? remainingSlotIds : [];
      state.pendingQuestionContext = context;
      return true;
    }

    function createQuestionContext() {
      return {
        bonusByColor: {},
        multiplierByColor: {},
        allBonus: 0,
        messages: [],
        swapDepth: 0
      };
    }

    function queueQuestionRevealAnimation(slotId) {
      if (!slotId || questionRevealAnimationSlots.indexOf(slotId) !== -1) {
        return;
      }

      questionRevealAnimationSlots.push(slotId);
      setTimeout(function () {
        questionRevealAnimationSlots = questionRevealAnimationSlots.filter(function (id) {
          return id !== slotId;
        });
      }, 460);
    }

    function hasPendingQuestionEffects() {
      return isPopjamMode()
        && Array.isArray(state.pendingQuestionEffects)
        && state.pendingQuestionEffects.length > 0;
    }

    function hasPendingAction() {
      return Boolean(state.pendingAction)
        && (isPopjamMode()
          || state.pendingAction.type === "survival-gift"
          || state.pendingAction.type === "life-damage"
          || state.pendingAction.type === "life-wound-damage"
          || state.pendingAction.type === "life-recover");
    }

    function showQuestionMessages(context) {
      if (!context || !context.messages || context.messages.length === 0) {
        return;
      }

      const message = "ハテナ: " + context.messages.join(" / ");
      state.scoreText = state.scoreText ? state.scoreText + " / " + message : message;
      scheduleToastHide();
    }

    function revealQuestionSlot(slot) {
      if (!slot || slot.revealed) {
        return;
      }

      slot.revealed = true;
      slot.effectUsed = false;
      if (slot.inner && slot.tile) {
        slot.tile.revealed = true;
        slot.tile.effectUsed = false;
      }
      queueQuestionRevealAnimation(slot.id);
    }

    function consumeInnerQuestionSlot(slot, player) {
      if (!slot || !slot.inner) {
        return;
      }
      const row = slot.questionRow;
      const col = slot.questionCol;
      const cell = isDynamicBoardMode()
        ? (state.blBoard || {})[blCellKey(row, col)]
        : (state.board[row] ? state.board[row][col] : null);
      if (!isInnerQuestionCell(cell)) {
        return;
      }
      cell.tile.revealed = true;
      cell.tile.effectUsed = true;
    }

    function beginQuestionEffectsForPlacement(row, col, player, existingContext) {
      const context = existingContext || createQuestionContext();
      if (!isPopjamMode()) {
        return context;
      }

      const slots = questionSlotsAdjacentToCell(row, col).filter(function (slot) {
        return Boolean(slot && slot.tile);
      });

      slots.forEach(function (slot) {
        revealQuestionSlot(slot);
      });

      if (slots.length === 0) {
        return context;
      }

      const needsOrderChoice = slots.length > 1 && (isPopjamInnerQuestionMode() || slots.some(function (slot) {
        return slot.tile && ["swap", "delete", "salvage", "collect", "present", "replace"].indexOf(slot.tile.effect) !== -1;
      }));

      if (player && !player.isCpu && needsOrderChoice) {
        state.pendingQuestionEffects = slots.map(function (slot) {
          return slot.id;
        });
        state.pendingQuestionContext = context;
        state.pendingQuestionPlacement = {
          row: row,
          col: col,
          playerId: player.id
        };
        state.scoreText = "ハテナの発動順を選んでください。";
        scheduleToastHide();
        return null;
      }

      state.pendingQuestionPlacement = {
        row: row,
        col: col,
        playerId: player ? player.id : currentPlayer().id
      };
      if (resolveQuestionEffectsInOrder(slots, context)) {
        render();
        return null;
      }
      state.pendingQuestionPlacement = null;
      showQuestionMessages(context);
      return context;
    }

    function resolveQuestionEffectsInOrder(slots, context) {
      for (let i = 0; i < slots.length; i++) {
        if (applyQuestionEffect(slots[i], context)) {
          state.pendingQuestionEffects = slots.slice(i + 1).map(function (slot) {
            return slot.id;
          });
          state.pendingQuestionContext = context;
          return true;
        }
        const remainingSlotIds = slots.slice(i + 1).map(function (slot) {
          return slot.id;
        });
        if (interruptQuestionEffectsForPopjamScore(context, remainingSlotIds)) {
          return true;
        }
      }
      return false;
    }

    function selectPendingQuestionEffect(slotId) {
      if (!hasPendingQuestionEffects()) {
        return;
      }

      const index = state.pendingQuestionEffects.indexOf(slotId);
      if (index === -1) {
        return;
      }

      const slot = findQuestionSlotById(slotId);
      const context = state.pendingQuestionContext || createQuestionContext();
      state.pendingQuestionContext = context;

      state.pendingQuestionEffects.splice(index, 1);

      if (slot && applyQuestionEffect(slot, context)) {
        render();
        return;
      }

      if (interruptQuestionEffectsForPopjamScore(context, state.pendingQuestionEffects.slice())) {
        render();
        return;
      }

      if (state.pendingQuestionEffects.length > 0) {
        render();
        return;
      }

      const placement = state.pendingQuestionPlacement;
      state.pendingQuestionEffects = [];
      state.pendingQuestionContext = null;
      state.pendingQuestionPlacement = null;
      showQuestionMessages(context);

      if (placement) {
        finishPopjamPlacement(placement.playerId, context);
        return;
      }

      render();
    }

    function applyQuestionEffect(slot, context) {
      const tile = slot.tile;
      const player = currentPlayer();
      const nextPlayer = state.players[(state.currentPlayer + 1) % state.players.length];

      if (!tile) {
        return;
      }

      slot.effectUsed = true;
      if (slot.inner && slot.tile) {
        slot.tile.revealed = true;
        slot.tile.effectUsed = true;
        consumeInnerQuestionSlot(slot, player);
      }

      if (tile.effect === "color") {
        context.messages.push(colorNames[tile.color] + "カラーズ");
        addLog(player.name + " が " + tile.name + " を発動しました。"
          + colorNames[tile.color] + "の模様の一部になります。");
        return;
      }

      if (tile.effect === "super-color") {
        context.messages.push("スーパー" + colorNames[tile.color] + "カラーズ");
        addLog(player.name + " が " + tile.name + " を発動しました。このハテナを使って完成した"
          + colorNames[tile.color] + "の得点が2倍になります。");
        return;
      }

      if (tile.effect === "all-colors") {
        context.messages.push("オールカラーズ");
        addLog(player.name + " が " + tile.name + " を発動しました。どの色の模様にもつながります。");
        return;
      }

      if (tile.effect === "spotlight") {
        context.messages.push("スポットライト");
        addLog(player.name + " が " + tile.name + " を発動しました。この外周ハテナの行または列にある完成模様に+1点します。");
        return;
      }

      if (tile.effect === "lock") {
        context.messages.push("ロック");
        addLog(player.name + " が " + tile.name + " を発動しました。この外周ハテナの行または列(盤端まで)にあるタイルはムーブで移動できなくなります。");
        return;
      }

      if (tile.effect === "swap") {
        if (!player.isCpu) {
          beginQuestionAction("swap", slot, context);
          return true;
        }
        return applyQuestionSwap(slot, context);
      }

      if (tile.effect === "one-more") {
        state.popjamExtraPlacements++;
        context.messages.push("ワンモア");
        addLog(player.name + " はワンモアを得ました。放出後、もう1枚置けます。");
        return;
      }

      if (tile.effect === "delete") {
        if (!player.isCpu) {
          if (!hasDeletableBoardTile()) {
            context.messages.push("デリート不発");
            return;
          }
          beginQuestionAction("delete", slot, context);
          return true;
        }
        const removed = deleteBoardTileForQuestion(player.id);
        if (removed) {
          context.messages.push("デリート");
          addLog(player.name + " が盤面の " + removed.tile.name + " をデリートして"
            + removed.destinationLabel + "へ戻しました。");
        } else {
          context.messages.push("デリート不発");
        }
        return;
      }

      if (tile.effect === "collect") {
        if (!player.isCpu) {
          if (!hasCollectableMarketTile(player.id)) {
            context.messages.push("キープ不発");
            return;
          }
          beginQuestionAction("collect", slot, context);
          return true;
        }
        const collected = collectMarketTileForQuestion(player.id);
        if (collected) {
          context.messages.push("キープ");
          addLog(player.name + " が共有札から " + collected.name + " をキープしました。");
        } else {
          context.messages.push("キープ不発");
        }
        return;
      }

      if (tile.effect === "salvage") {
        if (!player.isCpu) {
          if (!hasOpponentRiverTile(player.id)) {
            context.messages.push("コレクト不発");
            addLog(player.name + " はコレクトできる捨て札がありません。");
            return;
          }
          beginQuestionAction("salvage", slot, context);
          return true;
        }
        const salvaged = salvageRiverTileForQuestion(player.id);
        if (salvaged && placeSalvagedTileAutomatically(salvaged.tile, salvaged.sourcePlayerId, salvaged.sourceRiverIndex, context)) {
          context.messages.push("コレクト");
          addLog(player.name + " が捨て札から " + salvaged.tile.name + " を盤面に配置しました。");
          if (state.discardPending > 0) {
            return true;
          }
        } else {
          context.messages.push("コレクト不発");
        }
        return;
      }

      if (tile.effect === "replace") {
        if (!player.isCpu) {
          if (!hasReplaceableBoardTile()) {
            context.messages.push("ムーブ不発");
            return;
          }
          beginQuestionAction("replace", slot, context);
          return true;
        }
        if (applyQuestionReplace(player.id, context)) {
          context.messages.push("ムーブ");
        } else {
          context.messages.push("ムーブ不発");
        }
        return;
      }

      if (tile.effect === "present") {
        if (!player.isCpu) {
          if (player.hand.length === 0 || state.players.length <= 1) {
            context.messages.push("プレゼント不発");
            return;
          }
          beginQuestionAction("present", slot, context);
          return true;
        }
        if (player.hand.length > 0 && nextPlayer) {
          const gifts = [];
          for (let i = 0; i < 2 && player.hand.length > 0; i++) {
            gifts.push(player.hand.shift());
          }
          nextPlayer.hand = nextPlayer.hand.concat(gifts);
          context.messages.push("プレゼント");
          addLog(player.name + " が " + nextPlayer.name + " に手持ち" + gifts.length + "枚を渡しました。");
        } else {
          context.messages.push("プレゼント不発");
        }
      }

      if (tile.effect === "draw-question-two") {
        const drawn = drawInnerQuestionsToPlayer(player, 2);
        context.messages.push(drawn > 0 ? "追加ハテナ+" + drawn : "追加ハテナ不発");
        addLog(player.name + " はハテナのデメリットで仕込みハテナを" + drawn + "枚追加で受け取りました。");
        return;
      }

      if (tile.effect === "river-rebound") {
        const returned = moveOwnRiverTileBackToHand(player);
        context.messages.push(returned ? "捨て札戻し" : "捨て札戻し不発");
        if (returned) {
          addLog(player.name + " はハテナのデメリットで捨て札の " + returned.name + " を手札に戻しました。");
        } else {
          addLog(player.name + " の捨て札戻しは不発でした。");
        }
      }
    }

    function drawInnerQuestionsToPlayer(player, count) {
      if (!player || !Array.isArray(state.innerQuestionDeck)) {
        return 0;
      }
      let drawn = 0;
      for (let i = 0; i < count && state.innerQuestionDeck.length > 0; i++) {
        player.hand.push(state.innerQuestionDeck.shift());
        drawn++;
      }
      if (drawn > 0) {
        queueDealAnimation(player.id, drawn, player.color);
      }
      return drawn;
    }

    function moveOwnRiverTileBackToHand(player) {
      if (!player || player.river.length === 0) {
        return null;
      }
      const tile = player.river.pop();
      player.hand.push(tile);
      return tile;
    }

    function hasOpponentRiverTile(playerId) {
      return state.players.some(function (player) {
        return player.id !== playerId && player.river.length > 0;
      });
    }

    function hasDeletableBoardTile() {
      if (isDynamicBoardMode()) {
        return Object.keys(state.blBoard || {}).some(function (key) {
          const cell = state.blBoard[key];
          return Boolean(cell && cell.tile && !cell.tile.start);
        });
      }
      const size = state.board.length || fixedBoardSize();
      for (let row = 0; row < size; row++) {
        for (let col = 0; col < size; col++) {
          const cell = state.board[row][col];
          if (cell && !cell.tile.start) {
            return true;
          }
        }
      }
      return false;
    }

    function beginQuestionAction(type, slot, context) {
      state.pendingQuestionContext = context;
      state.pendingAction = {
        type: type,
        playerId: currentPlayer().id,
        slotId: slot ? slot.id : "",
        selectedSlotIds: [],
        selectedHandIndexes: [],
        targetPlayerId: null,
        context: context
      };

      if (type === "delete") {
        state.scoreText = "デリート";
      } else if (type === "swap") {
        state.scoreText = "スワップ";
      } else if (type === "salvage") {
        state.scoreText = "コレクト";
      } else if (type === "collect") {
        state.scoreText = "キープ";
      } else if (type === "replace") {
        state.scoreText = "ムーブ";
      } else if (type === "present") {
        state.scoreText = "プレゼント";
      }
      scheduleToastHide();
    }

    function finishPendingQuestionAction() {
      const context = state.pendingQuestionContext || (state.pendingAction && state.pendingAction.context) || createQuestionContext();
      const placement = state.pendingQuestionPlacement;
      state.pendingAction = null;

      if (interruptQuestionEffectsForPopjamScore(
        context,
        state.pendingQuestionEffects.slice(),
        placement ? placement.playerId : undefined
      )) {
        render();
        return;
      }

      if (state.pendingQuestionEffects.length > 0) {
        render();
        return;
      }

      state.pendingQuestionContext = null;
      state.pendingQuestionPlacement = null;
      showQuestionMessages(context);

      if (placement) {
        finishPopjamPlacement(placement.playerId, context);
        return;
      }

      render();
    }

    function selectDeleteBoardTile(row, col) {
      if (!state.pendingAction || state.pendingAction.type !== "delete") {
        return;
      }

      const cell = isDynamicBoardMode()
        ? (state.blBoard || {})[blCellKey(row, col)]
        : (state.board[row] ? state.board[row][col] : null);
      if (!cell || cell.tile.start) {
        return;
      }

      pushHistory();
      const player = currentPlayer();
      const removed = moveBoardTileToDeckBottom(row, col, player.id);
      if (removed) {
        const context = state.pendingAction.context || createQuestionContext();
        context.messages.push("デリート");
        addLog(player.name + " が盤面の " + removed.tile.name + " をデリートして"
          + removed.destinationLabel + "へ戻しました。");
      }
      finishPendingQuestionAction();
    }

    function moveBoardTileToRiver(row, col, playerId) {
      const key = blCellKey(row, col);
      const cell = isDynamicBoardMode()
        ? (state.blBoard || {})[key]
        : (state.board[row] ? state.board[row][col] : null);
      const player = state.players.find(function (candidate) {
        return candidate.id === playerId;
      });
      if (!cell || !player || cell.tile.start) {
        return null;
      }

      const tile = cell.tile;
      if (isDynamicBoardMode()) {
        delete state.blBoard[key];
      } else {
        state.board[row][col] = null;
      }
      forgetBrokenCompletedPatterns();
      player.river.push(tile);
      queueRiverAnimation(null, player.id, tile);
      return tile;
    }

    function moveBoardTileToDeckBottom(row, col, playerId) {
      const key = blCellKey(row, col);
      const cell = isDynamicBoardMode()
        ? (state.blBoard || {})[key]
        : (state.board[row] ? state.board[row][col] : null);
      if (!cell || cell.tile.start) {
        return null;
      }

      const tile = cell.tile;
      if (isDynamicBoardMode()) {
        delete state.blBoard[key];
      } else {
        state.board[row][col] = null;
      }
      forgetBrokenCompletedPatterns();
      const player = state.players.find(function (candidate) {
        return candidate.id === playerId;
      });
      if (state.deck.length > 0 || !player) {
        state.deck.push(tile);
        return {
          tile: tile,
          destination: "deck",
          destinationLabel: "山札の下"
        };
      }

      player.hand.push(tile);
      return {
        tile: tile,
        destination: "hand",
        destinationLabel: "追加手札"
      };
    }

    function deleteBoardTileForQuestion(playerId) {
      const last = state.lastPlacedCell;
      let fallback = null;

      if (isDynamicBoardMode()) {
        const keys = Object.keys(state.blBoard || {});
        for (let i = 0; i < keys.length; i++) {
          const parts = keys[i].split(",");
          const row = Number(parts[0]);
          const col = Number(parts[1]);
          const cell = state.blBoard[keys[i]];
          if (!cell || !cell.tile || cell.tile.start) {
            continue;
          }
          if (last && last.row === row && last.col === col) {
            fallback = { row: row, col: col, tile: cell.tile };
            continue;
          }

          const moved = moveBoardTileToDeckBottom(row, col, playerId);
          return moved ? Object.assign({ row: row, col: col }, moved) : null;
        }

        if (fallback) {
          const moved = moveBoardTileToDeckBottom(fallback.row, fallback.col, playerId);
          if (moved) {
            fallback = Object.assign(fallback, moved);
          }
        }
        return fallback;
      }

      const size = state.board.length || fixedBoardSize();
      for (let row = 0; row < size; row++) {
        for (let col = 0; col < size; col++) {
          const cell = state.board[row][col];
          if (!cell || cell.tile.start) {
            continue;
          }
          if (last && last.row === row && last.col === col) {
            fallback = { row: row, col: col, tile: cell.tile };
            continue;
          }

          const moved = moveBoardTileToDeckBottom(row, col, playerId);
          return moved ? Object.assign({ row: row, col: col }, moved) : null;
        }
      }

      if (fallback) {
        const moved = moveBoardTileToDeckBottom(fallback.row, fallback.col, playerId);
        if (moved) {
          fallback = Object.assign(fallback, moved);
        }
      }
      return fallback;
    }

    function playerHasKeptTile(playerId) {
      const player = state.players.find(function (candidate) {
        return candidate.id === playerId;
      });
      return Boolean(player && Array.isArray(player.hand) && player.hand.length > 0);
    }

    function hasCollectableMarketTile(playerId) {
      if ((isPopjamScoreAltMode() || isPopjamScoreOpenMode()) && Number.isInteger(playerId) && playerHasKeptTile(playerId)) {
        return false;
      }
      return Array.isArray(state.sharedMarket) && state.sharedMarket.some(Boolean);
    }

    function collectMarketTileAt(index, playerId) {
      const player = state.players.find(function (candidate) {
        return candidate.id === playerId;
      });
      if (!player || !Array.isArray(state.sharedMarket) || index < 0 || index >= state.sharedMarket.length) {
        return null;
      }
      if ((isPopjamScoreAltMode() || isPopjamScoreOpenMode()) && playerHasKeptTile(playerId)) {
        return null;
      }

      const tile = state.sharedMarket[index];
      if (!tile) {
        return null;
      }

      state.sharedMarket.splice(index, 1);
      clearMarketTileRotation(index);
      player.hand.push(tile);
      refillSharedMarket({ animate: true });
      return tile;
    }

    function collectMarketTileForQuestion(playerId) {
      if (!hasCollectableMarketTile(playerId)) {
        return null;
      }

      const player = state.players.find(function (candidate) {
        return candidate.id === playerId;
      });
      let bestIndex = -1;
      let bestScore = -Infinity;
      state.sharedMarket.forEach(function (tile, index) {
        if (!tile) {
          return;
        }
        let score = 0;
        for (let rotationIndex = 0; rotationIndex < 4; rotationIndex++) {
          const rotation = rotationIndex * 90;
          if (!hasAnyLegalMoveForTile(tile)) {
            continue;
          }
          ["top", "right", "bottom", "left"].forEach(function (edge) {
            if (sampleTileEdgeColor(tile.id, rotation, edge, 1) === (player && player.color)) {
              score += 1;
            }
          });
        }
        if (score > bestScore) {
          bestScore = score;
          bestIndex = index;
        }
      });
      if (bestIndex < 0) {
        bestIndex = state.sharedMarket.findIndex(Boolean);
      }
      return collectMarketTileAt(bestIndex, playerId);
    }

    function collectSelectedMarketTile(index) {
      const action = state.pendingAction;
      if (!action || action.type !== "collect" || index < 0 || index >= state.sharedMarket.length) {
        return;
      }

      pushHistory();
      const context = action.context || createQuestionContext();
      const collected = collectMarketTileAt(index, action.playerId);
      if (collected) {
        context.messages.push("キープ");
        addLog(currentPlayer().name + " が共有札から " + collected.name + " をキープしました。");
      } else {
        context.messages.push("キープ不発");
      }
      finishPendingQuestionAction();
    }

    function boardCellAt(row, col) {
      return state.board[row] ? state.board[row][col] : null;
    }

    function canReplaceTileTo(row, col, action) {
      if (!action || action.type !== "replace-place" || !action.tile || !action.source) {
        return false;
      }
      if (row === action.source.row && col === action.source.col) {
        return false;
      }
      if (boardCellAt(row, col)) {
        return false;
      }

      const sourceCell = boardCellAt(action.source.row, action.source.col);
      state.board[action.source.row][action.source.col] = null;
      const legal = canPlaceTileAt(row, col, action.tile, action.rotation || 0);
      state.board[action.source.row][action.source.col] = sourceCell;
      return legal;
    }

    function findReplaceMoveForTile(row, col, tile, rotation) {
      const size = state.board.length || fixedBoardSize();
      const sourceCell = boardCellAt(row, col);
      if (!sourceCell || !tile || tile.start) {
        return null;
      }

      state.board[row][col] = null;
      for (let targetRow = 0; targetRow < size; targetRow++) {
        for (let targetCol = 0; targetCol < size; targetCol++) {
          if (targetRow === row && targetCol === col) {
            continue;
          }
          if (state.board[targetRow][targetCol]) {
            continue;
          }
          for (let rotationIndex = 0; rotationIndex < 4; rotationIndex++) {
            const targetRotation = Number.isFinite(rotation) ? rotation : rotationIndex * 90;
            if (canPlaceTileAt(targetRow, targetCol, tile, targetRotation)) {
              state.board[row][col] = sourceCell;
              return { row: targetRow, col: targetCol, rotation: targetRotation };
            }
            if (Number.isFinite(rotation)) {
              break;
            }
          }
        }
      }
      state.board[row][col] = sourceCell;
      return null;
    }

    function hasReplaceableBoardTile() {
      const size = state.board.length || fixedBoardSize();
      for (let row = 0; row < size; row++) {
        for (let col = 0; col < size; col++) {
          const cell = boardCellAt(row, col);
          if (!cell || !cell.tile || cell.tile.start || isInnerQuestionTile(cell.tile) || isCellLocked(row, col)) {
            continue;
          }
          if (findReplaceMoveForTile(row, col, cell.tile)) {
            return true;
          }
        }
      }
      return false;
    }

    function selectReplaceBoardTile(row, col) {
      const action = state.pendingAction;
      if (!action || (action.type !== "replace" && action.type !== "replace-place")) {
        return;
      }

      const cell = boardCellAt(row, col);
      if (!cell || !cell.tile || cell.tile.start || isInnerQuestionTile(cell.tile)) {
        return;
      }
      if (isCellLocked(row, col)) {
        state.scoreText = "ロックされていて動かせません。";
        scheduleToastHide();
        render();
        return;
      }
      if (!findReplaceMoveForTile(row, col, cell.tile)) {
        state.scoreText = "ムーブ: そのタイルは置きなおせる場所がありません。";
        scheduleToastHide();
        render();
        return;
      }

      state.pendingAction = Object.assign({}, action, {
        type: "replace-place",
        tile: cell.tile,
        rotation: cell.rotation || 0,
        source: { row: row, col: col }
      });
      state.scoreText = "ムーブ先";
